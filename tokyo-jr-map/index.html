<style>
/* 画面いっぱいの地図。上に細い見出し、下に路線フィルター、駅を押すと下から駅の情報が出る */
:root {
  --bg: #eef1ef;
  --panel: #ffffff;
  --ink: #1b2420;
  --muted: #66716c;
  --hair: #d3d9d5;
  --chip-off: #f3f5f4;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --panel: #1e2421; --ink: #e8ece9; --muted: #9aa5a0; --hair: #343c38; --chip-off: #191e1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1e2421; --ink: #e8ece9; --muted: #9aa5a0; --hair: #343c38; --chip-off: #191e1c;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--hair);
}
h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .02em; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#wrap { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.zoom {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.zoom button {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--hair);
  background: var(--panel); color: var(--ink); font: 700 18px var(--font); cursor: pointer;
}
.zoom button.txt { font-size: 11px; }
.credit {
  position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 6px;
  font-size: 10px; color: var(--muted); pointer-events: none;
}
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--panel); border-top: 1px solid var(--hair);
  border-radius: 14px 14px 0 0; box-shadow: 0 -6px 20px rgba(0,0,0,.12);
  padding-block: 14px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-height: 55%; overflow-y: auto;
}
.sheet-head { display: flex; align-items: baseline; gap: 10px; }
.sheet-head h2 { margin: 0; font-size: 22px; }
.sheet-head .meta { flex: 1; }
#close {
  border: 1px solid var(--hair); background: var(--chip-off); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; font: 400 13px var(--font); cursor: pointer;
}
#sheet ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
#sheet li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
#sheet li .bar { width: 6px; height: 22px; border-radius: 3px; flex: none; }
#sheet li.off { color: var(--muted); }
#sheet li.off .bar { opacity: .3; }
#sheet li small { font-size: 12px; color: var(--muted); }
footer {
  background: var(--panel); border-top: 1px solid var(--hair);
  padding-block: 8px 10px;
}
.tools {
  display: flex; gap: 8px; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin-bottom: 8px; font-size: 12px; color: var(--muted);
}
.tools span { flex: 1; }
.tools button {
  border: 1px solid var(--hair); background: var(--chip-off); color: var(--ink);
  border-radius: 8px; padding: 6px 10px; font: 400 12px var(--font); cursor: pointer;
}
#chips {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto);
  gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--hair); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 6px 11px 6px 8px; font: 400 13px var(--font); cursor: pointer;
}
.chip i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.chip[aria-pressed="false"] { background: var(--chip-off); color: var(--muted); }
.chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 2px var(--hair); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (ptrs.size === 1) moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
  p.x = e.offsetX; p.y = e.offsetY;
  if (ptrs.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    view.x -= dx / view.s; view.y -= dy / view.s; redraw();
  } else if (ptrs.size === 2) {
    moved = 99;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) zoomAt(d / pinch, (a.x + b.x) / 2, (a.y + b.y) / 2);
    pinch = d;
  }
});
function up(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0 && moved < 8) pick(e.offsetX, e.offsetY);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; });

// 駅を選ぶ
const sheet = document.getElementById('sheet');
function pick(px, py) {
  let best = -1, bd = 24;
  ST.forEach((st, i) => {
    if (!st.g.some(g => on[g])) return;
    const d = Math.hypot(sx(st.x) - px, sy(st.y) - py);
    if (d < bd) { bd = d; best = i; }
  });
  selected = best; showSheet();
  // 選んだ駅が下の駅情報に隠れないよう、見える範囲の中央へ寄せる
  if (best >= 0) {
    const vis = H - sheet.offsetHeight, y = sy(ST[best].y);
    if (y > vis - 40) view.y += (y - vis / 2) / view.s;
  }
  redraw();
}
function showSheet() {
  if (selected < 0) { sheet.hidden = true; return; }
  const st = ST[selected];
  document.getElementById('sname').textContent = st.n;
  document.getElementById('smeta').textContent = st.g.length + '路線';
  const ul = document.getElementById('slist'); ul.innerHTML = '';
  st.g.forEach(g => {
    const li = document.createElement('li');
    if (!on[g]) li.className = 'off';
    li.innerHTML = `<span class="bar" style="background:${G[g].c}"></span><span></span>${on[g] ? '' : '<small>（非表示中）</small>'}`;
    li.children[1].textContent = G[g].n;
    ul.appendChild(li);
  });
  sheet.hidden = false;
}
document.getElementById('close').onclick = () => { selected = -1; showSheet(); redraw(); };

// 路線フィルター
const chips = document.getElementById('chips');
function updateCount() {
  const k = on.filter(Boolean).length;
  document.getElementById('count').textContent = `表示中 ${k} / ${G.length}路線・${ST.length}駅`;
}
G.forEach((g, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.id = 'chip-' + i; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<i style="background:${g.c}"></i><span></span>`;
  b.lastChild.textContent = g.n;
  b.onclick = () => { on[i] = !on[i]; sync(); };
  chips.appendChild(b);
});
function sync() {
  G.forEach((g, i) => document.getElementById('chip-' + i).setAttribute('aria-pressed', on[i]));
  updateCount(); showSheet(); redraw();
}
document.getElementById('allon').onclick = () => { on.fill(true); sync(); };
document.getElementById('alloff').onclick = () => { on.fill(false); sync(); };
updateCount();
</script>
