<style>
/* 横画面いっぱいに 16:9 のキャンバス。設定ボタンだけ右下に浮かせる */
:root{

}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none}

canvas{display:block;touch-action:none;outline:none;max-width:100%}
.btns{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

button.sub{border-color:var(--warn)}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
</style>

<script>
(() => {
'use strict';
const W = 320, H = 180, S = 3;
const C = document.getElementById('c');
const X = C.getContext('2d');
C.width = W * S; C.height = H * S;
const FONT = '"DotGothic16", "Noto Sans JP", sans-serif';

function fit() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H);
  C.style.width = Math.floor(W * s) + 'px';
  C.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 音 ---------- */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d, type = 'square', vol = 0.05, f2) {
  const a = AC; if (!a || a.state !== 'running') return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(g); g.connect(a.destination); o.start(n); o.stop(n + d);
}
function noise(d, vol = 0.12) {
  const a = AC; if (!a || a.state !== 'running') return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start();
}

/* ---------- ステージ ---------- */
const WW = 480, WH = 270, CX = 240;
const MAIN = { x1: 110, x2: 370, top: 190, bot: 222, main: true };
const PLATS = [MAIN, { x1: 140, x2: 210, top: 146, float: true }, { x1: 270, x2: 340, top: 146, float: true }];

const cam = { x: CX, y: 165, z: 1 };
const toSX = x => (x - cam.x) * cam.z + W / 2, toSY = y => (y - cam.y) * cam.z + H / 2;

/* ---------- キャラクター ---------- */
const CHARS = [

    col: { skin: '#f2c49b', top: '#2ec4b6', topD: '#1a8a80', pants: '#34365a', pantsD: '#22233d', hair: '#1b1530', belt: '#ffd23f', glove: '#ff4d6d', gloveD: '#b8324b' },
    proj: { name: 'かぜ玉', speed: 3.4, r: 5, c1: '#e6fdff', c2: '#5ee0ff' } },
  { name: 'ガルド', desc: '重くてふっとびにくい', speed: 1, power: 3, weight: 1.25, scale: 1.15, walk: 1.0, run: 1.8, air: 1.15, jump: 4.3, djump: 4.0, grav: 0.25, fall: 3.6, dmg: 1.2, hair: 'beard',
    col: { skin: '#c98b5e', top: '#7b4ce0', topD: '#53309e', pants: '#4a3a26', pantsD: '#30261a', hair: '#e8e1d4', belt: '#ff9a3c', glove: '#6dff8b', gloveD: '#3fa457' },
    proj: { name: 'いわ玉', speed: 2.4, r: 7, c1: '#ffe2b3', c2: '#ff9a3c' } }
];

/* 技：st=出始め, act=当たる時間, rec=戻り（フレーム）, box=[前方向, 足元からの高さ, 幅, 高さ], base/gr=ふっとび（基本／％で伸びる分）, ang=飛ぶ角度 */
const M = {
  jab:      { name: '弱攻撃', pose: 'sP', st: 3, act: 3, rec: 8, dmg: 3, box: [6, 30, 20, 10], base: 1.2, gr: 0.9, ang: 30 },

  usmash:   { pose: 'usmash', cpose: 'crouch', st: 9, act: 6, rec: 22, dmg: 14, box: [-14, 40, 28, 30], base: 3.2, gr: 6.6, ang: 88, smash: true },
  dsmash:   { pose: 'dsmash', cpose: 'crouch', st: 8, act: 5, rec: 22, dmg: 13, box: [-32, 0, 64, 10], base: 3, gr: 6.2, ang: 25, both: true, smash: true },

/* ---------- ポーズ（足元が0、上が+、前が+） ---------- */
const mod = (b, o) => Object.assign({}, b, o);
const BASE = { hip: [0, 24], neck: [1, 40], head: [2, 46], eB: [-3, 31], hB: [5, 35], eF: [9, 32], hF: [13, 38], kB: [-5, 12], fB: [-8, 0], kF: [6, 12], fF: [8, 0] };

const JUMP = { hip: [0, 24], neck: [1, 40], head: [2, 46], eB: [-4, 34], hB: [0, 42], eF: [8, 36], hF: [12, 44], kB: [-6, 16], fB: [-4, 8], kF: [8, 18], fF: [4, 10] };
const POSES = {
  idle: BASE,
  idle2: mod(BASE, { hip: [0, 23], neck: [1, 39], head: [2, 45], hB: [5, 34], hF: [13, 37], eB: [-3, 30], eF: [9, 31] }),
  walk1: mod(BASE, { kF: [8, 12], fF: [11, 0], kB: [-3, 12], fB: [-4, 0] }),
  walk2: mod(BASE, { kF: [3, 13], fF: [1, 0], kB: [-7, 11], fB: [-12, 0] }),
  crouch: CROUCH,
  jump: JUMP,
  helpless: mod(JUMP, { eF: [6, 30], hF: [8, 24], eB: [-4, 30], hB: [-6, 24] }),
  sP: mod(BASE, { neck: [4, 40], head: [5, 46], hip: [1, 24], eF: [16, 37], hF: [26, 37], eB: [-2, 32], hB: [4, 36], kF: [8, 12], fF: [12, 0] }),
  sK: { hip: [-1, 24], neck: [-5, 39], head: [-7, 45], eB: [-8, 32], hB: [-4, 38], eF: [2, 34], hF: [6, 40], kB: [-3, 12], fB: [-4, 0], kF: [12, 26], fF: [30, 28] },
  cK: { hip: [-2, 11], neck: [-4, 25], head: [-5, 31], eB: [-8, 16], hB: [-12, 6], eF: [2, 18], hF: [6, 22], kB: [-8, 8], fB: [-12, 0], kF: [14, 5], fF: [32, 2] },
  utilt: mod(BASE, { neck: [0, 40], head: [1, 46], eF: [4, 50], hF: [2, 62] }),
  fsmash: { hip: [3, 22], neck: [9, 36], head: [11, 42], eB: [-4, 30], hB: [-10, 26], eF: [20, 34], hF: [32, 34], kB: [-8, 10], fB: [-16, 0], kF: [12, 12], fF: [16, 0] },
  fsmashC: { hip: [-2, 23], neck: [-6, 38], head: [-8, 44], eF: [-10, 32], hF: [-16, 30], eB: [-6, 30], hB: [-12, 28], kB: [-8, 12], fB: [-12, 0], kF: [8, 12], fF: [12, 0] },
  usmash: mod(BASE, { neck: [0, 41], head: [1, 47], eF: [4, 50], hF: [4, 64], eB: [-4, 50], hB: [-4, 64] }),
  dsmash: { hip: [0, 14], neck: [2, 30], head: [3, 36], eB: [-6, 22], hB: [-2, 26], eF: [8, 22], hF: [12, 26], kB: [-14, 10], fB: [-30, 2], kF: [14, 10], fF: [30, 2] },
  nair: { hip: [0, 24], neck: [1, 38], head: [2, 44], eB: [-12, 34], hB: [-20, 34], eF: [12, 34], hF: [20, 34], kB: [-12, 18], fB: [-20, 16], kF: [12, 18], fF: [20, 16] },
  jK: { hip: [0, 24], neck: [-3, 39], head: [-4, 45], eB: [-7, 34], hB: [-3, 40], eF: [4, 36], hF: [8, 42], kB: [-4, 18], fB: [-2, 10], kF: [12, 20], fF: [24, 14] },
  bair: { hip: [0, 24], neck: [5, 38], head: [7, 44], eB: [2, 34], hB: [6, 40], eF: [8, 34], hF: [12, 40], kB: [-10, 22], fB: [-26, 20], kF: [6, 16], fF: [4, 8] },
  uair: { hip: [0, 22], neck: [-2, 36], head: [-3, 42], eB: [-8, 30], hB: [-12, 26], eF: [4, 30], hF: [8, 26], kB: [-4, 12], fB: [-6, 4], kF: [6, 38], fF: [4, 56] },
  dair: { hip: [0, 26], neck: [1, 42], head: [2, 48], eB: [-8, 40], hB: [-10, 48], eF: [8, 40], hF: [10, 48], kB: [-4, 14], fB: [-6, 6], kF: [4, 10], fF: [2, -8] },
  fb0: mod(BASE, { neck: [-2, 39], head: [-3, 45], eB: [-8, 30], hB: [-6, 28], eF: [-4, 30], hF: [-4, 27], kF: [10, 12], fF: [14, 0], kB: [-6, 12], fB: [-12, 0] }),
  fb: mod(BASE, { neck: [4, 39], head: [5, 45], eB: [12, 32], hB: [22, 31], eF: [14, 34], hF: [24, 34], kF: [10, 12], fF: [16, 0], kB: [-6, 12], fB: [-12, 0] }),
  rise: { hip: [0, 24], neck: [0, 40], head: [1, 46], eB: [-6, 34], hB: [-8, 42], eF: [6, 46], hF: [8, 58], kB: [-4, 14], fB: [-6, 4], kF: [10, 34], fF: [16, 48] },
  hit: mod(BASE, { hip: [-2, 24], neck: [-8, 38], head: [-11, 43], eB: [-14, 34], hB: [-18, 38], eF: [-4, 34], hF: [-8, 40], kF: [4, 12], fF: [6, 0] }),
  run1: mod(BASE, { neck: [5, 39], head: [7, 45], kF: [10, 14], fF: [14, 4], kB: [-6, 10], fB: [-12, 2], eF: [4, 30], hF: [10, 26], eB: [-2, 34], hB: [-8, 36] }),
  run2: mod(BASE, { neck: [5, 39], head: [7, 45], kF: [2, 12], fF: [-4, 2], kB: [4, 14], fB: [10, 4], eF: [-2, 32], hF: [-6, 28], eB: [4, 30], hB: [10, 28] }),
  ledge: { hip: [0, 12], neck: [1, 24], head: [1, 29], eB: [3, 28], hB: [6, 35], eF: [5, 28], hF: [8, 35], kB: [-2, 4], fB: [-1, -6], kF: [2, 3], fF: [3, -7] },
  win: mod(BASE, { eF: [6, 48], hF: [8, 58], eB: [-4, 32], hB: [2, 30] })
};

/* ---------- 入力 ---------- */
const ACTIONS = ['up', 'down', 'left', 'right', 'a', 'b', 'jump', 'start'];
const LABEL = { up: '上', down: '下', left: '左', right: '右', a: 'A（攻撃）', b: 'B（必殺技）', jump: 'ジャンプ', start: 'ポーズ（START）' };
const DEFAULT = {
  up:    ['k:ArrowUp', 'k:KeyW', 'p:12', 'a:1-'],
  down:  ['k:ArrowDown', 'k:KeyS', 'p:13', 'a:1+'],
  left:  ['k:ArrowLeft', 'k:KeyA', 'p:14', 'a:0-'],
  right: ['k:ArrowRight', 'k:KeyD', 'p:15', 'a:0+'],
  a:     ['k:KeyZ', 'k:KeyJ', 'p:1'],
  b:     ['k:KeyX', 'k:KeyK', 'p:0'],
  jump:  ['k:KeyC', 'k:KeyL', 'k:Space', 'p:2', 'p:3'],
  start: ['k:Enter', 'k:KeyP', 'k:Escape', 'p:9', 'p:8']
};
let binds = store.get('fi.binds', null) || JSON.parse(JSON.stringify(DEFAULT));
const keys = new Set(), tapped = new Set();
const cur = {}, prev = {};
ACTIONS.forEach(a => { cur[a] = false; prev[a] = false; });
let padName = '', lastUnknown = null, unknownT = 0, anyInput = false, cfgQueue = [];
const keyId = e => e.code || e.key;
const isBound = id => ACTIONS.some(a => binds[a].includes('k:' + id));

addEventListener('keydown', e => {
  ac(); anyInput = true;
  const id = keyId(e);
  if (mode === 'config') { if (!e.repeat) cfgQueue.push('k:' + id); e.preventDefault(); return; }
  keys.add(id); tapped.add(id);
  if (isBound(id)) e.preventDefault();
  else if (!e.repeat) { lastUnknown = id; unknownT = 240; }
});
addEventListener('keyup', e => keys.delete(keyId(e)));
addEventListener('blur', () => keys.clear());
addEventListener('pointerdown', () => { ac(); C.focus(); });

function getPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) if (p && p.connected) return p;
  return null;
}
function test(b, gp) {
  const t = b[0], v = b.slice(2);
  if (t === 'k') return keys.has(v) || tapped.has(v);
  if (!gp) return false;
  if (t === 'p') { const btn = gp.buttons[+v]; return !!btn && (btn.pressed || btn.value > 0.5); }
  if (t === 'a') {
    const val = gp.axes[parseInt(v, 10)], sgn = v.endsWith('-') ? -1 : 1;
    return val !== undefined && Math.abs(val) <= 1.05 && val * sgn > 0.5;
  }
  return false;
}
const padPrevBtn = [], padPrevAxis = [];
function poll() {
  const gp = getPad();
  padName = gp ? gp.id : '';
  for (const a of ACTIONS) cur[a] = binds[a].some(b => test(b, gp));
  tapped.clear();
  if (gp) {
    gp.buttons.forEach((btn, i) => {
      const on = btn.pressed || btn.value > 0.5;
      if (on) anyInput = true;
      if (mode === 'config' && on && !padPrevBtn[i]) cfgQueue.push('p:' + i);
      padPrevBtn[i] = on;
    });
    gp.axes.forEach((v, i) => {
      const dir = Math.abs(v) <= 1.05 && Math.abs(v) > 0.6 ? (v < 0 ? '-' : '+') : '';
      if (mode === 'config' && dir && padPrevAxis[i] !== dir) cfgQueue.push('a:' + i + dir);
      padPrevAxis[i] = dir;
    });
  }
}
const pr = a => cur[a] && !prev[a];

/* ---------- ボタン設定 ---------- */
const cfgBtn = document.getElementById('cfgBtn');
const defBtn = document.getElementById('defBtn');
const cancelBtn = document.getElementById('cancelBtn');
let cfgIndex = 0, cfgNew = {}, cfgReturn = 'title', cfgMsgT = 0;
function startConfig() {
  cfgReturn = mode === 'config' ? 'title' : mode;
  mode = 'config'; cfgIndex = 0; cfgNew = {}; cfgQueue = []; keys.clear();
  syncButtons();
}
function endConfig(save) {
  if (save) { binds = cfgNew; store.set('fi.binds', binds); }
  mode = cfgReturn; cooldown = 30; keys.clear(); syncButtons();
}
function updateConfig() {
  while (cfgQueue.length) {
    const b = cfgQueue.shift();
    if (Object.values(cfgNew).some(list => list.includes(b))) { cfgMsgT = 90; continue; }
    cfgNew[ACTIONS[cfgIndex]] = [b];
    beep(660, 0.08, 'square', 0.05);
    if (++cfgIndex >= ACTIONS.length) { endConfig(true); beep(990, 0.15, 'square', 0.05); return; }
  }
}
cfgBtn.addEventListener('click', () => { cfgBtn.blur(); ac(); startConfig(); });
cancelBtn.addEventListener('click', () => { cancelBtn.blur(); endConfig(false); });
defBtn.addEventListener('click', () => {
  defBtn.blur();
  binds = JSON.parse(JSON.stringify(DEFAULT)); store.set('fi.binds', binds);
  mode = cfgReturn; cooldown = 30; syncButtons();
});
let shownFor = '';
function syncButtons() {
  if (shownFor === mode) return;
  shownFor = mode;
  const inCfg = mode === 'config';
  cfgBtn.hidden = !(mode === 'title' || mode === 'pause' || mode === 'result' || mode === 'select');
  defBtn.hidden = !inCfg; cancelBtn.hidden = !inCfg;
}

/* ---------- 試合の状態 ---------- */
let mode = 'title', mt = 0, cooldown = 0, tick = 0, pausedFrom = 'fight';
let sel = 0, stage = 1, hitstop = 0, shake = 0, winner = -1, flashT = 0;
let best = store.get('fi.best', 0);
let F = [], projs = [], parts = [], popups = [];
const STOCKS = 3;

function newFighter(ch, x, facing, idx) {
  return { ch, idx, x, y: MAIN.top, vx: 0, vy: 0, lvx: 0, lvy: 0, facing, ground: MAIN, state: 'idle', t: 0, move: null, mt: 0,
    hitDone: false, stun: 0, percent: 0, stocks: STOCKS, jumps: 1, upBUsed: false, sideBUsed: false, dropT: 0, inv: 0,
    charging: false, chargeT: 0, fastFall: false, flash: 0, shownPct: 0, runT: 0, ledge: null, ledgeCD: 0, ledgeInv: true, lastInp: null, cx0: 0, cy0: 0, climbAtk: false };
}
function startMatch() {
  F = [newFighter(CHARS[sel], 200, 1, 0), newFighter(CHARS[1 - sel], 280, -1, 1)];
  LEDGES.forEach(l => { l.occ = null; });
  updateCam(true);
  projs = []; parts = []; popups = []; hitstop = 0; winner = -1;
  mode = 'intro'; mt = 0;
  Object.assign(pc, { aT: -1, bT: -1 });
  Object.assign(ai, { cd: 40 });
}

  if (hitstop > 0) { hitstop--; return; }
  if (mode === 'gameEnd' && mt < 60 && mt % 3) return;

  const inP = mode === 'fight' ? playerInput(F[0]) : blank();
  const inC = mode === 'fight' ? aiInput(F[1], F[0]) : blank();
  fighterStep(F[0], inP, F[1]);

  // 地上で重ならないように押し合う

}

function step() {

  parts = parts.filter(p => p.life > 0);

    order.forEach(f => { if (f.state !== 'dead') drawFighter(f); });
    projs.forEach(drawProj);
    for (const p of parts) { X.fillStyle = p.c; const s2 = p.life > 14 ? 2 : 1; X.fillRect(p.x, p.y, s2, s2); }
    X.setTransform(S, 0, 0, S, 0, 0);
    F.forEach(drawTag); F.forEach(drawOffscreen);
    for (const p of popups) txt(p.s, p.x, p.y, 12, '#ffd23f', 'center');
    drawCard(F[0], 4); drawCard(F[1], W - 66);
    txt('ステージ ' + stage, W / 2, 4, 7, '#f4f1ff', 'center');
    if (mode === 'intro') txt(String(3 - Math.floor(mt / 40)), W / 2, 50, 30, '#f4f1ff', 'center');
    if (mode === 'fight' && mt < 40) txt('ゴー', W / 2, 50, 30, '#ffd23f', 'center');
    if (mode === 'gameEnd') txt('しあいしゅうりょう', W / 2, 54, 22, '#f4f1ff', 'center');
    if (mode === 'pause') drawPanel('ポーズ中', ['B：タイトルへ戻る', 'STARTで再開']);
    if (mode === 'result') {
      if (winner === 0) drawPanel('あなたの勝ち', ['ステージ ' + stage + ' クリア', 'B：タイトルへ', mt > 50 ? 'A：次の相手へ（少し強くなります）' : ''], '#ffd23f');
      else drawPanel('あなたの負け', ['ステージ ' + stage, 'B：タイトルへ', mt > 50 ? 'A：もう一度挑戦' : ''], '#ff4d6d');
    }
  } else {
    X.setTransform(S, 0, 0, S, 0, 0);
    if (mode === 'title' || (mode === 'config' && cfgReturn === 'title')) drawTitle();
    else if (mode === 'select' || (mode === 'config' && cfgReturn === 'select')) drawSelect();
  }
  if (mode === 'config') drawConfig();
  if (flashT > 0) { X.fillStyle = 'rgba(255,255,255,' + flashT / 20 + ')'; X.fillRect(0, 0, W, H); }
}

/* ---------- ループ（1秒60回で固定） ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (mode === 'fight' || mode === 'intro')) { pausedFrom = mode; mode = 'pause'; }
});
C.addEventListener('pointerdown', e => {
  if (mode === 'title') { mode = 'select'; cooldown = 10; }
  else if (mode === 'select') {
    const r = C.getBoundingClientRect(), side = (e.clientX - r.left) / r.width < 0.5 ? 0 : 1;
    if (side === sel) { stage = 1; startMatch(); } else sel = side;
  } else if (mode === 'result' && mt > 50) { if (winner === 0) stage++; startMatch(); }
});
syncButtons();
if (document.fonts && document.fonts.load) document.fonts.load('10px "DotGothic16"').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
