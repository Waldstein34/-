<style>
/* ===== tokens ===== */
:root {
  --bg: #f5f3ee;
  --surface: #fffdf8;
  --surface2: #efece5;
  --text: #2b2a27;
  --muted: #6d6961;
  --line: #e0dbd0;
  --accent: #3b6c76;
  --accent-soft: #e3eeef;
  --on-accent: #ffffff;
  --shadow: 0 -6px 24px rgba(40,35,25,.10);
  --q-bg: #edf1f6; --q-bd: #7189ab; --q-ink: #3d5778;
  --a-bg: #ecf3ed; --a-bd: #5f8f68; --a-ink: #3b6544;
  --w-bg: #f6f0e1; --w-bd: #b48a3a; --w-ink: #7a5a1c;
  --s-bg: #f1eef6; --s-bd: #8a78ab; --s-ink: #5a4a7a;
  --c-bg: #f8ede9; --c-bd: #b86c5a; --c-ink: #8a4535;
  --m-bg: #e9f2f1; --m-bd: #4c8a88; --m-ink: #2f6462;
  --ok-bg: #e5f1e7; --ok-bd: #4f8a5b; --ng-bg: #f7e7e4; --ng-bd: #b5594b;
  --mark: #f3e2a6;
  --fs: 17px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --top-h: 52px;
  --bot-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #1a1c1e;
  --surface: #222528;
  --surface2: #2a2e32;
  --text: #dcd9d2;
  --muted: #9b978f;
  --line: #34383d;
  --accent: #86b7c0;
  --accent-soft: #24363a;
  --on-accent: #10181a;
  --shadow: 0 -6px 24px rgba(0,0,0,.35);
  --q-bg: #1f2833; --q-bd: #7f9cc2; --q-ink: #a9c0de;
  --a-bg: #1e2a22; --a-bd: #7fae88; --a-ink: #a7cdae;
  --w-bg: #2c2719; --w-bd: #c7a25a; --w-ink: #e0c387;
  --s-bg: #262331; --s-bd: #9f8dc2; --s-ink: #c4b7de;
  --c-bg: #2f2220; --c-bd: #cf8a78; --c-ink: #e4ac9d;
  --m-bg: #1c2b2b; --m-bd: #6fb0ae; --m-ink: #9fd0ce;
  --ok-bg: #1f3325; --ok-bd: #7fbf8c; --ng-bg: #3a2322; --ng-bd: #d98a7f;
  --mark: #5a4a1c;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1c1e;
  --surface: #222528;
  --surface2: #2a2e32;
  --text: #dcd9d2;
  --muted: #9b978f;
  --line: #34383d;
  --accent: #86b7c0;
  --accent-soft: #24363a;
  --on-accent: #10181a;
  --shadow: 0 -6px 24px rgba(0,0,0,.35);
  --q-bg: #1f2833; --q-bd: #7f9cc2; --q-ink: #a9c0de;
  --a-bg: #1e2a22; --a-bd: #7fae88; --a-ink: #a7cdae;
  --w-bg: #2c2719; --w-bd: #c7a25a; --w-ink: #e0c387;
  --s-bg: #262331; --s-bd: #9f8dc2; --s-ink: #c4b7de;
  --c-bg: #2f2220; --c-bd: #cf8a78; --c-ink: #e4ac9d;
  --m-bg: #1c2b2b; --m-bd: #6fb0ae; --m-ink: #9fd0ce;
  --ok-bg: #1f3325; --ok-bd: #7fbf8c; --ng-bg: #3a2322; --ng-bd: #d98a7f;
  --mark: #5a4a1c;

  color-scheme: dark;
}
:root[data-fs="0"] { --fs: 16px; }
:root[data-fs="1"] { --fs: 17px; }
:root[data-fs="2"] { --fs: 18px; }

/* ===== base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.85;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
  line-break: strict;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
main { display: block; max-width: 680px; margin: 0 auto; padding: 8px 18px calc(var(--bot-h) + var(--safe-b) + 40px); outline: none; }
h1, h2, h3 { line-height: 1.5; letter-spacing: .03em; font-feature-settings: "palt"; }
p { margin: 0 0 1em; }
strong { font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--mark) 75%, transparent) 62%); }
.muted { color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

/* ===== top bar ===== */
.top {
  position: sticky; top: 0; z-index: 20;
  height: var(--top-h);
  display: flex; align-items: center; gap: 2px;
  padding: 0 6px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-size: 15px; line-height: 1.4;
}
.top .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; padding: 0 4px; color: var(--muted); font-size: 14px; }
.ib {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; height: 44px; padding: 0 8px;
  border: 0; background: none; border-radius: 10px; color: var(--text); cursor: pointer; text-decoration: none;
  font-size: 14px; font-weight: 600;
}
.ib svg { width: 22px; height: 22px; }
.ib:active { background: var(--surface2); }
.ib .aa { font-size: 13px; letter-spacing: 0; }
.ib .aa b { font-size: 18px; }
.readbar { position: sticky; top: var(--top-h); z-index: 19; height: 2px; margin-top: -2px; pointer-events: none; }
.readbar i { display: block; height: 100%; width: 0; background: var(--accent); opacity: .7; transition: width .15s linear; }

/* ===== bottom nav ===== */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 4px 6px calc(4px + var(--safe-b));
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  font-size: 12px; line-height: 1.2;
}
.bottom:empty { display: none; }
.nb {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 52px; padding: 4px 2px;
  border: 0; background: none; border-radius: 12px;
  color: var(--muted); text-decoration: none; cursor: pointer; letter-spacing: .02em;
}
.nb svg { width: 24px; height: 24px; }
.nb.on { color: var(--accent); font-weight: 600; }
.nb:active { background: var(--surface2); }
.nb[aria-disabled="true"] { opacity: .32; pointer-events: none; }
.nb.wide { flex-direction: row; gap: 2px; font-size: 14px; font-weight: 600; color: var(--text); }
.nb.wide.primary { background: var(--accent); color: var(--on-accent); }
.nb.wide.primary:active { filter: brightness(.95); }
.bottom.ep { grid-template-columns: 1.35fr .8fr .8fr 1.35fr; grid-auto-flow: row; }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 10px 18px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text);
  font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; line-height: 1.4;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.block { display: flex; width: 100%; }
.btn:active { filter: brightness(.96); }

/* ===== cover ===== */
.cover { min-height: calc(100vh - var(--top-h) - var(--bot-h) - 40px); min-height: calc(100svh - var(--top-h) - var(--bot-h) - 40px); display: flex; flex-direction: column; justify-content: center; padding: 28px 4px 12px; }
.cover .mark { color: var(--accent); margin-bottom: 18px; }
.cover .mark svg { width: 44px; height: 44px; stroke-width: 1.4; }
.cover .aud { font-size: 13px; color: var(--muted); letter-spacing: .12em; margin: 0 0 10px; }
.cover h1 { font-size: 1.85rem; line-height: 1.4; margin: 0 0 14px; letter-spacing: .04em; }
.cover h1 .q { color: var(--accent); }
.cover .sub { color: var(--muted); font-size: .95em; line-height: 1.8; margin: 0 0 28px; }
.cover .stats { display: flex; gap: 10px; margin: 0 0 22px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cover .stats span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.cover .acts { display: grid; gap: 10px; }
.cover .resume-note { font-size: 13px; color: var(--muted); margin: 2px 0 0; text-align: center; line-height: 1.6; }
.cover .rule { height: 1px; background: var(--line); margin: 0 0 24px; width: 48px; }

/* ===== toc ===== */
.pg-h { font-size: 1.35rem; margin: 18px 0 6px; }
.toc-progress { margin: 4px 0 18px; }
.meter { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.toc-progress .lbl { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.resume-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 0 0 18px; border-radius: 14px; background: var(--accent-soft); color: var(--text); text-decoration: none; line-height: 1.5; }
.resume-card svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.resume-card small { display: block; color: var(--muted); font-size: 12px; }
.resume-card b { font-size: 15px; }
.part-h { font-size: 13px; color: var(--muted); letter-spacing: .08em; margin: 26px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-weight: 600; }
.part-h b { color: var(--accent); margin-right: .5em; }
.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list a { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px; padding: 11px 2px; min-height: 60px; color: var(--text); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); line-height: 1.5; }
.toc-list a:active { background: var(--surface2); }
.toc-list .no { font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.toc-list .t { font-size: 15.5px; font-weight: 600; display: block; }
.toc-list .s { font-size: 12.5px; color: var(--muted); display: block; margin-top: 1px; }
.toc-list .r { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.toc-list .r svg { width: 22px; height: 22px; }
.toc-list .r .ck { color: var(--line); }
.toc-list .is-read .ck { color: var(--accent); }
.toc-list .is-read .t { color: var(--muted); }
.toc-list .bm { color: var(--w-bd); }
.toc-list .bm svg { width: 16px; height: 16px; }
.marks { margin: 0 0 8px; }
.marks a { display: flex; align-items: center; gap: 10px; padding: 10px 2px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.5; min-height: 48px; }
.marks a svg { width: 18px; height: 18px; color: var(--w-bd); flex: none; }
.marks small { color: var(--muted); margin-left: auto; white-space: nowrap; font-size: 12px; }

/* ===== episode ===== */
.ep { padding-top: 10px; }
.ep-meta { font-size: 13px; color: var(--accent); letter-spacing: .08em; font-weight: 600; margin: 14px 0 4px; }
.ep h1 { font-size: 1.5rem; margin: 0 0 6px; }
.ep-sub { color: var(--muted); font-size: .92em; line-height: 1.7; margin: 0 0 22px; }
.ep h2 { font-size: 1.22rem; margin: 2.2em 0 .8em; padding: 0 0 .35em; border-bottom: 1px solid var(--line); }
.ep h3 { font-size: 1.06rem; margin: 1.8em 0 .5em; padding-left: .6em; border-left: 3px solid var(--accent); line-height: 1.55; }
.ep ul, .ep ol { margin: 0 0 1em; padding-left: 1.5em; }
.ep li { margin: .3em 0; padding-left: .15em; }
.ep li.nested { margin-left: 1.2em; list-style-type: circle; }
.ep li::marker { color: var(--muted); }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1.3em 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: .9em; line-height: 1.6; }
.table-wrap th, .table-wrap td { padding: .6em .75em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); overflow-wrap: break-word; word-break: normal; min-width: 4.5em; }
.table-wrap th + th, .table-wrap td + td { border-left: 1px solid var(--line); }
.table-wrap thead th { background: var(--surface2); font-weight: 600; font-size: .95em; }
.table-wrap tbody tr:last-child td { border-bottom: 0; }

.term { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 1.5px; text-underline-offset: .28em; cursor: pointer; border-radius: 3px; }
.term:active { background: var(--accent-soft); }

/* blocks */
.blk { --bg2: var(--surface); --bd: var(--line); --ink: var(--muted); margin: 1.5em 0; padding: .85em 1.05em 1em; border-radius: 14px; background: var(--bg2); border: 1px solid color-mix(in srgb, var(--bd) 28%, transparent); border-left: 4px solid var(--bd); }
.blk-h { display: flex; align-items: center; gap: .45em; font-size: 13.5px; font-weight: 700; letter-spacing: .08em; color: var(--ink); margin: 0 0 .45em; line-height: 1.4; }
.blk-h svg { width: 20px; height: 20px; flex: none; }
.blk-b > :last-child { margin-bottom: 0; }
.blk-b ul, .blk-b ol { padding-left: 1.3em; }
.blk-question { --bg2: var(--q-bg); --bd: var(--q-bd); --ink: var(--q-ink); }
.blk-question .blk-b { font-size: 1.04em; font-weight: 600; }
.blk-answer { --bg2: var(--a-bg); --bd: var(--a-bd); --ink: var(--a-ink); }
.blk-why { --bg2: var(--w-bg); --bd: var(--w-bd); --ink: var(--w-ink); padding-top: 1em; padding-bottom: 1.1em; }
.blk-student { --bg2: var(--s-bg); --bd: var(--s-bd); --ink: var(--s-ink); }
.blk-caution { --bg2: var(--c-bg); --bd: var(--c-bd); --ink: var(--c-ink); }
.blk-summary { --bg2: var(--m-bg); --bd: var(--m-bd); --ink: var(--m-ink); }
.blk-summary ul { list-style: none; padding-left: 0; }
.blk-summary li { position: relative; padding-left: 1.5em; margin: .45em 0; }
.blk-summary li::before { content: ""; position: absolute; left: .2em; top: .62em; width: .7em; height: .38em; border-left: 2px solid var(--m-bd); border-bottom: 2px solid var(--m-bd); transform: rotate(-45deg); }
.blk-figure { margin-left: 0; margin-right: 0; --bd: var(--muted); border-style: dashed; border-left-style: solid; background: var(--surface); }
.blk-figure .blk-b { font-size: .94em; color: var(--muted); }
.blk-other { --bd: var(--muted); }
.blk-source { --bd: var(--line); background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 1em 0 0; margin-top: 2.2em; font-size: 13px; line-height: 1.7; color: var(--muted); }
.blk-source .blk-h { color: var(--muted); }
.blk-source ul { padding-left: 1.1em; }
.blk-source a { overflow-wrap: anywhere; word-break: break-all; }

/* quiz */
.blk-quiz { --bg2: var(--surface); --bd: var(--accent); --ink: var(--accent); }
.quiz-item + .quiz-item { margin-top: 1.4em; padding-top: 1.2em; border-top: 1px dashed var(--line); }
.quiz-q { font-weight: 600; margin-bottom: .7em; }
.qno { display: inline-block; margin-right: .5em; color: var(--accent); font-weight: 700; }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 1.9em 1fr auto; align-items: center; gap: 10px;
  width: 100%; min-height: 50px; padding: 9px 12px; text-align: left;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg);
  cursor: pointer; line-height: 1.6; font-size: .95em;
}
.choice .mk { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--surface2); font-size: 13px; font-weight: 700; color: var(--muted); }
.choice .badge { display: none; font-size: 12px; font-weight: 700; color: var(--ok-bd); border: 1px solid var(--ok-bd); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.choice:active { background: var(--surface2); }
.quiz-item.done .choice { cursor: default; opacity: .55; }
.quiz-item.done .choice[data-c] { opacity: 1; border-color: var(--ok-bd); background: var(--ok-bg); }
.quiz-item.done .choice[data-c] .mk { background: var(--ok-bd); color: var(--bg); }
.quiz-item.done .choice[data-c] .badge { display: inline-block; }
.quiz-item.done .choice.picked:not([data-c]) { opacity: 1; border-color: var(--ng-bd); background: var(--ng-bg); }
.quiz-item.done .choice.picked:not([data-c]) .mk { background: var(--ng-bd); color: var(--bg); }
.quiz-ex { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface2); font-size: .94em; }
.quiz-item.done .quiz-ex { display: block; animation: fade .25s ease; }
.verdict { font-weight: 700; margin-bottom: .4em; }
.verdict.ok { color: var(--ok-bd); }
.verdict.ng { color: var(--ng-bd); }
.exl { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-right: .5em; line-height: 1.6; vertical-align: .1em; }
.quiz-retry { margin-top: 4px; min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; cursor: pointer; }
@keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* end of episode */
.ep-end { margin: 2.6em 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.ep-end .done-line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.ep-end .done-line svg { width: 22px; height: 22px; color: var(--accent); }
.next-card { display: block; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; line-height: 1.55; }
.next-card small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-bottom: 2px; }
.next-card b { font-size: 16px; }
.next-card span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.btn.ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; min-height: 44px; }

/* ===== glossary ===== */
.g-index { position: sticky; top: var(--top-h); z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.g-index button { min-width: 40px; min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; cursor: pointer; }
.g-group h2 { font-size: 14px; color: var(--accent); margin: 22px 0 4px; letter-spacing: .1em; scroll-margin-top: calc(var(--top-h) + 64px); }
.g-list { margin: 0; }
.g-item { padding: 12px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--top-h) + 64px); border-radius: 6px; transition: background .6s; }
.g-item dt { font-weight: 700; font-size: 1.02em; line-height: 1.5; }
.g-item dt small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: .6em; }
.g-item dd { margin: 4px 0 0; font-size: .95em; line-height: 1.8; }
.g-item.flash { background: var(--accent-soft); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; font-size: 15px; }

/* ===== search ===== */
.search-box { position: sticky; top: var(--top-h); z-index: 5; background: var(--bg); padding: 12px 0 10px; }
.search-box label { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 12px; }
.search-box label:focus-within { border-color: var(--accent); }
.search-box svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; height: 48px; }
.search-box input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .6; }
.s-count { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.s-sec { font-size: 13px; color: var(--muted); margin: 18px 0 2px; font-weight: 600; letter-spacing: .06em; }
.s-hit { display: block; padding: 12px 2px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; line-height: 1.65; }
.s-hit b { font-size: 15px; }
.s-hit small { color: var(--muted); font-size: 12px; margin-left: .4em; }
.s-hit p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ===== sheet / toast ===== */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-wrap[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(10,10,10,.38); animation: fade .2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 680px; margin: 0 auto; max-height: 72vh; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px 20px calc(16px + var(--safe-b)); box-shadow: var(--shadow); animation: up .22s ease; }
.sheet-grip { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-size: 1.15rem; margin: 0 0 8px; }
.sheet h2 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: .6em; }
.sheet-body { line-height: 1.85; margin-bottom: 16px; }
.sheet-act { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--bot-h) + var(--safe-b) + 16px); transform: translate(-50%, 8px); z-index: 60; background: var(--text); color: var(--bg); font-size: 14px; padding: 8px 16px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: .94; transform: translate(-50%, 0); }

/* ===== print-mode (?print=1) ===== */
.print-mode .top, .print-mode .bottom, .print-mode .readbar { display: none; }
.print-mode main { padding-bottom: 40px; }
.pr-cover { min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
.pr-cover h1 { font-size: 2rem; margin: 0 0 12px; }
.pr-toc ol { list-style: none; padding: 0; margin: 0; }
.pr-toc li { display: flex; gap: 8px; padding: 3px 0; font-size: .92em; line-height: 1.6; }
.pr-toc li .n { color: var(--muted); width: 3.2em; flex: none; }
.pr-toc li .m { margin-left: auto; color: var(--muted); white-space: nowrap; }
.pr-sec { margin-top: 48px; }
.print-mode .ep-end, .print-mode .quiz-retry { display: none; }
.print-mode .quiz-ex { display: block; }
.print-mode .choice[data-c] { border-color: var(--ok-bd); background: var(--ok-bg); }
.print-mode .choice[data-c] .badge { display: inline-block; }
.print-mode .verdict { display: none; }

  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #fff; --surface: #fff; --surface2: #f2f0eb; --text: #1e1d1b; --muted: #555; --line: #ccc; --accent: #2f5f69; --accent-soft: #eef4f5;
    --q-bg: #f1f4f8; --q-bd: #6c84a6; --q-ink: #34506f;
    --a-bg: #eff5f0; --a-bd: #5a8a63; --a-ink: #335c3b;
    --w-bg: #f8f3e7; --w-bd: #a9832f; --w-ink: #6e5016;
    --s-bg: #f3f1f7; --s-bd: #8270a5; --s-ink: #4f416d;
    --c-bg: #f9f0ed; --c-bd: #ad6250; --c-ink: #7d3c2e;
    --m-bg: #edf5f4; --m-bd: #46817f; --m-ink: #2b5c5a;
    --ok-bg: #e8f3ea; --ok-bd: #3f7a4b; --mark: #f2e2a8;
    --fs: 10.5pt;
    color-scheme: light;
  }
  @page { size: A5; margin: 14mm 13mm 16mm; }
  body { line-height: 1.75; background: #fff; }
  .top, .bottom, .readbar, .sheet-wrap, .toast, .ep-end, .quiz-retry, .g-index, .search-box, .resume-card, .cover .acts { display: none !important; }
  main { max-width: none; padding: 0; }
  .ep { break-before: page; page-break-before: always; padding-top: 0; }
  .ep-meta { margin-top: 0; }
  .blk, .table-wrap, .quiz-item, .g-item, figure { break-inside: avoid; page-break-inside: avoid; }
  h2, h3 { break-after: avoid; page-break-after: avoid; }
  .table-wrap { overflow: visible; }
  .table-wrap th, .table-wrap td { word-break: normal; overflow-wrap: anywhere; }
  .term { color: inherit; text-decoration: none; }
  .quiz-ex { display: block !important; background: #f6f5f1; }
  .verdict { display: none; }
  .choice { opacity: 1 !important; min-height: 0; padding: 5px 10px; background: #fff; }
  .choice[data-c] { border-color: var(--ok-bd); background: var(--ok-bg); }
  .choice[data-c] .badge { display: inline-block; }
  .blk-source a { color: inherit; text-decoration: none; }
  .pr-sec, .pr-gloss { break-before: page; page-break-before: always; }
  .cover, .pr-cover { min-height: 0; padding-top: 30mm; }
  strong { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .blk, .choice, .quiz-ex, mark, thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

<script type="application/json" id="book-data">{"book":{"title":"投資の「なぜ」がわかる本","subtitle":"1話3〜5分。根っこの理由から理解する、はじめての資産形成","audience":"大学1年生のための入門書"},"parts":{"0":"はじめに","1":"お金と経済の根っこ","2":"家計の土台をつくる","3":"投資の考え方","4":"金融商品を知る","5":"税金と制度","6":"はじめてみる","7":"心と罠","8":"その先へ"},"episodes":[{"no":1,"part":0,"title":"この本の歩き方","subtitle":"7週間の学習プランと「なぜ」を大切にする理由","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資の本はたくさんあります。この本は何が違い、どう読めばよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>この本は「何をするか」より先に「なぜそうなるのか」を説明します。1日1話、約3〜5分で、全50話を約7週間で読み終える設計です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>この本が目指すこと\u003c/h2>\n\u003cp>この本の読者として想定しているのは、大学1年生で、手元に約20万円がある人です。投資は初めてで、「そういうものだから」では納得できない人を思い浮かべて書いています。\u003c/p>\n\u003cp>ゴールは、長期の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"資産形成\">資産形成\u003c/span>を自分の頭で判断できるようになることです。資産形成とは、時間をかけてお金を少しずつ増やし、将来に備えることです。特定の商品や金融機関をすすめる本ではありません。\u003c/p>\n\u003ch2>なぜ「なぜ」が大切なのか\u003c/h2>\n\u003cp>投資のやり方だけなら、短い動画でも覚えられます。それでも理由から学ぶのには、はっきりした目的があります。\u003c/p>\n\u003cp>1つ目は、\u003cstrong>不安な場面で手を止めないため\u003c/strong>です。株価が大きく下がると、多くの人が怖くなって売ってしまいます。仕組みを知っていれば、何が起きているのかを落ち着いて考えられます。\u003c/p>\n\u003cp>2つ目は、\u003cstrong>怪しい話を見抜くため\u003c/strong>です。「確実に増える」という話がなぜおかしいのか。理由を知っていれば、言い回しが変わっても見抜けます。\u003c/p>\n\u003cp>3つ目は、\u003cstrong>制度が変わっても困らないため\u003c/strong>です。税金やNISAの数字は、数年ごとに変わります。しかし、金利や複利、分散といった原理はほとんど変わりません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>人が投資で失敗する大きな原因は、知識の量より「想定外」です。知らない出来事が起きると、人は損を避けようとして慌てて動きます。理由まで理解していると、多くの出来事が「想定内」になります。だからこの本は、手順の前に理由を置いています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>1話の読み方\u003c/h2>\n\u003cp>各話は同じ順番で進みます。最初に「今日の疑問」と「結論」があり、本文、根っこの理由、学生の具体例、まとめ、クイズと続きます。\u003c/p>\n\u003cp>時間がない日は、疑問・結論・まとめだけ読んでもかまいません。クイズで迷ったら、本文に戻ればよい合図です。\u003c/p>\n\u003ch2>7週間の学習プラン\u003c/h2>\n\u003cp>1日1話のペースで、次のように進みます。最後の週だけ8話あります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>週\u003c/th>\u003cth>話\u003c/th>\u003cth>テーマ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1週目\u003c/td>\u003ctd>01〜07\u003c/td>\u003ctd>お金と経済の根っこ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2週目\u003c/td>\u003ctd>08〜14\u003c/td>\u003ctd>家計の土台と投資の考え方\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3週目\u003c/td>\u003ctd>15〜21\u003c/td>\u003ctd>リスク・分散・長期と株式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4週目\u003c/td>\u003ctd>22〜28\u003c/td>\u003ctd>金融商品のしくみと手数料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5週目\u003c/td>\u003ctd>29〜35\u003c/td>\u003ctd>税金・NISA・口座の制度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6週目\u003c/td>\u003ctd>36〜42\u003c/td>\u003ctd>実際に始める手順と暴落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7週目\u003c/td>\u003ctd>43〜50\u003c/td>\u003ctd>出口・心の罠・その先へ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>前半の3週間は、すぐ役立つ話が少なく感じるかもしれません。しかし、後半の「何を買うか」を納得して選ぶための土台になります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を持つ大学1年生なら、7週間は投資を始めずに読み進めても損はほとんどありません。たとえば20万円を年5%で増やせたとしても、7週間分は約1,300円です（20万円 × 5% × 7週 ÷ 52週）。焦って始めるより、理解してから始めるほうが大切です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>この本の制度や数字は、2026年10月時点の日本の情報に基づきます。制度は変わることがあるので、実際に手続きする前には公式サイトで最新の情報を確かめてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>この本は「なぜそうなるのか」を中心に説明する\u003c/li>\u003cli>理由を知ると、暴落や怪しい話にも落ち着いて対応しやすい\u003c/li>\u003cli>1日1話、約7週間で全50話を読み終える\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>この本が「理由」から学ぶことを重視している主な目的はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">投資のやり方を早く覚えるため\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">想定外の出来事でも落ち着いて判断するため\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">特定のおすすめ商品を見つけるため\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>理由を理解していると、多くの出来事が想定内になり、慌てた行動を避けやすくなります。この本は特定の商品をすすめません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/index.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"投資の本はたくさんあります。この本は何が違い、どう読めばよいのでしょうか。 この本は「何をするか」より先に「なぜそうなるのか」を説明します。1日1話、約3〜5分で、全50話を約7週間で読み終える設計です。 この本が目指すこと この本の読者として想定しているのは、大学1年生で、手元に約20万円がある人です。投資は初めてで、「そういうものだから」では納得できない人を思い浮かべて書いています。 ゴールは、長期の資産形成を自分の頭で判断できるようになることです。資産形成とは、時間をかけてお金を少しずつ増やし、将来に備えることです。特定の商品や金融機関をすすめる本ではありません。 なぜ「なぜ」が大切なのか 投資のやり方だけなら、短い動画でも覚えられます。それでも理由から学ぶのには、はっきりした目的があります。 1つ目は、不安な場面で手を止めないためです。株価が大きく下がると、多くの人が怖くなって売ってしまいます。仕組みを知っていれば、何が起きているのかを落ち着いて考えられます。 2つ目は、怪しい話を見抜くためです。「確実に増える」という話がなぜおかしいのか。理由を知っていれば、言い回しが変わっても見抜けます。 3つ目は、制度が変わっても困らないためです。税金やNISAの数字は、数年ごとに変わります。しかし、金利や複利、分散といった原理はほとんど変わりません。 人が投資で失敗する大きな原因は、知識の量より「想定外」です。知らない出来事が起きると、人は損を避けようとして慌てて動きます。理由まで理解していると、多くの出来事が「想定内」になります。だからこの本は、手順の前に理由を置いています。 1話の読み方 各話は同じ順番で進みます。最初に「今日の疑問」と「結論」があり、本文、根っこの理由、学生の具体例、まとめ、クイズと続きます。 時間がない日は、疑問・結論・まとめだけ読んでもかまいません。クイズで迷ったら、本文に戻ればよい合図です。 7週間の学習プラン 1日1話のペースで、次のように進みます。最後の週だけ8話あります。 週 話 テーマ 1週目 01〜07 お金と経済の根っこ 2週目 08〜14 家計の土台と投資の考え方 3週目 15〜21 リスク・分散・長期と株式 4週目 22〜28 金融商品のしくみと手数料 5週目 29〜35 税金・NISA・口座の制度 6週目 36〜42 実際に始める手順と暴落 7週目 43〜50 出口・心の罠・その先へ 前半の3週間は、すぐ役立つ話が少なく感じるかもしれません。しかし、後半の「何を買うか」を納得して選ぶための土台になります。 20万円を持つ大学1年生なら、7週間は投資を始めずに読み進めても損はほとんどありません。たとえば20万円を年5%で増やせたとしても、7週間分は約1,300円です（20万円 × 5% × 7週 ÷ 52週）。焦って始めるより、理解してから始めるほうが大切です。 この本の制度や数字は、2026年10月時点の日本の情報に基づきます。制度は変わることがあるので、実際に手続きする前には公式サイトで最新の情報を確かめてください。 この本は「なぜそうなるのか」を中心に説明する 理由を知ると、暴落や怪しい話にも落ち着いて対応しやすい 1日1話、約7週間で全50話を読み終える この本が「理由」から学ぶことを重視している主な目的はどれでしょう。 投資のやり方を早く覚えるため 想定外の出来事でも落ち着いて判断するため 特定のおすすめ商品を見つけるため 理由を理解していると、多くの出来事が想定内になり、慌てた行動を避けやすくなります。この本は特定の商品をすすめません。"},{"no":2,"part":1,"title":"そもそもお金って何？","subtitle":"紙切れに価値がある理由（信用）","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>1万円札は、紙としてはほとんど価値がないはずです。それなのに、なぜ1万円分の物と交換できるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「みんなが受け取ってくれる」と誰もが信じているからです。お金の価値の正体は、紙そのものではなく\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"信用\">信用\u003c/span>です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>お金がなかったら困ること\u003c/h2>\n\u003cp>お金のない世界を想像してみます。あなたはパンが欲しく、手元にはノートがあるとします。パン屋さんがノートを欲しがっていなければ、交換は成立しません。\u003c/p>\n\u003cp>この「お互いが相手の物を欲しがる」偶然は、めったに起きません。そこで人は、誰もが受け取ってくれる共通の交換の道具を使うようになりました。それがお金です。\u003c/p>\n\u003ch2>お金の3つの役割\u003c/h2>\n\u003cp>お金には、大きく3つの役割があります。\u003c/p>\n\u003col>\u003cli>\u003cstrong>交換の手段\u003c/strong>: 物やサービスと交換できる\u003c/li>\u003cli>\u003cstrong>価値のものさし\u003c/strong>: 「パン200円、本1,500円」のように価値を比べられる\u003c/li>\u003cli>\u003cstrong>価値の保存\u003c/strong>: 今日のバイト代を、来月使うためにとっておける\u003c/li>\u003c/ol>\n\u003cp>3つ目の「保存」がうまくいくかどうかは、物価に左右されます。この点は第3話と第6話で詳しく扱います。\u003c/p>\n\u003ch2>紙のお金を支えるもの\u003c/h2>\n\u003cp>日本のお札は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"日本銀行券\">日本銀行券\u003c/span>といい、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"中央銀行\">中央銀行\u003c/span>である日本銀行が発行しています。中央銀行とは、国のお金の量や金利を調整する特別な銀行です。日本銀行は、日本銀行法にもとづいてお札を独占的に発行しています。\u003c/p>\n\u003cp>昔のお札は、金や銀と交換できることで信用を得ていました。今は金と交換できません。その代わり、物価を安定させる金融政策によって、お札の価値を保つ考え方になっています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>あなたは「お店は1万円札を受け取ってくれる」と信じています。お店も「仕入れ先が受け取ってくれる」と信じています。だから1万円札が使えるのです。この信頼の連鎖が社会全体でつながっているので、紙切れが1万円として通用します。\u003c/p>\n\u003cp>さらに、法律がお札を支払いに使えると定め、日本銀行が物価の安定に努めています。つまりお金は「みんなで共有している約束」です。約束が守られると皆が思える限り、価値が保たれます。逆に、政府や中央銀行への信頼が崩れた国では、お金の価値が急に下がった例が歴史上いくつもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>信用はお金以外にも広がる\u003c/h2>\n\u003cp>「信用が価値を生む」という考え方は、この本の全体に出てきます。銀行に預けたお金も、株式も債券も、相手が約束を守るという信用の上に成り立っています。\u003c/p>\n\u003cp>投資とは、ある意味で「誰の約束を、どのくらい信じるか」を選ぶ行為です。この見方は、第20話の株式や第23話の債券を読むときに役立ちます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>あなたの20万円も、20万円の紙や数字に価値があるわけではありません。「20万円分の物やサービスと交換できる力」に価値があります。たとえば1冊1,500円の教科書なら約133冊分です。この「交換できる力」が将来どう変わるかが、投資を考える出発点になります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>暗号資産（仮想通貨）は「お金」と呼ばれることがありますが、日本の法律上の通貨ではありません。価値を支える仕組みも異なります。性質の違いは第28話で扱います。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>お金は、物々交換の不便さを解決する共通の道具\u003c/li>\u003cli>お金には「交換・ものさし・保存」の3つの役割がある\u003c/li>\u003cli>お札の価値を支えているのは、社会全体の信用と物価の安定\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>現在の日本のお札（日本銀行券）の価値を支えている考え方として、最も近いものはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">同じ金額の金と交換できること\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">社会全体の信用と、物価を安定させる金融政策\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">紙の印刷コストが高いこと\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>現在のお札は金とは交換できません。人々の信用と、日本銀行による物価の安定が価値を支えています。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本銀行「お札は誰が発行しているのですか？」 \u003ca href=\"https://www.boj.or.jp/about/education/oshiete/money/c02.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/about/education/oshiete/money/c02.htm\u003c/a>\u003c/li>\u003cli>日本銀行「銀行券が日本銀行のバランスシートにおいて負債に計上されているのはなぜですか？」 \u003ca href=\"https://www.boj.or.jp/announcements/education/oshiete/outline/a23.htm/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/announcements/education/oshiete/outline/a23.htm/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"1万円札は、紙としてはほとんど価値がないはずです。それなのに、なぜ1万円分の物と交換できるのでしょうか。 「みんなが受け取ってくれる」と誰もが信じているからです。お金の価値の正体は、紙そのものではなく信用です。 お金がなかったら困ること お金のない世界を想像してみます。あなたはパンが欲しく、手元にはノートがあるとします。パン屋さんがノートを欲しがっていなければ、交換は成立しません。 この「お互いが相手の物を欲しがる」偶然は、めったに起きません。そこで人は、誰もが受け取ってくれる共通の交換の道具を使うようになりました。それがお金です。 お金の3つの役割 お金には、大きく3つの役割があります。 交換の手段: 物やサービスと交換できる 価値のものさし: 「パン200円、本1,500円」のように価値を比べられる 価値の保存: 今日のバイト代を、来月使うためにとっておける 3つ目の「保存」がうまくいくかどうかは、物価に左右されます。この点は第3話と第6話で詳しく扱います。 紙のお金を支えるもの 日本のお札は日本銀行券といい、中央銀行である日本銀行が発行しています。中央銀行とは、国のお金の量や金利を調整する特別な銀行です。日本銀行は、日本銀行法にもとづいてお札を独占的に発行しています。 昔のお札は、金や銀と交換できることで信用を得ていました。今は金と交換できません。その代わり、物価を安定させる金融政策によって、お札の価値を保つ考え方になっています。 あなたは「お店は1万円札を受け取ってくれる」と信じています。お店も「仕入れ先が受け取ってくれる」と信じています。だから1万円札が使えるのです。この信頼の連鎖が社会全体でつながっているので、紙切れが1万円として通用します。 さらに、法律がお札を支払いに使えると定め、日本銀行が物価の安定に努めています。つまりお金は「みんなで共有している約束」です。約束が守られると皆が思える限り、価値が保たれます。逆に、政府や中央銀行への信頼が崩れた国では、お金の価値が急に下がった例が歴史上いくつもあります。 信用はお金以外にも広がる 「信用が価値を生む」という考え方は、この本の全体に出てきます。銀行に預けたお金も、株式も債券も、相手が約束を守るという信用の上に成り立っています。 投資とは、ある意味で「誰の約束を、どのくらい信じるか」を選ぶ行為です。この見方は、第20話の株式や第23話の債券を読むときに役立ちます。 あなたの20万円も、20万円の紙や数字に価値があるわけではありません。「20万円分の物やサービスと交換できる力」に価値があります。たとえば1冊1,500円の教科書なら約133冊分です。この「交換できる力」が将来どう変わるかが、投資を考える出発点になります。 暗号資産（仮想通貨）は「お金」と呼ばれることがありますが、日本の法律上の通貨ではありません。価値を支える仕組みも異なります。性質の違いは第28話で扱います。 お金は、物々交換の不便さを解決する共通の道具 お金には「交換・ものさし・保存」の3つの役割がある お札の価値を支えているのは、社会全体の信用と物価の安定 現在の日本のお札（日本銀行券）の価値を支えている考え方として、最も近いものはどれでしょう。 同じ金額の金と交換できること 社会全体の信用と、物価を安定させる金融政策 紙の印刷コストが高いこと 現在のお札は金とは交換できません。人々の信用と、日本銀行による物価の安定が価値を支えています。"},{"no":3,"part":1,"title":"物価はなぜ上がる？","subtitle":"インフレとデフレ","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>コンビニのおにぎりや学食の値段が、少しずつ上がっている気がします。物の値段は、なぜ上がるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>物の値段は、欲しい人の多さ（需要）と、作れる量や作るコスト（供給）の関係で決まります。物価が全体的に上がり続けることを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"インフレ\">インフレ\u003c/span>、下がり続けることを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"デフレ\">デフレ\u003c/span>といいます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>物価とは「たくさんの値段の平均」\u003c/h2>\n\u003cp>物価とは、個々の値段ではなく、暮らしに関わる多くの物やサービスの値段をまとめたものです。日本では総務省が\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"消費者物価指数\">消費者物価指数\u003c/span>（CPI）を毎月発表しています。CPIは、家計が買う品物の値段の変化を1つの数字にした指標です。\u003c/p>\n\u003cp>2026年9月の全国のCPIは、前年の同じ月より約2.1%上がりました。1年前に1万円で買えた品物が、平均すると約10,210円になったという意味です。\u003c/p>\n\u003ch2>物価が上がる3つの理由\u003c/h2>\n\u003cp>物価が上がる理由は、大きく3つに分けられます。\u003c/p>\n\u003col>\u003cli>\u003cstrong>欲しい人が増える\u003c/strong>: 景気がよく、みんながお金を使うと、品物が足りなくなり値段が上がります。\u003c/li>\u003cli>\u003cstrong>作るコストが上がる\u003c/strong>: 原油や原材料、人件費が上がると、会社は値上げせざるを得ません。\u003c/li>\u003cli>\u003cstrong>お金の量が増える\u003c/strong>: 世の中のお金が物に比べて増えると、お金1円あたりの価値が下がります。\u003c/li>\u003c/ol>\n\u003cp>円安で輸入品の値段が上がるのは、2つ目の例です。為替の話は第41話で扱います。\u003c/p>\n\u003ch2>デフレはなぜ困るのか\u003c/h2>\n\u003cp>値段が下がるなら、うれしいと感じるかもしれません。しかし、物価が下がり続けると、会社の売上が減り、給料も上がりにくくなります。給料が増えないと人はお金を使わず、さらに値段が下がるという悪い循環が起きやすくなります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>では、なぜ日本銀行は「物価ゼロ%」ではなく「2%」の上昇を目標にしているのでしょうか。日本銀行は主に2つの理由を挙げています。\u003c/p>\n\u003cp>1つ目は、CPIには実際より高めに出るクセがあることです。新しい製品の品質向上などを十分に反映しきれないためです。\u003c/p>\n\u003cp>2つ目は「のりしろ」です。景気が悪くなったとき、中央銀行は金利を下げて支えます。物価がゼロ%近くだと金利もゼロ近くになり、下げる余地がなくなります。少しプラスの物価上昇があれば、金利を下げる余地を残せます。\u003c/p>\n\u003cp>つまり2%は、「デフレに落ちないための安全な距離」として選ばれた数字です。米国や英国なども同じ2%を目標にしています。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を現金のまま持っていて、物価が毎年2%上がるとします。1年後、20万円で買える量は「今の約19.6万円分」に減ります（20万円 ÷ 1.02 ≒ 19.6万円）。お金の額は減っていないのに、買える物が減ります。これが第6話のテーマにつながります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>CPIはあくまで平均です。食費の割合が大きい学生と、住宅ローンを払う家庭では、実感する物価上昇は異なります。ニュースの数字と自分の生活は、分けて考えましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>物価は、需要と供給、そしてお金の量で動く\u003c/li>\u003cli>物価が上がり続けるとインフレ、下がり続けるとデフレ\u003c/li>\u003cli>日本銀行は「デフレに落ちない余裕」として2%の物価上昇を目標にしている\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>日本銀行が物価上昇率0%ではなく2%を目標にしている理由として、正しいものはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">物価が高いほど国民の暮らしがよくなるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">景気が悪いときに金利を下げる余地を残せるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">2%なら株価が必ず上がるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>物価がゼロ%近くだと金利を下げる余地がなくなります。少しのプラスは「のりしろ」の役割を果たします。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>総務省統計局「消費者物価指数（CPI）全国（最新の月次結果の概要）」 \u003ca href=\"https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html\u003c/a>\u003c/li>\u003cli>日本銀行「黒田総裁講演『なぜ「2％」の物価上昇を目指すのか』（2014年3月）」 \u003ca href=\"https://www.boj.or.jp/about/press/koen_2014/ko140320a.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/about/press/koen_2014/ko140320a.htm\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"コンビニのおにぎりや学食の値段が、少しずつ上がっている気がします。物の値段は、なぜ上がるのでしょうか。 物の値段は、欲しい人の多さ（需要）と、作れる量や作るコスト（供給）の関係で決まります。物価が全体的に上がり続けることをインフレ、下がり続けることをデフレといいます。 物価とは「たくさんの値段の平均」 物価とは、個々の値段ではなく、暮らしに関わる多くの物やサービスの値段をまとめたものです。日本では総務省が消費者物価指数（CPI）を毎月発表しています。CPIは、家計が買う品物の値段の変化を1つの数字にした指標です。 2026年9月の全国のCPIは、前年の同じ月より約2.1%上がりました。1年前に1万円で買えた品物が、平均すると約10,210円になったという意味です。 物価が上がる3つの理由 物価が上がる理由は、大きく3つに分けられます。 欲しい人が増える: 景気がよく、みんながお金を使うと、品物が足りなくなり値段が上がります。 作るコストが上がる: 原油や原材料、人件費が上がると、会社は値上げせざるを得ません。 お金の量が増える: 世の中のお金が物に比べて増えると、お金1円あたりの価値が下がります。 円安で輸入品の値段が上がるのは、2つ目の例です。為替の話は第41話で扱います。 デフレはなぜ困るのか 値段が下がるなら、うれしいと感じるかもしれません。しかし、物価が下がり続けると、会社の売上が減り、給料も上がりにくくなります。給料が増えないと人はお金を使わず、さらに値段が下がるという悪い循環が起きやすくなります。 では、なぜ日本銀行は「物価ゼロ%」ではなく「2%」の上昇を目標にしているのでしょうか。日本銀行は主に2つの理由を挙げています。 1つ目は、CPIには実際より高めに出るクセがあることです。新しい製品の品質向上などを十分に反映しきれないためです。 2つ目は「のりしろ」です。景気が悪くなったとき、中央銀行は金利を下げて支えます。物価がゼロ%近くだと金利もゼロ近くになり、下げる余地がなくなります。少しプラスの物価上昇があれば、金利を下げる余地を残せます。 つまり2%は、「デフレに落ちないための安全な距離」として選ばれた数字です。米国や英国なども同じ2%を目標にしています。 20万円を現金のまま持っていて、物価が毎年2%上がるとします。1年後、20万円で買える量は「今の約19.6万円分」に減ります（20万円 ÷ 1.02 ≒ 19.6万円）。お金の額は減っていないのに、買える物が減ります。これが第6話のテーマにつながります。 CPIはあくまで平均です。食費の割合が大きい学生と、住宅ローンを払う家庭では、実感する物価上昇は異なります。ニュースの数字と自分の生活は、分けて考えましょう。 物価は、需要と供給、そしてお金の量で動く 物価が上がり続けるとインフレ、下がり続けるとデフレ 日本銀行は「デフレに落ちない余裕」として2%の物価上昇を目標にしている 日本銀行が物価上昇率0%ではなく2%を目標にしている理由として、正しいものはどれでしょう。 物価が高いほど国民の暮らしがよくなるから 景気が悪いときに金利を下げる余地を残せるから 2%なら株価が必ず上がるから 物価がゼロ%近くだと金利を下げる余地がなくなります。少しのプラスは「のりしろ」の役割を果たします。"},{"no":4,"part":1,"title":"金利とは何か","subtitle":"お金の「時間の価値」","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>銀行に預けると利息がつき、お金を借りると利息を払います。なぜお金を貸すと「お礼」がもらえるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>今のお金は、将来の同じ額のお金より価値が高いからです。その差を埋める「お金のレンタル料」が\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"金利\">金利\u003c/span>です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>金利は「お金のレンタル料」\u003c/h2>\n\u003cp>金利とは、お金を借りる人が貸す人に払うレンタル料の割合です。年1%なら、100万円を1年借りると1万円を上乗せして返します。最初に貸し借りしたお金を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"元本\">元本\u003c/span>、上乗せ分を利息といいます。\u003c/p>\n\u003cp>銀行預金も、実はあなたが銀行にお金を貸している状態です。だから銀行はあなたに利息を払います。\u003c/p>\n\u003cp>金利は、ふつう「1年あたり何%」という年率で表します。年1%で半年だけ借りるなら、利息は約半分の0.5%分です。ローンやカードの金利を比べるときも、年率で見るのが基本です。\u003c/p>\n\u003ch2>今の1万円と1年後の1万円\u003c/h2>\n\u003cp>「今すぐ1万円もらう」か「1年後に1万円もらう」かを選べるなら、多くの人は今を選びます。今もらえば、すぐ使えるうえ、どこかに預けて増やすこともできるからです。\u003c/p>\n\u003cp>このように、お金には「時間の価値」があります。お金を貸す人は、その時間の価値を手放します。金利は、その分を埋め合わせるための対価です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>貸す側が「お礼」を求める理由は、大きく3つあります。\u003c/p>\n\u003col>\u003cli>\u003cstrong>今使う楽しみを我慢する\u003c/strong>: 貸している間、自分はそのお金を使えません。\u003c/li>\u003cli>\u003cstrong>返ってこないかもしれない\u003c/strong>: 相手が返せなくなる可能性があります。危ない相手ほど高い金利を求めます。\u003c/li>\u003cli>\u003cstrong>物価が上がるかもしれない\u003c/strong>: 1年後にお金が返ってきても、物価が上がっていれば買える量が減ります。\u003c/li>\u003c/ol>\n\u003cp>この3つを足し合わせたものが、金利の正体です。だから信用の高い国や大企業への貸し出しは低い金利になり、返せないおそれが大きい相手ほど金利が高くなります。第15話の「リスクとリターンはなぜセットなのか」も、同じ考え方の延長です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>金利は誰が決めるのか\u003c/h2>\n\u003cp>金利は、お金を借りたい人と貸したい人の関係で動きます。その土台になるのが、日本銀行が誘導する\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"政策金利\">政策金利\u003c/span>です。政策金利とは、銀行どうしが短期間お金を貸し借りするときの金利の目標です。\u003c/p>\n\u003cp>日本銀行は2026年9月、この金利を1.0%程度から1.25%程度へ引き上げました。日本の政策金利は長くほぼゼロでしたが、物価が上がるなかで段階的に引き上げられています。政策金利が上がると、預金金利やローン金利も上がりやすくなります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>大手銀行の普通預金金利は、2026年10月時点で年0.4%程度です（11月から0.5%に上げると報じられています）。年0.4%で20万円を1年預けると、利息は800円です（20万円 × 0.004）。ここから約20%（正確には20.315%）の税金が引かれ、手取りは約640円になります。税金の内訳は第29話で扱います。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>金利は「高ければよい」とは限りません。高い金利をうたう話は、それだけ返ってこないリスクが高いことを意味します。理由のない高金利は、詐欺を疑う合図です（第46話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金利は、お金の時間の価値に対する「レンタル料」\u003c/li>\u003cli>金利には「我慢・返ってこないリスク・物価上昇」への対価が含まれる\u003c/li>\u003cli>日本銀行は2026年9月に政策金利を1.25%程度へ引き上げた\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>返せなくなるおそれが大きい相手にお金を貸すとき、金利はどうなりやすいでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">低くなる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">高くなる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">相手に関係なく同じ\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>返ってこないリスクを引き受ける分、貸す側はより高い対価を求めます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本銀行「金融市場調節方針の変更について（2026年9月18日）」 \u003ca href=\"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260918a.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260918a.pdf\u003c/a>\u003c/li>\u003cli>日本銀行「金融政策に関する決定事項等 2026年」 \u003ca href=\"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/index.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/index.htm\u003c/a>\u003c/li>\u003cli>3メガバンクの普通預金金利（2026年11月2日から年0.5%へ引き上げ）に関する各行の発表と報道（2026年9月）\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"銀行に預けると利息がつき、お金を借りると利息を払います。なぜお金を貸すと「お礼」がもらえるのでしょうか。 今のお金は、将来の同じ額のお金より価値が高いからです。その差を埋める「お金のレンタル料」が金利です。 金利は「お金のレンタル料」 金利とは、お金を借りる人が貸す人に払うレンタル料の割合です。年1%なら、100万円を1年借りると1万円を上乗せして返します。最初に貸し借りしたお金を元本、上乗せ分を利息といいます。 銀行預金も、実はあなたが銀行にお金を貸している状態です。だから銀行はあなたに利息を払います。 金利は、ふつう「1年あたり何%」という年率で表します。年1%で半年だけ借りるなら、利息は約半分の0.5%分です。ローンやカードの金利を比べるときも、年率で見るのが基本です。 今の1万円と1年後の1万円 「今すぐ1万円もらう」か「1年後に1万円もらう」かを選べるなら、多くの人は今を選びます。今もらえば、すぐ使えるうえ、どこかに預けて増やすこともできるからです。 このように、お金には「時間の価値」があります。お金を貸す人は、その時間の価値を手放します。金利は、その分を埋め合わせるための対価です。 貸す側が「お礼」を求める理由は、大きく3つあります。 今使う楽しみを我慢する: 貸している間、自分はそのお金を使えません。 返ってこないかもしれない: 相手が返せなくなる可能性があります。危ない相手ほど高い金利を求めます。 物価が上がるかもしれない: 1年後にお金が返ってきても、物価が上がっていれば買える量が減ります。 この3つを足し合わせたものが、金利の正体です。だから信用の高い国や大企業への貸し出しは低い金利になり、返せないおそれが大きい相手ほど金利が高くなります。第15話の「リスクとリターンはなぜセットなのか」も、同じ考え方の延長です。 金利は誰が決めるのか 金利は、お金を借りたい人と貸したい人の関係で動きます。その土台になるのが、日本銀行が誘導する政策金利です。政策金利とは、銀行どうしが短期間お金を貸し借りするときの金利の目標です。 日本銀行は2026年9月、この金利を1.0%程度から1.25%程度へ引き上げました。日本の政策金利は長くほぼゼロでしたが、物価が上がるなかで段階的に引き上げられています。政策金利が上がると、預金金利やローン金利も上がりやすくなります。 大手銀行の普通預金金利は、2026年10月時点で年0.4%程度です（11月から0.5%に上げると報じられています）。年0.4%で20万円を1年預けると、利息は800円です（20万円 × 0.004）。ここから約20%（正確には20.315%）の税金が引かれ、手取りは約640円になります。税金の内訳は第29話で扱います。 金利は「高ければよい」とは限りません。高い金利をうたう話は、それだけ返ってこないリスクが高いことを意味します。理由のない高金利は、詐欺を疑う合図です（第46話）。 金利は、お金の時間の価値に対する「レンタル料」 金利には「我慢・返ってこないリスク・物価上昇」への対価が含まれる 日本銀行は2026年9月に政策金利を1.25%程度へ引き上げた 返せなくなるおそれが大きい相手にお金を貸すとき、金利はどうなりやすいでしょう。 低くなる 高くなる 相手に関係なく同じ 返ってこないリスクを引き受ける分、貸す側はより高い対価を求めます。"},{"no":5,"part":1,"title":"複利のしくみ","subtitle":"利息が利息を生む、72の法則","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「複利は人類最大の発明」という言葉を聞いたことがあります。複利とは何で、なぜそんなに強いと言われるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"複利\">複利\u003c/span>とは、ついた利息を元本に加え、次はその合計に利息がつく仕組みです。増えた分がさらに増えるので、時間が長いほど差が大きく開きます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>単利と複利の違い\u003c/h2>\n\u003cp>利息のつき方には2種類あります。\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"単利\">単利\u003c/span>は、最初の元本にだけ利息がつく方式です。複利は、元本と、それまでについた利息の合計に利息がつく方式です。\u003c/p>\n\u003cp>20万円を年5%で増やす場合で比べてみます。単利なら、毎年1万円ずつ増えます。複利なら、1年目は1万円、2年目は21万円の5%で1万500円、と少しずつ増える額が大きくなります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>期間\u003c/th>\u003cth>単利\u003c/th>\u003cth>複利\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>10年後\u003c/td>\u003ctd>30万円\u003c/td>\u003ctd>約32.6万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20年後\u003c/td>\u003ctd>40万円\u003c/td>\u003ctd>約53.1万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30年後\u003c/td>\u003ctd>50万円\u003c/td>\u003ctd>約86.4万円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>最初の10年では差は約2.6万円です。ところが30年後には、差が約36万円に広がります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ複利は後半になるほど加速するのでしょうか。理由は「増える量が、今の大きさに比例する」からです。\u003c/p>\n\u003cp>単利では、利息を毎回取り出して使ってしまうイメージです。元本はずっと20万円のままなので、増える量も毎年同じです。\u003c/p>\n\u003cp>複利では、利息を手元に戻して一緒に働かせます。お金が大きくなるほど、5%の中身も大きくなります。大きくなったお金がさらに大きく増え、雪だるまのように転がるほど太っていきます。\u003c/p>\n\u003cp>だから複利の力を引き出すには、利率を上げるより「時間を長くとる」ことが効きます。若いうちに始める意味は、この性質から生まれます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>72の法則\u003c/h2>\n\u003cp>複利でお金が2倍になるまでの年数は、「72 ÷ 年利（%）」でおおよそ求められます。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"72の法則\">72の法則\u003c/span>といいます。\u003c/p>\n\u003cul>\u003cli>年利6%なら、72 ÷ 6 = 約12年で2倍\u003c/li>\u003cli>年利3%なら、72 ÷ 3 = 約24年で2倍\u003c/li>\u003cli>年利0.4%なら、72 ÷ 0.4 = 約180年で2倍\u003c/li>\u003c/ul>\n\u003cp>72が使われるのは、計算が簡単で、年利2〜10%くらいの範囲でよく当たるからです。正確な値とは少しずれますが、ざっくり比べるには十分です。\u003c/p>\n\u003ch2>複利を生かす3つの条件\u003c/h2>\n\u003cp>複利の効果を受けるには、いくつか条件があります。\u003c/p>\n\u003col>\u003cli>\u003cstrong>増えた分を使わない\u003c/strong>: 利息や利益を引き出して使うと、単利と同じになります。\u003c/li>\u003cli>\u003cstrong>時間を長くとる\u003c/strong>: 差が大きく開くのは、10年、20年たってからです。\u003c/li>\u003cli>\u003cstrong>コストを小さくする\u003c/strong>: 手数料も毎年引かれるので、複利でじわじわ効きます（第27話）。\u003c/li>\u003c/ol>\n\u003cp>どれも特別な才能はいりません。「待つこと」と「減らさないこと」が中心です。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>18歳で20万円を年5%の複利で運用できたとします。72 ÷ 5 = 約14年で2倍になるので、32歳ごろに約40万円です。さらに約14年後の46歳ごろには約80万円になります。何も足さなくても、時間だけでここまで差がつく計算です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>ここでの年5%は計算のための例です。株式などの投資では、毎年きっちり5%増えるわけではありません。年によって大きく上下します。また、複利は借金にも働きます。返さない利息がさらに利息を生む怖さは、第10話で扱います。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>複利は、利息を元本に加えて、合計にまた利息がつく仕組み\u003c/li>\u003cli>増える量が今の大きさに比例するので、時間がたつほど加速する\u003c/li>\u003cli>72 ÷ 年利で、2倍になるまでのおおよその年数がわかる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>年利4%の複利で運用すると、お金が2倍になるまでおよそ何年かかるでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">約4年\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">約12年\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">約18年\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>72の法則より、72 ÷ 4 = 18年です。あくまで目安で、実際の投資の利回りは一定ではありません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>財務省 中国財務局「複利効果について」 \u003ca href=\"https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/fukurikouka.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/fukurikouka.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「複利は人類最大の発明」という言葉を聞いたことがあります。複利とは何で、なぜそんなに強いと言われるのでしょうか。 複利とは、ついた利息を元本に加え、次はその合計に利息がつく仕組みです。増えた分がさらに増えるので、時間が長いほど差が大きく開きます。 単利と複利の違い 利息のつき方には2種類あります。単利は、最初の元本にだけ利息がつく方式です。複利は、元本と、それまでについた利息の合計に利息がつく方式です。 20万円を年5%で増やす場合で比べてみます。単利なら、毎年1万円ずつ増えます。複利なら、1年目は1万円、2年目は21万円の5%で1万500円、と少しずつ増える額が大きくなります。 期間 単利 複利 10年後 30万円 約32.6万円 20年後 40万円 約53.1万円 30年後 50万円 約86.4万円 最初の10年では差は約2.6万円です。ところが30年後には、差が約36万円に広がります。 なぜ複利は後半になるほど加速するのでしょうか。理由は「増える量が、今の大きさに比例する」からです。 単利では、利息を毎回取り出して使ってしまうイメージです。元本はずっと20万円のままなので、増える量も毎年同じです。 複利では、利息を手元に戻して一緒に働かせます。お金が大きくなるほど、5%の中身も大きくなります。大きくなったお金がさらに大きく増え、雪だるまのように転がるほど太っていきます。 だから複利の力を引き出すには、利率を上げるより「時間を長くとる」ことが効きます。若いうちに始める意味は、この性質から生まれます。 72の法則 複利でお金が2倍になるまでの年数は、「72 ÷ 年利（%）」でおおよそ求められます。これを72の法則といいます。 年利6%なら、72 ÷ 6 = 約12年で2倍 年利3%なら、72 ÷ 3 = 約24年で2倍 年利0.4%なら、72 ÷ 0.4 = 約180年で2倍 72が使われるのは、計算が簡単で、年利2〜10%くらいの範囲でよく当たるからです。正確な値とは少しずれますが、ざっくり比べるには十分です。 複利を生かす3つの条件 複利の効果を受けるには、いくつか条件があります。 増えた分を使わない: 利息や利益を引き出して使うと、単利と同じになります。 時間を長くとる: 差が大きく開くのは、10年、20年たってからです。 コストを小さくする: 手数料も毎年引かれるので、複利でじわじわ効きます（第27話）。 どれも特別な才能はいりません。「待つこと」と「減らさないこと」が中心です。 18歳で20万円を年5%の複利で運用できたとします。72 ÷ 5 = 約14年で2倍になるので、32歳ごろに約40万円です。さらに約14年後の46歳ごろには約80万円になります。何も足さなくても、時間だけでここまで差がつく計算です。 ここでの年5%は計算のための例です。株式などの投資では、毎年きっちり5%増えるわけではありません。年によって大きく上下します。また、複利は借金にも働きます。返さない利息がさらに利息を生む怖さは、第10話で扱います。 複利は、利息を元本に加えて、合計にまた利息がつく仕組み 増える量が今の大きさに比例するので、時間がたつほど加速する 72 ÷ 年利で、2倍になるまでのおおよその年数がわかる 年利4%の複利で運用すると、お金が2倍になるまでおよそ何年かかるでしょう。 約4年 約12年 約18年 72の法則より、72 ÷ 4 = 18年です。あくまで目安で、実際の投資の利回りは一定ではありません。"},{"no":6,"part":1,"title":"預金だけではいけないの？","subtitle":"インフレと実質的な目減り","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>預金なら元本が減らず安心です。それでも「預金だけでは損をする」と言われるのはなぜでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>預金の金額は減りませんが、物価が預金金利より速く上がると、買える量が減ります。金額ではなく「買える力」で見ると、目減りが起きているのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>「名目」と「実質」\u003c/h2>\n\u003cp>金利には2つの見方があります。\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"名目金利\">名目金利\u003c/span>は、通帳に書かれている金利そのものです。\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"実質金利\">実質金利\u003c/span>は、名目金利から物価上昇率を差し引いた、買える力で見た金利です。\u003c/p>\n\u003cp>たとえば預金金利が年0.4%で、物価上昇率が年2.1%だとします。実質金利は、0.4% − 2.1% = 約マイナス1.7%です。通帳の数字は増えても、買える物は1年で約1.7%減る計算です。\u003c/p>\n\u003cp>2026年10月時点の日本では、大手銀行の普通預金金利は年0.4%程度です。一方、2026年9月の消費者物価は前年より約2.1%上がりました。この状態が続けば、預金の実質金利はマイナスです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ預金金利は、物価上昇率より低くなりやすいのでしょうか。\u003c/p>\n\u003cp>1つ目の理由は、預金が「安全で、いつでも引き出せる」からです。銀行は預かったお金を企業や個人に貸し、その金利との差で利益を得ます。安全と便利さを提供する代わりに、預金者に払う金利は低めになります。安全にはコストがかかるのです。\u003c/p>\n\u003cp>2つ目は、預金金利が物価の動きに遅れて動くことです。物価が上がり始めても、銀行がすぐに預金金利を上げるとは限りません。\u003c/p>\n\u003cp>つまり預金は「減らない安心」と引き換えに、「物価に負けやすい」という性質を持っています。どちらが正しいではなく、性質の違いです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>それでも預金が大切な理由\u003c/h2>\n\u003cp>預金には、ほかの資産にない強みがあります。元本が変わらず、すぐに引き出せることです。さらに\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"預金保険制度\">預金保険制度\u003c/span>により、銀行が破綻しても1つの金融機関につき1人あたり元本1,000万円と、破綻日までの利息が保護されます。\u003c/p>\n\u003cp>急な出費に備えるお金は、値動きしない預金で持つのが向いています。この「生活防衛資金」については第8話で扱います。\u003c/p>\n\u003ch2>物価に負けにくい資産とは\u003c/h2>\n\u003cp>では、物価に負けにくいのはどんな資産でしょうか。代表例は株式です。物価が上がると、会社が売る商品の値段も上がり、売上や利益も増えやすくなります。会社の持ち分である株式は、その利益の伸びを受け取れます。\u003c/p>\n\u003cp>ただし、株式は短期間で大きく値下がりすることもあります。物価に負けにくい代わりに、値動きという別のリスクを引き受けるわけです。株が長期で上がってきた根拠は、次の第7話で見ていきます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を年0.4%の預金に置き、物価が年2.1%上がり続けたとします。実質で年約1.7%ずつ目減りすると、10年後の買える力は「今の約17万円分」です。通帳の数字は約20.8万円に増えていても、買える量は約3万円分減る計算です（税金は考えていません）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>これは「預金は悪い」という意味ではありません。日本では1990年代後半から長い間、物価がほとんど上がらない時期が続き、預金でも買える力はあまり減りませんでした。将来の物価は誰にも正確にはわかりません。だからこそ、預金と投資に役割を分けて持つ考え方が生まれます（第12話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>実質金利は、名目金利から物価上昇率を引いた「買える力」の金利\u003c/li>\u003cli>物価上昇率が預金金利を上回ると、預金の買える力は目減りする\u003c/li>\u003cli>預金は「すぐ使える・減らない」強みがあり、役割を分けて使う\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>預金金利が年0.5%、物価上昇率が年2%のとき、実質金利はおよそいくつでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">年プラス2.5%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">年プラス0.5%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">年マイナス1.5%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>実質金利は名目金利から物価上昇率を引いて求めます。0.5% − 2% = マイナス1.5%です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5
