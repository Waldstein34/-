div class=\"blk-b\">\u003cp>積立を始めたいのですが、毎月いくらにすればよいのかわかりません。学生なら、どれくらいが現実的でしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>決める順番は「守るお金を確保する → 毎月の残りを知る → その一部を積み立てる」です。学生の場合、月1,000円〜1万円ほどの少額から始める人が多いです。学生時代は金額よりも、続く仕組みを作ることに意味があります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>金額を決める3つのステップ\u003c/h2>\n\u003col>\u003cli>\u003cstrong>守るお金を先に確保する\u003c/strong>: 急な出費に備える\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"生活防衛資金\">生活防衛資金\u003c/span>を残します（第8話）。\u003c/li>\u003cli>\u003cstrong>毎月の残りを知る\u003c/strong>: バイト代や仕送りから、生活費を引いた額を把握します（第9話）。\u003c/li>\u003cli>\u003cstrong>予定の出費を差し引く\u003c/strong>: 教科書、帰省、免許、旅行など、近く使うお金は投資に回しません。\u003c/li>\u003c/ol>\n\u003cp>この残りの一部、たとえば半分を積立にあてます。全部を回すと、急な出費のたびに積立を止めることになります。\u003c/p>\n\u003cp>多くの金融機関では、投資信託を月100円や1,000円から積み立てられます。金額はあとから変えられるので、最初は小さく始めて構いません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ学生のうちは「金額」より「続く仕組み」が大切なのでしょうか。\u003c/p>\n\u003cp>学生にとって最大の財産は、手元の20万円ではありません。これから40年あまり働いて得る給料、つまり「稼ぐ力」です。経済学ではこれを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"人的資本\">人的資本\u003c/span>と呼びます。\u003c/p>\n\u003cp>学生時代に積み立てられる金額は、社会人になってからの額に比べると小さくなりがちです。下の計算のように、4年間の運用益も数万円の規模です。\u003c/p>\n\u003cp>それでも始める意味があるのは、仕組みと心の練習ができるからです。値下がりを経験し、それでも続ける感覚を少額で身につけておく。そうすれば、就職して積立額を増やすとき、慌てずに済みます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>無理のない額の目安\u003c/h2>\n\u003cp>積立額が適切かどうかは、次の問いで確かめられます。\u003c/p>\n\u003cul>\u003cli>資産が3割下がっても、生活や気持ちに影響しないか\u003c/li>\u003cli>急な出費があっても、積立を止めずに済むか\u003c/li>\u003cli>遊びや勉強、人付き合いを我慢しすぎていないか\u003c/li>\u003c/ul>\n\u003cp>どれかに不安があれば、額を下げるのが正解です。止めずに続けられる額こそが、その人にとっての適切な額です。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>バイト収入が月6万円（例）、生活費が月5万円の学生を考えます。残りは月1万円です。\u003c/p>\n\u003cp>このうち5,000円を積立、5,000円を預金に回すとします。年3%で4年間増えたと仮定すると、元本24万円は約25.5万円になります。増えた分は約1.5万円です。\u003c/p>\n\u003cp>手元の20万円は、生活防衛資金や予定の出費を残し、その残りを一度にまたは分けて投資する方法もあります。分け方は第12話で扱いました。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「早く始めるほど得」と聞いて、生活費まで回すのは逆効果です。下がったときに売らざるを得なくなり、損が確定してしまいます。\u003c/p>\n\u003cp>ここでの計算は一定の利回りを仮定したもので、将来の成果を約束するものではありません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>守るお金と予定の出費を残し、毎月の残りの一部を積み立てる\u003c/li>\u003cli>学生は月1,000円〜1万円ほどの少額から始め、あとで増やせばよい\u003c/li>\u003cli>学生時代の積立は、金額より「続ける練習」に価値がある\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>積立額を決めるとき、最初にすることはどれでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">できるだけ多く投資に回す\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">生活防衛資金など、守るお金を確保する\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">人気の商品を調べる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>守るお金を先に残しておかないと、急な出費のたびに積立を止めたり、売ったりすることになります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「資産形成の基本（NISA特設ウェブサイト）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/invest/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/invest/\u003c/a>\u003c/li>\u003cli>金融庁「つみたてシミュレーター」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/tsumitate-simulator/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/tsumitate-simulator/\u003c/a>\u003c/li>\u003cli>※本文の運用額は、月5,000円・年3%・48か月の複利で筆者が計算した概算\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"積立を始めたいのですが、毎月いくらにすればよいのかわかりません。学生なら、どれくらいが現実的でしょうか。 決める順番は「守るお金を確保する → 毎月の残りを知る → その一部を積み立てる」です。学生の場合、月1,000円〜1万円ほどの少額から始める人が多いです。学生時代は金額よりも、続く仕組みを作ることに意味があります。 金額を決める3つのステップ 守るお金を先に確保する: 急な出費に備える生活防衛資金を残します（第8話）。 毎月の残りを知る: バイト代や仕送りから、生活費を引いた額を把握します（第9話）。 予定の出費を差し引く: 教科書、帰省、免許、旅行など、近く使うお金は投資に回しません。 この残りの一部、たとえば半分を積立にあてます。全部を回すと、急な出費のたびに積立を止めることになります。 多くの金融機関では、投資信託を月100円や1,000円から積み立てられます。金額はあとから変えられるので、最初は小さく始めて構いません。 なぜ学生のうちは「金額」より「続く仕組み」が大切なのでしょうか。 学生にとって最大の財産は、手元の20万円ではありません。これから40年あまり働いて得る給料、つまり「稼ぐ力」です。経済学ではこれを人的資本と呼びます。 学生時代に積み立てられる金額は、社会人になってからの額に比べると小さくなりがちです。下の計算のように、4年間の運用益も数万円の規模です。 それでも始める意味があるのは、仕組みと心の練習ができるからです。値下がりを経験し、それでも続ける感覚を少額で身につけておく。そうすれば、就職して積立額を増やすとき、慌てずに済みます。 無理のない額の目安 積立額が適切かどうかは、次の問いで確かめられます。 資産が3割下がっても、生活や気持ちに影響しないか 急な出費があっても、積立を止めずに済むか 遊びや勉強、人付き合いを我慢しすぎていないか どれかに不安があれば、額を下げるのが正解です。止めずに続けられる額こそが、その人にとっての適切な額です。 バイト収入が月6万円（例）、生活費が月5万円の学生を考えます。残りは月1万円です。 このうち5,000円を積立、5,000円を預金に回すとします。年3%で4年間増えたと仮定すると、元本24万円は約25.5万円になります。増えた分は約1.5万円です。 手元の20万円は、生活防衛資金や予定の出費を残し、その残りを一度にまたは分けて投資する方法もあります。分け方は第12話で扱いました。 「早く始めるほど得」と聞いて、生活費まで回すのは逆効果です。下がったときに売らざるを得なくなり、損が確定してしまいます。 ここでの計算は一定の利回りを仮定したもので、将来の成果を約束するものではありません。 守るお金と予定の出費を残し、毎月の残りの一部を積み立てる 学生は月1,000円〜1万円ほどの少額から始め、あとで増やせばよい 学生時代の積立は、金額より「続ける練習」に価値がある 積立額を決めるとき、最初にすることはどれでしょうか。 できるだけ多く投資に回す 生活防衛資金など、守るお金を確保する 人気の商品を調べる 守るお金を先に残しておかないと、急な出費のたびに積立を止めたり、売ったりすることになります。"},{"no":40,"part":6,"title":"積立設定をしてみる","subtitle":"画面の前で迷うポイント","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>口座ができたので、積立の設定をしようと思います。でも、画面に選ぶ項目が多くて手が止まりました。どこで迷いやすいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>迷いやすいのは「どの枠で」「いくら」「いつ・どの頻度で」「何で払うか」「分配金をどうするか」の5つです。多くは長い目で見ると結果への影響が小さく、自分の家計に合わせて選べば十分です。設定のあとは、実際に買えたかを確かめましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>迷いやすい5つの項目\u003c/h2>\n\u003ch3>1. どの枠で買うか\u003c/h3>\n\u003cp>NISAの\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"つみたて投資枠\">つみたて投資枠\u003c/span>を選ぶのが基本です。課税される口座を選んでしまわないよう、画面の表示を確認します。\u003c/p>\n\u003ch3>2. 金額\u003c/h3>\n\u003cp>第39話で決めた額を入れます。あとから変えられます。\u003c/p>\n\u003ch3>3. 頻度と日にち\u003c/h3>\n\u003cp>毎月・毎週・毎日などから選べることが多いです。毎月の場合は、バイト代が入った数日後の日にすると、残高不足を防げます。\u003c/p>\n\u003ch3>4. 支払い方法\u003c/h3>\n\u003cp>証券口座に入れたお金、銀行口座からの引き落とし、クレジットカードなどがあります。クレジットカードでの積立は、制度上の上限が月10万円です。\u003c/p>\n\u003ch3>5. 分配金の受け取り方\u003c/h3>\n\u003cp>投資信託の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"分配金\">分配金\u003c/span>を「受け取る」か「再投資する」かを選びます。長期で増やすことが目的なら、再投資を選ぶのが一般的です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「毎日か毎月か」で、ほとんど差がつかないのでしょうか。\u003c/p>\n\u003cp>積立は、価格を予測しないための方法です（第18話）。どの日が安いかは、事前にはわかりません。毎日に分けても、毎月まとめても、長く続ければ平均の買い値はあまり変わらなくなります。\u003c/p>\n\u003cp>だから頻度は「どれが儲かるか」ではなく、「自分のお金の流れと合うか」で決めればよいのです。\u003c/p>\n\u003cp>分配金を再投資にする理由も根っこは同じです。投資信託の分配金は、ファンドの資産の一部を払い出すものです。払い出した分だけ、ファンドの値段（基準価額）は下がります。受け取って使えば、複利で増える元が減ります。再投資すれば、利益がさらに利益を生む流れを保てます（第5話）。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>設定のあとに確かめること\u003c/h2>\n\u003cul>\u003cli>初回の買い付け日に、実際に買えているか\u003c/li>\u003cli>残高不足で「買えなかった」と表示されていないか\u003c/li>\u003cli>NISAの枠で買えているか（取引履歴に口座区分が出ることが多い）\u003c/li>\u003c/ul>\n\u003cp>最初の1回を確かめれば、あとは基本的に自動で続きます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>月5,000円を、毎月27日（例）に、証券口座のお金で、つみたて投資枠で買う設定にしたとします。分配金は再投資です。\u003c/p>\n\u003cp>バイト代が25日に入るなら、26日に5,000円を証券口座へ移しておけば、残高不足を防げます。1年で6万円、つみたて投資枠120万円の5%を使う計算です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>クレジットカードで払うとポイントが付くことがありますが、条件は会社ごとに違い、変わることもあります。カードの使いすぎにつながらないかにも注意しましょう。\u003c/p>\n\u003cp>「ボーナス月に増額」などの設定は、学生には不要なことが多いです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>迷うのは、枠・金額・頻度と日にち・支払い方法・分配金の5つ\u003c/li>\u003cli>頻度による差は長期では小さく、家計の流れに合わせればよい\u003c/li>\u003cli>分配金は再投資が基本。初回は買えたかをかならず確かめる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>長期で増やすことが目的のとき、投資信託の分配金の受け取り方として一般的なのはどれでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">受け取って生活費に使う\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">再投資する\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">毎月分配型を選ぶ\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>分配金はファンドの資産の払い出しなので、再投資すると複利の効果を保ちやすくなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「『金融商品取引業等に関する内閣府令』等の改正（案）の公表について」（クレジットカード積立の上限引き上げ） \u003ca href=\"https://www.fsa.go.jp/news/r5/shouken/20231219/20231219.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/news/r5/shouken/20231219/20231219.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAを知る（NISA特設ウェブサイト）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003cli>金融庁「つみたて投資枠対象商品」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/products/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/products/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"口座ができたので、積立の設定をしようと思います。でも、画面に選ぶ項目が多くて手が止まりました。どこで迷いやすいのでしょうか。 迷いやすいのは「どの枠で」「いくら」「いつ・どの頻度で」「何で払うか」「分配金をどうするか」の5つです。多くは長い目で見ると結果への影響が小さく、自分の家計に合わせて選べば十分です。設定のあとは、実際に買えたかを確かめましょう。 迷いやすい5つの項目 1. どの枠で買うか NISAのつみたて投資枠を選ぶのが基本です。課税される口座を選んでしまわないよう、画面の表示を確認します。 2. 金額 第39話で決めた額を入れます。あとから変えられます。 3. 頻度と日にち 毎月・毎週・毎日などから選べることが多いです。毎月の場合は、バイト代が入った数日後の日にすると、残高不足を防げます。 4. 支払い方法 証券口座に入れたお金、銀行口座からの引き落とし、クレジットカードなどがあります。クレジットカードでの積立は、制度上の上限が月10万円です。 5. 分配金の受け取り方 投資信託の分配金を「受け取る」か「再投資する」かを選びます。長期で増やすことが目的なら、再投資を選ぶのが一般的です。 なぜ「毎日か毎月か」で、ほとんど差がつかないのでしょうか。 積立は、価格を予測しないための方法です（第18話）。どの日が安いかは、事前にはわかりません。毎日に分けても、毎月まとめても、長く続ければ平均の買い値はあまり変わらなくなります。 だから頻度は「どれが儲かるか」ではなく、「自分のお金の流れと合うか」で決めればよいのです。 分配金を再投資にする理由も根っこは同じです。投資信託の分配金は、ファンドの資産の一部を払い出すものです。払い出した分だけ、ファンドの値段（基準価額）は下がります。受け取って使えば、複利で増える元が減ります。再投資すれば、利益がさらに利益を生む流れを保てます（第5話）。 設定のあとに確かめること 初回の買い付け日に、実際に買えているか 残高不足で「買えなかった」と表示されていないか NISAの枠で買えているか（取引履歴に口座区分が出ることが多い） 最初の1回を確かめれば、あとは基本的に自動で続きます。 月5,000円を、毎月27日（例）に、証券口座のお金で、つみたて投資枠で買う設定にしたとします。分配金は再投資です。 バイト代が25日に入るなら、26日に5,000円を証券口座へ移しておけば、残高不足を防げます。1年で6万円、つみたて投資枠120万円の5%を使う計算です。 クレジットカードで払うとポイントが付くことがありますが、条件は会社ごとに違い、変わることもあります。カードの使いすぎにつながらないかにも注意しましょう。 「ボーナス月に増額」などの設定は、学生には不要なことが多いです。 迷うのは、枠・金額・頻度と日にち・支払い方法・分配金の5つ 頻度による差は長期では小さく、家計の流れに合わせればよい 分配金は再投資が基本。初回は買えたかをかならず確かめる 長期で増やすことが目的のとき、投資信託の分配金の受け取り方として一般的なのはどれでしょうか。 受け取って生活費に使う 再投資する 毎月分配型を選ぶ 分配金はファンドの資産の払い出しなので、再投資すると複利の効果を保ちやすくなります。"},{"no":41,"part":6,"title":"為替と外国株","subtitle":"円安・円高で、手元の投資信託に何が起きるのか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>日本円で買った全世界株式の投資信託なのに、ニュースで「円高」と聞くと値下がりするのはなぜですか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>中身が外国の株だからです。外国株の価値はドルなどの外貨で決まり、それを円に換算し直して表示しています。そのため、株価が動かなくても、為替が動くだけで円での評価額が変わります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>為替レートは「通貨の値段」\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"為替レート\">為替レート\u003c/span>とは、ある通貨を別の通貨と交換するときの比率です。「1ドル=150円」は、1ドルを手に入れるのに150円が必要という意味です。\u003c/p>\n\u003cp>これが1ドル=160円になると、同じ1ドルに前より多くの円が必要です。円の価値が下がったので「円安」と呼びます。逆に1ドル=140円になれば「円高」です。\u003c/p>\n\u003cp>数字が大きくなるのに「安」と呼ぶので混乱しやすい所です。「円が安く売られている」と考えると覚えやすくなります。\u003c/p>\n\u003ch2>円での評価額はどう決まるか\u003c/h2>\n\u003cp>外国株の円での評価額は、次のかけ算で決まります。\u003c/p>\n\u003cul>\u003cli>外貨での値段 × 為替レート = 円での値段\u003c/li>\u003c/ul>\n\u003cp>たとえば、100ドルの株を1ドル=150円のときに持つと、円では1万5,000円です。株価が100ドルのまま1ドル=165円になれば、1万6,500円に増えます。1ドル=135円になれば1万3,500円に減ります。\u003c/p>\n\u003cp>つまり外国株には、「株価の動き」と「為替の動き」という2つのぶれが重なっています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>そもそも為替レートは、なぜ動くのでしょうか。根っこにあるのは、ほかの値段と同じ「需要と供給」です。\u003c/p>\n\u003cp>ドルを欲しい人が増えればドルが値上がりし、円安になります。ドルが欲しくなる理由はいくつもあります。日本の会社が海外から原油や部品を買うとき。投資家が、金利の高い国の債券を買うとき。日本人が外国株の投資信託を積み立てるときも、裏では円を売ってドルを買っています。\u003c/p>\n\u003cp>特に影響が大きいとされるのが、国どうしの\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"金利差\">金利差\u003c/span>です。お金は少しでも高い利息がつく所へ移りたがります（第4話）。アメリカの金利が日本より高いと、円を売ってドルで運用したい人が増え、円安に傾きやすくなります。\u003c/p>\n\u003cp>ただし、景気、貿易、政治、人々の予想など、多くの要因が絡み合って動きます。だから専門家でも、為替の行方を当て続けることはできません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>円安・円高は過去にどのくらい動いたか\u003c/h2>\n\u003cp>為替は思った以上に大きく動きます。2011年10月には1ドル=75円台という歴史的な円高がありました。一方、2024年7月には1ドル=161円台と、約38年ぶりの円安水準になりました。\u003c/p>\n\u003cp>およそ13年で、円の価値が半分ほどになった計算です。その後の2024年9月には139円台まで戻るなど、短期間でも10%を超える動きは珍しくありません。\u003c/p>\n\u003ch2>為替ヘッジという選択肢\u003c/h2>\n\u003cp>投資信託の中には「\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"為替ヘッジ\">為替ヘッジ\u003c/span>あり」と書かれたものがあります。為替の変動による影響を、取引の工夫で小さくする仕組みです。\u003c/p>\n\u003cp>ただしヘッジには費用がかかります。その費用は、おおまかに日本と相手国の金利差で決まります。アメリカの金利が日本より高い時期は、ヘッジ費用も高くなります。\u003c/p>\n\u003cp>長期の積立では、為替ヘッジなしの商品が多く選ばれています。為替のぶれも、長い時間の中で上下しながら平らにならされる面があるからです。ただし、それは確実ではありません。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち10万円を、全世界株式の投資信託に入れたとします。中身の株価が1年間まったく動かず、為替だけが10%円高になったとしましょう。\u003c/p>\n\u003cp>評価額は10万円 × 0.9 = 9万円です。株は何も悪くないのに、1万円減って見えます。\u003c/p>\n\u003cp>逆に10%円安なら11万円です。「増えたのは株のおかげか、円安のおかげか」を分けて考えてみてください。この習慣があると、値動きに振り回されにくくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「円安が続きそうだから外国株を買う」「円高になったから売る」といった為替の予想に基づく売買はおすすめしません。為替の予測は株価の予測と同じくらい難しいからです。\u003c/p>\n\u003cp>また、日本株だけに投資しても為替と無関係ではありません。輸出の多い会社は円安で利益が増えやすいなど、間接的に影響を受けます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>外国株の円での評価額は「外貨での値段 × 為替レート」で決まる\u003c/li>\u003cli>為替は需要と供給で動き、金利差が大きな要因の一つになる\u003c/li>\u003cli>為替の予想に基づく売買はせず、ぶれの一部として受け入れる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>中身の株価が変わらず、1ドル=150円から1ドル=135円になりました。外国株の投資信託の円での評価額はどうなりますか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">増える\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">減る\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">変わらない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>1ドル=135円は円高です。同じ1ドル分の資産が、以前より少ない円にしか換算されないため、評価額は減ります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>幻冬舎ゴールドオンライン（マネックス証券 吉田恒氏の連載）「米ドル/円の歴史的推移」 \u003ca href=\"https://gentosha-go.com/articles/-/69712\" target=\"_blank\" rel=\"noopener noreferrer\">https://gentosha-go.com/articles/-/69712\u003c/a>\u003c/li>\u003cli>マネックス証券 マネクリ「米ドル/円の長期トレンド」 \u003ca href=\"https://media.monex.co.jp/articles/-/25337\" target=\"_blank\" rel=\"noopener noreferrer\">https://media.monex.co.jp/articles/-/25337\u003c/a>\u003c/li>\u003cli>2026年10月時点で確認。為替レートは概数です。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"日本円で買った全世界株式の投資信託なのに、ニュースで「円高」と聞くと値下がりするのはなぜですか。 中身が外国の株だからです。外国株の価値はドルなどの外貨で決まり、それを円に換算し直して表示しています。そのため、株価が動かなくても、為替が動くだけで円での評価額が変わります。 為替レートは「通貨の値段」 為替レートとは、ある通貨を別の通貨と交換するときの比率です。「1ドル=150円」は、1ドルを手に入れるのに150円が必要という意味です。 これが1ドル=160円になると、同じ1ドルに前より多くの円が必要です。円の価値が下がったので「円安」と呼びます。逆に1ドル=140円になれば「円高」です。 数字が大きくなるのに「安」と呼ぶので混乱しやすい所です。「円が安く売られている」と考えると覚えやすくなります。 円での評価額はどう決まるか 外国株の円での評価額は、次のかけ算で決まります。 外貨での値段 × 為替レート = 円での値段 たとえば、100ドルの株を1ドル=150円のときに持つと、円では1万5,000円です。株価が100ドルのまま1ドル=165円になれば、1万6,500円に増えます。1ドル=135円になれば1万3,500円に減ります。 つまり外国株には、「株価の動き」と「為替の動き」という2つのぶれが重なっています。 そもそも為替レートは、なぜ動くのでしょうか。根っこにあるのは、ほかの値段と同じ「需要と供給」です。 ドルを欲しい人が増えればドルが値上がりし、円安になります。ドルが欲しくなる理由はいくつもあります。日本の会社が海外から原油や部品を買うとき。投資家が、金利の高い国の債券を買うとき。日本人が外国株の投資信託を積み立てるときも、裏では円を売ってドルを買っています。 特に影響が大きいとされるのが、国どうしの金利差です。お金は少しでも高い利息がつく所へ移りたがります（第4話）。アメリカの金利が日本より高いと、円を売ってドルで運用したい人が増え、円安に傾きやすくなります。 ただし、景気、貿易、政治、人々の予想など、多くの要因が絡み合って動きます。だから専門家でも、為替の行方を当て続けることはできません。 円安・円高は過去にどのくらい動いたか 為替は思った以上に大きく動きます。2011年10月には1ドル=75円台という歴史的な円高がありました。一方、2024年7月には1ドル=161円台と、約38年ぶりの円安水準になりました。 およそ13年で、円の価値が半分ほどになった計算です。その後の2024年9月には139円台まで戻るなど、短期間でも10%を超える動きは珍しくありません。 為替ヘッジという選択肢 投資信託の中には「為替ヘッジあり」と書かれたものがあります。為替の変動による影響を、取引の工夫で小さくする仕組みです。 ただしヘッジには費用がかかります。その費用は、おおまかに日本と相手国の金利差で決まります。アメリカの金利が日本より高い時期は、ヘッジ費用も高くなります。 長期の積立では、為替ヘッジなしの商品が多く選ばれています。為替のぶれも、長い時間の中で上下しながら平らにならされる面があるからです。ただし、それは確実ではありません。 20万円のうち10万円を、全世界株式の投資信託に入れたとします。中身の株価が1年間まったく動かず、為替だけが10%円高になったとしましょう。 評価額は10万円 × 0.9 = 9万円です。株は何も悪くないのに、1万円減って見えます。 逆に10%円安なら11万円です。「増えたのは株のおかげか、円安のおかげか」を分けて考えてみてください。この習慣があると、値動きに振り回されにくくなります。 「円安が続きそうだから外国株を買う」「円高になったから売る」といった為替の予想に基づく売買はおすすめしません。為替の予測は株価の予測と同じくらい難しいからです。 また、日本株だけに投資しても為替と無関係ではありません。輸出の多い会社は円安で利益が増えやすいなど、間接的に影響を受けます。 外国株の円での評価額は「外貨での値段 × 為替レート」で決まる 為替は需要と供給で動き、金利差が大きな要因の一つになる 為替の予想に基づく売買はせず、ぶれの一部として受け入れる 中身の株価が変わらず、1ドル=150円から1ドル=135円になりました。外国株の投資信託の円での評価額はどうなりますか。 増える 減る 変わらない 1ドル=135円は円高です。同じ1ドル分の資産が、以前より少ない円にしか換算されないため、評価額は減ります。"},{"no":42,"part":6,"title":"暴落が来たら","subtitle":"過去の暴落と回復の歴史から、心の準備をする","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>積立を始めたあとに暴落が来たら、どうすればいいのでしょうか。そもそも、暴落のあと株価はちゃんと戻るのですか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>過去の大きな暴落では、数か月から数年かけて回復してきた例が多くあります。ただし、回復の時期は毎回違い、数十年かかった例もあります。大切なのは、暴落が来る前提で「売らずに済む金額」で投資しておくことです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>過去の3つの暴落\u003c/h2>\n\u003cp>まず、実際に何が起きたかを数字で見てみます。下落率は、高値から底値までの概数です。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>出来事\u003c/th>\u003cth>下落の大きさ\u003c/th>\u003cth>元の高値に戻るまで\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>リーマン・ショック（2008年）\u003c/td>\u003ctd>S&amp;P500で約57%\u003c/td>\u003ctd>約5年半（2013年3月）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>コロナ・ショック（2020年）\u003c/td>\u003ctd>S&amp;P500で約34%\u003c/td>\u003ctd>約6か月（2020年8月）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2024年8月の急落\u003c/td>\u003ctd>日経平均が1日で約12%（高値から約25%）\u003c/td>\u003ctd>約1年1か月（2025年8月）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"S&amp;P500\">S&amp;P500\u003c/span>はアメリカの代表的な大企業約500社の株価指数です。リーマン・ショックでは、2007年10月の高値から2009年3月の底まで、半分以下になりました。\u003c/p>\n\u003cp>コロナ・ショックは、わずか約1か月で約34%下がりました。しかし底から約5か月後には下げを埋め、8月に高値を更新しています。\u003c/p>\n\u003cp>2024年8月5日には、日経平均株価が1日で4,451円（約12.4%）下がりました。下げ幅は過去最大です。ところが翌日は3,217円上がり、上げ幅も過去最大となりました。直前の高値（2024年7月）を超えたのは2025年8月です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ暴落は起きるのでしょうか。株価は、会社が将来生む利益への「期待」で決まります（第21話）。何か悪い出来事が起きると、多くの人が同時に「この先の利益は減る」と考え、売りが売りを呼びます。\u003c/p>\n\u003cp>さらに、お金を借りて投資していた人は、損が膨らむと強制的に売らされます。こうして実際の価値以上に下がることがあります。\u003c/p>\n\u003cp>では、なぜ回復してきたのでしょうか。根っこにあるのは、会社が商品やサービスを作り、利益を生む力そのものは、暴落で消えるわけではないという点です。人々は危機の後も食べ、移動し、スマホを使います。経済が成長を続ける限り、利益も株価もやがて戻る力が働きます（第7話）。\u003c/p>\n\u003cp>ただし、これは「必ず戻る」という法則ではありません。日経平均は1989年末の高値を超えるまでに、約34年かかりました。1つの国や1つの会社に集中すると、長い停滞に巻き込まれることがあります。広く分散する理由はここにあります（第16話）。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>暴落のとき、積立はどうするか\u003c/h2>\n\u003cp>長期の積立をしている人にとって、暴落時に一番避けたいのは「怖くなって全部売る」ことです。底で売ると損が確定し、その後の回復を受け取れません。\u003c/p>\n\u003cp>一方、積立を続けると、値段が下がった時期に多くの口数を買えます（第18話）。リーマン・ショックやコロナ・ショックでも、淡々と続けた人は、回復後に下落前より資産を増やせた例が多くありました。\u003c/p>\n\u003cp>とはいえ、続けられるかどうかは理屈より心の問題です。「頭ではわかっていても怖い」のが普通です。この心の動きは第45話で詳しく扱います。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち10万円を株式の投資信託に入れているとします。リーマン・ショック級の下落が来ると、10万円は5万円前後になる可能性があります。\u003c/p>\n\u003cp>そのとき、残りの10万円（生活費や予備のお金）が手つかずなら、生活は変わりません。「5万円になっても、使う予定のないお金だから待てる」と思える金額かどうか。これを、始める前に一度想像しておくことが一番の備えです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「暴落したら買い増しするチャンス」という話もよく聞きます。ただ、どこが底かは誰にもわかりません。生活費や学費まで投資に回すのは避けてください。\u003c/p>\n\u003cp>また、過去に回復したことは、将来の回復を保証しません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>過去の暴落は、数か月から数年かけて回復した例が多い\u003c/li>\u003cli>ただし日経平均のように、高値回復に約34年かかった例もある\u003c/li>\u003cli>暴落前提で「売らずに済む金額」にとどめ、広く分散する\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>暴落時に、長期の積立投資家が一番避けたい行動はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">積立を淡々と続ける\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">怖くなって全部売ってしまう\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">生活防衛資金を確認する\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>底で売ると損が確定し、その後の回復を受け取れなくなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>松井証券「リーマン・ショックとは」 \u003ca href=\"https://www.matsui.co.jp/us-stock/study/article/lehman-shock/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.matsui.co.jp/us-stock/study/article/lehman-shock/\u003c/a>\u003c/li>\u003cli>幻冬舎ゴールドオンライン（三井住友DSアセットマネジメント）「過去の株価急落と回復」 \u003ca href=\"https://gentosha-go.com/articles/-/46206\" target=\"_blank\" rel=\"noopener noreferrer\">https://gentosha-go.com/articles/-/46206\u003c/a>\u003c/li>\u003cli>SBI証券「マーケット速報（2024年8月5日）」 \u003ca href=\"https://go.sbisec.co.jp/media/report/ma_flash/ma_flash_240805.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://go.sbisec.co.jp/media/report/ma_flash/ma_flash_240805.html\u003c/a>\u003c/li>\u003cli>マネックス証券「2024年8月5日のマーケット」 \u003ca href=\"https://info.monex.co.jp/news/2024/20240805_05.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://info.monex.co.jp/news/2024/20240805_05.html\u003c/a>\u003c/li>\u003cli>株探「日経平均、最高値更新（2025年8月12日）」 \u003ca href=\"https://s.kabutan.jp/news/n202508121188/\" target=\"_blank\" rel=\"noopener noreferrer\">https://s.kabutan.jp/news/n202508121188/\u003c/a>\u003c/li>\u003cli>東洋経済オンライン「日経平均、34年ぶり最高値」 \u003ca href=\"https://toyokeizai.net/articles/-/736429\" target=\"_blank\" rel=\"noopener noreferrer\">https://toyokeizai.net/articles/-/736429\u003c/a>\u003c/li>\u003cli>数値は概数。回復時期は終値ベースの目安です。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"積立を始めたあとに暴落が来たら、どうすればいいのでしょうか。そもそも、暴落のあと株価はちゃんと戻るのですか。 過去の大きな暴落では、数か月から数年かけて回復してきた例が多くあります。ただし、回復の時期は毎回違い、数十年かかった例もあります。大切なのは、暴落が来る前提で「売らずに済む金額」で投資しておくことです。 過去の3つの暴落 まず、実際に何が起きたかを数字で見てみます。下落率は、高値から底値までの概数です。 出来事 下落の大きさ 元の高値に戻るまで リーマン・ショック（2008年） S&P500で約57% 約5年半（2013年3月） コロナ・ショック（2020年） S&P500で約34% 約6か月（2020年8月） 2024年8月の急落 日経平均が1日で約12%（高値から約25%） 約1年1か月（2025年8月） S&P500はアメリカの代表的な大企業約500社の株価指数です。リーマン・ショックでは、2007年10月の高値から2009年3月の底まで、半分以下になりました。 コロナ・ショックは、わずか約1か月で約34%下がりました。しかし底から約5か月後には下げを埋め、8月に高値を更新しています。 2024年8月5日には、日経平均株価が1日で4,451円（約12.4%）下がりました。下げ幅は過去最大です。ところが翌日は3,217円上がり、上げ幅も過去最大となりました。直前の高値（2024年7月）を超えたのは2025年8月です。 なぜ暴落は起きるのでしょうか。株価は、会社が将来生む利益への「期待」で決まります（第21話）。何か悪い出来事が起きると、多くの人が同時に「この先の利益は減る」と考え、売りが売りを呼びます。 さらに、お金を借りて投資していた人は、損が膨らむと強制的に売らされます。こうして実際の価値以上に下がることがあります。 では、なぜ回復してきたのでしょうか。根っこにあるのは、会社が商品やサービスを作り、利益を生む力そのものは、暴落で消えるわけではないという点です。人々は危機の後も食べ、移動し、スマホを使います。経済が成長を続ける限り、利益も株価もやがて戻る力が働きます（第7話）。 ただし、これは「必ず戻る」という法則ではありません。日経平均は1989年末の高値を超えるまでに、約34年かかりました。1つの国や1つの会社に集中すると、長い停滞に巻き込まれることがあります。広く分散する理由はここにあります（第16話）。 暴落のとき、積立はどうするか 長期の積立をしている人にとって、暴落時に一番避けたいのは「怖くなって全部売る」ことです。底で売ると損が確定し、その後の回復を受け取れません。 一方、積立を続けると、値段が下がった時期に多くの口数を買えます（第18話）。リーマン・ショックやコロナ・ショックでも、淡々と続けた人は、回復後に下落前より資産を増やせた例が多くありました。 とはいえ、続けられるかどうかは理屈より心の問題です。「頭ではわかっていても怖い」のが普通です。この心の動きは第45話で詳しく扱います。 20万円のうち10万円を株式の投資信託に入れているとします。リーマン・ショック級の下落が来ると、10万円は5万円前後になる可能性があります。 そのとき、残りの10万円（生活費や予備のお金）が手つかずなら、生活は変わりません。「5万円になっても、使う予定のないお金だから待てる」と思える金額かどうか。これを、始める前に一度想像しておくことが一番の備えです。 「暴落したら買い増しするチャンス」という話もよく聞きます。ただ、どこが底かは誰にもわかりません。生活費や学費まで投資に回すのは避けてください。 また、過去に回復したことは、将来の回復を保証しません。 過去の暴落は、数か月から数年かけて回復した例が多い ただし日経平均のように、高値回復に約34年かかった例もある 暴落前提で「売らずに済む金額」にとどめ、広く分散する 暴落時に、長期の積立投資家が一番避けたい行動はどれですか。 積立を淡々と続ける 怖くなって全部売ってしまう 生活防衛資金を確認する 底で売ると損が確定し、その後の回復を受け取れなくなります。"},{"no":43,"part":6,"title":"いつ売る？","subtitle":"出口と取り崩しの考え方","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>買い方の話はよく聞きますが、いつ売ればいいのかはあまり聞きません。値上がりしたら売るべきなのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>長期の資産形成では、「値段」ではなく「お金を使う目的」が来たときに売るのが基本です。売るときも一度に全部ではなく、必要な分を少しずつ取り崩す方法がよく使われます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>「上がったから売る」の落とし穴\u003c/h2>\n\u003cp>値上がりすると、利益を確定させたくなります。ですが、売った後もさらに上がることもあれば、下がることもあります。売り時を当てるのは、買い時を当てるのと同じくらい難しいことです。\u003c/p>\n\u003cp>また、売ってしまうと、そのお金が複利で増える機会を手放すことになります（第5話）。売った後にまた買い直すなら、そのたびに迷いが生まれます。\u003c/p>\n\u003ch2>売るのは「目的」が来たとき\u003c/h2>\n\u003cp>では何を基準に売ればよいのでしょうか。答えは、お金を使う日が来たときです。たとえば、次のような場面です。\u003c/p>\n\u003cul>\u003cli>就職後の引っ越しや車の購入など、まとまった支出のとき\u003c/li>\u003cli>結婚や住宅購入の頭金\u003c/li>\u003cli>老後、働く収入が減ってから生活費にあてるとき\u003c/li>\u003c/ul>\n\u003cp>投資は、将来使うお金を育てるための手段です。目的のない「出口」は存在しない、と考えると迷いが減ります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「値段」ではなく「目的」で売るべきなのでしょうか。根本の理由は、短期の値動きが予測できないのに対し、自分がいつお金を使うかは、ある程度自分で決められるからです。\u003c/p>\n\u003cp>予測できないものを基準にすると、判断は運任せになります。一方、自分で決められる「使う時期」を基準にすれば、計画が立てられます。\u003c/p>\n\u003cp>もう一つの理由は、「時間」が長期投資の味方だからです（第17話）。株式は短期ではぶれが大きくても、長い期間では成長の力が表に出やすくなります。使う予定のないお金を売ってしまうと、この時間の力を自分から手放すことになります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>取り崩しの2つの方法\u003c/h2>\n\u003cp>いざ使うときも、一度に全部売る必要はありません。少しずつ売って使う「\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"取り崩し\">取り崩し\u003c/span>」には、大きく2つの考え方があります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>やり方\u003c/th>\u003cth>特徴\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>定額\u003c/td>\u003ctd>毎月◯万円ずつ売る\u003c/td>\u003ctd>生活設計は立てやすいが、下落時に多く売ることになる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定率\u003c/td>\u003ctd>残高の◯%ずつ売る\u003c/td>\u003ctd>資産が長持ちしやすいが、受け取る額が毎回変わる\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>どちらが正しいという答えはありません。使い道に合わせて選んだり、組み合わせたりします。\u003c/p>\n\u003ch2>使う日が近づいたら\u003c/h2>\n\u003cp>使う日が数年後に迫ってきたら、少しずつ株式の割合を減らし、預金などに移しておく方法もあります。使う直前に暴落が来ても、計画が崩れないようにするためです（第42話）。\u003c/p>\n\u003cp>NISA口座で売った場合、使った非課税の枠は翌年以降に復活します。ただし、復活するのは買ったときの金額分で、同じ年のうちには戻りません。くわしくは第32話を見てください。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>大学生の今、20万円のうち投資に回したお金を売る予定は、基本的にないはずです。学費や生活費など数年以内に使うお金は、そもそも投資に回さない、が原則です（第12話）。\u003c/p>\n\u003cp>たとえば毎月5,000円を積み立て、就職して数年後の引っ越し費用に使うとします。その時期が決まった時点で「2年前から少しずつ預金に移す」と決めておけば、売り時に悩む必要がありません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「急にお金が必要になったから、下がっているけど売る」という事態が、一番の失敗パターンです。これを防ぐのが生活防衛資金です（第8話）。\u003c/p>\n\u003cp>また、NISA以外の口座（特定口座など）で利益が出ている商品を売ると、税金がかかります（第29話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>売るのは「値段」ではなく「お金を使う目的」が来たとき\u003c/li>\u003cli>一度に全部ではなく、定額・定率で少しずつ取り崩す方法がある\u003c/li>\u003cli>使う日が近づいたら、少しずつ預金などに移して備える\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>長期の資産形成で、売るタイミングの基本になる考え方はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">値上がりして利益が出たとき\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">お金を使う目的の時期が来たとき\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">ニュースで暴落が予想されたとき\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>短期の値動きは予測できませんが、お金を使う時期はある程度自分で決められるため、計画の基準にできます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/\u003c/a>\u003c/li>\u003cli>マネックス証券 マネクリ「新NISAの非課税枠の再利用」 \u003ca href=\"https://media.monex.co.jp/articles/-/22883\" target=\"_blank\" rel=\"noopener noreferrer\">https://media.monex.co.jp/articles/-/22883\u003c/a>\u003c/li>\u003cli>2026年10月時点の制度に基づく。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"買い方の話はよく聞きますが、いつ売ればいいのかはあまり聞きません。値上がりしたら売るべきなのでしょうか。 長期の資産形成では、「値段」ではなく「お金を使う目的」が来たときに売るのが基本です。売るときも一度に全部ではなく、必要な分を少しずつ取り崩す方法がよく使われます。 「上がったから売る」の落とし穴 値上がりすると、利益を確定させたくなります。ですが、売った後もさらに上がることもあれば、下がることもあります。売り時を当てるのは、買い時を当てるのと同じくらい難しいことです。 また、売ってしまうと、そのお金が複利で増える機会を手放すことになります（第5話）。売った後にまた買い直すなら、そのたびに迷いが生まれます。 売るのは「目的」が来たとき では何を基準に売ればよいのでしょうか。答えは、お金を使う日が来たときです。たとえば、次のような場面です。 就職後の引っ越しや車の購入など、まとまった支出のとき 結婚や住宅購入の頭金 老後、働く収入が減ってから生活費にあてるとき 投資は、将来使うお金を育てるための手段です。目的のない「出口」は存在しない、と考えると迷いが減ります。 なぜ「値段」ではなく「目的」で売るべきなのでしょうか。根本の理由は、短期の値動きが予測できないのに対し、自分がいつお金を使うかは、ある程度自分で決められるからです。 予測できないものを基準にすると、判断は運任せになります。一方、自分で決められる「使う時期」を基準にすれば、計画が立てられます。 もう一つの理由は、「時間」が長期投資の味方だからです（第17話）。株式は短期ではぶれが大きくても、長い期間では成長の力が表に出やすくなります。使う予定のないお金を売ってしまうと、この時間の力を自分から手放すことになります。 取り崩しの2つの方法 いざ使うときも、一度に全部売る必要はありません。少しずつ売って使う「取り崩し」には、大きく2つの考え方があります。 方法 やり方 特徴 定額 毎月◯万円ずつ売る 生活設計は立てやすいが、下落時に多く売ることになる 定率 残高の◯%ずつ売る 資産が長持ちしやすいが、受け取る額が毎回変わる どちらが正しいという答えはありません。使い道に合わせて選んだり、組み合わせたりします。 使う日が近づいたら 使う日が数年後に迫ってきたら、少しずつ株式の割合を減らし、預金などに移しておく方法もあります。使う直前に暴落が来ても、計画が崩れないようにするためです（第42話）。 NISA口座で売った場合、使った非課税の枠は翌年以降に復活します。ただし、復活するのは買ったときの金額分で、同じ年のうちには戻りません。くわしくは第32話を見てください。 大学生の今、20万円のうち投資に回したお金を売る予定は、基本的にないはずです。学費や生活費など数年以内に使うお金は、そもそも投資に回さない、が原則です（第12話）。 たとえば毎月5,000円を積み立て、就職して数年後の引っ越し費用に使うとします。その時期が決まった時点で「2年前から少しずつ預金に移す」と決めておけば、売り時に悩む必要がありません。 「急にお金が必要になったから、下がっているけど売る」という事態が、一番の失敗パターンです。これを防ぐのが生活防衛資金です（第8話）。 また、NISA以外の口座（特定口座など）で利益が出ている商品を売ると、税金がかかります（第29話）。 売るのは「値段」ではなく「お金を使う目的」が来たとき 一度に全部ではなく、定額・定率で少しずつ取り崩す方法がある 使う日が近づいたら、少しずつ預金などに移して備える 長期の資産形成で、売るタイミングの基本になる考え方はどれですか。 値上がりして利益が出たとき お金を使う目的の時期が来たとき ニュースで暴落が予想されたとき 短期の値動きは予測できませんが、お金を使う時期はある程度自分で決められるため、計画の基準にできます。"},{"no":44,"part":6,"title":"リバランス","subtitle":"なぜ、増えた資産をわざわざ減らすのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株と預金を半分ずつにしていたのに、株が値上がりして比率が変わりました。そのままでいいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>比率を最初に決めた形に戻すことを「リバランス」と言います。目的は利益を増やすことではなく、自分が引き受けるリスクの大きさを、決めた量に保つことです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>リバランスとは\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リバランス\">リバランス\u003c/span>とは、値動きでずれた資産の比率を、もとの比率に整え直すことです。\u003c/p>\n\u003cp>たとえば「株式50%・預金50%」と決めて始めたとします。株が値上がりすると、気づけば「株式70%・預金30%」になっていることがあります。これを50%ずつに戻すのがリバランスです。\u003c/p>\n\u003ch2>なぜ比率がずれると困るのか\u003c/h2>\n\u003cp>株が増えたのだから、喜ばしいことのように思えます。ですが、比率が変わると、資産全体のぶれ幅も変わります（第14話）。\u003c/p>\n\u003cp>株式70%の状態は、最初に「これくらいなら耐えられる」と決めた株式50%より、暴落時の下がり方が大きくなります。知らないうちに、自分の想定より大きなリスクを抱えている状態です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「決めた比率」に戻すことが、それほど大事なのでしょうか。根っこにあるのは、資産の比率こそが、あなたのリスクの量そのものだという点です。\u003c/p>\n\u003cp>最初の比率は、「暴落が来ても売らずに耐えられるか」を考えて決めたはずです（第42話）。値上がりで比率がずれると、その前提が崩れます。リバランスは、自分で決めた約束を守り直す作業だと言えます。\u003c/p>\n\u003cp>もう一つの効果もあります。リバランスでは、値上がりした資産を少し売り、値下がりした資産を少し買います。結果として「高くなったものを売り、安くなったものを買う」行動を、感情に頼らずに機械的に行えます。\u003c/p>\n\u003cp>人は上がっているものをもっと買いたくなり、下がっているものを手放したくなります（第45話）。リバランスは、この心のくせに逆らうための仕組みでもあります。\u003c/p>\n\u003cp>ただし、リバランスで利益が必ず増えるわけではありません。株が上がり続ける時期には、リバランスしないほうが結果的に増えることもあります。あくまで「リスクを一定に保つ」ことが主な目的です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>リバランスの2つの方法\u003c/h2>\n\u003cp>方法は大きく2つあります。\u003c/p>\n\u003col>\u003cli>\u003cstrong>売って買う方法\u003c/strong>: 増えた資産を売り、減った資産を買う。すぐに比率を戻せるが、NISA以外では売却益に税金がかかる\u003c/li>\u003cli>\u003cstrong>積立先を調整する方法\u003c/strong>: 新しく入れるお金を、減っているほうに多く回す。売らずに済むので税金がかからない\u003c/li>\u003c/ol>\n\u003cp>少額で積立をしている時期は、2つ目の方法が手軽です。売らないので、NISAの非課税枠を使い直す心配もありません。\u003c/p>\n\u003ch2>どのくらいの頻度で行うか\u003c/h2>\n\u003cp>年に1回など、時期を決めて確認する方法がよく使われます。または「比率が5%以上ずれたら」のように、ずれの大きさで決める方法もあります。\u003c/p>\n\u003cp>頻繁にやりすぎると、手間や税金がかさみます。誕生日や年度初めなど、覚えやすい日を決めて年1回見直すくらいで十分です。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を「株式の投資信託10万円・預金10万円」で始めたとします。1年後、投資信託が14万円に増えました。合計24万円のうち、株式は約58%です。\u003c/p>\n\u003cp>50%ずつに戻すなら、株式を12万円にします。売る方法なら2万円分を売って預金に回します。売らない方法なら、しばらく新しいお金を預金だけに入れて、比率が戻るのを待ちます。\u003c/p>\n\u003cp>学生のうちは、アルバイト代の一部を預金に多めに入れるだけでも、十分にリバランスになります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>全世界株式の投資信託を1本だけ持つ場合、中身の国や会社の比率は運用会社が自動で調整しています。自分でリバランスが必要になるのは、「株式と預金」「株式と債券」のように、複数の資産を組み合わせたときです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>リバランスは、ずれた資産の比率を決めた形に戻すこと\u003c/li>\u003cli>目的は利益を増やすことより、リスクの量を一定に保つこと\u003c/li>\u003cli>学生のうちは「積立先の調整」で売らずに整えるのが手軽\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>リバランスの主な目的として、もっとも適切なものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">毎年の利益を最大にすること\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">自分が引き受けるリスクの量を、決めた水準に保つこと\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">値上がりしそうな資産を予想して買うこと\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>リバランスは資産の比率、つまりリスクの量を元に戻す作業です。利益が必ず増えるわけではありません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁 NISA特設ウェブサイト（J-FLEC作成資料）「資産形成の基本（長期・積立・分散）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/movie/resume.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/movie/resume.pdf\u003c/a>\u003c/li>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/\u003c/a>\u003c/li>\u003cli>マネックス証券 マネクリ「新NISAの非課税枠の再利用」 \u003ca href=\"https://media.monex.co.jp/articles/-/22883\" target=\"_blank\" rel=\"noopener noreferrer\">https://media.monex.co.jp/articles/-/22883\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株と預金を半分ずつにしていたのに、株が値上がりして比率が変わりました。そのままでいいのでしょうか。 比率を最初に決めた形に戻すことを「リバランス」と言います。目的は利益を増やすことではなく、自分が引き受けるリスクの大きさを、決めた量に保つことです。 リバランスとは リバランスとは、値動きでずれた資産の比率を、もとの比率に整え直すことです。 たとえば「株式50%・預金50%」と決めて始めたとします。株が値上がりすると、気づけば「株式70%・預金30%」になっていることがあります。これを50%ずつに戻すのがリバランスです。 なぜ比率がずれると困るのか 株が増えたのだから、喜ばしいことのように思えます。ですが、比率が変わると、資産全体のぶれ幅も変わります（第14話）。 株式70%の状態は、最初に「これくらいなら耐えられる」と決めた株式50%より、暴落時の下がり方が大きくなります。知らないうちに、自分の想定より大きなリスクを抱えている状態です。 なぜ「決めた比率」に戻すことが、それほど大事なのでしょうか。根っこにあるのは、資産の比率こそが、あなたのリスクの量そのものだという点です。 最初の比率は、「暴落が来ても売らずに耐えられるか」を考えて決めたはずです（第42話）。値上がりで比率がずれると、その前提が崩れます。リバランスは、自分で決めた約束を守り直す作業だと言えます。 もう一つの効果もあります。リバランスでは、値上がりした資産を少し売り、値下がりした資産を少し買います。結果として「高くなったものを売り、安くなったものを買う」行動を、感情に頼らずに機械的に行えます。 人は上がっているものをもっと買いたくなり、下がっているものを手放したくなります（第45話）。リバランスは、この心のくせに逆らうための仕組みでもあります。 ただし、リバランスで利益が必ず増えるわけではありません。株が上がり続ける時期には、リバランスしないほうが結果的に増えることもあります。あくまで「リスクを一定に保つ」ことが主な目的です。 リバランスの2つの方法 方法は大きく2つあります。 売って買う方法: 増えた資産を売り、減った資産を買う。すぐに比率を戻せるが、NISA以外では売却益に税金がかかる 積立先を調整する方法: 新しく入れるお金を、減っているほうに多く回す。売らずに済むので税金がかからない 少額で積立をしている時期は、2つ目の方法が手軽です。売らないので、NISAの非課税枠を使い直す心配もありません。 どのくらいの頻度で行うか 年に1回など、時期を決めて確認する方法がよく使われます。または「比率が5%以上ずれたら」のように、ずれの大きさで決める方法もあります。 頻繁にやりすぎると、手間や税金がかさみます。誕生日や年度初めなど、覚えやすい日を決めて年1回見直すくらいで十分です。 20万円を「株式の投資信託10万円・預金10万円」で始めたとします。1年後、投資信託が14万円に増えました。合計24万円のうち、株式は約58%です。 50%ずつに戻すなら、株式を12万円にします。売る方法なら2万円分を売って預金に回します。売らない方法なら、しばらく新しいお金を預金だけに入れて、比率が戻るのを待ちます。 学生のうちは、アルバイト代の一部を預金に多めに入れるだけでも、十分にリバランスになります。 全世界株式の投資信託を1本だけ持つ場合、中身の国や会社の比率は運用会社が自動で調整しています。自分でリバランスが必要になるのは、「株式と預金」「株式と債券」のように、複数の資産を組み合わせたときです。 リバランスは、ずれた資産の比率を決めた形に戻すこと 目的は利益を増やすことより、リスクの量を一定に保つこと 学生のうちは「積立先の調整」で売らずに整えるのが手軽 リバランスの主な目的として、もっとも適切なものはどれですか。 毎年の利益を最大にすること 自分が引き受けるリスクの量を、決めた水準に保つこと 値上がりしそうな資産を予想して買うこと リバランスは資産の比率、つまりリスクの量を元に戻す作業です。利益が必ず増えるわけではありません。"},{"no":45,"part":7,"title":"人はなぜ投資で失敗するのか","subtitle":"行動経済学の入口 — 頭のくせを知っておく","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「長期・分散・積立」が大事だと頭ではわかっています。それでも多くの人が失敗するのは、なぜなのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>人間の脳には、投資に向かない「判断のくせ」がいくつも備わっているからです。知識が足りないというより、わかっていても体が逆に動いてしまうのです。くせを知り、仕組みで防ぐことが対策になります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>行動経済学とは\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"行動経済学\">行動経済学\u003c/span>は、人が実際にどう判断し、どう間違えるかを研究する学問です。昔の経済学は「人は合理的に損得を計算する」と考えていました。行動経済学は、そうではない場面を数多く示してきました。\u003c/p>\n\u003cp>その代表的な研究者であるダニエル・カーネマンは、2002年にノーベル経済学賞を受けています。\u003c/p>\n\u003ch2>投資でよく出る4つのくせ\u003c/h2>\n\u003ch3>1. 損失回避\u003c/h3>\n\u003cp>同じ1万円でも、得をした喜びより、損をした痛みのほうが大きく感じられます。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"損失回避\">損失回避\u003c/span>と言い、カーネマンらの「プロスペクト理論」の柱です。研究では、損の痛みは同じ額の得の2倍前後と推定されることが多いです。\u003c/p>\n\u003cp>その結果、「含み損を確定させたくない」と売れなくなったり、少しの下落で怖くなって全部売ったりします。\u003c/p>\n\u003ch3>2. 群集心理（ハーディング）\u003c/h3>\n\u003cp>周りがみんな買っていると、自分も買いたくなります。みんなが売ると、自分も売りたくなります。こうして、高いときに買い、安いときに売る行動が起きやすくなります。\u003c/p>\n\u003ch3>3. 確証バイアス\u003c/h3>\n\u003cp>一度「この株は上がる」と思うと、それを支える情報ばかり目に入り、反対の情報を無視しがちです。SNSでは自分と似た意見が集まりやすく、このくせが強まります（第47話）。\u003c/p>\n\u003ch3>4. 自信過剰\u003c/h3>\n\u003cp>少しうまくいくと「自分には才能がある」と考えがちです。実際には相場全体が上がっていただけ、ということがよくあります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ人間の脳は、こんなにも投資に向かないのでしょうか。一つの有力な説明は、私たちの脳が、長い狩猟採集の時代に合うように形づくられてきた、というものです。\u003c/p>\n\u003cp>その時代、「損」はときに命に関わりました。食料を失えば飢えるかもしれません。だから、得よりも損に強く反応する個体のほうが、生き延びやすかったと考えられます。\u003c/p>\n\u003cp>群れから離れることも危険でした。周りが逃げ出したら、理由がわからなくても一緒に逃げるほうが安全だったのです。\u003c/p>\n\u003cp>ところが、株式市場ではこの本能が裏目に出ます。みんなが逃げる暴落時こそ安く買える場面であり、みんなが群がる熱狂時こそ高値づかみの危険があるからです。脳のくせは「欠陥」ではなく、別の環境では正しかった反応なのです。だから意志の力だけで抑えるのは難しい、と考えておくほうが現実的です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>くせは「仕組み」で防ぐ\u003c/h2>\n\u003cp>脳のくせは、知っているだけでは消えません。そこで、判断の回数そのものを減らす仕組みが役に立ちます。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>自動積立にする\u003c/strong>: 毎月の買い付けを機械に任せ、迷う場面をなくす（第11話）\u003c/li>\u003cli>\u003cstrong>アプリを見すぎない\u003c/strong>: 毎日の値動きを見るほど、損失回避が刺激される\u003c/li>\u003cli>\u003cstrong>ルールを先に書いておく\u003c/strong>: 「暴落しても売らない」「年1回だけ見直す」などを、冷静なときに紙に書く\u003c/li>\u003c/ul>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち10万円を投資して、1か月後に9万円になったとします。たった1万円の損でも、気分は思った以上に沈むはずです。それが損失回避です。\u003c/p>\n\u003cp>そんなときは「この1万円は、使う予定のないお金の、一時的な目減りだ」と言葉にしてみてください。そして、アプリを閉じます。\u003c/p>\n\u003cp>逆に、1か月で11万円に増えても「自分は投資がうまい」と思わないこと。相場全体が上がっただけかもしれません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「自分はくせに引っかからない」と思うことこそ、自信過剰の一種です。学んだ人でも同じように引っかかります。大切なのは、引っかかる前提で仕組みを用意しておくことです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>人には損失回避・群集心理・確証バイアス・自信過剰などのくせがある\u003c/li>\u003cli>これらは昔の環境では生き延びるのに役立った反応だと考えられている\u003c/li>\u003cli>意志ではなく、自動積立やルールづくりなどの仕組みで防ぐ\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>「同じ額でも、得の喜びより損の痛みのほうが大きく感じる」くせを何と呼びますか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">確証バイアス\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">損失回避\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">自信過剰\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>損失回避は、プロスペクト理論の中心的な考え方です。含み損を売れない、少しの下落で全部売る、といった行動につながります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>大和証券「金融・証券用語解説 プロスペクト理論」 \u003ca href=\"https://www.daiwa.jp/glossary/YST3282.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.daiwa.jp/glossary/YST3282.html\u003c/a>\u003c/li>\u003cli>コトバンク「カーネマン」 \u003ca href=\"https://kotobank.jp/word/%E3%81%8B%E3%83%BC%E3%81%AD%E3%81%BE%E3%82%93-3148363\" target=\"_blank\" rel=\"noopener noreferrer\">https://kotobank.jp/word/%E3%81%8B%E3%83%BC%E3%81%AD%E3%81%BE%E3%82%93-3148363\u003c/a>\u003c/li>\u003cli>損失の重みが「2倍前後」という数値は研究や推定方法により幅がある概数です。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「長期・分散・積立」が大事だと頭ではわかっています。それでも多くの人が失敗するのは、なぜなのでしょうか。 人間の脳には、投資に向かない「判断のくせ」がいくつも備わっているからです。知識が足りないというより、わかっていても体が逆に動いてしまうのです。くせを知り、仕組みで防ぐことが対策になります。 行動経済学とは 行動経済学は、人が実際にどう判断し、どう間違えるかを研究する学問です。昔の経済学は「人は合理的に損得を計算する」と考えていました。行動経済学は、そうではない場面を数多く示してきました。 その代表的な研究者であるダニエル・カーネマンは、2002年にノーベル経済学賞を受けています。 投資でよく出る4つのくせ 1. 損失回避 同じ1万円でも、得をした喜びより、損をした痛みのほうが大きく感じられます。これを損失回避と言い、カーネマンらの「プロスペクト理論」の柱です。研究では、損の痛みは同じ額の得の2倍前後と推定されることが多いです。 その結果、「含み損を確定させたくない」と売れなくなったり、少しの下落で怖くなって全部売ったりします。 2. 群集心理（ハーディング） 周りがみんな買っていると、自分も買いたくなります。みんなが売ると、自分も売りたくなります。こうして、高いときに買い、安いときに売る行動が起きやすくなります。 3. 確証バイアス 一度「この株は上がる」と思うと、それを支える情報ばかり目に入り、反対の情報を無視しがちです。SNSでは自分と似た意見が集まりやすく、このくせが強まります（第47話）。 4. 自信過剰 少しうまくいくと「自分には才能がある」と考えがちです。実際には相場全体が上がっていただけ、ということがよくあります。 なぜ人間の脳は、こんなにも投資に向かないのでしょうか。一つの有力な説明は、私たちの脳が、長い狩猟採集の時代に合うように形づくられてきた、というものです。 その時代、「損」はときに命に関わりました。食料を失えば飢えるかもしれません。だから、得よりも損に強く反応する個体のほうが、生き延びやすかったと考えられます。 群れから離れることも危険でした。周りが逃げ出したら、理由がわからなくても一緒に逃げるほうが安全だったのです。 ところが、株式市場ではこの本能が裏目に出ます。みんなが逃げる暴落時こそ安く買える場面であり、みんなが群がる熱狂時こそ高値づかみの危険があるからです。脳のくせは「欠陥」ではなく、別の環境では正しかった反応なのです。だから意志の力だけで抑えるのは難しい、と考えておくほうが現実的です。 くせは「仕組み」で防ぐ 脳のくせは、知っているだけでは消えません。そこで、判断の回数そのものを減らす仕組みが役に立ちます。 自動積立にする: 毎月の買い付けを機械に任せ、迷う場面をなくす（第11話） アプリを見すぎない: 毎日の値動きを見るほど、損失回避が刺激される ルールを先に書いておく: 「暴落しても売らない」「年1回だけ見直す」などを、冷静なときに紙に書く 20万円のうち10万円を投資して、1か月後に9万円になったとします。たった1万円の損でも、気分は思った以上に沈むはずです。それが損失回避です。 そんなときは「この1万円は、使う予定のないお金の、一時的な目減りだ」と言葉にしてみてください。そして、アプリを閉じます。 逆に、1か月で11万円に増えても「自分は投資がうまい」と思わないこと。相場全体が上がっただけかもしれません。 「自分はくせに引っかからない」と思うことこそ、自信過剰の一種です。学んだ人でも同じように引っかかります。大切なのは、引っかかる前提で仕組みを用意しておくことです。 人には損失回避・群集心理・確証バイアス・自信過剰などのくせがある これらは昔の環境では生き延びるのに役立った反応だと考えられている 意志ではなく、自動積立やルールづくりなどの仕組みで防ぐ 「同じ額でも、得の喜びより損の痛みのほうが大きく感じる」くせを何と呼びますか。 確証バイアス 損失回避 自信過剰 損失回避は、プロスペクト理論の中心的な考え方です。含み損を売れない、少しの下落で全部売る、といった行動につながります。"},{"no":46,"part":7,"title":"投資詐欺・怪しい話の見抜き方","subtitle":"なぜ学生が狙われるのか、どこに相談すればいいのか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>SNSで「月利10%」「元本保証」という投資の話を見かけました。本物かどうか、どう見分ければいいですか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「高い利回り」と「元本保証」が同時にそろう話は、仕組みとして成り立ちません。それだけで疑ってよい合図です。迷ったら、お金を払う前に消費者ホットライン「188」などに相談してください。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>被害は増え続けている\u003c/h2>\n\u003cp>警察庁によると、2025年の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"SNS型投資詐欺\">SNS型投資詐欺\u003c/span>の被害は、認知件数が約9,500件、被害額が約1,288億円でした。前年からおよそ1.5倍に増えています。\u003c/p>\n\u003cp>接触のきっかけは、SNSの広告と、知らない人からのダイレクトメッセージ（DM）が大半を占めます。\u003c/p>\n\u003ch2>よくある手口\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>有名人のなりすまし広告\u003c/strong>: 著名な投資家や経営者の名前と写真を勝手に使い、LINEグループなどに誘う\u003c/li>\u003cli>\u003cstrong>偽の投資アプリ・サイト\u003c/strong>: 画面上では利益が増えて見えるが、出金しようとすると「手数料」「税金」を求められ、お金が戻らない\u003c/li>\u003cli>\u003cstrong>マルチ商法・情報商材\u003c/strong>: 「友達を紹介すれば稼げる」「この教材で月収100万円」と高額な契約をさせる\u003c/li>\u003cli>\u003cstrong>ロマンス型\u003c/strong>: SNSで親しくなった相手から、投資を勧められる\u003c/li>\u003c/ul>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「高利回り・元本保証」は成り立たないのでしょうか。第15話で見たように、リターンはリスクを引き受けた見返りです。元本が減らないなら、ぶれ（リスク）はほぼゼロです。リスクがほぼゼロの預金や国債の利回りが低いのは、そのためです。\u003c/p>\n\u003cp>もし本当に月利10%の確実な方法があれば、計算上、1年で元本は約3倍になります。そんな方法を持つ人は、銀行から低い金利で借りて自分で運用すれば十分です。見知らぬ学生にわざわざ教える理由がありません。\u003c/p>\n\u003cp>つまり、「おいしい話を他人に教える」という行動そのものが、話の矛盾を示しています。相手が欲しいのは、あなたの運用益ではなく、あなたのお金そのものです。\u003c/p>\n\u003cp>では、なぜ学生が狙われるのでしょうか。理由はいくつか考えられます。2022年4月から、成年年齢は18歳になりました。18歳・19歳は親の同意なしに契約できる一方、未成年を理由に契約を取り消すことはできません。また、知識や経験が少なく、友人や先輩とのつながりで断りにくいことも狙われる理由です。お金がない学生に、借金をさせて払わせる手口も報告されています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>見抜くためのチェックリスト\u003c/h2>\n\u003cp>次のどれか1つでも当てはまれば、立ち止まってください。\u003c/p>\n\u003cul>\u003cli>「元本保証」「必ず儲かる」「月利◯%」と言う\u003c/li>\u003cli>「今だけ」「あなただけ」と急がせる\u003c/li>\u003cli>LINEや個人の口座への振り込みを求める\u003c/li>\u003cli>金融庁の登録業者かどうか答えない、または確認できない\u003c/li>\u003cli>「友達を誘えば元が取れる」と言う\u003c/li>\u003c/ul>\n\u003cp>金融商品を売ったり、投資の助言をしたりする業者は、金融庁への登録が必要です。金融庁のサイトにある「免許・許可・登録等を受けている事業者一覧」や一括検索で確認できます。ただし、登録があっても安全が保証されるわけではなく、登録を偽る業者もいます。\u003c/p>\n\u003ch2>困ったときの相談先\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>相談先\u003c/th>\u003cth>番号\u003c/th>\u003cth>向いている内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>消費者ホットライン\u003c/td>\u003ctd>188\u003c/td>\u003ctd>契約トラブル全般。近くの消費生活センターにつながる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金融庁 金融サービス利用者相談室\u003c/td>\u003ctd>0570-016811\u003c/td>\u003ctd>投資・金融商品の相談\u003c/td>\u003c/tr>\u003ctr>\u003ctd>警察相談専用電話\u003c/td>\u003ctd>#9110\u003c/td>\u003ctd>詐欺かどうか迷うとき\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>金融庁の相談室は平日10時〜17時、IP電話からは03-5251-6811です。お金をだまし取られた、脅されているなど緊急のときは110番してください。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>大学のサークルの先輩から「20万円で始められる投資があって、毎月2万円の配当が出る。後輩を紹介すればさらに増える」と誘われたとします。\u003c/p>\n\u003cp>毎月2万円は、20万円に対して月利10%です。年に直すと元本の1.2倍の配当になり、普通の投資ではありえない数字です。「紹介で増える」はマルチ商法の特徴でもあります。\u003c/p>\n\u003cp>断りにくいときは「親に相談してから決めます」と言って、その場では契約しないでください。そして188に電話しましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「被害を取り戻します」という業者や、弁護士・公的機関を名乗る連絡にも注意してください。一度被害にあった人を再び狙う「二次被害」の手口です。相談は、自分で調べた公的な窓口の番号にかけてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>「高利回り」と「元本保証」は同時に成り立たない\u003c/li>\u003cli>学生は成年になったばかりで経験が少なく、人間関係から狙われやすい\u003c/li>\u003cli>迷ったら払う前に、188・金融庁の相談室・#9110に相談する\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>次のうち、投資詐欺を疑うべき合図としてもっとも強いものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">毎月の手数料がはっきり書かれている\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">「元本保証で月利10%」と言われる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">金融庁の登録番号を自分で確認できた\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>元本保証（リスクほぼゼロ）と高利回りは両立しません。その組み合わせが出た時点で疑ってください。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>警察庁「SNS型投資・ロマンス詐欺の認知・検挙状況等（令和7年）」 \u003ca href=\"https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260605/01.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260605/01.html\u003c/a>\u003c/li>\u003cli>金融庁「SNS等を利用した投資詐欺にご注意ください」 \u003ca href=\"https://www.fsa.go.jp/ordinary/chuui/sns.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/ordinary/chuui/sns.html\u003c/a>\u003c/li>\u003cli>金融庁「免許・許可・登録等を受けている事業者一覧」 \u003ca href=\"https://www.fsa.go.jp/menkyo/menkyo.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/menkyo/menkyo.html\u003c/a>\u003c/li>\u003cli>金融庁「金融サービス利用者相談室」 \u003ca href=\"https://www.fsa.go.jp/receipt/soudansitu/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/receipt/soudansitu/index.html\u003c/a>\u003c/li>\u003cli>総務省「行政相談 共通窓口一覧（金融庁）」 \u003ca href=\"https://www.soumu.go.jp/main_sosiki/hyouka/soudan_n/kyotsucb_tag17.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.soumu.go.jp/main_sosiki/hyouka/soudan_n/kyotsucb_tag17.html\u003c/a>\u003c/li>\u003cli>政府広報オンライン「暮らしの相談窓口（消費者庁・消費者ホットライン188）」 \u003ca href=\"https://www.gov-online.go.jp/kurashinosodan/list/fu_caa.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov-online.go.jp/kurashinosodan/list/fu_caa.html\u003c/a>\u003c/li>\u003cli>国民生活センター「18歳・19歳に気を付けてほしい消費者トラブル」 \u003ca href=\"https://www.kokusen.go.jp/news/data/n-20210408_1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kokusen.go.jp/news/data/n-20210408_1.html\u003c/a>\u003c/li>\u003cli>警察庁「警察相談専用電話 #9110」 \u003ca href=\"https://www.npa.go.jp/bureau/safetylife/sos47/manga/dial/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.npa.go.jp/bureau/safetylife/sos47/manga/dial/\u003c/a>\u003c/li>\u003cli>2026年10月時点で確認。受付時間は変わることがあるため、各窓口の公式サイトで確認してください。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"SNSで「月利10%」「元本保証」という投資の話を見かけました。本物かどうか、どう見分ければいいですか。 「高い利回り」と「元本保証」が同時にそろう話は、仕組みとして成り立ちません。それだけで疑ってよい合図です。迷ったら、お金を払う前に消費者ホットライン「188」などに相談してください。 被害は増え続けている 警察庁によると、2025年のSNS型投資詐欺の被害は、認知件数が約9,500件、被害額が約1,288億円でした。前年からおよそ1.5倍に増えています。 接触のきっかけは、SNSの広告と、知らない人からのダイレクトメッセージ（DM）が大半を占めます。 よくある手口 有名人のなりすまし広告: 著名な投資家や経営者の名前と写真を勝手に使い、LINEグループなどに誘う 偽の投資アプリ・サイト: 画面上では利益が増えて見えるが、出金しようとすると「手数料」「税金」を求められ、お金が戻らない マルチ商法・情報商材: 「友達を紹介すれば稼げる」「この教材で月収100万円」と高額な契約をさせる ロマンス型: SNSで親しくなった相手から、投資を勧められる なぜ「高利回り・元本保証」は成り立たないのでしょうか。第15話で見たように、リターンはリスクを引き受けた見返りです。元本が減らないなら、ぶれ（リスク）はほぼゼロです。リスクがほぼゼロの預金や国債の利回りが低いのは、そのためです。 もし本当に月利10%の確実な方法があれば、計算上、1年で元本は約3倍になります。そんな方法を持つ人は、銀行から低い金利で借りて自分で運用すれば十分です。見知らぬ学生にわざわざ教える理由がありません。 つまり、「おいしい話を他人に教える」という行動そのものが、話の矛盾を示しています。相手が欲しいのは、あなたの運用益ではなく、あなたのお金そのものです。 では、なぜ学生が狙われるのでしょうか。理由はいくつか考えられます。2022年4月から、成年年齢は18歳になりました。18歳・19歳は親の同意なしに契約できる一方、未成年を理由に契約を取り消すことはできません。また、知識や経験が少なく、友人や先輩とのつながりで断りにくいことも狙われる理由です。お金がない学生に、借金をさせて払わせる手口も報告されています。 見抜くためのチェックリスト 次のどれか1つでも当てはまれば、立ち止まってください。 「元本保証」「必ず儲かる」「月利◯%」と言う 「今だけ」「あなただけ」と急がせる LINEや個人の口座への振り込みを求める 金融庁の登録業者かどうか答えない、または確認できない 「友達を誘えば元が取れる」と言う 金融商品を売ったり、投資の助言をしたりする業者は、金融庁への登録が必要です。金融庁のサイトにある「免許・許可・登録等を受けている事業者一覧」や一括検索で確認できます。ただし、登録があっても安全が保証されるわけではなく、登録を偽る業者もいます。 困ったときの相談先 相談先 番号 向いている内容 消費者ホットライン 188 契約トラブル全般。近くの消費生活センターにつながる 金融庁 金融サービス利用者相談室 0570-016811 投資・金融商品の相談 警察相談専用電話 #9110 詐欺かどうか迷うとき 金融庁の相談室は平日10時〜17時、IP電話からは03-5251-6811です。お金をだまし取られた、脅されているなど緊急のときは110番してください。 大学のサークルの先輩から「20万円で始められる投資があって、毎月2万円の配当が出る。後輩を紹介すればさらに増える」と誘われたとします。 毎月2万円は、20万円に対して月利10%です。年に直すと元本の1.2倍の配当になり、普通の投資ではありえない数字です。「紹介で増える」はマルチ商法の特徴でもあります。 断りにくいときは「親に相談してから決めます」と言って、その場では契約しないでください。そして188に電話しましょう。 「被害を取り戻します」という業者や、弁護士・公的機関を名乗る連絡にも注意してください。一度被害にあった人を再び狙う「二次被害」の手口です。相談は、自分で調べた公的な窓口の番号にかけてください。 「高利回り」と「元本保証」は同時に成り立たない 学生は成年になったばかりで経験が少なく、人間関係から狙われやすい 迷ったら払う前に、188・金融庁の相談室・#9110に相談する 次のうち、投資詐欺を疑うべき合図としてもっとも強いものはどれですか。 毎月の手数料がはっきり書かれている 「元本保証で月利10%」と言われる 金融庁の登録番号を自分で確認できた 元本保証（リスクほぼゼロ）と高利回りは両立しません。その
