u003c/div>\u003c/section>\n\u003ch2>「逆」は成り立たない\u003c/h2>\n\u003cp>ここで注意したいのは、「リスクが高ければ、必ずリターンも高い」わけではない点です。\u003c/p>\n\u003cp>リスクプレミアムがつくのは、分散しても消せない種類のぶれに対してだと考えられています。1つの会社に集中する、値動きの激しい短期売買をくり返すといったぶれは、わざわざ取らなくても避けられます。そうしたぶれに、市場はごほうびを払ってくれるとは限りません。どんなぶれなら避けられるのかは、第16話で扱います。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円の置き場所で考えてみましょう。普通預金なら元本はほぼ減りませんが、増え方はごくわずかです。株式の投資信託は、1年で2割、3割と下がる年もありえます。その代わりに、長い目で見れば預金より大きく増えることが期待されています。\u003c/p>\n\u003cp>どちらが正しいということはありません。「どれだけのぶれなら耐えられるか」に応じて、混ぜる割合を決めていくことになります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「元本保証で年10%」「リスクなしで高利回り」といった話は、この仕組みに反しています。市場で起きない条件をうたう話は、詐欺を疑うべきサインです（第46話で詳しく扱います）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>人はぶれを嫌うので、ぶれの大きい資産は安く値段がつき、その分リターンが上乗せされる\u003c/li>\u003cli>安全で高リターンの資産があっても、買う人が殺到して値段が上がり、うまみは消える\u003c/li>\u003cli>ただし、リスクが高ければリターンも高いとは限らない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>「ぶれが小さく、しかもリターンが高い資産」が市場で長く続かない理由はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">法律で禁止されているから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">多くの人が買って値段が上がり、その後のリターンが下がるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">証券会社が販売しないから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>おいしい資産には買い手が集まり、値段が上がります。高く買うほど、その後の増え方は小さくなるため、うまみは長く続きません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>財務省 中国財務局「リスクとリターンの関係」（ローリスク・ハイリターンは成り立たないことの説明） \u003ca href=\"https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/risukutoritan.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/risukutoritan.html\u003c/a>\u003c/li>\u003cli>財務省 中国財務局「投資のリスクを減らす方法【分散投資】」 \u003ca href=\"https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/bunsantoushi.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/bunsantoushi.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"どうせなら、ぶれが小さくて、しかもよく増える商品を選びたいです。なぜそういう商品は見つからないのでしょうか。 多くの人がぶれを嫌うため、ぶれの大きい資産は「おまけ」をつけないと買ってもらえないからです。逆に、安全でよく増える資産があれば、みんなが買って値段が上がり、すぐに「よく増える」ではなくなります。 リスクとリターンの関係 一般に、ぶれ（リスク）が小さい資産は、期待できるリターンも小さくなります。ぶれが大きい資産は、期待できるリターンも大きい傾向があります。 資産の例 ぶれ 期待できるリターン 預金 ほぼない とても小さい 債券 小さめ 小さめ 株式 大きい 大きめ これは自然の法則ではありません。市場で多くの人が売り買いした結果として、こうした関係ができあがっています。 なぜ市場でこの関係が生まれるのか、2つの方向から考えてみます。 一つ目は「人はぶれを嫌う」ことです。確実に1万円もらえる話と、半々の確率で0円か2万円になる話があったとします。平均はどちらも1万円です。それでも多くの人は確実な1万円を選びます。 すると、ぶれの大きい資産は、同じ値段では買い手がつきません。買ってもらうには、値段を下げるしかありません。安く買えれば、将来同じ利益を受け取ったときの増え方は大きくなります。この「ぶれを引き受けるごほうび」をリスクプレミアムと呼びます。 二つ目は「おいしい話は競争で消える」ことです。仮に、ぶれが小さいのに年10%増える資産があったとします。気づいた人は次々と買うでしょう。買う人が増えれば値段が上がります。高い値段で買えば、その後の増え方は小さくなります。値段が上がりきったところで、普通の資産と同じ程度のリターンに落ち着きます。 このように、ぶれの大きい資産には上乗せがつき、ぶれが小さくて高リターンの資産は競争で消えていきます。結果として、リスクとリターンはセットで動くのです。 「逆」は成り立たない ここで注意したいのは、「リスクが高ければ、必ずリターンも高い」わけではない点です。 リスクプレミアムがつくのは、分散しても消せない種類のぶれに対してだと考えられています。1つの会社に集中する、値動きの激しい短期売買をくり返すといったぶれは、わざわざ取らなくても避けられます。そうしたぶれに、市場はごほうびを払ってくれるとは限りません。どんなぶれなら避けられるのかは、第16話で扱います。 20万円の置き場所で考えてみましょう。普通預金なら元本はほぼ減りませんが、増え方はごくわずかです。株式の投資信託は、1年で2割、3割と下がる年もありえます。その代わりに、長い目で見れば預金より大きく増えることが期待されています。 どちらが正しいということはありません。「どれだけのぶれなら耐えられるか」に応じて、混ぜる割合を決めていくことになります。 「元本保証で年10%」「リスクなしで高利回り」といった話は、この仕組みに反しています。市場で起きない条件をうたう話は、詐欺を疑うべきサインです（第46話で詳しく扱います）。 人はぶれを嫌うので、ぶれの大きい資産は安く値段がつき、その分リターンが上乗せされる 安全で高リターンの資産があっても、買う人が殺到して値段が上がり、うまみは消える ただし、リスクが高ければリターンも高いとは限らない 「ぶれが小さく、しかもリターンが高い資産」が市場で長く続かない理由はどれでしょう。 法律で禁止されているから 多くの人が買って値段が上がり、その後のリターンが下がるから 証券会社が販売しないから おいしい資産には買い手が集まり、値段が上がります。高く買うほど、その後の増え方は小さくなるため、うまみは長く続きません。"},{"no":16,"part":3,"title":"分散投資","subtitle":"なぜ混ぜるとぶれが小さくなるのか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「卵は一つのカゴに盛るな」とよく聞きます。でも、ぶれる資産をいくつ混ぜても、ぶれる資産であることに変わりはないはずです。なぜ混ぜるとぶれが小さくなるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>資産どうしが「いつも同じ方向に動くわけではない」からです。ある資産が下がったとき、別の資産が上がったり下がらなかったりして、ぶれの一部が打ち消し合います。平均的な増え方はあまり変えずに、ぶれだけを小さくできるのがポイントです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>コインで考える分散\u003c/h2>\n\u003cp>2つの資産A・Bがあり、どちらも1年後に「+20%か−20%」が半々の確率で起きるとします。平均はどちらも0%です。\u003c/p>\n\u003cp>全額をAに入れると、結果は+20%か−20%のどちらかです。では、半分ずつAとBに入れ、AとBの結果が互いに無関係に決まるとしたらどうでしょう。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aの結果\u003c/th>\u003cth>Bの結果\u003c/th>\u003cth>全体の結果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>+20%\u003c/td>\u003ctd>+20%\u003c/td>\u003ctd>+20%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>+20%\u003c/td>\u003ctd>−20%\u003c/td>\u003ctd>0%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>−20%\u003c/td>\u003ctd>+20%\u003c/td>\u003ctd>0%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>−20%\u003c/td>\u003ctd>−20%\u003c/td>\u003ctd>−20%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>4通りは同じ確率で起きます。全体が0%になる確率が半分あり、−20%になる確率は4分の1に減りました。平均は0%のままなのに、極端な結果が起きにくくなっています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜこうなるのか。カギは\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"相関\">相関\u003c/span>、つまり「2つのものが一緒に動く度合い」です。\u003c/p>\n\u003cp>上の例でぶれが減ったのは、AとBが無関係に動き、片方の下げをもう片方が埋める場面があったからです。では、AとBがいつも同じ方向に動くとしたらどうでしょう。Aが−20%のときはBも必ず−20%です。この場合、混ぜても結果は+20%か−20%のままで、ぶれはまったく減りません。\u003c/p>\n\u003cp>逆に、Aが下がるときはBが必ず上がる関係なら、2つを半分ずつ持つと結果はいつも0%です。ぶれは完全に消えます。\u003c/p>\n\u003cp>身近な例で言えば、傘屋とアイス屋です。雨の日は傘が売れ、晴れの日はアイスが売れます。片方だけの店は天気次第ですが、両方の店を半分ずつ持てば、どちらの天気でも売上がある程度安定します。\u003c/p>\n\u003cp>まとめると、ぶれの減り方は相関で決まります。\u003c/p>\n\u003cul>\u003cli>いつも同じ方向に動く: ぶれは減らない\u003c/li>\u003cli>無関係に動く: ぶれはかなり減る\u003c/li>\u003cli>逆方向に動く: ぶれは大きく減る\u003c/li>\u003c/ul>\n\u003cp>現実の株式どうしは、多くの場合「ある程度同じ方向に動く」関係です。それでも、完全に同じでない限り、混ぜれば一部は打ち消し合います。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>分散で消せるぶれ、消せないぶれ\u003c/h2>\n\u003cp>会社ごとの事情によるぶれ（不祥事、ヒット商品など）を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"個別リスク\">個別リスク\u003c/span>と呼びます。これは多くの会社に分けるほど打ち消し合い、小さくなります。\u003c/p>\n\u003cp>一方、世界的な不景気のように、ほぼすべての株が一緒に下がるぶれは\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"市場リスク\">市場リスク\u003c/span>と呼ばれます。株だけをいくら増やしても、これは消せません。債券など、性質の違う資産を混ぜることで和らげる方法がとられます。\u003c/p>\n\u003cp>参考として、日本の公的年金を運用するGPIFは、国内外の株式と債券を4分の1ずつ持つ配分を基本にしています。GPIFの想定では、株式単体のぶれ（第19話で扱う標準偏差）は年率で約20%です。一方、4資産を混ぜた全体では約10%と見積もられています。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円で、ある1社の株だけを買うと、その会社の不祥事ひとつで大きく値下がりすることがあります。全世界の数千社に投資する投資信託なら、1社の問題が全体に与える影響はごくわずかです。少額でも広く分散できるのが、投資信託の強みです（第24話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>世界的な暴落のときは、ふだんはばらばらに動く資産が一斉に下がり、相関が高まることがあります。分散は「損をしなくなる方法」ではなく、「ぶれを小さくする方法」だと理解してください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>分散でぶれが減るのは、資産どうしが完全には同じ方向に動かないから\u003c/li>\u003cli>一緒に動く度合い（相関）が低いほど、ぶれは大きく打ち消し合う\u003c/li>\u003cli>会社ごとのぶれは分散で消せるが、市場全体のぶれは消せない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>2つの資産を混ぜたとき、ぶれがまったく小さくならないのはどんな場合でしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">2つが無関係に動く場合\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">2つがいつも同じ方向に同じだけ動く場合\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">2つが逆方向に動く場合\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>いつも同じように動く資産を混ぜても、打ち消し合う場面がありません。分散の効果は、動き方の違いから生まれます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>年金積立金管理運用独立行政法人（GPIF）「基本ポートフォリオの考え方」 \u003ca href=\"https://www.gpif.go.jp/gpif/portfolio.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gpif.go.jp/gpif/portfolio.html\u003c/a>\u003c/li>\u003cli>GPIF「第5期中期目標期間における基本ポートフォリオについて～詳細～」 \u003ca href=\"https://www.gpif.go.jp/gpif/15324685gpif/5th_policy_asset_mix_details_jp.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gpif.go.jp/gpif/15324685gpif/5th_policy_asset_mix_details_jp.pdf\u003c/a>\u003c/li>\u003cli>GPIF「資本市場 2025.6（No.478）掲載論文」（資産別の標準偏差：国内株式約19%、外国株式約20%） \u003ca href=\"https://www.gpif.go.jp/investment/capitalmarkets_478_ronbun_takeuchi.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gpif.go.jp/investment/capitalmarkets_478_ronbun_takeuchi.pdf\u003c/a>\u003c/li>\u003cli>第一生命経済研究所「GPIFの基本ポートフォリオを再検証する」（2026年7月） \u003ca href=\"https://www.dlri.co.jp/report/asset/634707.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dlri.co.jp/report/asset/634707.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「卵は一つのカゴに盛るな」とよく聞きます。でも、ぶれる資産をいくつ混ぜても、ぶれる資産であることに変わりはないはずです。なぜ混ぜるとぶれが小さくなるのでしょうか。 資産どうしが「いつも同じ方向に動くわけではない」からです。ある資産が下がったとき、別の資産が上がったり下がらなかったりして、ぶれの一部が打ち消し合います。平均的な増え方はあまり変えずに、ぶれだけを小さくできるのがポイントです。 コインで考える分散 2つの資産A・Bがあり、どちらも1年後に「+20%か−20%」が半々の確率で起きるとします。平均はどちらも0%です。 全額をAに入れると、結果は+20%か−20%のどちらかです。では、半分ずつAとBに入れ、AとBの結果が互いに無関係に決まるとしたらどうでしょう。 Aの結果 Bの結果 全体の結果 +20% +20% +20% +20% −20% 0% −20% +20% 0% −20% −20% −20% 4通りは同じ確率で起きます。全体が0%になる確率が半分あり、−20%になる確率は4分の1に減りました。平均は0%のままなのに、極端な結果が起きにくくなっています。 なぜこうなるのか。カギは相関、つまり「2つのものが一緒に動く度合い」です。 上の例でぶれが減ったのは、AとBが無関係に動き、片方の下げをもう片方が埋める場面があったからです。では、AとBがいつも同じ方向に動くとしたらどうでしょう。Aが−20%のときはBも必ず−20%です。この場合、混ぜても結果は+20%か−20%のままで、ぶれはまったく減りません。 逆に、Aが下がるときはBが必ず上がる関係なら、2つを半分ずつ持つと結果はいつも0%です。ぶれは完全に消えます。 身近な例で言えば、傘屋とアイス屋です。雨の日は傘が売れ、晴れの日はアイスが売れます。片方だけの店は天気次第ですが、両方の店を半分ずつ持てば、どちらの天気でも売上がある程度安定します。 まとめると、ぶれの減り方は相関で決まります。 いつも同じ方向に動く: ぶれは減らない 無関係に動く: ぶれはかなり減る 逆方向に動く: ぶれは大きく減る 現実の株式どうしは、多くの場合「ある程度同じ方向に動く」関係です。それでも、完全に同じでない限り、混ぜれば一部は打ち消し合います。 分散で消せるぶれ、消せないぶれ 会社ごとの事情によるぶれ（不祥事、ヒット商品など）を個別リスクと呼びます。これは多くの会社に分けるほど打ち消し合い、小さくなります。 一方、世界的な不景気のように、ほぼすべての株が一緒に下がるぶれは市場リスクと呼ばれます。株だけをいくら増やしても、これは消せません。債券など、性質の違う資産を混ぜることで和らげる方法がとられます。 参考として、日本の公的年金を運用するGPIFは、国内外の株式と債券を4分の1ずつ持つ配分を基本にしています。GPIFの想定では、株式単体のぶれ（第19話で扱う標準偏差）は年率で約20%です。一方、4資産を混ぜた全体では約10%と見積もられています。 20万円で、ある1社の株だけを買うと、その会社の不祥事ひとつで大きく値下がりすることがあります。全世界の数千社に投資する投資信託なら、1社の問題が全体に与える影響はごくわずかです。少額でも広く分散できるのが、投資信託の強みです（第24話）。 世界的な暴落のときは、ふだんはばらばらに動く資産が一斉に下がり、相関が高まることがあります。分散は「損をしなくなる方法」ではなく、「ぶれを小さくする方法」だと理解してください。 分散でぶれが減るのは、資産どうしが完全には同じ方向に動かないから 一緒に動く度合い（相関）が低いほど、ぶれは大きく打ち消し合う 会社ごとのぶれは分散で消せるが、市場全体のぶれは消せない 2つの資産を混ぜたとき、ぶれがまったく小さくならないのはどんな場合でしょう。 2つが無関係に動く場合 2つがいつも同じ方向に同じだけ動く場合 2つが逆方向に動く場合 いつも同じように動く資産を混ぜても、打ち消し合う場面がありません。分散の効果は、動き方の違いから生まれます。"},{"no":17,"part":3,"title":"長期投資","subtitle":"時間がリスクを和らげる理由と限界","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「長く持てばリスクが小さくなる」と聞きます。持っている間も毎日価格は動くのに、なぜ時間がたつとリスクが小さくなるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>良い年と悪い年が打ち消し合い、「1年あたりの平均的な増え方」のぶれが小さくなるからです。ただし、損をする可能性がゼロになるわけではなく、時間が解決しない種類のリスクもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>データで見る「時間の効果」\u003c/h2>\n\u003cp>金融庁は、1985年以降、国内外の株式と債券に毎月積み立てた場合の過去の結果を示しています（2017年の資料）。保有期間ごとに、1年あたりの増え方（年率）がどれくらいの幅に収まったかを比べたものです。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>保有期間\u003c/th>\u003cth>年率リターンの幅\u003c/th>\u003cth>元本割れ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>5年\u003c/td>\u003ctd>マイナスからプラスまで広い\u003c/td>\u003ctd>あり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20年\u003c/td>\u003ctd>約2%〜約8%\u003c/td>\u003ctd>なし\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>5年では元本割れした時期もありました。一方、20年では、計算した期間内のどの時期に始めても年率約2〜8%に収まりました。あくまで過去のデータで、手数料も含んでいません。将来も同じになる保証はありません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ期間が長くなると、年率のぶれが縮むのでしょうか。\u003c/p>\n\u003cp>サイコロで考えてみます。1回だけ振ると、出る目は1〜6のどれでもありえます。10回振って平均をとると、平均が1になるには毎回1が出る必要があり、ほとんど起きません。平均は3.5の近くに集まります。回数を増やすほど、運の偏りが打ち消し合うからです。\u003c/p>\n\u003cp>株式の1年ごとのリターンも、良い年と悪い年が入りまじります。1年だけなら大きく外れることがあっても、20年分を平均すると、極端な年の影響が薄まります。こうして「1年あたりの平均」は、長期的な実力に近づいていきます。\u003c/p>\n\u003cp>もう一つの理由は、株式のリターンの源が会社の利益の成長だという点です（第7話、第13話）。短期の価格は人々の期待や不安で大きく揺れます。しかし長い期間では、実際に会社がどれだけ稼いだかが価格に反映されやすくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>時間が解決しないこと\u003c/h2>\n\u003cp>時間の効果には限界もあります。3つ押さえておきましょう。\u003c/p>\n\u003cp>1つ目は、増えた「金額」のぶれは長期ほど広がることです。年率のぶれが小さくなっても、それを20年分積み重ねると、最終的な金額の差は大きくなります。\u003c/p>\n\u003cp>2つ目は、1つの国や地域に集中すると、長期でも報われないことがある点です。日経平均株価は1989年末に最高値をつけた後、それを上回るまでに約34年かかりました（2024年2月）。長期投資は、広い分散（第16話）と組み合わせてはじめて力を発揮します。\u003c/p>\n\u003cp>3つ目は、「長期で持てば大丈夫」は、途中で売らなければの話だということです。暴落時に怖くなって売ってしまえば、時間の効果は受け取れません（第42話）。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>18歳で始めて20年持てば、38歳です。大学生は使えるお金が少ない代わりに、時間をたっぷり持っています。\u003c/p>\n\u003cp>たとえば20万円のうち5万円を、年率4%で20年間運用できたとします。すると約11万円になります（5万円に1.04を20回かけた計算で、税金や手数料は考えていません）。もちろん実際の年率は毎年変わり、4%になる保証はありません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>長く持つと良い年と悪い年が打ち消し合い、年率のぶれが小さくなる\u003c/li>\u003cli>過去のデータでは、20年の積立・分散投資は年率約2〜8%に収まった\u003c/li>\u003cli>ただし金額のぶれ、集中投資、途中で売ることの3つは時間では解決しない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>長期投資について、正しい説明はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">20年持てば、将来も必ず元本割れしない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">長く持つほど、1年あたりの平均的な増え方のぶれは小さくなる傾向がある\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">1つの国の株だけでも、長く持てば必ず報われる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>長期では良い年と悪い年が打ち消し合います。ただし将来の保証はなく、日経平均のように回復に長い時間がかかった例もあります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「長期・積立・分散投資とNISA制度」（保有期間5年・20年の収益率の比較） \u003ca href=\"https://www.fsa.go.jp/policy/nisa/20170614-2/12.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa/20170614-2/12.pdf\u003c/a>\u003c/li>\u003cli>マネクリ（マネックス証券）「金融庁データにみる長期・積立・分散投資の効果」 \u003ca href=\"https://media.monex.co.jp/articles/-/25982\" target=\"_blank\" rel=\"noopener noreferrer\">https://media.monex.co.jp/articles/-/25982\u003c/a>\u003c/li>\u003cli>nippon.com「日経平均株価、34年ぶりに史上最高値を更新」 \u003ca href=\"https://www.nippon.com/ja/japan-data/h01927/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nippon.com/ja/japan-data/h01927/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「長く持てばリスクが小さくなる」と聞きます。持っている間も毎日価格は動くのに、なぜ時間がたつとリスクが小さくなるのでしょうか。 良い年と悪い年が打ち消し合い、「1年あたりの平均的な増え方」のぶれが小さくなるからです。ただし、損をする可能性がゼロになるわけではなく、時間が解決しない種類のリスクもあります。 データで見る「時間の効果」 金融庁は、1985年以降、国内外の株式と債券に毎月積み立てた場合の過去の結果を示しています（2017年の資料）。保有期間ごとに、1年あたりの増え方（年率）がどれくらいの幅に収まったかを比べたものです。 保有期間 年率リターンの幅 元本割れ 5年 マイナスからプラスまで広い あり 20年 約2%〜約8% なし 5年では元本割れした時期もありました。一方、20年では、計算した期間内のどの時期に始めても年率約2〜8%に収まりました。あくまで過去のデータで、手数料も含んでいません。将来も同じになる保証はありません。 なぜ期間が長くなると、年率のぶれが縮むのでしょうか。 サイコロで考えてみます。1回だけ振ると、出る目は1〜6のどれでもありえます。10回振って平均をとると、平均が1になるには毎回1が出る必要があり、ほとんど起きません。平均は3.5の近くに集まります。回数を増やすほど、運の偏りが打ち消し合うからです。 株式の1年ごとのリターンも、良い年と悪い年が入りまじります。1年だけなら大きく外れることがあっても、20年分を平均すると、極端な年の影響が薄まります。こうして「1年あたりの平均」は、長期的な実力に近づいていきます。 もう一つの理由は、株式のリターンの源が会社の利益の成長だという点です（第7話、第13話）。短期の価格は人々の期待や不安で大きく揺れます。しかし長い期間では、実際に会社がどれだけ稼いだかが価格に反映されやすくなります。 時間が解決しないこと 時間の効果には限界もあります。3つ押さえておきましょう。 1つ目は、増えた「金額」のぶれは長期ほど広がることです。年率のぶれが小さくなっても、それを20年分積み重ねると、最終的な金額の差は大きくなります。 2つ目は、1つの国や地域に集中すると、長期でも報われないことがある点です。日経平均株価は1989年末に最高値をつけた後、それを上回るまでに約34年かかりました（2024年2月）。長期投資は、広い分散（第16話）と組み合わせてはじめて力を発揮します。 3つ目は、「長期で持てば大丈夫」は、途中で売らなければの話だということです。暴落時に怖くなって売ってしまえば、時間の効果は受け取れません（第42話）。 18歳で始めて20年持てば、38歳です。大学生は使えるお金が少ない代わりに、時間をたっぷり持っています。 たとえば20万円のうち5万円を、年率4%で20年間運用できたとします。すると約11万円になります（5万円に1.04を20回かけた計算で、税金や手数料は考えていません）。もちろん実際の年率は毎年変わり、4%になる保証はありません。 長く持つと良い年と悪い年が打ち消し合い、年率のぶれが小さくなる 過去のデータでは、20年の積立・分散投資は年率約2〜8%に収まった ただし金額のぶれ、集中投資、途中で売ることの3つは時間では解決しない 長期投資について、正しい説明はどれでしょう。 20年持てば、将来も必ず元本割れしない 長く持つほど、1年あたりの平均的な増え方のぶれは小さくなる傾向がある 1つの国の株だけでも、長く持てば必ず報われる 長期では良い年と悪い年が打ち消し合います。ただし将来の保証はなく、日経平均のように回復に長い時間がかかった例もあります。"},{"no":18,"part":3,"title":"積立投資とドルコスト平均法","subtitle":"効果と誤解","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>毎月同じ金額で買い続ける「ドルコスト平均法」は、安く買えてお得だと聞きました。本当にお得なのでしょうか。それとも何か落とし穴があるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>同じ金額で買い続けると、平均の購入単価が「価格の平均」より低くなるという効果は本当にあります。ただし、それは儲かることの保証ではありません。手元にまとまったお金がある場合、一括で投資したほうが結果がよかった時期も多いことが知られています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>ドルコスト平均法とは\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"積立投資\">積立投資\u003c/span>のうち、毎回「同じ金額」で買う方法を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ドルコスト平均法\">ドルコスト平均法\u003c/span>と呼びます。たとえば毎月1万円ずつ投資信託を買う方法です。\u003c/p>\n\u003cp>金額が一定なので、価格が高い月は少しだけ、安い月はたくさん買うことになります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ金額を一定にすると、平均の購入単価が下がるのでしょうか。2か月だけの例で確かめます。\u003c/p>\n\u003cul>\u003cli>1か月目: 価格1,000円で1万円分 → 10口\u003c/li>\u003cli>2か月目: 価格500円で1万円分 → 20口\u003c/li>\u003c/ul>\n\u003cp>合計2万円で30口買えました。1口あたりの\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"平均購入単価\">平均購入単価\u003c/span>は、2万円 ÷ 30口 = 約667円です。\u003c/p>\n\u003cp>一方、2か月の価格の平均は (1,000円 + 500円) ÷ 2 = 750円です。平均購入単価のほうが、約83円安くなっています。\u003c/p>\n\u003cp>理由は、安い月ほど「たくさんの口数」を買っているからです。平均購入単価は、口数の多い安い月の価格に引っぱられます。反対に、高い月は口数が少ないので、平均にあまり影響しません。毎回同じ「口数」を買う方法では、こうはなりません。\u003c/p>\n\u003cp>ただ、ここで比べているのは「価格の平均」です。「一番安いときに全部買う」より得になるわけではありません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>よくある誤解\u003c/h2>\n\u003cp>ドルコスト平均法には、誤解されやすい点が2つあります。\u003c/p>\n\u003cp>1つ目は「下落しても損をしない」という誤解です。平均購入単価が下がっても、売るときの価格がそれより低ければ損失になります。下がり続ける資産を買い続ければ、損は膨らみます。\u003c/p>\n\u003cp>2つ目は「一括投資より有利」という誤解です。米国の運用会社バンガードは、2012年に米国・英国・豪州の過去データを分析しました。その結果、一括で投資したほうが、分けて投資するより成績がよかったケースが約3分の2ありました。株式は長い目で見ると上がってきたので、早く全額を市場に入れたほうが有利になりやすいのです。\u003c/p>\n\u003cp>それでも分けて買う意味はあります。高値で一度に買ってしまう後悔を減らせますし、気持ちが楽になります。また、買った直後に下落が続いた場面では、分けて買ったほうが損は小さくなります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>大学生の場合、そもそも「まとまったお金」はあまりありません。アルバイト代が毎月入るなら、毎月その一部で積み立てるのが自然な形です。これは「一括か積立か」の選択ではなく、収入に合わせた投資です。\u003c/p>\n\u003cp>手元の20万円のうち育てるお金5万円については、一度に入れても、数か月に分けてもかまいません（第12話）。どちらが得かは事前にはわかりません。後悔しにくい方法を選ぶのも一つの考え方です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「安くなったから」と積立額を急に増やしたり、「下がりそうだから」と止めたりすると、それは予想にもとづく売買になります。ドルコスト平均法の良さは、予想をしなくてよいことにあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>一定金額で買うと、安いときに多く買うため平均購入単価は価格の平均より低くなる\u003c/li>\u003cli>ただし損をしない方法ではなく、一括投資のほうが成績がよかった期間も多い\u003c/li>\u003cli>毎月収入がある学生にとっては、積立は収入に合わせた自然な投資方法\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>価格が1,000円の月と500円の月に、1万円ずつ投資しました。平均購入単価はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">750円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">約667円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">500円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>合計2万円で10口と20口、計30口を買ったので、2万円 ÷ 30口 = 約667円です。価格の平均750円より低くなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>Vanguard Research &quot;Dollar-cost averaging just means taking risk later&quot;（2012年）\u003c/li>\u003cli>BenefitsPRO &quot;Lump sum investing vs. dollar cost averaging&quot;（バンガード分析の紹介） \u003ca href=\"https://benefitspro.com/2012/10/31/lump-sum-investing-vs-dollar-cost-averaging\" target=\"_blank\" rel=\"noopener noreferrer\">https://benefitspro.com/2012/10/31/lump-sum-investing-vs-dollar-cost-averaging\u003c/a>\u003c/li>\u003cli>三菱UFJ銀行「ドルコスト平均法とは」 \u003ca href=\"https://www.bk.mufg.jp/tameru/toushin/motto_shiritai/shittoku/dorukosuto.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bk.mufg.jp/tameru/toushin/motto_shiritai/shittoku/dorukosuto.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"毎月同じ金額で買い続ける「ドルコスト平均法」は、安く買えてお得だと聞きました。本当にお得なのでしょうか。それとも何か落とし穴があるのでしょうか。 同じ金額で買い続けると、平均の購入単価が「価格の平均」より低くなるという効果は本当にあります。ただし、それは儲かることの保証ではありません。手元にまとまったお金がある場合、一括で投資したほうが結果がよかった時期も多いことが知られています。 ドルコスト平均法とは 積立投資のうち、毎回「同じ金額」で買う方法をドルコスト平均法と呼びます。たとえば毎月1万円ずつ投資信託を買う方法です。 金額が一定なので、価格が高い月は少しだけ、安い月はたくさん買うことになります。 なぜ金額を一定にすると、平均の購入単価が下がるのでしょうか。2か月だけの例で確かめます。 1か月目: 価格1,000円で1万円分 → 10口 2か月目: 価格500円で1万円分 → 20口 合計2万円で30口買えました。1口あたりの平均購入単価は、2万円 ÷ 30口 = 約667円です。 一方、2か月の価格の平均は (1,000円 + 500円) ÷ 2 = 750円です。平均購入単価のほうが、約83円安くなっています。 理由は、安い月ほど「たくさんの口数」を買っているからです。平均購入単価は、口数の多い安い月の価格に引っぱられます。反対に、高い月は口数が少ないので、平均にあまり影響しません。毎回同じ「口数」を買う方法では、こうはなりません。 ただ、ここで比べているのは「価格の平均」です。「一番安いときに全部買う」より得になるわけではありません。 よくある誤解 ドルコスト平均法には、誤解されやすい点が2つあります。 1つ目は「下落しても損をしない」という誤解です。平均購入単価が下がっても、売るときの価格がそれより低ければ損失になります。下がり続ける資産を買い続ければ、損は膨らみます。 2つ目は「一括投資より有利」という誤解です。米国の運用会社バンガードは、2012年に米国・英国・豪州の過去データを分析しました。その結果、一括で投資したほうが、分けて投資するより成績がよかったケースが約3分の2ありました。株式は長い目で見ると上がってきたので、早く全額を市場に入れたほうが有利になりやすいのです。 それでも分けて買う意味はあります。高値で一度に買ってしまう後悔を減らせますし、気持ちが楽になります。また、買った直後に下落が続いた場面では、分けて買ったほうが損は小さくなります。 大学生の場合、そもそも「まとまったお金」はあまりありません。アルバイト代が毎月入るなら、毎月その一部で積み立てるのが自然な形です。これは「一括か積立か」の選択ではなく、収入に合わせた投資です。 手元の20万円のうち育てるお金5万円については、一度に入れても、数か月に分けてもかまいません（第12話）。どちらが得かは事前にはわかりません。後悔しにくい方法を選ぶのも一つの考え方です。 「安くなったから」と積立額を急に増やしたり、「下がりそうだから」と止めたりすると、それは予想にもとづく売買になります。ドルコスト平均法の良さは、予想をしなくてよいことにあります。 一定金額で買うと、安いときに多く買うため平均購入単価は価格の平均より低くなる ただし損をしない方法ではなく、一括投資のほうが成績がよかった期間も多い 毎月収入がある学生にとっては、積立は収入に合わせた自然な投資方法 価格が1,000円の月と500円の月に、1万円ずつ投資しました。平均購入単価はどれでしょう。 750円 約667円 500円 合計2万円で10口と20口、計30口を買ったので、2万円 ÷ 30口 = 約667円です。価格の平均750円より低くなります。"},{"no":19,"part":3,"title":"「平均」と「ぶれ」を数字で見る","subtitle":"標準偏差をざっくり","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資信託の資料に「リスク（標準偏差）18%」のような数字が書かれていました。この数字は何を表していて、どう読めばよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"標準偏差\">標準偏差\u003c/span>は「結果が平均からどれくらい離れやすいか」を表す数字です。ざっくり言えば、年の3分の2くらいは「平均 ± 標準偏差」の範囲に収まる、という目安として読めます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>平均だけでは足りない\u003c/h2>\n\u003cp>2人の学生のテストの点数を考えます。\u003c/p>\n\u003cul>\u003cli>Aさん: 60点、60点、60点\u003c/li>\u003cli>Bさん: 100点、60点、20点\u003c/li>\u003c/ul>\n\u003cp>平均はどちらも60点です。でも、Bさんは次に何点をとるか予想しにくいですね。平均だけでは、この違いが見えません。そこで「ぶれ」を表す数字が必要になります。\u003c/p>\n\u003ch2>標準偏差のざっくりした意味\u003c/h2>\n\u003cp>標準偏差は、それぞれの結果が平均からどれくらい離れているかを、ならして1つの数字にしたものです。Aさんは0点、Bさんは約33点になります。数字が大きいほど、結果がばらつくという意味です。\u003c/p>\n\u003cp>投資では、1年ごとのリターンについて標準偏差を計算し、それを「リスク」と呼びます（第14話）。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「平均 ± 標準偏差」に3分の2くらいが収まると言えるのでしょうか。\u003c/p>\n\u003cp>多くのものごとは、「平均のあたりがいちばん起きやすく、離れるほど起きにくい」という山の形にばらつきます。身長やテストの点数がそうです。この形を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"正規分布\">正規分布\u003c/span>と呼びます。\u003c/p>\n\u003cp>正規分布には、山の形がどんなに太くても細くても成り立つ性質があります。平均 ± 標準偏差1つ分の中に全体の約68%、標準偏差2つ分の中に約95%が入るのです。山の横幅を測る「ものさし」として標準偏差を使っているので、こうした共通の割合が出てくるわけです。\u003c/p>\n\u003cp>株式の年間リターンも、おおまかにはこの山の形に近いと考えられてきました。そのため、標準偏差を知るだけで「だいたいどのくらいの幅に収まりそうか」を見積もれるのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>例で読んでみる\u003c/h2>\n\u003cp>期待リターン（平均）が年5%、標準偏差が年20%の資産を考えます。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>範囲\u003c/th>\u003cth>年率リターン\u003c/th>\u003cth>起きる割合の目安\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>平均 ± 1つ分\u003c/td>\u003ctd>−15% 〜 +25%\u003c/td>\u003ctd>約3年に2年\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平均 ± 2つ分\u003c/td>\u003ctd>−35% 〜 +45%\u003c/td>\u003ctd>約20年に19年\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>「平均5%」と聞くと穏やかに見えます。しかし、20年に1年くらいは−35%より悪い年や+45%より良い年もありうる、ということです。\u003c/p>\n\u003cp>参考までに、GPIFの第5期の想定では、国内債券の標準偏差は約2.6%、外国株式は約20%とされています。株式と債券では、ぶれの大きさが桁違いだとわかります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を、平均5%・標準偏差20%の資産に1年間入れたとします。3年に2年くらいは、1年後に17万円〜25万円の範囲に収まる計算です。20万円 × 0.85 = 17万円、20万円 × 1.25 = 25万円です。\u003c/p>\n\u003cp>まれに（目安として40年に1年ほど）、13万円を下回るような年もありえます。「その結果を見ても売らずにいられるか」を想像することが、自分に合う投資額を考えるヒントになります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>現実の市場では、正規分布で考えるよりも極端な暴落が起きやすいことが知られています。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ファットテール\">ファットテール\u003c/span>と呼びます。標準偏差はあくまで目安で、「最悪でもこの範囲」という意味ではありません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>標準偏差は、結果が平均からどれくらい離れやすいかを表す数字\u003c/li>\u003cli>目安として、約3分の2が「平均 ± 1つ分」、約95%が「平均 ± 2つ分」に収まる\u003c/li>\u003cli>実際の市場は、この目安より極端な動きが起きることがある\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>平均リターン年5%、標準偏差年10%の資産があります。3年に2年くらいの目安で収まる範囲はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">0% 〜 +10%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">−5% 〜 +15%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">−15% 〜 +25%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>平均5%に標準偏差10%を足し引きして、−5%〜+15%です。約68%がこの範囲に入るのが目安です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>GPIF「資本市場 2025.6（No.478）掲載論文」（第5期の資産別標準偏差：国内債券2.60%、外国株式20.35%など） \u003ca href=\"https://www.gpif.go.jp/investment/capitalmarkets_478_ronbun_takeuchi.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gpif.go.jp/investment/capitalmarkets_478_ronbun_takeuchi.pdf\u003c/a>\u003c/li>\u003cli>インディペンデント・フィデュシャリー「GPIFを運用事例として議論する⑤リスク管理手法（標準偏差）」 \u003ca href=\"https://www.i-fiduciary.co.jp/archives/3024\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.i-fiduciary.co.jp/archives/3024\u003c/a>\u003c/li>\u003cli>大和証券「金融・証券用語解説［標準偏差］」 \u003ca href=\"https://www.daiwa.jp/glossary/YST1579.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.daiwa.jp/glossary/YST1579.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"投資信託の資料に「リスク（標準偏差）18%」のような数字が書かれていました。この数字は何を表していて、どう読めばよいのでしょうか。 標準偏差は「結果が平均からどれくらい離れやすいか」を表す数字です。ざっくり言えば、年の3分の2くらいは「平均 ± 標準偏差」の範囲に収まる、という目安として読めます。 平均だけでは足りない 2人の学生のテストの点数を考えます。 Aさん: 60点、60点、60点 Bさん: 100点、60点、20点 平均はどちらも60点です。でも、Bさんは次に何点をとるか予想しにくいですね。平均だけでは、この違いが見えません。そこで「ぶれ」を表す数字が必要になります。 標準偏差のざっくりした意味 標準偏差は、それぞれの結果が平均からどれくらい離れているかを、ならして1つの数字にしたものです。Aさんは0点、Bさんは約33点になります。数字が大きいほど、結果がばらつくという意味です。 投資では、1年ごとのリターンについて標準偏差を計算し、それを「リスク」と呼びます（第14話）。 なぜ「平均 ± 標準偏差」に3分の2くらいが収まると言えるのでしょうか。 多くのものごとは、「平均のあたりがいちばん起きやすく、離れるほど起きにくい」という山の形にばらつきます。身長やテストの点数がそうです。この形を正規分布と呼びます。 正規分布には、山の形がどんなに太くても細くても成り立つ性質があります。平均 ± 標準偏差1つ分の中に全体の約68%、標準偏差2つ分の中に約95%が入るのです。山の横幅を測る「ものさし」として標準偏差を使っているので、こうした共通の割合が出てくるわけです。 株式の年間リターンも、おおまかにはこの山の形に近いと考えられてきました。そのため、標準偏差を知るだけで「だいたいどのくらいの幅に収まりそうか」を見積もれるのです。 例で読んでみる 期待リターン（平均）が年5%、標準偏差が年20%の資産を考えます。 範囲 年率リターン 起きる割合の目安 平均 ± 1つ分 −15% 〜 +25% 約3年に2年 平均 ± 2つ分 −35% 〜 +45% 約20年に19年 「平均5%」と聞くと穏やかに見えます。しかし、20年に1年くらいは−35%より悪い年や+45%より良い年もありうる、ということです。 参考までに、GPIFの第5期の想定では、国内債券の標準偏差は約2.6%、外国株式は約20%とされています。株式と債券では、ぶれの大きさが桁違いだとわかります。 20万円を、平均5%・標準偏差20%の資産に1年間入れたとします。3年に2年くらいは、1年後に17万円〜25万円の範囲に収まる計算です。20万円 × 0.85 = 17万円、20万円 × 1.25 = 25万円です。 まれに（目安として40年に1年ほど）、13万円を下回るような年もありえます。「その結果を見ても売らずにいられるか」を想像することが、自分に合う投資額を考えるヒントになります。 現実の市場では、正規分布で考えるよりも極端な暴落が起きやすいことが知られています。これをファットテールと呼びます。標準偏差はあくまで目安で、「最悪でもこの範囲」という意味ではありません。 標準偏差は、結果が平均からどれくらい離れやすいかを表す数字 目安として、約3分の2が「平均 ± 1つ分」、約95%が「平均 ± 2つ分」に収まる 実際の市場は、この目安より極端な動きが起きることがある 平均リターン年5%、標準偏差年10%の資産があります。3年に2年くらいの目安で収まる範囲はどれでしょう。 0% 〜 +10% −5% 〜 +15% −15% 〜 +25% 平均5%に標準偏差10%を足し引きして、−5%〜+15%です。約68%がこの範囲に入るのが目安です。"},{"no":20,"part":4,"title":"株式とは何か","subtitle":"会社の持ち主になるということ","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株を買うと「会社の持ち主になる」と言われます。たった数株買っただけで持ち主というのは、どういう意味なのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"株式\">株式\u003c/span>は、会社にお金を出した人が受け取る「持ち分の証明」です。株主は、持っている株数に応じて、利益を受け取る権利や、会社の大事なことを決める投票の権利を持ちます。この意味で、持ち主の一人になります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>株式会社のしくみ\u003c/h2>\n\u003cp>会社が事業を始めたり広げたりするには、お金が必要です。株式会社は、そのお金を多くの人から少しずつ集めるしくみです。お金を出した人には株式を渡し、出した人は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"株主\">株主\u003c/span>になります。\u003c/p>\n\u003cp>会社全体を1,000株に分けたとすれば、10株を持つ人は会社の100分の1の持ち主です。数株でも、小さいながら持ち分を持っていることになります。\u003c/p>\n\u003ch2>株主が持つ3つの権利\u003c/h2>\n\u003cp>株主には、主に次の権利があります。\u003c/p>\n\u003col>\u003cli>\u003cstrong>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"議決権\">議決権\u003c/span>\u003c/strong>: 株主総会で、役員の選任などに投票する権利\u003c/li>\u003cli>\u003cstrong>配当を受け取る権利\u003c/strong>: 会社の利益の一部を受け取る権利（第22話）\u003c/li>\u003cli>\u003cstrong>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"残余財産\">残余財産\u003c/span>を受け取る権利\u003c/strong>: 会社をたたむとき、借金を返した残りを受け取る権利\u003c/li>\u003c/ol>\n\u003cp>株を買ったあとは、ほかの投資家に売ることもできます。その値段が株価で、株価がなぜ動くのかは第21話で扱います。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、見ず知らずの多くの人が、安心して会社にお金を出せるのでしょうか。カギは2つあります。\u003c/p>\n\u003cp>一つ目は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"有限責任\">有限責任\u003c/span>です。会社法では、株主の責任は「株式を手に入れるために払った金額まで」と定められています。会社が倒産して大きな借金を残しても、株主が自分の財布から追加で払う必要はありません。最悪でも、株の価値がゼロになるだけです。\u003c/p>\n\u003cp>もし責任に上限がなければ、会社の事情をよく知らない人は怖くて出資できません。上限があるから、多くの人が少額ずつ出し合えるのです。損は出したお金までに限られ、利益の上限はありません。この非対称な形が、株式会社という発明の核心です。\u003c/p>\n\u003cp>二つ目は、株主の受け取る順番です。会社が稼いだお金は、まず社員の給料、取引先への支払い、借金の利息、税金に回ります。株主が受け取るのは、そのすべてを払った「残り」です。\u003c/p>\n\u003cp>残りなので、利益が大きければ株主の取り分は大きく増え、利益が小さければゼロにもなります。株主は、会社の成功と失敗をいちばん大きく受け止める立場です。だからこそ、株式はぶれが大きく、その代わりに期待できるリターンも大きくなります（第15話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>日本の証券取引所では、ふつう100株単位で売買します。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"単元株\">単元株\u003c/span>と呼びます。株価が2,000円なら、最低でも20万円が必要です。\u003c/p>\n\u003cp>東京証券取引所は、上場会社に対して、1単元の金額を50万円未満にすることを望ましい水準としています。さらに2025年4月には、東証の勉強会の報告書で、個人投資家が求める水準として10万円程度という目安も示されました。株式分割で1単元の金額を下げる会社も増えています。\u003c/p>\n\u003cp>それでも20万円で1社の株を買うと、資産のほとんどが1つの会社に集中します。分散の観点では心配が残ります（第16話）。まずは投資信託で多くの会社の株を少しずつ持ち、個別株は仕組みを学んでから小さく試すのも一つの方法です（第49話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>有限責任とはいえ、株の価値がゼロになる可能性はあります。また、一部の証券会社では1株から買えるサービスもありますが、手数料や売買のタイミングなどの条件は会社によって異なります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>株式は会社の持ち分で、株主は議決権・配当・残余財産を受け取る権利を持つ\u003c/li>\u003cli>有限責任があるため、損は出資額までに限られ、多くの人が安心して出資できる\u003c/li>\u003cli>株主は会社の利益の「残り」を受け取る立場なので、ぶれも期待リターンも大きい\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>株主が会社の借金に対して負う責任について、正しいのはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">会社の借金をすべて肩代わりする必要がある\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">株式を手に入れるために払った金額までに限られる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">株数に応じて追加で支払う必要がある\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>会社法では株主の責任は引受価額が限度とされています。最悪の場合でも、失うのは株に払ったお金までです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>e-Gov法令検索「会社法」（第104条 株主の責任、第105条 株主の権利） \u003ca href=\"https://laws.e-gov.go.jp/law/417AC0000000086\" target=\"_blank\" rel=\"noopener noreferrer\">https://laws.e-gov.go.jp/law/417AC0000000086\u003c/a>\u003c/li>\u003cli>大和総研「東証の少額投資の在り方に関する勉強会 報告書のポイント」（2025年4月） \u003ca href=\"https://www.dir.co.jp/report/research/capital-mkt/securities/20250428_025071.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dir.co.jp/report/research/capital-mkt/securities/20250428_025071.html\u003c/a>\u003c/li>\u003cli>全国証券取引所「売買単位の100株への統一」（2018年10月完了）\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株を買うと「会社の持ち主になる」と言われます。たった数株買っただけで持ち主というのは、どういう意味なのでしょうか。 株式は、会社にお金を出した人が受け取る「持ち分の証明」です。株主は、持っている株数に応じて、利益を受け取る権利や、会社の大事なことを決める投票の権利を持ちます。この意味で、持ち主の一人になります。 株式会社のしくみ 会社が事業を始めたり広げたりするには、お金が必要です。株式会社は、そのお金を多くの人から少しずつ集めるしくみです。お金を出した人には株式を渡し、出した人は株主になります。 会社全体を1,000株に分けたとすれば、10株を持つ人は会社の100分の1の持ち主です。数株でも、小さいながら持ち分を持っていることになります。 株主が持つ3つの権利 株主には、主に次の権利があります。 議決権: 株主総会で、役員の選任などに投票する権利 配当を受け取る権利: 会社の利益の一部を受け取る権利（第22話） 残余財産を受け取る権利: 会社をたたむとき、借金を返した残りを受け取る権利 株を買ったあとは、ほかの投資家に売ることもできます。その値段が株価で、株価がなぜ動くのかは第21話で扱います。 なぜ、見ず知らずの多くの人が、安心して会社にお金を出せるのでしょうか。カギは2つあります。 一つ目は有限責任です。会社法では、株主の責任は「株式を手に入れるために払った金額まで」と定められています。会社が倒産して大きな借金を残しても、株主が自分の財布から追加で払う必要はありません。最悪でも、株の価値がゼロになるだけです。 もし責任に上限がなければ、会社の事情をよく知らない人は怖くて出資できません。上限があるから、多くの人が少額ずつ出し合えるのです。損は出したお金までに限られ、利益の上限はありません。この非対称な形が、株式会社という発明の核心です。 二つ目は、株主の受け取る順番です。会社が稼いだお金は、まず社員の給料、取引先への支払い、借金の利息、税金に回ります。株主が受け取るのは、そのすべてを払った「残り」です。 残りなので、利益が大きければ株主の取り分は大きく増え、利益が小さければゼロにもなります。株主は、会社の成功と失敗をいちばん大きく受け止める立場です。だからこそ、株式はぶれが大きく、その代わりに期待できるリターンも大きくなります（第15話）。 日本の証券取引所では、ふつう100株単位で売買します。これを単元株と呼びます。株価が2,000円なら、最低でも20万円が必要です。 東京証券取引所は、上場会社に対して、1単元の金額を50万円未満にすることを望ましい水準としています。さらに2025年4月には、東証の勉強会の報告書で、個人投資家が求める水準として10万円程度という目安も示されました。株式分割で1単元の金額を下げる会社も増えています。 それでも20万円で1社の株を買うと、資産のほとんどが1つの会社に集中します。分散の観点では心配が残ります（第16話）。まずは投資信託で多くの会社の株を少しずつ持ち、個別株は仕組みを学んでから小さく試すのも一つの方法です（第49話）。 有限責任とはいえ、株の価値がゼロになる可能性はあります。また、一部の証券会社では1株から買えるサービスもありますが、手数料や売買のタイミングなどの条件は会社によって異なります。 株式は会社の持ち分で、株主は議決権・配当・残余財産を受け取る権利を持つ 有限責任があるため、損は出資額までに限られ、多くの人が安心して出資できる 株主は会社の利益の「残り」を受け取る立場なので、ぶれも期待リターンも大きい 株主が会社の借金に対して負う責任について、正しいのはどれでしょう。 会社の借金をすべて肩代わりする必要がある 株式を手に入れるために払った金額までに限られる 株数に応じて追加で支払う必要がある 会社法では株主の責任は引受価額が限度とされています。最悪の場合でも、失うのは株に払ったお金までです。"},{"no":21,"part":4,"title":"株価はなぜ動くのか","subtitle":"値段を決めているのは「期待」と「利益」","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株価は毎日、ときには1分ごとに上下します。会社の中身はそんなに急に変わらないはずなのに、なぜ値段だけが動くのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株価は「この会社が将来どれだけ稼ぐか」という期待で決まります。短期では人々の気分や売り買いの量で大きくぶれますが、長い目で見ると会社の実際の利益に引き寄せられていきます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>値段は「売りたい人」と「買いたい人」で決まる\u003c/h2>\n\u003cp>株は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"証券取引所\">証券取引所\u003c/span>で売買されています。取引所は、売りたい人と買いたい人を引き合わせる市場です。\u003c/p>\n\u003cp>買いたい人が多ければ値段は上がり、売りたい人が多ければ下がります。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"需給\">需給\u003c/span>（需要と供給）といいます。つまり株価とは、その瞬間に「この値段なら取引してよい」と合意した価格にすぎません。\u003c/p>\n\u003ch2>人はなぜその値段で買うのか\u003c/h2>\n\u003cp>第20話で見たように、株を持つことは会社の持ち主の一人になることです。持ち主は、会社が稼いだ利益の分け前を受け取る権利を持ちます。ですから、買う人は「この会社は将来いくら稼ぎそうか」を考えて値段をつけます。\u003c/p>\n\u003cp>将来の利益が増えそうだと多くの人が思えば、今のうちに買おうとする人が増え、株価は上がります。\u003c/p>\n\u003ch3>株価を動かすできごとの例\u003c/h3>\n\u003cul>\u003cli>決算（会社の成績発表）が予想より良かった、または悪かった\u003c/li>\u003cli>新商品の成功や不祥事のニュース\u003c/li>\u003cli>金利の上げ下げや景気の見通し\u003c/li>\u003cli>為替（円高・円安）の変化\u003c/li>\u003c/ul>\n\u003cp>どれも「将来の利益の見込み」を変えるできごとだと言えます。\u003c/p>\n\u003ch2>短期は気分、長期は利益\u003c/h2>\n\u003cp>短期の株価は、期待や不安が行き過ぎて大きく上下します。理由がはっきりしない日の上げ下げも珍しくありません。\u003c/p>\n\u003cp>一方で、何年も利益を伸ばし続ける会社の株価は、長い目で見ると上がっていく傾向があります。逆に利益が減り続ける会社の株価は、いずれ下がりやすくなります。期待はいつまでも現実から離れてはいられず、最後は決算という「答え合わせ」で修正されるからです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「今の利益」ではなく「将来の期待」で動くのでしょうか。それは、株を買った人が受け取れるのが、これから先に会社が稼ぐお金だからです。過去の利益はすでに過ぎたことで、買った人のものにはなりません。\u003c/p>\n\u003cp>さらに、期待は情報が届くたびに一斉に書き換わります。良いニュースが出た瞬間に多くの人が同時に考えを改めるので、株価は会社の中身よりずっと速く動きます。\u003c/p>\n\u003cp>加えて、他人がどう考えるかを先読みして売買する人もいます。経済学者ケインズは、これを「自分が美人だと思う人ではなく、みんなが選びそうな人に投票する美人投票」にたとえました。この先読み合戦が、短期の値動きを実態以上に大きくします。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち2万円で、ある会社の株を買ったとします（例）。翌日に悪いニュースが出て株価が10%下がると、評価額は2万円 × 0.9 = 1万8,000円です。\u003c/p>\n\u003cp>しかし会社の利益が数年かけて伸びれば、株価も戻ってくる可能性があります。逆に業績が回復しなければ、戻らないこともあります。毎日の値動きに一喜一憂するより、「この会社の利益は今後どうなりそうか」を見るほうが、株価の動きを理解する近道です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「利益が良かったのに株価が下がった」ということもよく起こります。みんなの期待がそれ以上に高かった場合、結果が良くても「期待ほどではない」と受け取られるためです。株価は良し悪しではなく、期待とのずれに反応します。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>株価は売りたい人と買いたい人の合意で決まる\u003c/li>\u003cli>人々は会社の「将来の利益」を予想して値段をつける\u003c/li>\u003cli>短期は期待や不安でぶれやすく、長期は実際の利益に近づきやすい\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>決算で過去最高の利益を発表したのに、株価が下がりました。考えられる理由として最も適切なものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">株価は会社の利益とまったく関係がないから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">市場の期待がさらに高く、結果がそれを下回ったから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">決算発表の日は必ず株価が下がる決まりがあるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>株価は期待をもとに先回りして動きます。結果が良くても期待に届かなければ、売りが増えて下がることがあります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本取引所グループ「売買成立の方法」 \u003ca href=\"https://www.jpx.co.jp/equities/trading/domestic/04.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jpx.co.jp/equities/trading/domestic/04.html\u003c/a>\u003c/li>\u003cli>J.M.ケインズ『雇用・利子および貨幣の一般理論』第12章（美人投票のたとえ）\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株価は毎日、ときには1分ごとに上下します。会社の中身はそんなに急に変わらないはずなのに、なぜ値段だけが動くのでしょうか。 株価は「この会社が将来どれだけ稼ぐか」という期待で決まります。短期では人々の気分や売り買いの量で大きくぶれますが、長い目で見ると会社の実際の利益に引き寄せられていきます。 値段は「売りたい人」と「買いたい人」で決まる 株は証券取引所で売買されています。取引所は、売りたい人と買いたい人を引き合わせる市場です。 買いたい人が多ければ値段は上がり、売りたい人が多ければ下がります。これを需給（需要と供給）といいます。つまり株価とは、その瞬間に「この値段なら取引してよい」と合意した価格にすぎません。 人はなぜその値段で買うのか 第20話で見たように、株を持つことは会社の持ち主の一人になることです。持ち主は、会社が稼いだ利益の分け前を受け取る権利を持ちます。ですから、買う人は「この会社は将来いくら稼ぎそうか」を考えて値段をつけます。 将来の利益が増えそうだと多くの人が思えば、今のうちに買おうとする人が増え、株価は上がります。 株価を動かすできごとの例 決算（会社の成績発表）が予想より良かった、または悪かった 新商品の成功や不祥事のニュース 金利の上げ下げや景気の見通し 為替（円高・円安）の変化 どれも「将来の利益の見込み」を変えるできごとだと言えます。 短期は気分、長期は利益 短期の株価は、期待や不安が行き過ぎて大きく上下します。理由がはっきりしない日の上げ下げも珍しくありません。 一方で、何年も利益を伸ばし続ける会社の株価は、長い目で見ると上がっていく傾向があります。逆に利益が減り続ける会社の株価は、いずれ下がりやすくなります。期待はいつまでも現実から離れてはいられず、最後は決算という「答え合わせ」で修正されるからです。 なぜ「今の利益」ではなく「将来の期待」で動くのでしょうか。それは、株を買った人が受け取れるのが、これから先に会社が稼ぐお金だからです。過去の利益はすでに過ぎたことで、買った人のものにはなりません。 さらに、期待は情報が届くたびに一斉に書き換わります。良いニュースが出た瞬間に多くの人が同時に考えを改めるので、株価は会社の中身よりずっと速く動きます。 加えて、他人がどう考えるかを先読みして売買する人もいます。経済学者ケインズは、これを「自分が美人だと思う人ではなく、みんなが選びそうな人に投票する美人投票」にたとえました。この先読み合戦が、短期の値動きを実態以上に大きくします。 20万円のうち2万円で、ある会社の株を買ったとします（例）。翌日に悪いニュースが出て株価が10%下がると、評価額は2万円 × 0.9 = 1万8,000円です。 しかし会社の利益が数年かけて伸びれば、株価も戻ってくる可能性があります。逆に業績が回復しなければ、戻らないこともあります。毎日の値動きに一喜一憂するより、「この会社の利益は今後どうなりそうか」を見るほうが、株価の動きを理解する近道です。 「利益が良かったのに株価が下がった」ということもよく起こります。みんなの期待がそれ以上に高かった場合、結果が良くても「期待ほどではない」と受け取られるためです。株価は良し悪しではなく、期待とのずれに反応します。 株価は売りたい人と買いたい人の合意で決まる 人々は会社の「将来の利益」を予想して値段をつける 短期は期待や不安でぶれやすく、長期は実際の利益に近づきやすい 決算で過去最高の利益を発表したのに、株価が下がりました。考えられる理由として最も適切なものはどれですか。 株価は会社の利益とまったく関係がないから 市場の期待がさらに高く、結果がそれを下回ったから 決算発表の日は必ず株価が下がる決まりがあるから 株価は期待をもとに先回りして動きます。結果が良くても期待に届かなければ、売りが増えて下がることがあります。"},{"no":22,"part":4,"title":"配当と株主優待","subtitle":"会社が利益を株主に返す方法","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株を持っているだけでお金がもらえる「配当」があると聞きました。もらえるなら得なはずなのに、配当を出さない会社があるのはなぜでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>配当は、会社の利益の一部を現金で株主に返すしくみです。ただし配当を出すと会社の手元のお金が減り、その分だけ株価も下がりやすくなります。配当は「おまけ」ではなく、自分の持ち分の一部を現金で受け取っていると考えるのが正確です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>配当とは何か\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"配当\">配当\u003c/span>は、会社が稼いだ利益の一部を、持っている株数に応じて株主に配るお金です。たとえば1株あたり年50円の配当なら、100株持っている人は年5,000円を受け取ります（税金を引く前）。\u003c/p>\n\u003cp>株価に対する1年分の配当の割合を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"配当利回り\">配当利回り\u003c/span>といいます。株価2,000円で配当50円なら、50 ÷ 2,000 = 2.5%です。\u003c/p>\n\u003ch2>利益の使い道は2つある\u003c/h2>\n\u003cp>会社は稼いだ利益を、大きく2つの方法で使います。\u003c/p>\n\u003col>\u003cli>株主に返す（配当や、自社の株を買い戻す自社株買い）\u003c/li>\u003cli>会社の中に残して、新しい工場や研究開発に使う\u003c/li>\u003c/ol>\n\u003cp>成長の機会が多い若い会社は、2を選ぶことがよくあります。配当を出さない会社も、株主を軽く見ているわけではありません。\u003c/p>\n\u003ch2>株主優待とは\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"株主優待\">株主優待\u003c/span>は、株主に自社の商品券や割引券などを贈る、日本で広く見られるしくみです。個人の株主を増やし、長く持ってもらうことが主な目的とされています。一方で、株主の間で公平でないなどの理由から、優待をやめて配当に切り替える会社も出ています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>配当の話に戻りましょう。なぜ配当をもらっても「得」とは言い切れないのでしょうか。\u003c/p>\n\u003cp>会社の価値の一部は、会社が持っている現金です。配当を払うと、その現金が会社から株主へ移ります。会社の価値がその分だけ減るので、理屈の上では株価も配当の分だけ下がります。実際に、配当を受け取る権利が確定した直後は、株価が下がりやすい傾向があります（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"権利落ち\">権利落ち\u003c/span>）。\u003c/p>\n\u003cp>つまり配当は、ポケットの右から左へお金を移すのに近い面があります。さらに日本では配当に税金がかかるため、受け取るたびに一部が差し引かれます。\u003c/p>\n\u003cp>大切なのは配当の多さではなく、会社が利益を「株主にとって最も価値が高い使い方」に回しているかどうかです。高い利益率で再投資できる会社なら、配当を出さずに成長してもらうほうが株主の得になることもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち10万円で、配当利回り3%の株を買ったとします（例）。1年の配当は10万円 × 3% = 3,000円です。ここから約20%の税金が引かれ、手取りは約2,390円になります（税金のしくみは第29話で扱います）。\u003c/p>\n\u003cp>ただし、株価が10%下がれば評価額は1万円減ります。配当の3,000円だけを見て「確実に増える」と考えるのは危険です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>配当は業績が悪くなると減ったり、なくなったりすることがあります（減配・無配）。\u003c/li>\u003cli>配当利回りが極端に高い株は、株価が大きく下がった結果である場合があります。\u003c/li>\u003cli>優待の内容は会社の判断で変更・廃止されることがあります。\u003c/li>\u003cli>NISAで配当を非課税にするには、証券口座で配当を受け取る方式（株式数比例配分方式）を選ぶ必要があります。詳しくは第32話で扱います。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>配当は会社の利益の一部を現金で株主に返すしくみ\u003c/li>\u003cli>配当を出すと会社の現金が減り、株価もその分下がりやすい\u003c/li>\u003cli>配当や優待の多さより、会社が利益を上手に使っているかが大切\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>配当について正しい説明はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">配当は会社の価値とは関係なく、もらえる分だけ必ず得をする\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">配当を払うと会社の現金が減るため、株価はその分下がりやすい\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">配当を出さない会社は株主を大切にしていない会社である\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>配当は会社の現金が株主に移るものです。会社の価値が減る分、株価も下がりやすくなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁「No.1331 上場株式等の配当等に係る申告分離課税制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm\u003c/a>\u003c/li>\u003cli>金融庁「NISAを知る」（配当金の受取方法） \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株を持っているだけでお金がもらえる「配当」があると聞きました。もらえるなら得なはずなのに、配当を出さない会社があるのはなぜでしょうか。 配当は、会社の利益の一部を現金で株主に返すしくみです。ただし配当を出すと会社の手元のお金が減り、その分だけ株価も下がりやすくなります。配当は「おまけ」ではなく、自分の持ち分の一部を現金で受け取っていると考えるのが正確です。 配当とは何か 配当は、会社が稼いだ利益の一部を、持っている株数に応じて株主に配るお金です。たとえば1株あたり年50円の配当なら、100株持っている人は年5,000円を受け取ります（税金を引く前）。 株価に対する1年分の配当の割合を配当利回りといいます。株価2,000円で配当50円なら、50 ÷ 2,000 = 2.5%です。 利益の使い道は2つある 会社は稼いだ利益を、大きく2つの方法で使います。 株主に返す（配当や、自社の株を買い戻す自社株買い） 会社の中に残して、新しい工場や研究開発に使う 成長の機会が多い若い会社は、2を選ぶことがよくあります。配当を出さない会社も、株主を軽く見ているわけではありません。 株主優待とは 株主優待は、株主に自社の商品券や割引券などを贈る、日本で広く見られるしくみです。個人の株主を増やし、長く持ってもらうことが主な目的とされています。一方で、株主の間で公平でないなどの理由から、優待をやめて配当に切り替える会社も出ています。 配当の話に戻りましょう。なぜ配当をもらっても「得」とは言い切れないのでしょうか。 会社の価値の一部は、会社が持っている現金です。配当を払うと、その現金が会社から株主へ移ります。会社の価値がその分だけ減るので、理屈の上では株価も配当の分だけ下がります。実際に、配当を受け取る権利が確定した直後は、株価が下がりやすい傾向があります（権利落ち）。 つまり配当は、ポケットの右から左へお金を移すのに近い面があります。さらに日本では配当に税金がかかるため、受け取るたびに一部が差し引かれます。 大切なのは配当の多さではなく、会社が利益を「株主にとって最も価値が高い使い方」に回しているかどうかです。高い利益率で再投資できる会社なら、配当を出さずに成長してもらうほうが株主の得になることもあります。 20万円のうち10万円で、配当利回り3%の株を買ったとします（例）。1年の配当は10万円 × 3% = 3,000円です。ここから約20%の税金が引かれ、手取りは約2,390円になります（税金のしくみは第29話で扱います）。 ただし、株価が10%下がれば評価額は1万円減ります。配当の3,000円だけを見て「確実に増える」と考えるのは危険です。 配当は業績が悪くなると減ったり、なくなったりすることがあります（減配・無配）。 配当利回りが極端に高い株は、株価が大きく下がった結果である場合があります。 優待の内容は会社の判断で変更・廃止されることがあります。 NISAで配当を非課税にするには、証券口座で配当を受け取る方式（株式数比例配分方式）を選ぶ必要があります。詳しくは第32話で扱います。 配当は会社の利益の一部を現金で株主に返すしくみ 配当を出すと会社の現金が減り、株価もその分下がりやすい 配当や優待の多さより、会社が利益を上手に使っているかが大切 配当について正しい説明はどれですか。 配当は会社の価値とは関係なく、もらえる分だけ必ず得をする 配当を払うと会社の現金が減るため、株価はその分下がりやすい 配当を出さない会社は株主を大切にしていない会社である 配当は会社の現金が株主に移るものです。会社の価値が減る分、株価も下がりやすくなります。"},{"no":23,"part":4,"title":"債券とは何か","subtitle":"お金を「貸す」投資と、金利が上がると値下がりする理由","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>債券は「安全な投資」と聞きます。でも、金利が上がると債券の値段が下がるとも聞きました。お金を貸しているだけなのに、なぜ値段が変わるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>債券は、国や会社にお金を貸して、決まった利息と元本を受け取る約束の証書です。満期まで持てば約束どおりの金額が戻るのが原則ですが、途中で売る場合は、そのときの金利と比べて値段が決まるため上下します。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>債券は「借用証書」\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"債券\">債券\u003c/span>は、国や会社がお金を借りるときに発行する証書です。国が出すものを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"国債\">国債\u003c/span>、会社が出すものを社債といいます。買った人は、決められた日に利息（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"利率\">利率\u003c/span>）を受け取り、満期の日に貸したお金（元本）を返してもらいます。\u003c/p>\n\u003cp>株は会社の持ち主になる投資でした（第20話）。債券はそれに対して、お金を貸す投資です。\u003c/p>\n\u003ch2>株とのちがい\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>株式\u003c/th>\u003cth>債券\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>立場\u003c/td>\u003ctd>持ち主\u003c/td>\u003ctd>貸し手\u003c/td>\u003c/tr>\u003ctr>\u003ctd>受け取るもの\u003c/td>\u003ctd>利益に応じて変わる\u003c/td>\u003ctd>原則あらかじめ決まっている\u003c/td>\u003c/tr>\u003ctr>\u003ctd>値動き\u003c/td>\u003ctd>大きい\u003c/td>\u003ctd>比較的小さい\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>持ち主は会社が大きく成長すれば大きく得をしますが、貸し手が受け取るのは約束の利息までです。その代わり、会社が苦しくなっても貸し手は持ち主より先に返済を受けられます。\u003c/p>\n\u003ch2>債券のリスク\u003c/h2>\n\u003cp>債券にもリスクがあります。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"信用リスク\">信用リスク\u003c/span>\u003c/strong>: 借りた側がお金を返せなくなるリスク。返せない心配が大きい相手ほど、高い利率を払わないとお金を借りられません。\u003c/li>\u003cli>\u003cstrong>金利リスク\u003c/strong>: 世の中の金利が上がり、途中で売るときに値下がりしているリスク（理由は次で説明します）。\u003c/li>\u003cli>\u003cstrong>インフレのリスク\u003c/strong>: 受け取る金額が固定なので、物価が上がると実質的な価値が目減りします（第6話）。\u003c/li>\u003c/ul>\n\u003cp>利率が高い債券は、それだけ返してもらえない心配が大きいという意味でもあります（第15話）。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ金利が上がると、手元の債券の値段は下がるのでしょうか。たとえば、利率1%の債券を持っているとします。その後、世の中の金利が上がり、新しく出る債券の利率が2%になりました。\u003c/p>\n\u003cp>このとき、わざわざ1%の古い債券を同じ値段で買う人はいません。2%の新しい債券を買えば済むからです。古い債券を売るには、値段を下げて「安く買えるぶん、合計では2%と同じくらい得になる」水準まで調整するしかありません。\u003c/p>\n\u003cp>逆に金利が下がれば、高い利率の古い債券は人気が出て値上がりします。債券の値段と金利がシーソーのように逆に動くのは、新しい債券との「比べっこ」で値段が決まるからです。満期が先の債券ほど、低い利率に縛られる期間が長いので、値下がりの幅も大きくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>日本の個人向け国債（例）は、1万円から買えます。たとえば「変動10年」は、半年ごとに利率が見直され、最低でも年0.05%が保証されています。発行から1年たてば、国に買い取ってもらう形で途中換金もできます。その際は、直前2回分の利息に相当する金額（税引後）が差し引かれます。逆に、最初の1年は原則として換金できません。\u003c/p>\n\u003cp>なお財務省は、2026年12月募集分から名称を「個人向け国債プラス」に変える予定です。法人なども買えるようになるための変更で、商品の中身は変わらないとされています（2026年10月時点）。\u003c/p>\n\u003cp>1年以上使う予定のないお金なら、元本割れしにくい置き場所の候補の一つになります。急に使うかもしれない生活防衛資金（第8話）を置くなら、最初の1年は換金できない点に注意が必要です。増やす力が株式より小さいことも理解しておきましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「債券は元本保証」ではありません。発行した国や会社が返せなくなれば損をします。また外国の債券は、為替の動きで円に換えたときの金額が変わります（第41話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/
