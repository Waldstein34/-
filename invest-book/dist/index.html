span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>債券はお金を貸して、利息と元本を受け取る約束の証書\u003c/li>\u003cli>金利が上がると、手元の債券の値段は下がる（新しい債券との比べっこ）\u003c/li>\u003cli>高い利率は、返してもらえない心配の裏返しでもある\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>利率1%の債券を持っています。世の中の金利が上がり、新しい債券の利率が3%になりました。持っている債券の値段はどうなりやすいですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">上がる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">下がる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">満期まで変わらない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>3%の新しい債券があるのに、1%の債券を同じ値段で買う人はいません。値段を下げないと売れなくなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>財務省「『変動10年』商品概要」 \u003ca href=\"https://www.mof.go.jp/jgbs/individual/kojinmuke/main/outline/hendou/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/jgbs/individual/kojinmuke/main/outline/hendou/\u003c/a>\u003c/li>\u003cli>財務省「個人向け国債」 \u003ca href=\"https://www.mof.go.jp/jgbs/individual/kojinmuke/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/jgbs/individual/kojinmuke/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"債券は「安全な投資」と聞きます。でも、金利が上がると債券の値段が下がるとも聞きました。お金を貸しているだけなのに、なぜ値段が変わるのでしょうか。 債券は、国や会社にお金を貸して、決まった利息と元本を受け取る約束の証書です。満期まで持てば約束どおりの金額が戻るのが原則ですが、途中で売る場合は、そのときの金利と比べて値段が決まるため上下します。 債券は「借用証書」 債券は、国や会社がお金を借りるときに発行する証書です。国が出すものを国債、会社が出すものを社債といいます。買った人は、決められた日に利息（利率）を受け取り、満期の日に貸したお金（元本）を返してもらいます。 株は会社の持ち主になる投資でした（第20話）。債券はそれに対して、お金を貸す投資です。 株とのちがい 株式 債券 立場 持ち主 貸し手 受け取るもの 利益に応じて変わる 原則あらかじめ決まっている 値動き 大きい 比較的小さい 持ち主は会社が大きく成長すれば大きく得をしますが、貸し手が受け取るのは約束の利息までです。その代わり、会社が苦しくなっても貸し手は持ち主より先に返済を受けられます。 債券のリスク 債券にもリスクがあります。 信用リスク: 借りた側がお金を返せなくなるリスク。返せない心配が大きい相手ほど、高い利率を払わないとお金を借りられません。 金利リスク: 世の中の金利が上がり、途中で売るときに値下がりしているリスク（理由は次で説明します）。 インフレのリスク: 受け取る金額が固定なので、物価が上がると実質的な価値が目減りします（第6話）。 利率が高い債券は、それだけ返してもらえない心配が大きいという意味でもあります（第15話）。 なぜ金利が上がると、手元の債券の値段は下がるのでしょうか。たとえば、利率1%の債券を持っているとします。その後、世の中の金利が上がり、新しく出る債券の利率が2%になりました。 このとき、わざわざ1%の古い債券を同じ値段で買う人はいません。2%の新しい債券を買えば済むからです。古い債券を売るには、値段を下げて「安く買えるぶん、合計では2%と同じくらい得になる」水準まで調整するしかありません。 逆に金利が下がれば、高い利率の古い債券は人気が出て値上がりします。債券の値段と金利がシーソーのように逆に動くのは、新しい債券との「比べっこ」で値段が決まるからです。満期が先の債券ほど、低い利率に縛られる期間が長いので、値下がりの幅も大きくなります。 日本の個人向け国債（例）は、1万円から買えます。たとえば「変動10年」は、半年ごとに利率が見直され、最低でも年0.05%が保証されています。発行から1年たてば、国に買い取ってもらう形で途中換金もできます。その際は、直前2回分の利息に相当する金額（税引後）が差し引かれます。逆に、最初の1年は原則として換金できません。 なお財務省は、2026年12月募集分から名称を「個人向け国債プラス」に変える予定です。法人なども買えるようになるための変更で、商品の中身は変わらないとされています（2026年10月時点）。 1年以上使う予定のないお金なら、元本割れしにくい置き場所の候補の一つになります。急に使うかもしれない生活防衛資金（第8話）を置くなら、最初の1年は換金できない点に注意が必要です。増やす力が株式より小さいことも理解しておきましょう。 「債券は元本保証」ではありません。発行した国や会社が返せなくなれば損をします。また外国の債券は、為替の動きで円に換えたときの金額が変わります（第41話）。 債券はお金を貸して、利息と元本を受け取る約束の証書 金利が上がると、手元の債券の値段は下がる（新しい債券との比べっこ） 高い利率は、返してもらえない心配の裏返しでもある 利率1%の債券を持っています。世の中の金利が上がり、新しい債券の利率が3%になりました。持っている債券の値段はどうなりやすいですか。 上がる 下がる 満期まで変わらない 3%の新しい債券があるのに、1%の債券を同じ値段で買う人はいません。値段を下げないと売れなくなります。"},{"no":24,"part":4,"title":"投資信託とは何か","subtitle":"みんなでお金を出し合うしくみと、それが安全に回る理由","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資信託は「プロに運用を任せる商品」だと聞きました。でも、預けた先の会社がつぶれたら、自分のお金はどうなるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資信託は、たくさんの人のお金を一つにまとめ、専門家が多くの株や債券に分けて投資する商品です。お金を集める会社、運用する会社、保管する会社は別々です。そのため、どこかの会社が破綻しても、投資したお金は原則として守られる設計になっています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>少額でもたくさんの会社に投資できる\u003c/h2>\n\u003cp>日本の株は、多くの場合100株単位で売買します。株価3,000円の会社なら、1社買うだけで30万円が必要です。20万円では1社も買えないことがあり、ましてや何十社にも分けるのは困難です。\u003c/p>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"投資信託\">投資信託\u003c/span>（投信）は、大勢から集めたお金をまとめて大きな資金にし、それを数百〜数千の会社に分けて投資します。一人ひとりは、その大きな袋の「一部」を持つ形になります。金融機関によっては100円から買えるため、少額でも\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"分散投資\">分散投資\u003c/span>（第16話）ができます。\u003c/p>\n\u003ch2>3つの会社が役割を分担している\u003c/h2>\n\u003cp>投資信託には、主に3つの会社がかかわります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>役割\u003c/th>\u003cth>会社の種類\u003c/th>\u003cth>していること\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>売る\u003c/td>\u003ctd>販売会社（証券会社・銀行）\u003c/td>\u003ctd>窓口になり、お金を受け付ける\u003c/td>\u003c/tr>\u003ctr>\u003ctd>運用する\u003c/td>\u003ctd>運用会社\u003c/td>\u003ctd>何を買うかを決めて指示する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保管する\u003c/td>\u003ctd>信託銀行\u003c/td>\u003ctd>実際に株や債券を保管する\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>投資信託の値段は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"基準価額\">基準価額\u003c/span>といい、通常1日に1回計算されます。袋の中身の合計を口数で割った値段で、多くは1万口あたりの金額で示されます（第48話）。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、わざわざ3つの会社に分けているのでしょうか。それは「お金を動かせる人」と「お金を持っている人」を別にするためです。運用会社は何を買うかを指示できますが、お金そのものは手元にありません。お金と株は信託銀行が、銀行自身の財産とは分けて保管しています（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"分別管理\">分別管理\u003c/span>）。\u003c/p>\n\u003cp>もし運用会社が自由にお金を引き出せたら、経営が苦しいときに流用される心配があります。役割を分けておけば、一社が不正をしたり破綻したりしても、残りの会社がそれを止めたり、財産を守ったりできます。\u003c/p>\n\u003cp>つまり「誰か一人を信じる」のではなく、「誰か一人が裏切っても大丈夫な形」を制度として作っているのです。会社がつぶれても投資信託の財産が守られやすいのは、この設計のおかげです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち毎月5,000円を、全世界の株に投資する投資信託（例）で積み立てたとします。1年で5,000円 × 12か月 = 6万円になります。この6万円で、世界中の数千社に少しずつ投資したことになります。\u003c/p>\n\u003cp>個別株で同じことをしようとすると、少なくとも数千万円の資金が必要になります。少額で広く分散できることが、投資信託の一番の価値です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>投資信託は預金ではないため、元本は保証されていません。中身の株が下がれば、基準価額も下がります。\u003c/li>\u003cli>「破綻しても守られる」のは、会社の倒産から財産を切り離す話です。値下がりの損失を補ってくれるわけではありません。\u003c/li>\u003cli>投資信託には手数料がかかります。手数料の影響は第27話で詳しく扱います。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>投資信託は、大勢のお金をまとめてプロが分散投資する商品\u003c/li>\u003cli>販売・運用・保管を別の会社が担い、財産は分けて保管されている\u003c/li>\u003cli>少額で広く分散できるのが最大の利点だが、元本保証はない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>投資信託の財産を実際に保管しているのはどこですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">販売会社（証券会社など）\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">運用会社\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">信託銀行\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>財産は信託銀行が自社の財産と分けて保管しています。そのため販売会社や運用会社が破綻しても、財産は守られる設計です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>投資信託協会「投資信託の安全性」 \u003ca href=\"https://www.toushin.or.jp/investmenttrust/meritrisk/safety/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.toushin.or.jp/investmenttrust/meritrisk/safety/index.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAを知る」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"投資信託は「プロに運用を任せる商品」だと聞きました。でも、預けた先の会社がつぶれたら、自分のお金はどうなるのでしょうか。 投資信託は、たくさんの人のお金を一つにまとめ、専門家が多くの株や債券に分けて投資する商品です。お金を集める会社、運用する会社、保管する会社は別々です。そのため、どこかの会社が破綻しても、投資したお金は原則として守られる設計になっています。 少額でもたくさんの会社に投資できる 日本の株は、多くの場合100株単位で売買します。株価3,000円の会社なら、1社買うだけで30万円が必要です。20万円では1社も買えないことがあり、ましてや何十社にも分けるのは困難です。 投資信託（投信）は、大勢から集めたお金をまとめて大きな資金にし、それを数百〜数千の会社に分けて投資します。一人ひとりは、その大きな袋の「一部」を持つ形になります。金融機関によっては100円から買えるため、少額でも分散投資（第16話）ができます。 3つの会社が役割を分担している 投資信託には、主に3つの会社がかかわります。 役割 会社の種類 していること 売る 販売会社（証券会社・銀行） 窓口になり、お金を受け付ける 運用する 運用会社 何を買うかを決めて指示する 保管する 信託銀行 実際に株や債券を保管する 投資信託の値段は基準価額といい、通常1日に1回計算されます。袋の中身の合計を口数で割った値段で、多くは1万口あたりの金額で示されます（第48話）。 なぜ、わざわざ3つの会社に分けているのでしょうか。それは「お金を動かせる人」と「お金を持っている人」を別にするためです。運用会社は何を買うかを指示できますが、お金そのものは手元にありません。お金と株は信託銀行が、銀行自身の財産とは分けて保管しています（分別管理）。 もし運用会社が自由にお金を引き出せたら、経営が苦しいときに流用される心配があります。役割を分けておけば、一社が不正をしたり破綻したりしても、残りの会社がそれを止めたり、財産を守ったりできます。 つまり「誰か一人を信じる」のではなく、「誰か一人が裏切っても大丈夫な形」を制度として作っているのです。会社がつぶれても投資信託の財産が守られやすいのは、この設計のおかげです。 20万円のうち毎月5,000円を、全世界の株に投資する投資信託（例）で積み立てたとします。1年で5,000円 × 12か月 = 6万円になります。この6万円で、世界中の数千社に少しずつ投資したことになります。 個別株で同じことをしようとすると、少なくとも数千万円の資金が必要になります。少額で広く分散できることが、投資信託の一番の価値です。 投資信託は預金ではないため、元本は保証されていません。中身の株が下がれば、基準価額も下がります。 「破綻しても守られる」のは、会社の倒産から財産を切り離す話です。値下がりの損失を補ってくれるわけではありません。 投資信託には手数料がかかります。手数料の影響は第27話で詳しく扱います。 投資信託は、大勢のお金をまとめてプロが分散投資する商品 販売・運用・保管を別の会社が担い、財産は分けて保管されている 少額で広く分散できるのが最大の利点だが、元本保証はない 投資信託の財産を実際に保管しているのはどこですか。 販売会社（証券会社など） 運用会社 信託銀行 財産は信託銀行が自社の財産と分けて保管しています。そのため販売会社や運用会社が破綻しても、財産は守られる設計です。"},{"no":25,"part":4,"title":"インデックスとアクティブ","subtitle":"なぜ「平均」に乗るだけの運用が、プロの多数に勝つのか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>プロが銘柄を選ぶアクティブファンドより、インデックスファンドのほうが成績が良いことが多いと聞きました。インデックスファンドは、市場の平均に連動するだけの商品です。プロが本気で選んでいるのに、なぜ「平均」に負けるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>市場全体の成績は、参加者全員の成績を平均したものです。手数料を払う前の時点で、プロ全体の平均は市場の平均とほぼ同じになります。そこからアクティブファンドは高い手数料を引かれるため、手数料の安いインデックスファンドに、平均すると負けやすくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>2つの運用スタイル\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"インデックスファンド\">インデックスファンド\u003c/span>は、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"指数\">指数\u003c/span>（市場の平均を表す数字）と同じ動きを目指す投資信託です。日経平均株価や全世界の株価指数などが例です。指数に含まれる会社を、ほぼそのまま買います。\u003c/p>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"アクティブファンド\">アクティブファンド\u003c/span>は、運用の担当者が調査し、値上がりしそうな会社を選んで、指数を上回る成績を目指す投資信託です。調査に人手がかかるため、アクティブファンドの手数料はインデックスファンドより高いことが一般的です。\u003c/p>\n\u003ch2>実際の成績\u003c/h2>\n\u003cp>株価指数を算出するS&amp;Pダウ・ジョーンズ・インデックスは、SPIVAという調査を毎年公表しています。ファンドと指数の成績を比べる調査です。\u003c/p>\n\u003cp>2025年末時点の日本版の調査を見てみます。国内大型株のアクティブファンドのうち、10年や15年の期間で指数（S&amp;P/TOPIX 150）に負けた割合は80%を超えていました。2025年の1年だけを見ると負けた割合は約49%で、短い期間なら勝つファンドも多くあります。期間が長くなるほど、勝ち続けるのが難しくなることがわかります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「平均」が強いのか、算数で考えてみましょう。市場にある株は、発行されている限り、どれも誰かが持っています。だから参加者全員の成績を、持っている金額で重みをつけて平均すると、市場全体の成績そのものになります。ある人が平均より得をしたら、その裏で誰かが平均より損をしています。\u003c/p>\n\u003cp>参加者を「インデックス派」と「アクティブ派」に分けてみます。インデックス派は市場をそのまま持つので、成績は市場の平均です。全体も市場の平均なので、残りのアクティブ派全体も、手数料を引く前は市場の平均になるはずです。そこから毎年の手数料と売買のコストを差し引くと、アクティブ派の平均は市場を下回ります。\u003c/p>\n\u003cp>一方、インデックスファンドは市場の平均を、ごく安い手数料で手に入れます。つまり「平均マイナス小さなコスト」と「平均マイナス大きなコスト」の比べっこになり、平均すれば後者が負けるのです。これはノーベル経済学賞を受けたシャープが示した考え方で、運用の腕前とは関係なく成り立ちます。\u003c/p>\n\u003cp>さらに、優秀な人が大勢で調べている市場では、割安な株はすぐに見つかって買われてしまいます。見つけた人の利益は小さく、続きにくくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を、手数料が年0.1%のインデックスファンドと、年1.5%のアクティブファンドに投資したとします（例）。手数料の差は年に20万円 × 1.4% = 2,800円です。アクティブファンドは、毎年この差以上に市場を上回り続けないと追いつけません。\u003c/p>\n\u003cp>1年なら小さく見えますが、長く続けるほど差は大きくなります（第27話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>これは「アクティブファンドはすべてだめ」という意味ではありません。指数を上回るファンドもあります。ただ、どれが将来勝つかを前もって見分けるのが難しいのです。\u003c/li>\u003cli>インデックスファンドも、市場全体が下がれば一緒に下がります。損をしない商品ではありません。\u003c/li>\u003cli>過去に成績が良かったファンドが、今後も良いとは限りません。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>手数料を引く前、プロ全体の平均は市場の平均に近くなる\u003c/li>\u003cli>手数料が高いぶん、アクティブファンドは平均すると指数に負けやすい\u003c/li>\u003cli>長い期間ほど、指数に勝ち続けるファンドは少なくなる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>インデックスファンドが、アクティブファンドの多くに長期で勝ちやすい根本的な理由はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">インデックスファンドの運用者のほうが優秀だから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">全員の平均は市場の平均になり、そこから手数料の差が効いてくるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">インデックスファンドは値下がりしないから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>参加者全体の平均は市場そのものです。そこから引かれるコストが小さいほうが、平均すると有利になります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>S&amp;P Dow Jones Indices「SPIVA Japan Year-End 2025」 \u003ca href=\"https://www.spglobal.com/spdji/en/spiva/article/spiva-japan-year-end-2025/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.spglobal.com/spdji/en/spiva/article/spiva-japan-year-end-2025/\u003c/a>\u003c/li>\u003cli>William F. Sharpe「The Arithmetic of Active Management」（Financial Analysts Journal, 1991年）\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"プロが銘柄を選ぶアクティブファンドより、インデックスファンドのほうが成績が良いことが多いと聞きました。インデックスファンドは、市場の平均に連動するだけの商品です。プロが本気で選んでいるのに、なぜ「平均」に負けるのでしょうか。 市場全体の成績は、参加者全員の成績を平均したものです。手数料を払う前の時点で、プロ全体の平均は市場の平均とほぼ同じになります。そこからアクティブファンドは高い手数料を引かれるため、手数料の安いインデックスファンドに、平均すると負けやすくなります。 2つの運用スタイル インデックスファンドは、指数（市場の平均を表す数字）と同じ動きを目指す投資信託です。日経平均株価や全世界の株価指数などが例です。指数に含まれる会社を、ほぼそのまま買います。 アクティブファンドは、運用の担当者が調査し、値上がりしそうな会社を選んで、指数を上回る成績を目指す投資信託です。調査に人手がかかるため、アクティブファンドの手数料はインデックスファンドより高いことが一般的です。 実際の成績 株価指数を算出するS&Pダウ・ジョーンズ・インデックスは、SPIVAという調査を毎年公表しています。ファンドと指数の成績を比べる調査です。 2025年末時点の日本版の調査を見てみます。国内大型株のアクティブファンドのうち、10年や15年の期間で指数（S&P/TOPIX 150）に負けた割合は80%を超えていました。2025年の1年だけを見ると負けた割合は約49%で、短い期間なら勝つファンドも多くあります。期間が長くなるほど、勝ち続けるのが難しくなることがわかります。 なぜ「平均」が強いのか、算数で考えてみましょう。市場にある株は、発行されている限り、どれも誰かが持っています。だから参加者全員の成績を、持っている金額で重みをつけて平均すると、市場全体の成績そのものになります。ある人が平均より得をしたら、その裏で誰かが平均より損をしています。 参加者を「インデックス派」と「アクティブ派」に分けてみます。インデックス派は市場をそのまま持つので、成績は市場の平均です。全体も市場の平均なので、残りのアクティブ派全体も、手数料を引く前は市場の平均になるはずです。そこから毎年の手数料と売買のコストを差し引くと、アクティブ派の平均は市場を下回ります。 一方、インデックスファンドは市場の平均を、ごく安い手数料で手に入れます。つまり「平均マイナス小さなコスト」と「平均マイナス大きなコスト」の比べっこになり、平均すれば後者が負けるのです。これはノーベル経済学賞を受けたシャープが示した考え方で、運用の腕前とは関係なく成り立ちます。 さらに、優秀な人が大勢で調べている市場では、割安な株はすぐに見つかって買われてしまいます。見つけた人の利益は小さく、続きにくくなります。 20万円を、手数料が年0.1%のインデックスファンドと、年1.5%のアクティブファンドに投資したとします（例）。手数料の差は年に20万円 × 1.4% = 2,800円です。アクティブファンドは、毎年この差以上に市場を上回り続けないと追いつけません。 1年なら小さく見えますが、長く続けるほど差は大きくなります（第27話）。 これは「アクティブファンドはすべてだめ」という意味ではありません。指数を上回るファンドもあります。ただ、どれが将来勝つかを前もって見分けるのが難しいのです。 インデックスファンドも、市場全体が下がれば一緒に下がります。損をしない商品ではありません。 過去に成績が良かったファンドが、今後も良いとは限りません。 手数料を引く前、プロ全体の平均は市場の平均に近くなる 手数料が高いぶん、アクティブファンドは平均すると指数に負けやすい 長い期間ほど、指数に勝ち続けるファンドは少なくなる インデックスファンドが、アクティブファンドの多くに長期で勝ちやすい根本的な理由はどれですか。 インデックスファンドの運用者のほうが優秀だから 全員の平均は市場の平均になり、そこから手数料の差が効いてくるから インデックスファンドは値下がりしないから 参加者全体の平均は市場そのものです。そこから引かれるコストが小さいほうが、平均すると有利になります。"},{"no":26,"part":4,"title":"ETFとは何か","subtitle":"投資信託との違いと、なぜ市場価格が中身とずれないのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>ETFは「上場している投資信託」だと聞きました。普通の投資信託と中身が似ているなら、なぜ2種類あるのでしょうか。どちらを選べばよいのかもわかりません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>ETFは、株と同じように証券取引所で売買できる投資信託です。中身の考え方は投資信託と同じですが、買い方、値段の決まり方、積立のしやすさが違います。長期の少額積立が目的なら、普通の投資信託のほうが手間が少ない場合が多いです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>ETFは取引所で売買する投資信託\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ETF\">ETF\u003c/span>（上場投資信託）は、証券取引所に上場している投資信託です。多くは指数に連動するインデックス型です。普通の投資信託は、1日に1回決まる\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"基準価額\">基準価額\u003c/span>で、証券会社などを通じて買います（第24話）。注文した時点では、いくらで買えるかはわかりません。ETFは株と同じく、取引所が開いている間、刻々と変わる市場価格で売買できます。\u003c/p>\n\u003ch2>主な違い\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>投資信託\u003c/th>\u003cth>ETF\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>値段\u003c/td>\u003ctd>1日1回の基準価額\u003c/td>\u003ctd>取引時間中に動く市場価格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>買う単位\u003c/td>\u003ctd>金額指定（100円などから）\u003c/td>\u003ctd>決められた口数単位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自動積立\u003c/td>\u003ctd>しやすい\u003c/td>\u003ctd>金融機関による\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>ETFは手数料（信託報酬）が低めのものが多くあります。一方で、売買のたびに\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"スプレッド\">スプレッド\u003c/span>（買値と売値の差）などのコストがかかることがあります。また、分配金を自動で再投資するしくみがない場合が多く、受け取るたびに自分で買い直す必要があります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>ETFの市場価格は、売りたい人と買いたい人で決まります（第21話）。それなら、中身の価値とかけ離れた値段がつかないのはなぜでしょうか。秘密は「指定参加者」と呼ばれる証券会社などの存在です。市場価格が中身より高くなると、指定参加者は中身の株をまとめて渡して新しいETFを作り、それを市場で高く売ります。差額が利益になるので、売りが増えて市場価格は下がります。逆に市場価格が中身より安くなると、安いETFを買って中身の株と交換し、その株を売ります。今度は買いが増えて市場価格が上がります。このように「ずれたら得をする人」が常にいるので、ずれは小さく保たれやすいのです。ただし、取引が少ないETFや、市場が大きく混乱したときは、ずれが広がることもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円で毎月1万円ずつ積み立てたい場合を考えます（例）。投資信託なら「毎月1万円」と金額で設定すれば、自動で買い付けが続きます。ETFは口数単位で買います。売買単位が1口で、1口の値段が3,500円なら2口で7,000円、3口で1万500円です。ぴったり1万円にはなりません。NISAのつみたて投資枠で選べるETFは限られています。金融機関の対応も含めて第31話・第40話で確認しましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>ETFも元本保証ではなく、中身の値動きで損をすることがあります。\u003c/li>\u003cli>取引量の少ないETFは、思った値段で売買できないことがあります。\u003c/li>\u003cli>名前が似ていても、連動する指数や手数料はETFごとに違います。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>ETFは取引所で、株と同じように売買できる投資信託\u003c/li>\u003cli>指定参加者のしくみで、市場価格と中身の価値のずれは小さく保たれやすい\u003c/li>\u003cli>少額の自動積立なら、普通の投資信託のほうが手間が少ない場合が多い\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>ETFの市場価格が中身の価値より大きく高くなったとき、ずれを小さくする働きとして正しいものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">取引所が値段を強制的に下げる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">指定参加者が新しくETFを作って市場で売るため、価格が下がる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">運用会社が中身の株を買い増すため、価格が上がる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>中身より高く売れるなら、ETFを新しく作って売る人が現れます。売りが増えることで、市場価格は中身の価値に近づきます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本取引所グループ「ETFの仕組み」 \u003ca href=\"https://www.jpx.co.jp/equities/products/etfs/etf-outline/02.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jpx.co.jp/equities/products/etfs/etf-outline/02.html\u003c/a>\u003c/li>\u003cli>日本取引所グループ「ETFデータベース（大口投資家の皆様へ）」 \u003ca href=\"https://www.jpx.co.jp/equities/products/etfs/investors/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jpx.co.jp/equities/products/etfs/investors/index.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAを知る」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"ETFは「上場している投資信託」だと聞きました。普通の投資信託と中身が似ているなら、なぜ2種類あるのでしょうか。どちらを選べばよいのかもわかりません。 ETFは、株と同じように証券取引所で売買できる投資信託です。中身の考え方は投資信託と同じですが、買い方、値段の決まり方、積立のしやすさが違います。長期の少額積立が目的なら、普通の投資信託のほうが手間が少ない場合が多いです。 ETFは取引所で売買する投資信託 ETF（上場投資信託）は、証券取引所に上場している投資信託です。多くは指数に連動するインデックス型です。普通の投資信託は、1日に1回決まる基準価額で、証券会社などを通じて買います（第24話）。注文した時点では、いくらで買えるかはわかりません。ETFは株と同じく、取引所が開いている間、刻々と変わる市場価格で売買できます。 主な違い 項目 投資信託 ETF 値段 1日1回の基準価額 取引時間中に動く市場価格 買う単位 金額指定（100円などから） 決められた口数単位 自動積立 しやすい 金融機関による ETFは手数料（信託報酬）が低めのものが多くあります。一方で、売買のたびにスプレッド（買値と売値の差）などのコストがかかることがあります。また、分配金を自動で再投資するしくみがない場合が多く、受け取るたびに自分で買い直す必要があります。 ETFの市場価格は、売りたい人と買いたい人で決まります（第21話）。それなら、中身の価値とかけ離れた値段がつかないのはなぜでしょうか。秘密は「指定参加者」と呼ばれる証券会社などの存在です。市場価格が中身より高くなると、指定参加者は中身の株をまとめて渡して新しいETFを作り、それを市場で高く売ります。差額が利益になるので、売りが増えて市場価格は下がります。逆に市場価格が中身より安くなると、安いETFを買って中身の株と交換し、その株を売ります。今度は買いが増えて市場価格が上がります。このように「ずれたら得をする人」が常にいるので、ずれは小さく保たれやすいのです。ただし、取引が少ないETFや、市場が大きく混乱したときは、ずれが広がることもあります。 20万円で毎月1万円ずつ積み立てたい場合を考えます（例）。投資信託なら「毎月1万円」と金額で設定すれば、自動で買い付けが続きます。ETFは口数単位で買います。売買単位が1口で、1口の値段が3,500円なら2口で7,000円、3口で1万500円です。ぴったり1万円にはなりません。NISAのつみたて投資枠で選べるETFは限られています。金融機関の対応も含めて第31話・第40話で確認しましょう。 ETFも元本保証ではなく、中身の値動きで損をすることがあります。 取引量の少ないETFは、思った値段で売買できないことがあります。 名前が似ていても、連動する指数や手数料はETFごとに違います。 ETFは取引所で、株と同じように売買できる投資信託 指定参加者のしくみで、市場価格と中身の価値のずれは小さく保たれやすい 少額の自動積立なら、普通の投資信託のほうが手間が少ない場合が多い ETFの市場価格が中身の価値より大きく高くなったとき、ずれを小さくする働きとして正しいものはどれですか。 取引所が値段を強制的に下げる 指定参加者が新しくETFを作って市場で売るため、価格が下がる 運用会社が中身の株を買い増すため、価格が上がる 中身より高く売れるなら、ETFを新しく作って売る人が現れます。売りが増えることで、市場価格は中身の価値に近づきます。"},{"no":27,"part":4,"title":"手数料の破壊力","subtitle":"信託報酬0.1%と1%の差は、なぜ数十年で大きくなるのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>信託報酬が0.1%でも1%でも、どちらも小さな数字に見えます。たった0.9%の差を、なぜそんなに気にする必要があるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>信託報酬は、毎年、持っている資産全体から差し引かれ続けます。差し引かれたお金はその後の複利で増えることもできないため、長い期間では差が雪だるまのように大きくなります。手数料は、投資で数少ない「自分で確実に選べるもの」でもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>投資信託にかかる3つの手数料\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>名前\u003c/th>\u003cth>いつかかるか\u003c/th>\u003cth>目安\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>購入時手数料\u003c/td>\u003ctd>買うとき\u003c/td>\u003ctd>0円（ノーロード）の商品も多い\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"信託報酬\">信託報酬\u003c/span>\u003c/td>\u003ctd>持っている間ずっと\u003c/td>\u003ctd>年0.1%未満〜2%程度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>信託財産留保額\u003c/td>\u003ctd>売るとき\u003c/td>\u003ctd>かからない商品も多い\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>信託報酬は、運用会社・販売会社・信託銀行への報酬です（第24話）。毎日少しずつ資産から差し引かれ、基準価額にはすでに反映されています。そのため、明細で引かれた金額を目にする機会がほとんどありません。\u003c/p>\n\u003ch2>30年後の差を計算してみる\u003c/h2>\n\u003cp>20万円を一度に投資し、手数料を引く前の利回りが年5%だったとします（例）。説明を簡単にするため、利回りから信託報酬をそのまま差し引いて計算します。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>信託報酬\u003c/th>\u003cth>実質の利回り\u003c/th>\u003cth>30年後\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0.1%\u003c/td>\u003ctd>年4.9%\u003c/td>\u003ctd>約84.0万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.0%\u003c/td>\u003ctd>年4.0%\u003c/td>\u003ctd>約64.9万円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>差は約19万円です。最初に投資した20万円とほぼ同じ金額が、手数料の差だけで消えています。なお、年5%は計算のための仮の数字で、実際の利回りは毎年大きく変わります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ小さな差が、こんなに大きくなるのでしょうか。理由は2つあります。1つ目は、信託報酬が「増えた分」ではなく「資産全体」にかかることです。年5%増える資産に1%かかるなら、増えた分の5分の1を毎年手放している計算になります。2つ目は、手放したお金がその先の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"複利\">複利\u003c/span>（第5話）から外れることです。今年払った1,000円は、30年間で増えるはずだった利益ごと失われます。複利は増える力が雪だるま式に大きくなるしくみですが、手数料はその雪だるまを毎年少しずつ削り続けます。そして根本的に重要なのは、確かさの違いです。将来の値上がりはだれにも予想できません。一方、手数料は買う前にわかり、確実に効いてくる数字です。不確かなものより、確かなものを先に整えるのが合理的です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>金融庁は、NISAのつみたて投資枠で買えるインデックス投資信託に条件を設けています。信託報酬の上限は、国内資産なら税抜0.5%、海外資産なら税抜0.75%です。購入時手数料はゼロであることも条件です。2026年5月時点の対象商品の一覧を見ると、平均の信託報酬はこの上限よりかなり低く、0.3%前後の水準です。年0.1%前後の商品も複数あります（例）。20万円から始める学生にとっては、まず信託報酬の低さで候補をしぼるのが、もっとも失敗しにくい選び方の一つです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>手数料が安いことだけで選ぶと、自分の目的に合わない商品を選ぶことがあります。何に投資する商品かを先に確かめましょう。\u003c/li>\u003cli>信託報酬のほかに、売買手数料や監査費用などの「その他の費用」がかかることがあります。運用報告書で確認できます。\u003c/li>\u003cli>銀行や証券会社の窓口で勧められる商品は、手数料が高いことがあります。理由を聞いてから判断しましょう。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>信託報酬は資産全体から毎年差し引かれ続ける\u003c/li>\u003cli>差し引かれたお金は複利で増えないため、長期では差が大きくなる\u003c/li>\u003cli>手数料は事前にわかり、確実に効く。まず手数料の低さで候補をしぼる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>信託報酬が長期で大きな差を生む理由として、最も適切なものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">信託報酬は利益が出た年にだけかかるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">資産全体に毎年かかり、差し引かれたお金はその後の複利から外れるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">信託報酬は売るときにまとめて請求されるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>信託報酬は持っている間、資産全体から毎年差し引かれます。失ったお金は、その後増えるはずだった利益ごと失われます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「つみたて投資枠対象商品」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/products/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/products/\u003c/a>\u003c/li>\u003cli>金融庁「つみたて投資枠対象商品の概要（2026年5月11日時点）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/products/20260511/28.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/products/20260511/28.pdf\u003c/a>\u003c/li>\u003cli>金融庁「NISAを知る」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"信託報酬が0.1%でも1%でも、どちらも小さな数字に見えます。たった0.9%の差を、なぜそんなに気にする必要があるのでしょうか。 信託報酬は、毎年、持っている資産全体から差し引かれ続けます。差し引かれたお金はその後の複利で増えることもできないため、長い期間では差が雪だるまのように大きくなります。手数料は、投資で数少ない「自分で確実に選べるもの」でもあります。 投資信託にかかる3つの手数料 名前 いつかかるか 目安 購入時手数料 買うとき 0円（ノーロード）の商品も多い 信託報酬 持っている間ずっと 年0.1%未満〜2%程度 信託財産留保額 売るとき かからない商品も多い 信託報酬は、運用会社・販売会社・信託銀行への報酬です（第24話）。毎日少しずつ資産から差し引かれ、基準価額にはすでに反映されています。そのため、明細で引かれた金額を目にする機会がほとんどありません。 30年後の差を計算してみる 20万円を一度に投資し、手数料を引く前の利回りが年5%だったとします（例）。説明を簡単にするため、利回りから信託報酬をそのまま差し引いて計算します。 信託報酬 実質の利回り 30年後 0.1% 年4.9% 約84.0万円 1.0% 年4.0% 約64.9万円 差は約19万円です。最初に投資した20万円とほぼ同じ金額が、手数料の差だけで消えています。なお、年5%は計算のための仮の数字で、実際の利回りは毎年大きく変わります。 なぜ小さな差が、こんなに大きくなるのでしょうか。理由は2つあります。1つ目は、信託報酬が「増えた分」ではなく「資産全体」にかかることです。年5%増える資産に1%かかるなら、増えた分の5分の1を毎年手放している計算になります。2つ目は、手放したお金がその先の複利（第5話）から外れることです。今年払った1,000円は、30年間で増えるはずだった利益ごと失われます。複利は増える力が雪だるま式に大きくなるしくみですが、手数料はその雪だるまを毎年少しずつ削り続けます。そして根本的に重要なのは、確かさの違いです。将来の値上がりはだれにも予想できません。一方、手数料は買う前にわかり、確実に効いてくる数字です。不確かなものより、確かなものを先に整えるのが合理的です。 金融庁は、NISAのつみたて投資枠で買えるインデックス投資信託に条件を設けています。信託報酬の上限は、国内資産なら税抜0.5%、海外資産なら税抜0.75%です。購入時手数料はゼロであることも条件です。2026年5月時点の対象商品の一覧を見ると、平均の信託報酬はこの上限よりかなり低く、0.3%前後の水準です。年0.1%前後の商品も複数あります（例）。20万円から始める学生にとっては、まず信託報酬の低さで候補をしぼるのが、もっとも失敗しにくい選び方の一つです。 手数料が安いことだけで選ぶと、自分の目的に合わない商品を選ぶことがあります。何に投資する商品かを先に確かめましょう。 信託報酬のほかに、売買手数料や監査費用などの「その他の費用」がかかることがあります。運用報告書で確認できます。 銀行や証券会社の窓口で勧められる商品は、手数料が高いことがあります。理由を聞いてから判断しましょう。 信託報酬は資産全体から毎年差し引かれ続ける 差し引かれたお金は複利で増えないため、長期では差が大きくなる 手数料は事前にわかり、確実に効く。まず手数料の低さで候補をしぼる 信託報酬が長期で大きな差を生む理由として、最も適切なものはどれですか。 信託報酬は利益が出た年にだけかかるから 資産全体に毎年かかり、差し引かれたお金はその後の複利から外れるから 信託報酬は売るときにまとめて請求されるから 信託報酬は持っている間、資産全体から毎年差し引かれます。失ったお金は、その後増えるはずだった利益ごと失われます。"},{"no":28,"part":4,"title":"そのほかの資産","subtitle":"REIT・金・暗号資産・FXは「何から利益が生まれるか」で見分ける","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株や債券のほかにも、REIT、金、暗号資産、FXなどの名前をよく見かけます。どれも値上がりすればもうかりそうですが、何がちがうのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>見分けるポイントは「その資産が、持っているだけでお金を生み出すかどうか」です。REITは家賃という収入を生みますが、金や暗号資産は自分では収入を生みません。FXは通貨の交換の取引で、全体としてはお金が増えないしくみです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>4つの資産の正体\u003c/h2>\n\u003ch3>REIT（不動産投資信託）\u003c/h3>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"REIT\">REIT\u003c/span>は、多くの人から集めたお金でオフィスビルや物流施設などを買い、家賃収入を分配する投資信託です。少額で不動産に分散投資できます。収入の源は家賃なので、株と同じく「お金を生む資産」です。一方で、金利が上がると値下がりしやすい性質があります。\u003c/p>\n\u003ch3>金（ゴールド）\u003c/h3>\n\u003cp>金は世界中で価値が認められてきた貴金属です。利息も配当も生みません。値段は、ほかの人がいくらで買いたいかだけで決まります。そのため、不安が高まる時期に買われやすい一方、長期間値下がりが続いた時期もあります。\u003c/p>\n\u003ch3>暗号資産\u003c/h3>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"暗号資産\">暗号資産\u003c/span>は、インターネット上でやりとりされる電子的な資産で、ビットコインが代表例です。発行する国や会社の後ろ盾はなく、それ自体は収入を生みません。値動きは株よりもはるかに大きく、1年で半分以下になったこともあります。\u003c/p>\n\u003ch3>FX（外国為替証拠金取引）\u003c/h3>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"FX\">FX\u003c/span>は、円とドルなどの通貨を交換する取引で、預けたお金（証拠金）の何倍もの金額を取引できます。日本の個人向けの取引は、規制で最大25倍までとされています。この「何倍も」の取引を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"レバレッジ\">レバレッジ\u003c/span>といいます。もうけも損も何倍にもなります。\u003c/p>\n\u003ch2>税金のちがい（2026年10月時点）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>資産\u003c/th>\u003cth>利益の主な扱い\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>上場REIT\u003c/td>\u003ctd>株と同じく約20%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FX（国内業者）\u003c/td>\u003ctd>約20%の分離課税\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金\u003c/td>\u003ctd>給料などと合算する総合課税\u003c/td>\u003c/tr>\u003ctr>\u003ctd>暗号資産\u003c/td>\u003ctd>雑所得として給料などと合算\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>暗号資産は、所得が多いほど税率が上がり、他の所得との損益通算もできません。2026年度の税制改正の大綱では、一定の暗号資産の取引を約20%の分離課税にする方針が示されています。ただし適用は「暗号資産を金融商品取引法の対象にする改正法が施行された年の翌年から」とされています。2026年10月時点では、まだ始まっていません。いつから始まるかは、今後の発表で確かめる必要があります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「お金を生むかどうか」がそんなに大切なのでしょうか。株やREITは、会社や建物が利益や家賃を生み続けます。持ち主全員が受け取る合計が時間とともに増えていくので、参加者全体としてもうかることができます（第13話のプラスサム）。金や暗号資産は、それ自体は何も生みません。値上がりで得をするには、自分より高く買ってくれる人が必要です。長期の利益の根拠は「将来もっと欲しがる人が増えるかどうか」に限られます。FXでは、ある人が円高で得をすれば、同じだけ反対側の人が損をします。全体の合計はゼロで、手数料などを引けばマイナスです（ゼロサム）。長期の資産形成の中心に、全体として価値が増えていく資産を置くのは、この違いがあるからです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円の使い道として、FXで5万円を証拠金にして25倍の取引をしたとします（例）。取引額は125万円です。円相場が4%逆に動くだけで、125万円 × 4% = 5万円の損になり、証拠金がほぼなくなります。長期の資産形成を学んでいる段階では、こうした取引は「性質を知っておくもの」にとどめるのが賢明です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「暗号資産で短期間に何倍にも」といった話は、詐欺の入り口になることがあります。見抜き方は第46話で扱います。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>資産を「お金を生むか」で見分けると、長期の性質がわかる\u003c/li>\u003cli>REITは家賃を生むが、金や暗号資産は自分では収入を生まない\u003c/li>\u003cli>FXは全体ではゼロサムで、レバレッジで損も大きくなる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>持っているだけで収入を生む資産はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">金\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">暗号資産\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">REIT\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>REITは保有する不動産の家賃収入を分配します。金や暗号資産は、それ自体は収入を生みません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁「No.1522 先物取引に係る雑所得等の課税の特例」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1522.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1522.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.3161 金地金の譲渡による所得」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3161.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3161.htm\u003c/a>\u003c/li>\u003cli>国税庁「暗号資産等に関する税務上の取扱い及び計算書について（令和7年12月）」 \u003ca href=\"https://www.nta.go.jp/publication/pamph/shotoku/kakuteishinkokukankei/kasoutuka/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/publication/pamph/shotoku/kakuteishinkokukankei/kasoutuka/\u003c/a>\u003c/li>\u003cli>財務省「令和8年度税制改正の大綱」 \u003ca href=\"https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/20251226taikou.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/20251226taikou.pdf\u003c/a>\u003c/li>\u003cli>金融庁「令和8（2026）年度税制改正について」 \u003ca href=\"https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株や債券のほかにも、REIT、金、暗号資産、FXなどの名前をよく見かけます。どれも値上がりすればもうかりそうですが、何がちがうのでしょうか。 見分けるポイントは「その資産が、持っているだけでお金を生み出すかどうか」です。REITは家賃という収入を生みますが、金や暗号資産は自分では収入を生みません。FXは通貨の交換の取引で、全体としてはお金が増えないしくみです。 4つの資産の正体 REIT（不動産投資信託） REITは、多くの人から集めたお金でオフィスビルや物流施設などを買い、家賃収入を分配する投資信託です。少額で不動産に分散投資できます。収入の源は家賃なので、株と同じく「お金を生む資産」です。一方で、金利が上がると値下がりしやすい性質があります。 金（ゴールド） 金は世界中で価値が認められてきた貴金属です。利息も配当も生みません。値段は、ほかの人がいくらで買いたいかだけで決まります。そのため、不安が高まる時期に買われやすい一方、長期間値下がりが続いた時期もあります。 暗号資産 暗号資産は、インターネット上でやりとりされる電子的な資産で、ビットコインが代表例です。発行する国や会社の後ろ盾はなく、それ自体は収入を生みません。値動きは株よりもはるかに大きく、1年で半分以下になったこともあります。 FX（外国為替証拠金取引） FXは、円とドルなどの通貨を交換する取引で、預けたお金（証拠金）の何倍もの金額を取引できます。日本の個人向けの取引は、規制で最大25倍までとされています。この「何倍も」の取引をレバレッジといいます。もうけも損も何倍にもなります。 税金のちがい（2026年10月時点） 資産 利益の主な扱い 上場REIT 株と同じく約20% FX（国内業者） 約20%の分離課税 金 給料などと合算する総合課税 暗号資産 雑所得として給料などと合算 暗号資産は、所得が多いほど税率が上がり、他の所得との損益通算もできません。2026年度の税制改正の大綱では、一定の暗号資産の取引を約20%の分離課税にする方針が示されています。ただし適用は「暗号資産を金融商品取引法の対象にする改正法が施行された年の翌年から」とされています。2026年10月時点では、まだ始まっていません。いつから始まるかは、今後の発表で確かめる必要があります。 なぜ「お金を生むかどうか」がそんなに大切なのでしょうか。株やREITは、会社や建物が利益や家賃を生み続けます。持ち主全員が受け取る合計が時間とともに増えていくので、参加者全体としてもうかることができます（第13話のプラスサム）。金や暗号資産は、それ自体は何も生みません。値上がりで得をするには、自分より高く買ってくれる人が必要です。長期の利益の根拠は「将来もっと欲しがる人が増えるかどうか」に限られます。FXでは、ある人が円高で得をすれば、同じだけ反対側の人が損をします。全体の合計はゼロで、手数料などを引けばマイナスです（ゼロサム）。長期の資産形成の中心に、全体として価値が増えていく資産を置くのは、この違いがあるからです。 20万円の使い道として、FXで5万円を証拠金にして25倍の取引をしたとします（例）。取引額は125万円です。円相場が4%逆に動くだけで、125万円 × 4% = 5万円の損になり、証拠金がほぼなくなります。長期の資産形成を学んでいる段階では、こうした取引は「性質を知っておくもの」にとどめるのが賢明です。 「暗号資産で短期間に何倍にも」といった話は、詐欺の入り口になることがあります。見抜き方は第46話で扱います。 資産を「お金を生むか」で見分けると、長期の性質がわかる REITは家賃を生むが、金や暗号資産は自分では収入を生まない FXは全体ではゼロサムで、レバレッジで損も大きくなる 持っているだけで収入を生む資産はどれですか。 金 暗号資産 REIT REITは保有する不動産の家賃収入を分配します。金や暗号資産は、それ自体は収入を生みません。"},{"no":29,"part":5,"title":"投資の利益にかかる税金","subtitle":"20.315%の内訳と、なぜ給料とは別に計算するのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資でもうけると約20%の税金がかかると聞きました。中途半端な「20.315%」という数字は、どこから来ているのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株や投資信託の利益には、所得税15%、復興特別所得税0.315%、住民税5%がかかり、合計で20.315%です。給料などとは切り離して、所得の多い少ないに関係なく同じ税率で計算します。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>税金がかかる2種類の利益\u003c/h2>\n\u003cp>投資の利益には、大きく2種類あります。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"譲渡益\">譲渡益\u003c/span>\u003c/strong>: 買った値段より高く売ったときの差額（値上がり益）\u003c/li>\u003cli>\u003cstrong>配当・分配金\u003c/strong>: 株の配当や投資信託の分配金（第22話）\u003c/li>\u003c/ul>\n\u003cp>上場している株や投資信託であれば、どちらも原則として同じ税率です。なお、売らずに持っているだけの「含み益」には、税金はかかりません。税金は利益が確定したときにかかります。\u003c/p>\n\u003ch2>20.315%の内訳\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>税金の種類\u003c/th>\u003cth>税率\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>所得税\u003c/td>\u003ctd>15%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>復興特別所得税\u003c/td>\u003ctd>0.315%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>住民税\u003c/td>\u003ctd>5%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>復興特別所得税は、東日本大震災の復興の財源にあてる税です。所得税額の2.1%がかかるため、15% × 2.1% = 0.315%になります。2027年1月からは、この0.315%の部分が「防衛特別所得税」と「復興特別所得税」に分かれる予定です。ただし国税庁によれば、合計の税率は変わりません。\u003c/p>\n\u003ch2>自分で計算しなくてよいしくみ\u003c/h2>\n\u003cp>証券口座を開くときに「\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"特定口座\">特定口座\u003c/span>（源泉徴収あり）」を選ぶと、証券会社が利益と税金を計算し、差し引いて納めてくれます。原則として確定申告は不要です。1年の間に、ある商品で損をして別の商品で得をした場合は、同じ口座の中で損と得を差し引きして計算されます（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"損益通算\">損益通算\u003c/span>）。口座の種類は第35話で詳しく扱います。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ投資の利益は、給料と別にして一律の税率なのでしょうか。給料は「総合課税」といって、ほかの所得と合計し、所得が多いほど税率が上がるしくみで計算します。投資の利益は「\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"申告分離課税\">申告分離課税\u003c/span>」として切り離され、誰でも同じ税率です。理由の一つは、お金が国境を越えて簡単に動くことです。投資の利益に高い税率をかけると、お金が税金の安い国へ逃げたり、国内で投資する人が減ったりしやすくなります。もう一つは、多くの人の取引を証券会社がまとめて計算し、税金を差し引いて納められるようにするためです。一律の税率なら、その計算がずっと簡単になります。一方で、所得の多い人ほど投資の利益の割合が大きく、一律の税率は「お金持ちに有利だ」という意見もあります。税の設計は、こうした公平さと効率のバランスで決まっているのです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円で買った投資信託が値上がりし、25万円で売ったとします（例）。利益は5万円です。税金は5万円 × 20.315% = 1万157円（1円未満切り捨て）で、手取りの利益は約3万9,843円になります。同じ取引をNISA口座で行えば、この税金はかかりません（第30話）。アルバイト収入があまり多くない学生は、確定申告をすると、差し引かれた税金の一部が戻る場合があります。扶養との関係を含めて第36話で扱います。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>損をした年は、確定申告をすると翌年以降3年間、損を繰り越して将来の利益と相殺できます。\u003c/li>\u003cli>税率や制度は改正されることがあります。この内容は2026年10月時点のものです。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>投資の利益にかかる税金は、合計20.315%\u003c/li>\u003cli>給料とは切り離して、一律の税率で計算する\u003c/li>\u003cli>特定口座（源泉徴収あり）なら、証券会社が計算して納めてくれる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>20.315%のうち、住民税にあたる部分は何%ですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">15%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">0.315%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">5%\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>所得税15%、復興特別所得税0.315%、住民税5%で、合計20.315%です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁「No.1463 株式等を譲渡したときの課税（申告分離課税）」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1463.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1463.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1331 上場株式等の配当等に係る申告分離課税制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1331.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1476 特定口座制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1476.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1476.htm\u003c/a>\u003c/li>\u003cli>国税庁「防衛特別所得税及び復興特別所得税の源泉徴収のあらまし（令和9年1月以後の源泉徴収）」 \u003ca href=\"https://www.nta.go.jp/publication/pamph/pdf/0026005-024_02.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/publication/pamph/pdf/0026005-024_02.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"投資でもうけると約20%の税金がかかると聞きました。中途半端な「20.315%」という数字は、どこから来ているのでしょうか。 株や投資信託の利益には、所得税15%、復興特別所得税0.315%、住民税5%がかかり、合計で20.315%です。給料などとは切り離して、所得の多い少ないに関係なく同じ税率で計算します。 税金がかかる2種類の利益 投資の利益には、大きく2種類あります。 譲渡益: 買った値段より高く売ったときの差額（値上がり益） 配当・分配金: 株の配当や投資信託の分配金（第22話） 上場している株や投資信託であれば、どちらも原則として同じ税率です。なお、売らずに持っているだけの「含み益」には、税金はかかりません。税金は利益が確定したときにかかります。 20.315%の内訳 税金の種類 税率 所得税 15% 復興特別所得税 0.315% 住民税 5% 復興特別所得税は、東日本大震災の復興の財源にあてる税です。所得税額の2.1%がかかるため、15% × 2.1% = 0.315%になります。2027年1月からは、この0.315%の部分が「防衛特別所得税」と「復興特別所得税」に分かれる予定です。ただし国税庁によれば、合計の税率は変わりません。 自分で計算しなくてよいしくみ 証券口座を開くときに「特定口座（源泉徴収あり）」を選ぶと、証券会社が利益と税金を計算し、差し引いて納めてくれます。原則として確定申告は不要です。1年の間に、ある商品で損をして別の商品で得をした場合は、同じ口座の中で損と得を差し引きして計算されます（損益通算）。口座の種類は第35話で詳しく扱います。 なぜ投資の利益は、給料と別にして一律の税率なのでしょうか。給料は「総合課税」といって、ほかの所得と合計し、所得が多いほど税率が上がるしくみで計算します。投資の利益は「申告分離課税」として切り離され、誰でも同じ税率です。理由の一つは、お金が国境を越えて簡単に動くことです。投資の利益に高い税率をかけると、お金が税金の安い国へ逃げたり、国内で投資する人が減ったりしやすくなります。もう一つは、多くの人の取引を証券会社がまとめて計算し、税金を差し引いて納められるようにするためです。一律の税率なら、その計算がずっと簡単になります。一方で、所得の多い人ほど投資の利益の割合が大きく、一律の税率は「お金持ちに有利だ」という意見もあります。税の設計は、こうした公平さと効率のバランスで決まっているのです。 20万円で買った投資信託が値上がりし、25万円で売ったとします（例）。利益は5万円です。税金は5万円 × 20.315% = 1万157円（1円未満切り捨て）で、手取りの利益は約3万9,843円になります。同じ取引をNISA口座で行えば、この税金はかかりません（第30話）。アルバイト収入があまり多くない学生は、確定申告をすると、差し引かれた税金の一部が戻る場合があります。扶養との関係を含めて第36話で扱います。 損をした年は、確定申告をすると翌年以降3年間、損を繰り越して将来の利益と相殺できます。 税率や制度は改正されることがあります。この内容は2026年10月時点のものです。 投資の利益にかかる税金は、合計20.315% 給料とは切り離して、一律の税率で計算する 特定口座（源泉徴収あり）なら、証券会社が計算して納めてくれる 20.315%のうち、住民税にあたる部分は何%ですか。 15% 0.315% 5% 所得税15%、復興特別所得税0.315%、住民税5%で、合計20.315%です。"},{"no":30,"part":5,"title":"新NISAの全体像","subtitle":"なぜ国は、税金を取らないしくみをわざわざ作るのか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAを使えば、投資の利益に税金がかからないと聞きました。国にとって税金は大切な収入のはずです。なぜ自分から税金を取らないしくみを作るのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>国は目先の税収を一部あきらめる代わりに、国民一人ひとりが長期の資産を持ち、企業にお金が回り、経済が成長することをねらっています。新NISAは、そのために「投資の利益を非課税にする」という強い動機づけを、期限なく続けられる形にした制度です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>新NISAのしくみをひとことで\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"NISA\">NISA\u003c/span>（少額投資非課税制度）は、専用の口座で買った株や投資信託の利益に、税金がかからない制度です。通常なら利益の20.315%がかかります（第29話）。NISA口座なら、その税金がゼロになります。2024年に制度が大きく見直され、「新NISA」と呼ばれています。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>つみたて投資枠\u003c/th>\u003cth>成長投資枠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>年間の上限\u003c/td>\u003ctd>120万円\u003c/td>\u003ctd>240万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生涯の上限\u003c/td>\u003ctd>合計1,800万円\u003c/td>\u003ctd>うち1,200万円まで\u003c/td>\u003c/tr>\u003ctr>\u003ctd>非課税の期間\u003c/td>\u003ctd>無期限\u003c/td>\u003ctd>無期限\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>2つの枠は同時に使え、1年で合計360万円まで投資できます。売った場合は、買ったときの金額の分だけ、翌年以降に枠が復活します。2026年10月時点で口座を開けるのは、その年の1月1日に18歳以上の人です。2つの枠の使い分けは第31話、注意点は第32話で詳しく扱います。\u003c/p>\n\u003ch2>2026年度の税制改正で何が変わるか\u003c/h2>\n\u003cp>2026年3月に成立した税制改正で、つみたて投資枠を0〜17歳の子どもも使えるようにすることが決まりました。2027年1月から始まる予定です。子どもの間は年間60万円、生涯600万円が上限で、18歳になると大人のつみたて投資枠に移ります。あわせて、つみたて投資枠で買える商品の種類を広げる見直しも予定されています。NISA口座の数は、2026年6月末時点で約3,048万口座まで増えています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ国は、非課税という「税収を減らす」制度を作るのでしょうか。根っこには3つの理由があります。1つ目は、家計のお金が預金に偏っていることです。日本銀行の統計では、2026年6月末の家計の金融資産は約2,519兆円で、そのうち現金・預金が約45%を占めます。物価が上がる時代には、預金だけではお金の実質的な価値が目減りします（第6話）。2つ目は、老後の生活を公的年金だけに頼りにくくなっていることです。国民が自分でも資産を育てられるよう、背中を押す必要があります。3つ目は、経済全体の成長です。家計のお金が株式などを通じて企業に回れば、企業は成長のための投資をしやすくなります。企業が成長すれば給料や配当が増え、長い目で見れば国の税収にもつながります。つまり国にとって非課税は、目先の税収を「将来の成長と国民の安心」への投資に回す政策だと言えます。税金という強い動機をあえて手放すのは、人は得になるしくみがあってはじめて行動を変えやすいからです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>大学1年生で20万円を持っている場合、使える枠は年間360万円です。枠の大きさが問題になることは、当面ほとんどないでしょう。たとえば20万円のうち10万円を投資し、将来15万円になって売ったとします（例）。利益の5万円にかかる約1万円の税金が、NISAならかかりません。大切なのは、枠を使い切ることではありません。生活防衛資金（第8話）を残したうえで、無理のない金額を長く続けることです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>NISAは「税金がかからない」制度で、「損をしない」制度ではありません。値下がりすれば損をします。\u003c/li>\u003cli>NISA口座で出た損は、ほかの口座の利益と相殺できません（第32話）。\u003c/li>\u003cli>制度は改正されることがあります。この内容は2026年10月時点の情報です。\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>NISAは、投資の利益にかかる約20%の税金をゼロにする制度\u003c/li>\u003cli>年間360万円、生涯1,800万円まで、期限なく非課税で持てる\u003c/li>\u003cli>国は税収の一部と引き換えに、国民の資産形成と経済の成長をねらっている\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>国がNISAのような非課税制度を作る理由として、最も適切なものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">国の税収が多すぎて減らしたいから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">家計のお金を長期の投資に回し、国民の資産形成と経済成長につなげたいから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">NISAで買った商品の値下がりを国が補うため\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>国は目先の税収を一部あきらめ、家計の資産形成と、企業へのお金の流れを後押ししようとしています。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISAを知る」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAの抜本的拡充・恒久化のイメージ」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/about/nisa2024/summary.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/about/nisa2024/summary.pdf\u003c/a>\u003c/li>\u003cli>金融庁「令和8（2026）年度税制改正について」 \u003ca href=\"https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\u003c/a>\u003c/li>\u003cli>財務省「NISAのつみたて投資枠の拡充（令和8年度改正）（令和9年～）」 \u003ca href=\"https://www.mof.go.jp/tax_policy/summary/income/nisa_2.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/tax_policy/summary/income/nisa_2.pdf\u003c/a>\u003c/li>\u003cli>財務省「『所得税法等の一部を改正する法律案』について」 \u003ca href=\"https://www.mof.go.jp/about_mof/bills/221diet/st080220g.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/about_mof/bills/221diet/st080220g.pdf\u003c/a>\u003c/li>\u003cli>金融庁「NISA口座の利用状況に関する調査結果（令和8年6月末時点）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa/20261002.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa/20261002.html\u003c/a>\u003c/li>\u003cli>日本銀行「資金循環統計（速報）（2026年第2四半期）」 \u003ca href=\"https://www.boj.or.jp/statistics/sj/sj.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/statistics/sj/sj.htm\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"NISAを使えば、投資の利益に税金がかからないと聞きました。国にとって税金は大切な収入のはずです。なぜ自分から税金を取らないしくみを作るのでしょうか。 国は目先の税収を一部あきらめる代わりに、国民一人ひとりが長期の資産を持ち、企業にお金が回り、経済が成長することをねらっています。新NISAは、そのために「投資の利益を非課税にする」という強い動機づけを、期限なく続けられる形にした制度です。 新NISAのしくみをひとことで NISA（少額投資非課税制度）は、専用の口座で買った株や投資信託の利益に、税金がかからない制度です。通常なら利益の20.315%がかかります（第29話）。NISA口座なら、その税金がゼロになります。2024年に制度が大きく見直され、「新NISA」と呼ばれています。 項目 つみたて投資枠 成長投資枠 年間の上限 120万円 240万円 生涯の上限 合計1,800万円 うち1,200万円まで 非課税の期間 無期限 無期限 2つの枠は同時に使え、1年で合計360万円まで投資できます。売った場合は、買ったときの金額の分だけ、翌年以降に枠が復活します。2026年10月時点で口座を開けるのは、その年の1月1日に18歳以上の人です。2つの枠の使い分けは第31話、注意点は第32話で詳しく扱います。 2026年度の税制改正で何が変わるか 2026年3月に成立した税制改正で、つみたて投資枠を0〜17歳の子どもも使えるようにすることが決まりました。2027年1月から始まる予定です。子どもの間は年間60万円、生涯600万円が上限で、18歳になると大人のつみたて投資枠に移ります。あわせて、つみたて投資枠で買える商品の種類を広げる見直しも予定されています。NISA口座の数は、2026年6月末時点で約3,048万口座まで増えています。 なぜ国は、非課税という「税収を減らす」制度を作るのでしょうか。根っこには3つの理由があります。1つ目は、家計のお金が預金に偏っていることです。日本銀行の統計では、2026年6月末の家計の金融資産は約2,519兆円で、そのうち現金・預金が約45%を占めます。物価が上がる時代には、預金だけではお金の実質的な価値が目減りします（第6話）。2つ目は、老後の生活を公的年金だけに頼りにくくなっていることです。国民が自分でも資産を育てられるよう、背中を押す必要があります。3つ目は、経済全体の成長です。家計のお金が株式などを通じて企業に回れば、企業は成長のための投資をしやすくなります。企業が成長すれば給料や配当が増え、長い目で見れば国の税収にもつながります。つまり国にとって非課税は、目先の税収を「将来の成長と国民の安心」への投資に回す政策だと言えます。税金という強い動機をあえて手放すのは、人は得になるしくみがあってはじめて行動を変えやすいからです。 大学1年生で20万円を持っている場合、使える枠は年間360万円です。枠の大きさが問題になることは、当面ほとんどないでしょう。たとえば20万円のうち10万円を投資し、将来15万円になって売ったとします（例）。利益の5万円にかかる約1万円の税金が、NISAならかかりません。大切なのは、枠を使い切ることではありません。生活防衛資金（第8話）を残したうえで、無理のない金額を長く続けることです。 NISAは「税金がかからない」制度で、「損をしない」制度ではありません。値下がりすれば損をします。 NISA口座で出た損は、ほかの口座の利益と相殺できません（第32話）。 制度は改正されることがあります。この内容は2026年10月時点の情報です。 NISAは、投資の利益にかかる約20%の税金をゼロにする制度 年間360万円、生涯1,800万円まで、期限なく非課税で持てる 国は税収の一部と引き換えに、国民の資産形成と経済の成長をねらっている 国がNISAのような非課税制度を作る理由として、最も適切なものはどれですか。 国の税収が多すぎて減らしたいから 家計のお金を長期の投資に回し、国民の資産形成と経済成長につなげたいから NISAで買った商品の値下がりを国が補うため 国は目先の税収を一部あきらめ、家計の資産形成と、企業へのお金の流れを後押ししようとしています。"},{"no":31,"part":5,"title":"つみたて投資枠と成長投資枠","subtitle":"NISAの中に、なぜ「2つの箱」があるのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAには「つみたて投資枠」と「成長投資枠」があると聞きました。何が違って、なぜ2つに分かれているのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>つみたて投資枠は、長期の積立に向く投資信託だけを年120万円まで買える枠です。成長投資枠は、株式なども含めて年240万円まで買える枠です。初心者を守る「レール」と、選択肢を広げる「自由」を両立させるために分かれています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>2つの枠の基本\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"NISA\">NISA\u003c/span>の全体像は第30話で見ました。ここでは2つの枠の違いに絞ります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>つみたて投資枠\u003c/th>\u003cth>成長投資枠\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>年間の上限\u003c/td>\u003ctd>120万円\u003c/td>\u003ctd>240万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>買えるもの\u003c/td>\u003ctd>基準を満たす投資信託など\u003c/td>\u003ctd>株式・投資信託・ETFなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>買い方\u003c/td>\u003ctd>積立のみ\u003c/td>\u003ctd>一括も積立も可\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>2つの枠は同じ年に併用できます。合計すると年に最大360万円です。\u003c/p>\n\u003cp>一生のうちに非課税で持てる上限は1,800万円です。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"非課税保有限度額\">非課税保有限度額\u003c/span>といいます。そのうち成長投資枠で使えるのは1,200万円までです。非課税で持てる期間に期限はありません。\u003c/p>\n\u003cp>使えるのは、口座を開く年の1月1日時点で18歳以上の人です。\u003c/p>\n\u003ch2>つみたて投資枠の商品が絞られている理由\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"つみたて投資枠\">つみたて投資枠\u003c/span>で買えるのは、金融庁が定めた基準を満たす投資信託などです。販売手数料がかからないこと、信託報酬が一定以下であることなどが条件です。\u003c/p>\n\u003cp>対象商品は金融庁に届け出られ、一覧が公開されています。2026年4月からは基準が一部見直され、主に債券に投資する投資信託も対象になりうる形になりました。\u003c/p>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"成長投資枠\">成長投資枠\u003c/span>は対象が広い一方で、除かれるものもあります。信託期間が20年未満のもの、毎月分配型、デリバティブで値動きを大きくした一定の投資信託などです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ国は、わざわざ枠を2つに分けたのでしょうか。\u003c/p>\n\u003cp>NISAの非課税は、国が本来もらえる税金を手放すことです。だから国は、その恩恵を「家計が長期で安定して資産を育てること」に使ってほしいと考えます。一方で、企業に成長のためのお金が流れることも経済には大切です。\u003c/p>\n\u003cp>そこで、長期・積立・分散に向く商品だけを並べた「安全側のレール」を用意しました。そのうえで、株式なども選べる自由な枠を残したのです。成長投資枠に1,200万円という上限があるのも同じ考えです。1,800万円のうち少なくとも600万円分は、レールの側で使われる設計になっています。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>月1万円を積み立てる場合、1年で使うのは12万円です。つみたて投資枠120万円の1割にすぎません。\u003c/p>\n\u003cp>枠は使い切る必要はありません。たとえば月3万円を積み立てると、1,800万円に届くのは50年後です（1,800万円 ÷ 年36万円 = 50年）。\u003c/p>\n\u003cp>手元の20万円の一部を一度に投資したいときは、成長投資枠を使う方法もあります。同じ投資信託が両方の枠の対象になっていることも多いです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle
