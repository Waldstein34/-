 cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>年間の枠で使わなかった分は、翌年に繰り越せません。ただし生涯の1,800万円は減らないので、焦って使い切る必要はありません。\u003c/p>\n\u003cp>なお、0〜17歳もつみたて投資枠を使えるようにする改正が、2027年1月から始まる予定です（第30話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>つみたて投資枠は年120万円、成長投資枠は年240万円で、併用できる\u003c/li>\u003cli>生涯の上限は1,800万円、うち成長投資枠は1,200万円まで\u003c/li>\u003cli>枠が2つあるのは、初心者向けのレールと選択の自由を両立させるため\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>成長投資枠だけで、生涯に非課税で持てる上限はいくらでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">1,800万円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">1,200万円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">240万円\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>生涯の上限は合計1,800万円ですが、そのうち成長投資枠で使えるのは1,200万円までです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISAを知る（NISA特設ウェブサイト）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/know/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/know/index.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAの抜本的拡充・恒久化のイメージ」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/about/nisa2024/summary.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/about/nisa2024/summary.pdf\u003c/a>\u003c/li>\u003cli>金融庁「つみたて投資枠対象商品」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/products/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/products/\u003c/a>\u003c/li>\u003cli>金融庁「『非課税口座に受け入れることができる上場株式等の範囲に関する基準』の一部改正について」（2026年4月1日適用） \u003ca href=\"https://www.fsa.go.jp/news/r7/sonota/20260401-3/20260401.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/news/r7/sonota/20260401-3/20260401.html\u003c/a>\u003c/li>\u003cli>金融庁「令和8（2026）年度税制改正について」 \u003ca href=\"https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/news/r7/sonota/20251226-2/01.pdf\u003c/a>\u003c/li>\u003cli>国税庁「No.1535 NISA制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"NISAには「つみたて投資枠」と「成長投資枠」があると聞きました。何が違って、なぜ2つに分かれているのでしょうか。 つみたて投資枠は、長期の積立に向く投資信託だけを年120万円まで買える枠です。成長投資枠は、株式なども含めて年240万円まで買える枠です。初心者を守る「レール」と、選択肢を広げる「自由」を両立させるために分かれています。 2つの枠の基本 NISAの全体像は第30話で見ました。ここでは2つの枠の違いに絞ります。 項目 つみたて投資枠 成長投資枠 年間の上限 120万円 240万円 買えるもの 基準を満たす投資信託など 株式・投資信託・ETFなど 買い方 積立のみ 一括も積立も可 2つの枠は同じ年に併用できます。合計すると年に最大360万円です。 一生のうちに非課税で持てる上限は1,800万円です。これを非課税保有限度額といいます。そのうち成長投資枠で使えるのは1,200万円までです。非課税で持てる期間に期限はありません。 使えるのは、口座を開く年の1月1日時点で18歳以上の人です。 つみたて投資枠の商品が絞られている理由 つみたて投資枠で買えるのは、金融庁が定めた基準を満たす投資信託などです。販売手数料がかからないこと、信託報酬が一定以下であることなどが条件です。 対象商品は金融庁に届け出られ、一覧が公開されています。2026年4月からは基準が一部見直され、主に債券に投資する投資信託も対象になりうる形になりました。 成長投資枠は対象が広い一方で、除かれるものもあります。信託期間が20年未満のもの、毎月分配型、デリバティブで値動きを大きくした一定の投資信託などです。 なぜ国は、わざわざ枠を2つに分けたのでしょうか。 NISAの非課税は、国が本来もらえる税金を手放すことです。だから国は、その恩恵を「家計が長期で安定して資産を育てること」に使ってほしいと考えます。一方で、企業に成長のためのお金が流れることも経済には大切です。 そこで、長期・積立・分散に向く商品だけを並べた「安全側のレール」を用意しました。そのうえで、株式なども選べる自由な枠を残したのです。成長投資枠に1,200万円という上限があるのも同じ考えです。1,800万円のうち少なくとも600万円分は、レールの側で使われる設計になっています。 月1万円を積み立てる場合、1年で使うのは12万円です。つみたて投資枠120万円の1割にすぎません。 枠は使い切る必要はありません。たとえば月3万円を積み立てると、1,800万円に届くのは50年後です（1,800万円 ÷ 年36万円 = 50年）。 手元の20万円の一部を一度に投資したいときは、成長投資枠を使う方法もあります。同じ投資信託が両方の枠の対象になっていることも多いです。 年間の枠で使わなかった分は、翌年に繰り越せません。ただし生涯の1,800万円は減らないので、焦って使い切る必要はありません。 なお、0〜17歳もつみたて投資枠を使えるようにする改正が、2027年1月から始まる予定です（第30話）。 つみたて投資枠は年120万円、成長投資枠は年240万円で、併用できる 生涯の上限は1,800万円、うち成長投資枠は1,200万円まで 枠が2つあるのは、初心者向けのレールと選択の自由を両立させるため 成長投資枠だけで、生涯に非課税で持てる上限はいくらでしょうか。 1,800万円 1,200万円 240万円 生涯の上限は合計1,800万円ですが、そのうち成長投資枠で使えるのは1,200万円までです。"},{"no":32,"part":5,"title":"NISAの注意点","subtitle":"損益通算できない・枠の復活","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAは「得」な話ばかりに聞こえます。損をしたときや、売ったときに、知らずに困ることはありますか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAで出た損は、税金の計算上「なかったもの」とされます。ほかの口座の利益と差し引くことはできません。また、売ると枠は復活しますが、戻るのは買った金額分で、使えるのは翌年からです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>損益通算ができない\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"損益通算\">損益通算\u003c/span>とは、同じ年の利益と損失を差し引きして、税金を計算することです。税金のしくみは第29話で扱いました。\u003c/p>\n\u003cp>たとえば\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"特定口座\">特定口座\u003c/span>で、A株で10万円の利益、B株で10万円の損が出たとします。差し引きゼロなので、税金はかかりません。\u003c/p>\n\u003cp>ところが、NISAで出た損は、この計算に入れられません。損を翌年以降に持ち越す\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"繰越控除\">繰越控除\u003c/span>もできません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜNISAの損は「なかったこと」にされるのでしょうか。\u003c/p>\n\u003cp>税金の世界では、課税される取引どうしで損と益を相殺します。NISAはその世界から切り離された「非課税の箱」です。箱の中の利益には税金がかかりません。\u003c/p>\n\u003cp>もし箱の中の損だけを外の世界に持ち出せたら、どうなるでしょう。利益は非課税、損は節税に使えるという、いいとこ取りになります。税の公平が崩れるので、損も箱の外には出せない決まりになっています。\u003c/p>\n\u003cp>「利益に税金がかからない」と「損を相殺できない」は、同じルールの表と裏なのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>枠の復活は「買った値段」で、翌年から\u003c/h2>\n\u003cp>NISAで売ると、使っていた生涯の枠が空きます。これを枠の復活（再利用）といいます。\u003c/p>\n\u003cp>ポイントは2つです。1つ目は、戻るのは売った値段ではなく、買った値段（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"簿価\">簿価\u003c/span>）の分だということです。2つ目は、使えるのは売った年の翌年からということです。\u003c/p>\n\u003cp>また、復活した枠があっても、年間の上限は増えません。つみたて投資枠120万円、成長投資枠240万円の範囲で使います。\u003c/p>\n\u003cp>生涯の枠は「元本をいくら箱に入れているか」で数えています。値上がり益の大きさでは数えないので、利益が増えても枠は減りません。その代わり、売っても戻るのは元本分だけです。\u003c/p>\n\u003ch2>配当の受け取り方にも注意\u003c/h2>\n\u003cp>NISAで買った株の配当は、受け取り方によっては課税されます。非課税にするには「株式数比例配分方式」を選ぶ必要があります。証券口座の配当金の受け取り方法で確認できます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAで20万円分の投資信託を買い、15万円まで下がったところで売ったとします。損は5万円です。\u003c/p>\n\u003cp>同じ年に、特定口座の個別株で5万円の利益が出ました。本来なら相殺してゼロにしたいところです。しかしNISAの損は使えないので、5万円に税金がかかります。\u003c/p>\n\u003cp>5万円 × 20.315% = 約1万円です。損をしたうえに、税金も払うことになります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>枠が翌年まで戻らないので、NISAは短い期間で売り買いを繰り返す使い方に向きません。\u003c/p>\n\u003cp>また、下がったときに慌てて売ると、損は確定し、税金面の救済もありません。NISAは「長く持つ」前提の箱と考えてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>NISAの損は他の口座と損益通算できず、繰越控除もできない\u003c/li>\u003cli>売ると枠は復活するが、戻るのは簿価の分で、使えるのは翌年から\u003c/li>\u003cli>株の配当を非課税にするには、株式数比例配分方式を選ぶ\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>2026年5月にNISAで20万円で買った投資信託を、同じ年の9月に30万円で売りました。枠はどうなるでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">2026年中に30万円分の枠が戻る\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">2027年以降に、生涯の枠が20万円分使えるようになる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">一度使った枠は戻らない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>復活するのは売った値段ではなく買った値段（簿価）の分で、使えるのは翌年からです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁「No.1535 NISA制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1474 上場株式等に係る譲渡損失の損益通算及び繰越控除」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1474.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1474.htm\u003c/a>\u003c/li>\u003cli>金融庁「よくある質問（NISA特設ウェブサイト）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/question/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/question/index.html\u003c/a>\u003c/li>\u003cli>金融庁「NISAを利用する皆さまへ」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/about/nisa2024/slide_202406.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/about/nisa2024/slide_202406.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"NISAは「得」な話ばかりに聞こえます。損をしたときや、売ったときに、知らずに困ることはありますか。 NISAで出た損は、税金の計算上「なかったもの」とされます。ほかの口座の利益と差し引くことはできません。また、売ると枠は復活しますが、戻るのは買った金額分で、使えるのは翌年からです。 損益通算ができない 損益通算とは、同じ年の利益と損失を差し引きして、税金を計算することです。税金のしくみは第29話で扱いました。 たとえば特定口座で、A株で10万円の利益、B株で10万円の損が出たとします。差し引きゼロなので、税金はかかりません。 ところが、NISAで出た損は、この計算に入れられません。損を翌年以降に持ち越す繰越控除もできません。 なぜNISAの損は「なかったこと」にされるのでしょうか。 税金の世界では、課税される取引どうしで損と益を相殺します。NISAはその世界から切り離された「非課税の箱」です。箱の中の利益には税金がかかりません。 もし箱の中の損だけを外の世界に持ち出せたら、どうなるでしょう。利益は非課税、損は節税に使えるという、いいとこ取りになります。税の公平が崩れるので、損も箱の外には出せない決まりになっています。 「利益に税金がかからない」と「損を相殺できない」は、同じルールの表と裏なのです。 枠の復活は「買った値段」で、翌年から NISAで売ると、使っていた生涯の枠が空きます。これを枠の復活（再利用）といいます。 ポイントは2つです。1つ目は、戻るのは売った値段ではなく、買った値段（簿価）の分だということです。2つ目は、使えるのは売った年の翌年からということです。 また、復活した枠があっても、年間の上限は増えません。つみたて投資枠120万円、成長投資枠240万円の範囲で使います。 生涯の枠は「元本をいくら箱に入れているか」で数えています。値上がり益の大きさでは数えないので、利益が増えても枠は減りません。その代わり、売っても戻るのは元本分だけです。 配当の受け取り方にも注意 NISAで買った株の配当は、受け取り方によっては課税されます。非課税にするには「株式数比例配分方式」を選ぶ必要があります。証券口座の配当金の受け取り方法で確認できます。 NISAで20万円分の投資信託を買い、15万円まで下がったところで売ったとします。損は5万円です。 同じ年に、特定口座の個別株で5万円の利益が出ました。本来なら相殺してゼロにしたいところです。しかしNISAの損は使えないので、5万円に税金がかかります。 5万円 × 20.315% = 約1万円です。損をしたうえに、税金も払うことになります。 枠が翌年まで戻らないので、NISAは短い期間で売り買いを繰り返す使い方に向きません。 また、下がったときに慌てて売ると、損は確定し、税金面の救済もありません。NISAは「長く持つ」前提の箱と考えてください。 NISAの損は他の口座と損益通算できず、繰越控除もできない 売ると枠は復活するが、戻るのは簿価の分で、使えるのは翌年から 株の配当を非課税にするには、株式数比例配分方式を選ぶ 2026年5月にNISAで20万円で買った投資信託を、同じ年の9月に30万円で売りました。枠はどうなるでしょうか。 2026年中に30万円分の枠が戻る 2027年以降に、生涯の枠が20万円分使えるようになる 一度使った枠は戻らない 復活するのは売った値段ではなく買った値段（簿価）の分で、使えるのは翌年からです。"},{"no":33,"part":5,"title":"iDeCoとは","subtitle":"学生は使える？","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>iDeCoも税金が得になると聞きました。大学生でも始められるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20歳以上の学生は、国民年金の保険料を納めていれば加入できます。ただし、学生納付特例を受けている間や、20歳になる前は原則として加入できません。加入できても、学生のうちは税の得が小さく、60歳まで引き出せないため、多くの場合はNISAが先です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>iDeCoのしくみ\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"iDeCo\">iDeCo\u003c/span>（個人型確定拠出年金）は、自分で掛金を出して運用し、原則60歳以降に受け取る私的な年金です。掛金は月5,000円から出せます。\u003c/p>\n\u003cp>税の優遇は3つあります。\u003c/p>\n\u003col>\u003cli>掛金の全額が\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"所得控除\">所得控除\u003c/span>になり、所得税・住民税が減る\u003c/li>\u003cli>運用で出た利益に税金がかからない\u003c/li>\u003cli>受け取るときにも税の控除がある\u003c/li>\u003c/ol>\n\u003ch2>学生が加入できる条件\u003c/h2>\n\u003cp>20歳以上の学生は、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"国民年金第1号被保険者\">国民年金第1号被保険者\u003c/span>として加入資格があります。ただし、国民年金保険料の免除や納付猶予を受けている人は加入できません。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状況\u003c/th>\u003cth>iDeCo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>18〜19歳の学生\u003c/td>\u003ctd>加入できない（国民年金は20歳から）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20歳以上で保険料を納付\u003c/td>\u003ctd>加入できる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"学生納付特例\">学生納付特例\u003c/span>を利用中\u003c/td>\u003ctd>加入できない\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>国民年金保険料は2026年度で月17,920円です。なお、会社員として厚生年金に入っている人は、20歳未満でも別の区分で加入できます。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、年金保険料を払っていないとiDeCoに入れないのでしょうか。\u003c/p>\n\u003cp>日本の年金は、よく建物の階にたとえられます。1階が全員共通の国民年金、その上に会社員の厚生年金、さらに上にiDeCoなどの私的年金が乗ります。iDeCoは「上乗せ」として作られた制度なのです。\u003c/p>\n\u003cp>1階が空いたまま上の階だけ積むと、建物の順序が逆になります。学生納付特例は「今は払えない事情がある」と国が認め、支払いを待っている状態です。その間に別の老後資金を積むのは筋が通らないため、加入できない決まりになっています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>「税の得」は、税金を払っている人にしか出ない\u003c/h2>\n\u003cp>所得控除は、税金を計算するもとの所得を小さくするしくみです。もともと所得税がかからない人は、減らせる税金がありません。\u003c/p>\n\u003cp>第36話で見るように、2026年分はバイト収入が年178万円以下なら所得税はかかりません。多くの学生にとって、1つ目の優遇はほとんど効きません。\u003c/p>\n\u003ch2>2026年12月からの改正\u003c/h2>\n\u003cp>国民年金第1号被保険者の掛金の上限は、国民年金基金と合わせて月6.8万円から月7.5万円に上がります。2026年12月分（2027年1月の引き落とし分）からです。加入できる年齢の上限も、一定の条件のもとで70歳未満に広がります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20歳でバイト収入が年100万円の学生を考えます。所得税はかからないので、月5,000円を掛けても節税はゼロです。\u003c/p>\n\u003cp>一方で手数料はかかります。加入時に2,829円、掛金を出すたびに105円です（2027年1月から月120円に変わる予定）。さらに、金融機関ごとの手数料が加わる場合もあります。\u003c/p>\n\u003cp>しかも、まず国民年金保険料の年約21.5万円（17,920円 × 12か月）を納めることが前提です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>iDeCoのお金は、原則60歳まで引き出せません。学生時代は、留学や就職などでお金の使い道が大きく変わる時期です。\u003c/p>\n\u003cp>社会人になり所得税を払うようになれば、iDeCoの価値は大きく上がります。今は「知っておく制度」と考えるのがよいでしょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>20歳以上の学生は、国民年金保険料を納めていれば加入できる\u003c/li>\u003cli>学生納付特例の利用中や20歳未満（会社員などを除く）は加入できない\u003c/li>\u003cli>所得税がかからない学生は節税効果が小さく、60歳まで引き出せない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>学生納付特例を受けている20歳の大学生は、iDeCoに加入できるでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">加入できる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">加入できない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">親の同意があれば加入できる\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>学生納付特例は保険料の納付猶予にあたり、猶予を受けている期間はiDeCoに加入できません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国民年金基金連合会「iDeCoの加入資格・掛金・受取方法等」 \u003ca href=\"https://www.ideco-koushiki.jp/guide/structure.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ideco-koushiki.jp/guide/structure.html\u003c/a>\u003c/li>\u003cli>国民年金基金連合会「用語集」 \u003ca href=\"https://www.ideco-koushiki.jp/yougo/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ideco-koushiki.jp/yougo/\u003c/a>\u003c/li>\u003cli>国民年金基金連合会「iDeCo加入者に係る手数料を見直します」 \u003ca href=\"https://www.ideco-koushiki.jp/library/pdf/leaflet202604.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ideco-koushiki.jp/library/pdf/leaflet202604.pdf\u003c/a>\u003c/li>\u003cli>厚生労働省「2026年12月からiDeCoがパワーアップ 制度改正の3つのポイント」 \u003ca href=\"https://www.mhlw.go.jp/web_magazine/column/20261020.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mhlw.go.jp/web_magazine/column/20261020.html\u003c/a>\u003c/li>\u003cli>厚生労働省「2025年の制度改正」 \u003ca href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/nenkin/nenkin/kyoshutsu/2025kaisei.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/nenkin/nenkin/kyoshutsu/2025kaisei.html\u003c/a>\u003c/li>\u003cli>日本年金機構「国民年金保険料の学生納付特例制度」 \u003ca href=\"https://www.nenkin.go.jp/service/kokunen/menjo/20150514.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nenkin.go.jp/service/kokunen/menjo/20150514.html\u003c/a>\u003c/li>\u003cli>日本年金機構「国民年金保険料」 \u003ca href=\"https://www.nenkin.go.jp/service/kokunen/hokenryo/hokenryo.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nenkin.go.jp/service/kokunen/hokenryo/hokenryo.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"iDeCoも税金が得になると聞きました。大学生でも始められるのでしょうか。 20歳以上の学生は、国民年金の保険料を納めていれば加入できます。ただし、学生納付特例を受けている間や、20歳になる前は原則として加入できません。加入できても、学生のうちは税の得が小さく、60歳まで引き出せないため、多くの場合はNISAが先です。 iDeCoのしくみ iDeCo（個人型確定拠出年金）は、自分で掛金を出して運用し、原則60歳以降に受け取る私的な年金です。掛金は月5,000円から出せます。 税の優遇は3つあります。 掛金の全額が所得控除になり、所得税・住民税が減る 運用で出た利益に税金がかからない 受け取るときにも税の控除がある 学生が加入できる条件 20歳以上の学生は、国民年金第1号被保険者として加入資格があります。ただし、国民年金保険料の免除や納付猶予を受けている人は加入できません。 状況 iDeCo 18〜19歳の学生 加入できない（国民年金は20歳から） 20歳以上で保険料を納付 加入できる 学生納付特例を利用中 加入できない 国民年金保険料は2026年度で月17,920円です。なお、会社員として厚生年金に入っている人は、20歳未満でも別の区分で加入できます。 なぜ、年金保険料を払っていないとiDeCoに入れないのでしょうか。 日本の年金は、よく建物の階にたとえられます。1階が全員共通の国民年金、その上に会社員の厚生年金、さらに上にiDeCoなどの私的年金が乗ります。iDeCoは「上乗せ」として作られた制度なのです。 1階が空いたまま上の階だけ積むと、建物の順序が逆になります。学生納付特例は「今は払えない事情がある」と国が認め、支払いを待っている状態です。その間に別の老後資金を積むのは筋が通らないため、加入できない決まりになっています。 「税の得」は、税金を払っている人にしか出ない 所得控除は、税金を計算するもとの所得を小さくするしくみです。もともと所得税がかからない人は、減らせる税金がありません。 第36話で見るように、2026年分はバイト収入が年178万円以下なら所得税はかかりません。多くの学生にとって、1つ目の優遇はほとんど効きません。 2026年12月からの改正 国民年金第1号被保険者の掛金の上限は、国民年金基金と合わせて月6.8万円から月7.5万円に上がります。2026年12月分（2027年1月の引き落とし分）からです。加入できる年齢の上限も、一定の条件のもとで70歳未満に広がります。 20歳でバイト収入が年100万円の学生を考えます。所得税はかからないので、月5,000円を掛けても節税はゼロです。 一方で手数料はかかります。加入時に2,829円、掛金を出すたびに105円です（2027年1月から月120円に変わる予定）。さらに、金融機関ごとの手数料が加わる場合もあります。 しかも、まず国民年金保険料の年約21.5万円（17,920円 × 12か月）を納めることが前提です。 iDeCoのお金は、原則60歳まで引き出せません。学生時代は、留学や就職などでお金の使い道が大きく変わる時期です。 社会人になり所得税を払うようになれば、iDeCoの価値は大きく上がります。今は「知っておく制度」と考えるのがよいでしょう。 20歳以上の学生は、国民年金保険料を納めていれば加入できる 学生納付特例の利用中や20歳未満（会社員などを除く）は加入できない 所得税がかからない学生は節税効果が小さく、60歳まで引き出せない 学生納付特例を受けている20歳の大学生は、iDeCoに加入できるでしょうか。 加入できる 加入できない 親の同意があれば加入できる 学生納付特例は保険料の納付猶予にあたり、猶予を受けている期間はiDeCoに加入できません。"},{"no":34,"part":5,"title":"証券口座の選び方","subtitle":"銀行と証券会社の違い","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISAは銀行でも始められると聞きました。銀行と証券会社、どちらで口座を作るのがよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>NISA口座は1人1つなので、選ぶ金融機関は大切です。銀行は投資信託が中心で、NISAで株やETFを買えないことが多いです。証券会社は商品が多く、手数料も低い傾向があります。特定の会社ではなく、比べる観点を持って選びましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>銀行と証券会社、何が違うのか\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>観点\u003c/th>\u003cth>銀行\u003c/th>\u003cth>証券会社\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>買える商品\u003c/td>\u003ctd>主に投資信託\u003c/td>\u003ctd>株式・ETF・投資信託\u003c/td>\u003c/tr>\u003ctr>\u003ctd>相談\u003c/td>\u003ctd>窓口で話しやすい\u003c/td>\u003ctd>ネット中心の会社が多い\u003c/td>\u003c/tr>\u003ctr>\u003ctd>品ぞろえ\u003c/td>\u003ctd>絞られていることが多い\u003c/td>\u003ctd>多いことが多い\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>対面の窓口がある証券会社もあれば、店舗のない\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ネット証券\">ネット証券\u003c/span>もあります。同じ「証券会社」でも中身はさまざまです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ銀行では、ふつう株が買えないのでしょうか。\u003c/p>\n\u003cp>銀行の本業は、預金を預かって貸し出すことです。預金は多くの人の生活のお金です。そのため法律で、銀行と証券会社の仕事は分けられてきました。株の売買の仲介は、原則として証券会社の仕事です。\u003c/p>\n\u003cp>1990年代後半の金融制度改革で、銀行も投資信託を売れるようになりました。ただ、株の売買そのものは今も証券会社の役割です。銀行のNISAで買えるものが投資信託中心なのは、この線引きの名残なのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>比べるときの5つの観点\u003c/h2>\n\u003col>\u003cli>\u003cstrong>商品\u003c/strong>: つみたて投資枠の商品が何本あるか。買いたい投資信託があるか。\u003c/li>\u003cli>\u003cstrong>コスト\u003c/strong>: 株やETFの売買手数料。同じ投資信託なら、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"信託報酬\">信託報酬\u003c/span>はどこで買っても同じです。\u003c/li>\u003cli>\u003cstrong>積立の柔軟さ\u003c/strong>: 最低いくらから積み立てられるか。毎月か毎日か。クレジットカードで払えるか。\u003c/li>\u003cli>\u003cstrong>使いやすさ\u003c/strong>: スマホのアプリで迷わず操作できるか。\u003c/li>\u003cli>\u003cstrong>安全面\u003c/strong>: ログイン時の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"多要素認証\">多要素認証\u003c/span>などのセキュリティ。\u003c/li>\u003c/ol>\n\u003cp>証券会社は、預かった資産を自社の財産と分けて管理する義務があります。万一それが守られず返せない場合も、日本投資者保護基金が1人1,000万円まで補償します。ただし、値下がりによる損は補償されません。\u003c/p>\n\u003ch2>あとから金融機関を変えられるか\u003c/h2>\n\u003cp>NISAの金融機関は、年単位で変えられます。ただし、その年にすでにNISAで買っていると、その年の分は変更できません。\u003c/p>\n\u003cp>変えても、前の金融機関で買った商品は売らずに持ち続けられます。とはいえ手続きの手間はあるので、最初によく比べておくのが楽です。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち、毎月5,000円を投資信託で積み立てたい学生を考えます。\u003c/p>\n\u003cp>この場合に大事なのは、少額から積み立てられるか、買いたい投資信託があるか、アプリが使いやすいかです。株の売買手数料は、今はあまり関係ありません。\u003c/p>\n\u003cp>将来、個別株も試してみたいなら、株を扱う証券会社を選んでおくと口座を作り直さずに済みます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>窓口では、手数料の高い商品や、毎月分配型の商品を勧められることがあります。勧められた理由と、かかる手数料をかならず確かめてください。\u003c/p>\n\u003cp>また、ポイントの還元率だけで選ぶのは避けましょう。ポイントの条件は変わることがあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>NISA口座は1人1つ。銀行は投資信託中心、証券会社は株やETFも買える\u003c/li>\u003cli>商品・コスト・積立の柔軟さ・使いやすさ・安全面の5つで比べる\u003c/li>\u003cli>金融機関は年単位で変えられるが、その年に買っていると翌年から\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>同じ投資信託を、A社とB社のどちらで買っても変わらないものはどれでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">ポイントの還元率\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">信託報酬\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">アプリの使いやすさ\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>信託報酬は投資信託ごとに決まっているため、どの金融機関で買っても同じです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「よくある質問（NISA特設ウェブサイト）」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/question/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/question/index.html\u003c/a>\u003c/li>\u003cli>国税庁「NISA口座の新規開設又は変更に関する手続等について」 \u003ca href=\"https://www.nta.go.jp/users/gensen/nisa/tetsuzuki.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/users/gensen/nisa/tetsuzuki.htm\u003c/a>\u003c/li>\u003cli>日本投資者保護基金「投資者保護とは」 \u003ca href=\"https://jipf.or.jp/introduction/\" target=\"_blank\" rel=\"noopener noreferrer\">https://jipf.or.jp/introduction/\u003c/a>\u003c/li>\u003cli>日本証券業協会「インターネット取引における不正アクセス等防止に向けたガイドライン」 \u003ca href=\"https://www.jsda.or.jp/about/hatten/inv_alerts/alearts04/files/20251015_internetgl.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jsda.or.jp/about/hatten/inv_alerts/alearts04/files/20251015_internetgl.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"NISAは銀行でも始められると聞きました。銀行と証券会社、どちらで口座を作るのがよいのでしょうか。 NISA口座は1人1つなので、選ぶ金融機関は大切です。銀行は投資信託が中心で、NISAで株やETFを買えないことが多いです。証券会社は商品が多く、手数料も低い傾向があります。特定の会社ではなく、比べる観点を持って選びましょう。 銀行と証券会社、何が違うのか 観点 銀行 証券会社 買える商品 主に投資信託 株式・ETF・投資信託 相談 窓口で話しやすい ネット中心の会社が多い 品ぞろえ 絞られていることが多い 多いことが多い 対面の窓口がある証券会社もあれば、店舗のないネット証券もあります。同じ「証券会社」でも中身はさまざまです。 なぜ銀行では、ふつう株が買えないのでしょうか。 銀行の本業は、預金を預かって貸し出すことです。預金は多くの人の生活のお金です。そのため法律で、銀行と証券会社の仕事は分けられてきました。株の売買の仲介は、原則として証券会社の仕事です。 1990年代後半の金融制度改革で、銀行も投資信託を売れるようになりました。ただ、株の売買そのものは今も証券会社の役割です。銀行のNISAで買えるものが投資信託中心なのは、この線引きの名残なのです。 比べるときの5つの観点 商品: つみたて投資枠の商品が何本あるか。買いたい投資信託があるか。 コスト: 株やETFの売買手数料。同じ投資信託なら、信託報酬はどこで買っても同じです。 積立の柔軟さ: 最低いくらから積み立てられるか。毎月か毎日か。クレジットカードで払えるか。 使いやすさ: スマホのアプリで迷わず操作できるか。 安全面: ログイン時の多要素認証などのセキュリティ。 証券会社は、預かった資産を自社の財産と分けて管理する義務があります。万一それが守られず返せない場合も、日本投資者保護基金が1人1,000万円まで補償します。ただし、値下がりによる損は補償されません。 あとから金融機関を変えられるか NISAの金融機関は、年単位で変えられます。ただし、その年にすでにNISAで買っていると、その年の分は変更できません。 変えても、前の金融機関で買った商品は売らずに持ち続けられます。とはいえ手続きの手間はあるので、最初によく比べておくのが楽です。 20万円のうち、毎月5,000円を投資信託で積み立てたい学生を考えます。 この場合に大事なのは、少額から積み立てられるか、買いたい投資信託があるか、アプリが使いやすいかです。株の売買手数料は、今はあまり関係ありません。 将来、個別株も試してみたいなら、株を扱う証券会社を選んでおくと口座を作り直さずに済みます。 窓口では、手数料の高い商品や、毎月分配型の商品を勧められることがあります。勧められた理由と、かかる手数料をかならず確かめてください。 また、ポイントの還元率だけで選ぶのは避けましょう。ポイントの条件は変わることがあります。 NISA口座は1人1つ。銀行は投資信託中心、証券会社は株やETFも買える 商品・コスト・積立の柔軟さ・使いやすさ・安全面の5つで比べる 金融機関は年単位で変えられるが、その年に買っていると翌年から 同じ投資信託を、A社とB社のどちらで買っても変わらないものはどれでしょうか。 ポイントの還元率 信託報酬 アプリの使いやすさ 信託報酬は投資信託ごとに決まっているため、どの金融機関で買っても同じです。"},{"no":35,"part":5,"title":"特定口座・一般口座・NISA口座","subtitle":"税金の計算を「誰が」するかの違い","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>口座を作るとき、「特定口座（源泉徴収あり・なし）」や「一般口座」を選ぶ画面が出ると聞きました。どれを選べばよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>3つの違いは、税金の計算と支払いを誰がするかです。特定口座の「源泉徴収あり」を選ぶと、証券会社が計算して代わりに納めてくれます。原則として確定申告もいりません。学生には、多くの場合これがわかりやすい選択です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>口座の種類と税金\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>口座\u003c/th>\u003cth>税金の計算\u003c/th>\u003cth>確定申告\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>NISA口座\u003c/td>\u003ctd>非課税\u003c/td>\u003ctd>不要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>特定口座（源泉徴収あり）\u003c/td>\u003ctd>証券会社が計算し天引き\u003c/td>\u003ctd>原則不要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>特定口座（源泉徴収なし）\u003c/td>\u003ctd>証券会社が計算書を作る\u003c/td>\u003ctd>原則として自分で行う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般口座\u003c/td>\u003ctd>自分で計算\u003c/td>\u003ctd>自分で行う\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>NISA口座は、ふつう単独では作りません。証券会社の総合口座の中に、課税される口座と並べて作ります。NISAの枠を超えた分や、NISAで買えない商品は、課税される口座で買うことになります。\u003c/p>\n\u003ch2>用語をひとことで\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"特定口座\">特定口座\u003c/span>: 1年間の売買の損益を、証券会社が計算してくれる口座\u003c/li>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"源泉徴収\">源泉徴収\u003c/span>: 利益が出たときに、税金をその場で差し引いて納める方式\u003c/li>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"一般口座\">一般口座\u003c/span>: 計算も申告もすべて自分で行う口座\u003c/li>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"確定申告\">確定申告\u003c/span>: 1年分の所得と税金を、自分で計算して税務署に届けること\u003c/li>\u003c/ul>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「特定口座」という仕組みがあるのでしょうか。\u003c/p>\n\u003cp>日本の税金は、自分で所得を計算して申告するのが原則です。株の利益も、本来は自分で1年分を計算して申告します。\u003c/p>\n\u003cp>ところが、これが意外に難しいのです。同じ投資信託を毎月少しずつ買えば、買った値段は毎回違います。売ったときの利益を出すには、平均の買い値を計算しなければなりません。\u003c/p>\n\u003cp>個人の投資家が増えるほど、本人も税務署も手間が大きくなります。そこで2003年に、証券会社が計算を代わりに行う特定口座が生まれました。さらに「源泉徴収あり」を選べば、給料の天引きと同じ発想で、納税まで済ませてくれます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>学生に「源泉徴収あり」が向く理由\u003c/h2>\n\u003cp>確定申告をしないことを選んだ源泉徴収ありの利益は、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"合計所得金額\">合計所得金額\u003c/span>に含まれません。合計所得金額は、親の扶養に入れるかどうかの判定に使われる数字です。詳しくは第36話で扱います。\u003c/p>\n\u003cp>一方、源泉徴収なしや一般口座で申告すると、その利益は所得に数えられます。\u003c/p>\n\u003cp>なお、源泉徴収ありでも、あえて申告することはできます。複数の証券会社の損益を通算したいときなどです。ただしその場合、利益は所得に数えられます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>特定口座（源泉徴収あり）で、5万円で買った株を7万円で売ったとします。利益は2万円です。\u003c/p>\n\u003cp>税金は2万円 × 20.315% = 4,063円で、自動で差し引かれます。手元に残る利益は15,937円です。\u003c/p>\n\u003cp>同じ年、同じ口座で別の株に1万円の損が出たら、自動で差し引きされます。利益は合わせて1万円になり、払いすぎた分の税金は口座に戻ってきます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>源泉徴収あり・なしは、その年の最初に売る前までに選びます。年の途中では変えられません。\u003c/p>\n\u003cp>迷ったら、まずは「特定口座（源泉徴収あり）」と「NISA口座」を同時に申し込む人が多いです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>口座の違いは、税金の計算と支払いを誰がするか\u003c/li>\u003cli>特定口座（源泉徴収あり）なら、証券会社が計算・納税し、原則申告不要\u003c/li>\u003cli>申告しない源泉徴収ありの利益は、扶養判定の合計所得金額に入らない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>確定申告をしなくても、税金の計算と納付が済むのはどの口座でしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">一般口座\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">特定口座（源泉徴収なし）\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">特定口座（源泉徴収あり）\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>源泉徴収ありを選ぶと、証券会社が利益から税金を差し引いて納めるため、原則として申告はいりません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁 確定申告書等作成コーナー「特定口座（源泉徴収あり）とは」 \u003ca href=\"https://www.keisan.nta.go.jp/r2yokuaru/cat2/cat21/cat219/yogosetsumei/gensenchoshukoza.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.keisan.nta.go.jp/r2yokuaru/cat2/cat21/cat219/yogosetsumei/gensenchoshukoza.html\u003c/a>\u003c/li>\u003cli>国税庁「No.1474 上場株式等に係る譲渡損失の損益通算及び繰越控除」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1474.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1474.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1190 配偶者の所得がいくらまでなら配偶者控除が受けられるか」（合計所得金額に含まれない所得の説明） \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1190.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1190.htm\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"口座を作るとき、「特定口座（源泉徴収あり・なし）」や「一般口座」を選ぶ画面が出ると聞きました。どれを選べばよいのでしょうか。 3つの違いは、税金の計算と支払いを誰がするかです。特定口座の「源泉徴収あり」を選ぶと、証券会社が計算して代わりに納めてくれます。原則として確定申告もいりません。学生には、多くの場合これがわかりやすい選択です。 口座の種類と税金 口座 税金の計算 確定申告 NISA口座 非課税 不要 特定口座（源泉徴収あり） 証券会社が計算し天引き 原則不要 特定口座（源泉徴収なし） 証券会社が計算書を作る 原則として自分で行う 一般口座 自分で計算 自分で行う NISA口座は、ふつう単独では作りません。証券会社の総合口座の中に、課税される口座と並べて作ります。NISAの枠を超えた分や、NISAで買えない商品は、課税される口座で買うことになります。 用語をひとことで 特定口座: 1年間の売買の損益を、証券会社が計算してくれる口座 源泉徴収: 利益が出たときに、税金をその場で差し引いて納める方式 一般口座: 計算も申告もすべて自分で行う口座 確定申告: 1年分の所得と税金を、自分で計算して税務署に届けること なぜ「特定口座」という仕組みがあるのでしょうか。 日本の税金は、自分で所得を計算して申告するのが原則です。株の利益も、本来は自分で1年分を計算して申告します。 ところが、これが意外に難しいのです。同じ投資信託を毎月少しずつ買えば、買った値段は毎回違います。売ったときの利益を出すには、平均の買い値を計算しなければなりません。 個人の投資家が増えるほど、本人も税務署も手間が大きくなります。そこで2003年に、証券会社が計算を代わりに行う特定口座が生まれました。さらに「源泉徴収あり」を選べば、給料の天引きと同じ発想で、納税まで済ませてくれます。 学生に「源泉徴収あり」が向く理由 確定申告をしないことを選んだ源泉徴収ありの利益は、合計所得金額に含まれません。合計所得金額は、親の扶養に入れるかどうかの判定に使われる数字です。詳しくは第36話で扱います。 一方、源泉徴収なしや一般口座で申告すると、その利益は所得に数えられます。 なお、源泉徴収ありでも、あえて申告することはできます。複数の証券会社の損益を通算したいときなどです。ただしその場合、利益は所得に数えられます。 特定口座（源泉徴収あり）で、5万円で買った株を7万円で売ったとします。利益は2万円です。 税金は2万円 × 20.315% = 4,063円で、自動で差し引かれます。手元に残る利益は15,937円です。 同じ年、同じ口座で別の株に1万円の損が出たら、自動で差し引きされます。利益は合わせて1万円になり、払いすぎた分の税金は口座に戻ってきます。 源泉徴収あり・なしは、その年の最初に売る前までに選びます。年の途中では変えられません。 迷ったら、まずは「特定口座（源泉徴収あり）」と「NISA口座」を同時に申し込む人が多いです。 口座の違いは、税金の計算と支払いを誰がするか 特定口座（源泉徴収あり）なら、証券会社が計算・納税し、原則申告不要 申告しない源泉徴収ありの利益は、扶養判定の合計所得金額に入らない 確定申告をしなくても、税金の計算と納付が済むのはどの口座でしょうか。 一般口座 特定口座（源泉徴収なし） 特定口座（源泉徴収あり） 源泉徴収ありを選ぶと、証券会社が利益から税金を差し引いて納めるため、原則として申告はいりません。"},{"no":36,"part":5,"title":"バイト収入と税金・扶養","subtitle":"年収の壁と投資の利益","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>バイトを始めるなら「103万円の壁」に気をつけて、と言われました。今もそうなのでしょうか。投資の利益も関係しますか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>2025年と2026年の税制改正で、壁の位置は大きく変わりました。壁は1つではなく、本人の税金、親の税金、親の健康保険で別々にあります。NISAの利益と、申告しない源泉徴収ありの利益は、税の扶養の判定に入りません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>2026年の主な「壁」\u003c/h2>\n\u003cp>バイトの給料だけの場合の目安です（2026年10月時点の制度）。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>壁\u003c/th>\u003cth>目安\u003c/th>\u003cth>超えると\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>本人の所得税\u003c/td>\u003ctd>178万円\u003c/td>\u003ctd>所得税がかかり始める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>本人の住民税\u003c/td>\u003ctd>約119万円\u003c/td>\u003ctd>住民税がかかり始める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>親の扶養控除\u003c/td>\u003ctd>136万円\u003c/td>\u003ctd>親の税金の控除が減る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>親の健康保険の扶養\u003c/td>\u003ctd>150万円未満\u003c/td>\u003ctd>自分で保険に入る\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>住民税の目安は、2026年の収入にかかる分（2027年度）を名古屋市の例で示したもので、住む自治体によって少し違います。\u003c/p>\n\u003cp>本人の所得税の178万円には、2026年分と2027年分だけの上乗せ（特例）が含まれます。\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"基礎控除\">基礎控除\u003c/span>が最大104万円、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"給与所得控除\">給与所得控除\u003c/span>の最低額が74万円で、合わせて178万円です。\u003c/p>\n\u003ch2>年齢で変わる部分に注意\u003c/h2>\n\u003cp>親の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"扶養控除\">扶養控除\u003c/span>は、子の給料が136万円以下なら満額です。子が19〜22歳なら、136万円を超えても197万円までは\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"特定親族特別控除\">特定親族特別控除\u003c/span>で控除が段階的に残ります。\u003c/p>\n\u003cp>健康保険の150万円未満も、19〜22歳の人の基準です。年齢はどちらも、その年の12月31日時点で見ます。18歳の年は、健康保険の基準は130万円未満で、特定親族特別控除もありません。\u003c/p>\n\u003cp>勤務先で社会保険に入る基準は、2026年10月に賃金の条件がなくなりました。ただし学生は、定時制や通信制などを除き、原則として対象外のままです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「壁」ができるのでしょうか。\u003c/p>\n\u003cp>所得税は、収入から各種の控除を引いた残りにかかります。控除は「この金額までは生活に必要なので税をかけない」という線です。\u003c/p>\n\u003cp>親の扶養控除は「子を養っている」ことへの配慮です。子が自分で十分に稼げるなら配慮はいらない、と考えて線が引かれます。線の手前と向こうで親の税金が急に増えるので、崖のような「壁」になります。\u003c/p>\n\u003cp>特定親族特別控除は、この崖をなだらかな坂に変えるために作られました。また、物価が上がると控除が実態に合わなくなります。2026年度の改正では、物価に合わせて控除を見直すしくみも作られました。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>投資の利益は扶養に影響するか\u003c/h2>\n\u003cp>税の扶養は、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"合計所得金額\">合計所得金額\u003c/span>という数字で判定します。\u003c/p>\n\u003cul>\u003cli>NISAの利益: 非課税なので含まれない\u003c/li>\u003cli>特定口座（源泉徴収あり）で申告しない利益: 含まれない\u003c/li>\u003cli>確定申告した利益、一般口座の利益: 含まれる\u003c/li>\u003c/ul>\n\u003cp>所得の少ない学生は、源泉徴収ありの利益をあえて確定申告すると、使い切れていない基礎控除が差し引かれ、引かれた税金が戻ることがあります。ただしその利益は合計所得金額に入り、扶養の判定に影響しうる点に注意が必要です。\u003c/p>\n\u003cp>健康保険の扶養（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"被扶養者\">被扶養者\u003c/span>）は、税とは別の「収入」で判定します。投資の利益の数え方は、親が入る健康保険によって扱いが違うことがあります。気になる場合は、親の勤務先の健康保険に確認してください。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>19歳で、時給1,200円（例）で週15時間、年50週働くとします。1,200円 × 15時間 × 50週 = 90万円です。\u003c/p>\n\u003cp>この場合、所得税も住民税もかかりません。親の扶養からも外れません。投資はNISAと特定口座（源泉徴収あり）で行えば、利益が扶養の判定を動かす心配も小さくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>数字は2026年10月時点の制度で、改正が続いています。特例部分は2027年分までの時限措置です。毎月の給料から引かれた所得税は、年末調整や確定申告で戻ることがあります。年の途中で壁を超えそうなら、早めに親に相談しましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>壁は本人の税金・親の税金・親の健康保険で別々にある\u003c/li>\u003cli>2026年分は所得税178万円、親の扶養控除136万円（19〜22歳は197万円まで段階的）\u003c/li>\u003cli>NISAと申告しない源泉徴収ありの利益は、税の扶養判定に入らない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>20歳の学生の、税の扶養の判定に含まれる投資の利益はどれでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">NISA口座の売却益\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">特定口座（源泉徴収あり）で申告しない売却益\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">確定申告をした売却益\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>確定申告をした利益は合計所得金額に含まれ、扶養の判定に影響します。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>国税庁「No.1199 基礎控除」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1177 特定親族特別控除」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1177.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1177.htm\u003c/a>\u003c/li>\u003cli>国税庁「令和8年分 年末調整のしかた」 \u003ca href=\"https://www.nta.go.jp/publication/pamph/gensen/nencho2026/01.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/publication/pamph/gensen/nencho2026/01.htm\u003c/a>\u003c/li>\u003cli>国税庁「令和8年度税制改正による基礎控除の引上げ等について（令和8年5月）」 \u003ca href=\"https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/users/gensen/2026kiso/pdf/0026005-024.pdf\u003c/a>\u003c/li>\u003cli>国税庁「No.1190 配偶者の所得がいくらまでなら配偶者控除が受けられるか」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1190.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1190.htm\u003c/a>\u003c/li>\u003cli>財務省「令和8年度税制改正の大綱の概要」 \u003ca href=\"https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/08taikou_gaiyou.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/08taikou_gaiyou.pdf\u003c/a>\u003c/li>\u003cli>名古屋市「令和9年度以降適用される市民税・県民税に関する主な税制改正」 \u003ca href=\"https://www.city.nagoya.jp/kurashi/zeikin/1037356/1011880/1011899/1045304.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.city.nagoya.jp/kurashi/zeikin/1037356/1011880/1011899/1045304.html\u003c/a>\u003c/li>\u003cli>日本年金機構「19歳以上23歳未満の方の被扶養者認定における年間収入要件が変わります」 \u003ca href=\"https://www.nenkin.go.jp/oshirase/taisetu/2025/202508/0819.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nenkin.go.jp/oshirase/taisetu/2025/202508/0819.html\u003c/a>\u003c/li>\u003cli>日本年金機構「2026（令和8）年10月に社会保険の短時間労働者に係る賃金要件が撤廃されました」 \u003ca href=\"https://www.nenkin.go.jp/oshirase/taisetu/jigyosho/2026/202610/100104.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nenkin.go.jp/oshirase/taisetu/jigyosho/2026/202610/100104.html\u003c/a>\u003c/li>\u003cli>厚生労働省「適用拡大Q&amp;A（社会保険適用拡大特設サイト）」 \u003ca href=\"https://www.mhlw.go.jp/tekiyoukakudai/qa/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mhlw.go.jp/tekiyoukakudai/qa/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"バイトを始めるなら「103万円の壁」に気をつけて、と言われました。今もそうなのでしょうか。投資の利益も関係しますか。 2025年と2026年の税制改正で、壁の位置は大きく変わりました。壁は1つではなく、本人の税金、親の税金、親の健康保険で別々にあります。NISAの利益と、申告しない源泉徴収ありの利益は、税の扶養の判定に入りません。 2026年の主な「壁」 バイトの給料だけの場合の目安です（2026年10月時点の制度）。 壁 目安 超えると 本人の所得税 178万円 所得税がかかり始める 本人の住民税 約119万円 住民税がかかり始める 親の扶養控除 136万円 親の税金の控除が減る 親の健康保険の扶養 150万円未満 自分で保険に入る 住民税の目安は、2026年の収入にかかる分（2027年度）を名古屋市の例で示したもので、住む自治体によって少し違います。 本人の所得税の178万円には、2026年分と2027年分だけの上乗せ（特例）が含まれます。基礎控除が最大104万円、給与所得控除の最低額が74万円で、合わせて178万円です。 年齢で変わる部分に注意 親の扶養控除は、子の給料が136万円以下なら満額です。子が19〜22歳なら、136万円を超えても197万円までは特定親族特別控除で控除が段階的に残ります。 健康保険の150万円未満も、19〜22歳の人の基準です。年齢はどちらも、その年の12月31日時点で見ます。18歳の年は、健康保険の基準は130万円未満で、特定親族特別控除もありません。 勤務先で社会保険に入る基準は、2026年10月に賃金の条件がなくなりました。ただし学生は、定時制や通信制などを除き、原則として対象外のままです。 なぜ「壁」ができるのでしょうか。 所得税は、収入から各種の控除を引いた残りにかかります。控除は「この金額までは生活に必要なので税をかけない」という線です。 親の扶養控除は「子を養っている」ことへの配慮です。子が自分で十分に稼げるなら配慮はいらない、と考えて線が引かれます。線の手前と向こうで親の税金が急に増えるので、崖のような「壁」になります。 特定親族特別控除は、この崖をなだらかな坂に変えるために作られました。また、物価が上がると控除が実態に合わなくなります。2026年度の改正では、物価に合わせて控除を見直すしくみも作られました。 投資の利益は扶養に影響するか 税の扶養は、合計所得金額という数字で判定します。 NISAの利益: 非課税なので含まれない 特定口座（源泉徴収あり）で申告しない利益: 含まれない 確定申告した利益、一般口座の利益: 含まれる 所得の少ない学生は、源泉徴収ありの利益をあえて確定申告すると、使い切れていない基礎控除が差し引かれ、引かれた税金が戻ることがあります。ただしその利益は合計所得金額に入り、扶養の判定に影響しうる点に注意が必要です。 健康保険の扶養（被扶養者）は、税とは別の「収入」で判定します。投資の利益の数え方は、親が入る健康保険によって扱いが違うことがあります。気になる場合は、親の勤務先の健康保険に確認してください。 19歳で、時給1,200円（例）で週15時間、年50週働くとします。1,200円 × 15時間 × 50週 = 90万円です。 この場合、所得税も住民税もかかりません。親の扶養からも外れません。投資はNISAと特定口座（源泉徴収あり）で行えば、利益が扶養の判定を動かす心配も小さくなります。 数字は2026年10月時点の制度で、改正が続いています。特例部分は2027年分までの時限措置です。毎月の給料から引かれた所得税は、年末調整や確定申告で戻ることがあります。年の途中で壁を超えそうなら、早めに親に相談しましょう。 壁は本人の税金・親の税金・親の健康保険で別々にある 2026年分は所得税178万円、親の扶養控除136万円（19〜22歳は197万円まで段階的） NISAと申告しない源泉徴収ありの利益は、税の扶養判定に入らない 20歳の学生の、税の扶養の判定に含まれる投資の利益はどれでしょうか。 NISA口座の売却益 特定口座（源泉徴収あり）で申告しない売却益 確定申告をした売却益 確定申告をした利益は合計所得金額に含まれ、扶養の判定に影響します。"},{"no":37,"part":6,"title":"口座開設の手順","subtitle":"必要なものと流れ","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>いよいよ口座を作ろうと思います。何を用意して、どんな順番で進めればよいのでしょうか。親の同意は必要ですか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>用意するのは、マイナンバーがわかるもの、本人確認書類、本人名義の銀行口座、スマホとメールアドレスです。18歳以上なら、法律上は親の同意なしで契約できます。ただしNISAは、その年の1月1日時点で18歳以上であることが条件です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>用意するもの\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"マイナンバー\">マイナンバー\u003c/span>がわかるもの（マイナンバーカードなど）\u003c/li>\u003cli>本人確認書類（マイナンバーカードがあれば、多くの場合1枚で済む）\u003c/li>\u003cli>本人名義の銀行口座（売ったお金を受け取る先）\u003c/li>\u003cli>スマホとメールアドレス\u003c/li>\u003c/ul>\n\u003cp>マイナンバーカードがない場合は、通知カードなどと運転免許証など、複数の書類が必要になることがあります。必要な組み合わせは金融機関ごとに確認してください。\u003c/p>\n\u003ch2>申し込みの流れ\u003c/h2>\n\u003col>\u003cli>比べて金融機関を選ぶ（第34話）\u003c/li>\u003cli>申込画面で氏名・住所・職業・年収・投資経験などを入力する\u003c/li>\u003cli>口座の種類を選ぶ（特定口座の源泉徴収あり・NISA口座など。第35話）\u003c/li>\u003cli>スマホで書類と顔を撮影して\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"本人確認\">本人確認\u003c/span>をする\u003c/li>\u003cli>審査のあと、ログイン情報が届く\u003c/li>\u003cli>ログインして、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"多要素認証\">多要素認証\u003c/span>や出金先の銀行口座を設定する\u003c/li>\u003cli>NISA口座は、金融機関が税務署に確認する手続きがあり、時間がかかることがある\u003c/li>\u003cli>入金して、買う準備が整う\u003c/li>\u003c/ol>\n\u003cp>職業は「学生」、年収はバイト収入の見込みを正直に書きます。投資経験も「なし」で問題ありません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ証券会社は、マイナンバーまで求めるのでしょうか。\u003c/p>\n\u003cp>理由の1つは税金です。証券会社は、お客さんの利益や配当の情報を税務署に報告します。その情報を正しく本人と結びつけるために、マイナンバーの提供が法律で求められています。NISAが1人1口座に限られることを確かめるためにも使われます。\u003c/p>\n\u003cp>もう1つは、なりすましや犯罪のお金の受け渡しを防ぐことです。他人の名前で口座が作れると、詐欺で得たお金を隠す道具になってしまいます。厳しい本人確認は、利用者全体を守るための入口なのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>18歳と「親の同意」\u003c/h2>\n\u003cp>2022年4月から、成年年齢は18歳です。18歳以上なら、証券口座も親の同意なしで開けます。\u003c/p>\n\u003cp>その代わり、未成年なら使えた「親の同意のない契約を取り消す」権利はなくなります。自分で契約し、自分で責任を持つ立場になったということです。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>誕生日が2008年5月の大学1年生（例）を考えます。2026年1月1日時点では17歳なので、2026年中はNISA口座を開けません。\u003c/p>\n\u003cp>ただし、課税される口座は18歳になれば開けます。NISAは2027年1月から使えます。それまでは、20万円は預金のまま、仕組みの勉強や口座の準備にあてるのも一つの方法です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>2025年には、証券口座の乗っ取り被害が相次ぎました。メールやSMSのリンクからログインしないこと、多要素認証をかならず設定することが大切です。\u003c/p>\n\u003cp>パスワードは、他のサービスと同じものを使わないでください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>マイナンバー・本人確認書類・本人名義の銀行口座・スマホを用意する\u003c/li>\u003cli>18歳以上は親の同意なしで開けるが、NISAはその年の1月1日に18歳以上が条件\u003c/li>\u003cli>開設後はすぐに多要素認証を設定する\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>2026年1月1日時点で17歳、2026年6月に18歳になった人は、いつからNISAを使えるでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">18歳の誕生日から\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">2026年10月から\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">2027年1月から\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>NISAは、口座を開く年の1月1日時点で18歳以上であることが条件です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本証券業協会「マイナンバーについて」 \u003ca href=\"https://www.jsda.or.jp/about/hatten/mynumber/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jsda.or.jp/about/hatten/mynumber/index.html\u003c/a>\u003c/li>\u003cli>国税庁「NISA口座の新規開設又は変更に関する手続等について」 \u003ca href=\"https://www.nta.go.jp/users/gensen/nisa/tetsuzuki.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/users/gensen/nisa/tetsuzuki.htm\u003c/a>\u003c/li>\u003cli>国税庁「No.1535 NISA制度」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1535.htm\u003c/a>\u003c/li>\u003cli>法務省「民法（成年年齢関係）改正 Q&amp;A」 \u003ca href=\"https://www.moj.go.jp/MINJI/minji07_00238.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moj.go.jp/MINJI/minji07_00238.html\u003c/a>\u003c/li>\u003cli>日本証券業協会「インターネット取引における不正アクセス等防止に向けたガイドライン」（2025年10月15日） \u003ca href=\"https://www.jsda.or.jp/about/hatten/inv_alerts/alearts04/files/20251015_internetgl.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jsda.or.jp/about/hatten/inv_alerts/alearts04/files/20251015_internetgl.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"いよいよ口座を作ろうと思います。何を用意して、どんな順番で進めればよいのでしょうか。親の同意は必要ですか。 用意するのは、マイナンバーがわかるもの、本人確認書類、本人名義の銀行口座、スマホとメールアドレスです。18歳以上なら、法律上は親の同意なしで契約できます。ただしNISAは、その年の1月1日時点で18歳以上であることが条件です。 用意するもの マイナンバーがわかるもの（マイナンバーカードなど） 本人確認書類（マイナンバーカードがあれば、多くの場合1枚で済む） 本人名義の銀行口座（売ったお金を受け取る先） スマホとメールアドレス マイナンバーカードがない場合は、通知カードなどと運転免許証など、複数の書類が必要になることがあります。必要な組み合わせは金融機関ごとに確認してください。 申し込みの流れ 比べて金融機関を選ぶ（第34話） 申込画面で氏名・住所・職業・年収・投資経験などを入力する 口座の種類を選ぶ（特定口座の源泉徴収あり・NISA口座など。第35話） スマホで書類と顔を撮影して本人確認をする 審査のあと、ログイン情報が届く ログインして、多要素認証や出金先の銀行口座を設定する NISA口座は、金融機関が税務署に確認する手続きがあり、時間がかかることがある 入金して、買う準備が整う 職業は「学生」、年収はバイト収入の見込みを正直に書きます。投資経験も「なし」で問題ありません。 なぜ証券会社は、マイナンバーまで求めるのでしょうか。 理由の1つは税金です。証券会社は、お客さんの利益や配当の情報を税務署に報告します。その情報を正しく本人と結びつけるために、マイナンバーの提供が法律で求められています。NISAが1人1口座に限られることを確かめるためにも使われます。 もう1つは、なりすましや犯罪のお金の受け渡しを防ぐことです。他人の名前で口座が作れると、詐欺で得たお金を隠す道具になってしまいます。厳しい本人確認は、利用者全体を守るための入口なのです。 18歳と「親の同意」 2022年4月から、成年年齢は18歳です。18歳以上なら、証券口座も親の同意なしで開けます。 その代わり、未成年なら使えた「親の同意のない契約を取り消す」権利はなくなります。自分で契約し、自分で責任を持つ立場になったということです。 誕生日が2008年5月の大学1年生（例）を考えます。2026年1月1日時点では17歳なので、2026年中はNISA口座を開けません。 ただし、課税される口座は18歳になれば開けます。NISAは2027年1月から使えます。それまでは、20万円は預金のまま、仕組みの勉強や口座の準備にあてるのも一つの方法です。 2025年には、証券口座の乗っ取り被害が相次ぎました。メールやSMSのリンクからログインしないこと、多要素認証をかならず設定することが大切です。 パスワードは、他のサービスと同じものを使わないでください。 マイナンバー・本人確認書類・本人名義の銀行口座・スマホを用意する 18歳以上は親の同意なしで開けるが、NISAはその年の1月1日に18歳以上が条件 開設後はすぐに多要素認証を設定する 2026年1月1日時点で17歳、2026年6月に18歳になった人は、いつからNISAを使えるでしょうか。 18歳の誕生日から 2026年10月から 2027年1月から NISAは、口座を開く年の1月1日時点で18歳以上であることが条件です。"},{"no":38,"part":6,"title":"何を買えばいい？","subtitle":"全世界株式とS&P500の考え方","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「とりあえず全世界株式かS&amp;P500」とよく聞きます。何が違い、なぜこの2つがよく挙がるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>どちらも、たくさんの株にまとめて投資するインデックス型の投資信託の代表です。違いは、世界に分けるか、米国に集中するかです。どちらが優れているかは、事前にはわかりません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>2つの中身\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"全世界株式\">全世界株式\u003c/span>は、世界の約50の国・地域の株にまとめて投資します。代表的な指数の1つでは、2026年8月時点で米国が約64%、日本が約5%を占めています。\u003c/p>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"S&amp;P500\">S&amp;P500\u003c/span>は、米国の代表的な大企業約500社の株価をまとめた指数です。米国だけに投資します。\u003c/p>\n\u003cp>全世界株式の6割以上が米国なので、2つは思ったより似た値動きをします。違いは、残りの約4割に米国以外を持つかどうかです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、市場全体をまるごと買うのが「基本形」と言われるのでしょうか。\u003c/p>\n\u003cp>市場の平均とは、そこに参加している投資家全員の平均です。手数料を引く前で見れば、プロも初心者も合わせて平均になります。だから、低いコストで平均をそのまま持てば、手数料の分だけ平均的な投資家より有利になりやすいのです（第25話）。\u003c/p>\n\u003cp>さらに、これらの指数は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"時価総額加重\">時価総額加重\u003c/span>で作られています。会社の規模（株価 × 株数）に応じて多く持つ方式です。世界中の投資家が今つけている評価を、そのまま持つことになります。\u003c/p>\n\u003cp>全世界株式は「どの国が伸びるかは当てない」という選択です。S&amp;P500は「米国がこれからも強い」に重みを置く選択だといえます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>過去の成績は将来を約束しない\u003c/h2>\n\u003cp>過去には、強い国の株が長く低迷したこともあります。日経平均株価は1989年末の最高値を超えるまで、約34年かかりました。\u003c/p>\n\u003cp>米国も例外ではありません。S&amp;P500は2000年からの10年間、配当を含めても年率で約マイナス1%でした。ここ十数年の米国株の強さが、この先も続くとは限りません。\u003c/p>\n\u003ch2>選ぶときの観点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>分散の広さ\u003c/strong>: 国や会社がどれだけ分かれているか\u003c/li>\u003cli>\u003cstrong>コスト\u003c/strong>: 信託報酬は低いか（第27話）\u003c/li>\u003cli>\u003cstrong>為替\u003c/strong>: どちらも外国の株が中心で、円高・円安の影響を受ける（第41話）\u003c/li>\u003cli>\u003cstrong>納得感\u003c/strong>: 下がったときも持ち続けられる理由を、自分で説明できるか\u003c/li>\u003c/ul>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>月1万円を40年積み立てると、元本は480万円です。\u003c/p>\n\u003cp>年5%で増えたと仮定すると約1,526万円、年3%なら約926万円になります。どちらも仮定の計算で、実際の成績は年によって大きくぶれます。\u003c/p>\n\u003cp>全世界株式とS&amp;P500のどちらを選んでも、40年で見れば差より「続けたかどうか」の影響が大きくなりがちです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「全世界株式とS&amp;P500を両方買えば分散になる」と考えがちですが、中身の米国株が大きく重なります。\u003c/p>\n\u003cp>この本は特定の商品を勧めません。商品名ではなく、何に連動するか、コストはいくらかで比べてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>全世界株式は世界に分散、S&amp;P500は米国の大企業に集中する\u003c/li>\u003cli>全世界株式の6割以上は米国で、2つは似た値動きをしやすい\u003c/li>\u003cli>市場全体を低コストで持つと、平均的な投資家より有利になりやすい\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>全世界株式の代表的な指数で、2026年8月時点に最も比率が大きい国はどこでしょうか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">日本\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">米国\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">中国\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>米国が約6割強を占めています。そのため全世界株式とS&amp;P500は似た値動きをしやすいです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>MSCI「MSCI ACWI Index (USD) Factsheet」（2026年8月末時点） \u003ca href=\"https://www.msci.com/documents/10199/255599/msci-acwi-net.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.msci.com/documents/10199/255599/msci-acwi-net.pdf\u003c/a>\u003c/li>\u003cli>金融庁「つみたて投資枠対象商品」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/products/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/products/\u003c/a>\u003c/li>\u003cli>Dimensional Fund Advisors「A Tale of Two Decades: Lessons for Long-Term Investors」（S&amp;P500の2000〜2009年の年率リターン） \u003ca href=\"https://www.dimensional.com/us-en/insights/a-tale-of-two-decades\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dimensional.com/us-en/insights/a-tale-of-two-decades\u003c/a>\u003c/li>\u003cli>nippon.com「Japan Data」（日経平均の最高値更新、2024年2月22日） \u003ca href=\"https://www.nippon.com/ja/japan-data/h01927/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nippon.com/ja/japan-data/h01927/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「とりあえず全世界株式かS&P500」とよく聞きます。何が違い、なぜこの2つがよく挙がるのでしょうか。 どちらも、たくさんの株にまとめて投資するインデックス型の投資信託の代表です。違いは、世界に分けるか、米国に集中するかです。どちらが優れているかは、事前にはわかりません。 2つの中身 全世界株式は、世界の約50の国・地域の株にまとめて投資します。代表的な指数の1つでは、2026年8月時点で米国が約64%、日本が約5%を占めています。 S&P500は、米国の代表的な大企業約500社の株価をまとめた指数です。米国だけに投資します。 全世界株式の6割以上が米国なので、2つは思ったより似た値動きをします。違いは、残りの約4割に米国以外を持つかどうかです。 なぜ、市場全体をまるごと買うのが「基本形」と言われるのでしょうか。 市場の平均とは、そこに参加している投資家全員の平均です。手数料を引く前で見れば、プロも初心者も合わせて平均になります。だから、低いコストで平均をそのまま持てば、手数料の分だけ平均的な投資家より有利になりやすいのです（第25話）。 さらに、これらの指数は時価総額加重で作られています。会社の規模（株価 × 株数）に応じて多く持つ方式です。世界中の投資家が今つけている評価を、そのまま持つことになります。 全世界株式は「どの国が伸びるかは当てない」という選択です。S&P500は「米国がこれからも強い」に重みを置く選択だといえます。 過去の成績は将来を約束しない 過去には、強い国の株が長く低迷したこともあります。日経平均株価は1989年末の最高値を超えるまで、約34年かかりました。 米国も例外ではありません。S&P500は2000年からの10年間、配当を含めても年率で約マイナス1%でした。ここ十数年の米国株の強さが、この先も続くとは限りません。 選ぶときの観点 分散の広さ: 国や会社がどれだけ分かれているか コスト: 信託報酬は低いか（第27話） 為替: どちらも外国の株が中心で、円高・円安の影響を受ける（第41話） 納得感: 下がったときも持ち続けられる理由を、自分で説明できるか 月1万円を40年積み立てると、元本は480万円です。 年5%で増えたと仮定すると約1,526万円、年3%なら約926万円になります。どちらも仮定の計算で、実際の成績は年によって大きくぶれます。 全世界株式とS&P500のどちらを選んでも、40年で見れば差より「続けたかどうか」の影響が大きくなりがちです。 「全世界株式とS&P500を両方買えば分散になる」と考えがちですが、中身の米国株が大きく重なります。 この本は特定の商品を勧めません。商品名ではなく、何に連動するか、コストはいくらかで比べてください。 全世界株式は世界に分散、S&P500は米国の大企業に集中する 全世界株式の6割以上は米国で、2つは似た値動きをしやすい 市場全体を低コストで持つと、平均的な投資家より有利になりやすい 全世界株式の代表的な指数で、2026年8月時点に最も比率が大きい国はどこでしょうか。 日本 米国 中国 米国が約6割強を占めています。そのため全世界株式とS&P500は似た値動きをしやすいです。"},{"no":39,"part":6,"title":"毎月いくら積み立てる？","subtitle":"学生の現実的な金額","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003c
