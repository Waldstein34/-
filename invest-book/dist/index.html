組み合わせが出た時点で疑ってください。"},{"no":47,"part":7,"title":"情報との付き合い方","subtitle":"SNS・YouTube・ニュースを、どう読めばいいのか","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資の情報はSNSやYouTubeにあふれています。どれを信じればいいのか、わからなくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>まず「この情報で、発信者は何を得るのか」を考える習慣をつけてください。そのうえで、制度や数字は金融庁などの一次情報で確かめ、相場の予想には振り回されないことが基本です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>情報には「発信者の事情」がある\u003c/h2>\n\u003cp>無料の情報にも、発信する理由があります。再生回数を増やして広告収入を得たい。有料サロンや教材に誘いたい。紹介した証券口座が開設されると報酬が入る。どれも、それ自体が悪いわけではありません。\u003c/p>\n\u003cp>ただし、事情を知らずに読むと、内容の偏りに気づけません。2023年10月からは、広告であることを隠した宣伝（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ステルスマーケティング\">ステルスマーケティング\u003c/span>）が景品表示法で規制されています。それでも、すべての投稿が正しく表示されているとは限りません。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜSNSや動画では、刺激的な情報ほど目立つのでしょうか。根本には、多くのサービスが「見られた時間」で収益を上げる仕組みになっている点があります。\u003c/p>\n\u003cp>人は「暴落が来る」「この銘柄で資産10倍」といった強い言葉に、つい目を止めます。おすすめ表示の仕組みは、目を止めた情報をさらに届けます。その結果、穏やかで正確な情報より、極端な情報のほうが広まりやすくなります。\u003c/p>\n\u003cp>もう一つ、長期投資の正しい情報は「地味」です。「全世界に分散して、毎月積み立てて、何十年も持つ」は、毎日語ることが少ない内容です。一方、明日の相場予想は毎日新しく作れます。発信の量が多いことは、役に立つことを意味しません。\u003c/p>\n\u003cp>さらに、投資で大きく儲けた人の声は目立ち、損をしてやめた人の声は聞こえにくくなります。これを「生存者バイアス」と言います。目に入る成功談は、全体のほんの一部かもしれません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>情報の種類ごとの付き合い方\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>情報の種類\u003c/th>\u003cth>例\u003c/th>\u003cth>付き合い方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>制度・数字\u003c/td>\u003ctd>NISA枠、税率\u003c/td>\u003ctd>金融庁・国税庁などで確認する\u003c/td>\u003c/tr>\u003ctr>\u003ctd>考え方・仕組み\u003c/td>\u003ctd>分散、複利\u003c/td>\u003ctd>複数の情報源で一致するか見る\u003c/td>\u003c/tr>\u003ctr>\u003ctd>相場の予想\u003c/td>\u003ctd>「来月は上がる」\u003c/td>\u003ctd>当たり外れは誰にもわからないと割り切る\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>制度の数字は、発信者が古い情報のまま話していることがよくあります。NISAや税金の話は、公的なサイトで「いつ時点の情報か」を確かめてください。\u003c/p>\n\u003ch2>SNSで「投資の助言」をする人に注意\u003c/h2>\n\u003cp>お金を受け取って銘柄の売り買いを助言するには、登録が必要です。金融庁への「投資助言・代理業」の登録です。有料サロンやメルマガで、登録なしにこうした助言をすることは、違法になりえます。\u003c/p>\n\u003cp>「有料会員になれば、買うべき銘柄を教えます」という人を見かけたら、金融庁の登録業者かどうかを確認しましょう（第46話）。\u003c/p>\n\u003ch2>ニュースとの距離感\u003c/h2>\n\u003cp>ニュースは、今日起きた変化を伝えるものです。長期投資に必要なのは、何十年という単位の視点です。毎日の「株価が◯%下落」に、毎回反応する必要はありません。\u003c/p>\n\u003cp>ニュースを見て売買したくなったときは、第45話の「くせ」が働いていないか、一度考えてみてください。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>YouTubeで「今すぐ全部売れ。大暴落が来る」という動画を見て不安になったとします。20万円のうち投資している10万円を、今売るべきでしょうか。\u003c/p>\n\u003cp>ここで3つ確認してみましょう。発信者は、再生回数で収入を得ていないか。過去にも同じ予想をして外れていないか。そして自分の計画では、そのお金はいつ使う予定か。\u003c/p>\n\u003cp>使う予定が何年も先なら、動画の予想が当たっても外れても、することは変わりません。積立を続けるだけです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>本書も、一つの情報源にすぎません。制度は変わります。数字を使うときは、本書の出典欄にある公的なサイトで、最新の情報を確かめる習慣をつけてください（第50話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>情報を見たら「発信者は何を得るのか」を考える\u003c/li>\u003cli>制度・数字は一次情報で確認し、相場予想には振り回されない\u003c/li>\u003cli>有料で銘柄を助言する人は、金融庁の登録が必要\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>NISAの年間投資枠の金額を確かめたいとき、もっとも信頼できる情報源はどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">フォロワーの多いSNSアカウントの投稿\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">金融庁のNISA特設ウェブサイト\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">再生回数の多い解説動画\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>制度の数字は、制度を作る側の公的な情報源で確認するのが確実です。SNSや動画は古い情報のことがあります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>Impress Watch「消費者庁、2023年10月1日からステマを景品表示法で規制（令和5年内閣府告示第19号）」 \u003ca href=\"https://www.watch.impress.co.jp/docs/news/1489089.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.watch.impress.co.jp/docs/news/1489089.html\u003c/a>\u003c/li>\u003cli>金融庁「無登録で金融商品取引業を行う者の名称等について」 \u003ca href=\"https://www.fsa.go.jp/ordinary/chuui/mutouroku.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/ordinary/chuui/mutouroku.html\u003c/a>\u003c/li>\u003cli>金融庁「SNS等を利用した投資詐欺にご注意ください」 \u003ca href=\"https://www.fsa.go.jp/ordinary/chuui/sns.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/ordinary/chuui/sns.html\u003c/a>\u003c/li>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"投資の情報はSNSやYouTubeにあふれています。どれを信じればいいのか、わからなくなります。 まず「この情報で、発信者は何を得るのか」を考える習慣をつけてください。そのうえで、制度や数字は金融庁などの一次情報で確かめ、相場の予想には振り回されないことが基本です。 情報には「発信者の事情」がある 無料の情報にも、発信する理由があります。再生回数を増やして広告収入を得たい。有料サロンや教材に誘いたい。紹介した証券口座が開設されると報酬が入る。どれも、それ自体が悪いわけではありません。 ただし、事情を知らずに読むと、内容の偏りに気づけません。2023年10月からは、広告であることを隠した宣伝（ステルスマーケティング）が景品表示法で規制されています。それでも、すべての投稿が正しく表示されているとは限りません。 なぜSNSや動画では、刺激的な情報ほど目立つのでしょうか。根本には、多くのサービスが「見られた時間」で収益を上げる仕組みになっている点があります。 人は「暴落が来る」「この銘柄で資産10倍」といった強い言葉に、つい目を止めます。おすすめ表示の仕組みは、目を止めた情報をさらに届けます。その結果、穏やかで正確な情報より、極端な情報のほうが広まりやすくなります。 もう一つ、長期投資の正しい情報は「地味」です。「全世界に分散して、毎月積み立てて、何十年も持つ」は、毎日語ることが少ない内容です。一方、明日の相場予想は毎日新しく作れます。発信の量が多いことは、役に立つことを意味しません。 さらに、投資で大きく儲けた人の声は目立ち、損をしてやめた人の声は聞こえにくくなります。これを「生存者バイアス」と言います。目に入る成功談は、全体のほんの一部かもしれません。 情報の種類ごとの付き合い方 情報の種類 例 付き合い方 制度・数字 NISA枠、税率 金融庁・国税庁などで確認する 考え方・仕組み 分散、複利 複数の情報源で一致するか見る 相場の予想 「来月は上がる」 当たり外れは誰にもわからないと割り切る 制度の数字は、発信者が古い情報のまま話していることがよくあります。NISAや税金の話は、公的なサイトで「いつ時点の情報か」を確かめてください。 SNSで「投資の助言」をする人に注意 お金を受け取って銘柄の売り買いを助言するには、登録が必要です。金融庁への「投資助言・代理業」の登録です。有料サロンやメルマガで、登録なしにこうした助言をすることは、違法になりえます。 「有料会員になれば、買うべき銘柄を教えます」という人を見かけたら、金融庁の登録業者かどうかを確認しましょう（第46話）。 ニュースとの距離感 ニュースは、今日起きた変化を伝えるものです。長期投資に必要なのは、何十年という単位の視点です。毎日の「株価が◯%下落」に、毎回反応する必要はありません。 ニュースを見て売買したくなったときは、第45話の「くせ」が働いていないか、一度考えてみてください。 YouTubeで「今すぐ全部売れ。大暴落が来る」という動画を見て不安になったとします。20万円のうち投資している10万円を、今売るべきでしょうか。 ここで3つ確認してみましょう。発信者は、再生回数で収入を得ていないか。過去にも同じ予想をして外れていないか。そして自分の計画では、そのお金はいつ使う予定か。 使う予定が何年も先なら、動画の予想が当たっても外れても、することは変わりません。積立を続けるだけです。 本書も、一つの情報源にすぎません。制度は変わります。数字を使うときは、本書の出典欄にある公的なサイトで、最新の情報を確かめる習慣をつけてください（第50話）。 情報を見たら「発信者は何を得るのか」を考える 制度・数字は一次情報で確認し、相場予想には振り回されない 有料で銘柄を助言する人は、金融庁の登録が必要 NISAの年間投資枠の金額を確かめたいとき、もっとも信頼できる情報源はどれですか。 フォロワーの多いSNSアカウントの投稿 金融庁のNISA特設ウェブサイト 再生回数の多い解説動画 制度の数字は、制度を作る側の公的な情報源で確認するのが確実です。SNSや動画は古い情報のことがあります。"},{"no":48,"part":7,"title":"よくある誤解Q&A","subtitle":"細かい疑問をまとめて解消する","minutes":6,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>証券会社が潰れたら、お金は消えてしまうのでしょうか。ほかにも、小さな疑問がたくさん残っています。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>多くの不安には、制度や仕組みの答えがあります。ここでは、初心者がつまずきやすい10の疑問を、短く一つずつ解消していきます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>Q1. 証券会社が潰れたら、預けたお金は？\u003c/h2>\n\u003cp>証券会社は、お客さんの資産を自社の財産と分けて管理する\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"分別管理\">分別管理\u003c/span>が法律で義務づけられています。そのため、原則として破綻しても返ってきます。\u003c/p>\n\u003cp>万一それが守られていなかった場合も、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"投資者保護基金\">投資者保護基金\u003c/span>が1人あたり1,000万円まで補償します。ただし、値下がりによる損は補償の対象外です。\u003c/p>\n\u003ch2>Q2. 投資信託の運用会社が潰れたら？\u003c/h2>\n\u003cp>投資信託のお金は、運用会社ではなく信託銀行が保管しています。信託銀行も、そのお金を自分の財産と分けて管理する義務があります。運用会社が破綻しても、別の会社に運用が引き継がれるか、その時点の価値で精算されます。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、ここまで何重にも「分けて管理する」仕組みがあるのでしょうか。根っこにあるのは、金融が「信用」で成り立っているからです（第2話）。\u003c/p>\n\u003cp>預けたお金が会社の倒産で消えるなら、誰も安心して投資できません。お金が集まらなければ、会社は事業を広げられず、経済も育ちません。\u003c/p>\n\u003cp>つまり、投資家を守る仕組みは、投資家への親切であると同時に、経済全体が回るための土台なのです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>Q3. 全世界株式の投資信託が0円になることはある？\u003c/h2>\n\u003cp>理屈の上ではゼロではありません。ですが、そのためには世界中の数千社が同時に価値を失う必要があります。そうなれば預金や現金の価値も無事とは考えにくく、現実的に心配すべき場面とは言いにくいでしょう。むしろ心配すべきは、半分程度まで下がる暴落です（第42話）。\u003c/p>\n\u003ch2>Q4. 基準価額が安い投資信託のほうがお得？\u003c/h2>\n\u003cp>いいえ。\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"基準価額\">基準価額\u003c/span>は、投資信託の値段を1万口あたりで表した数字です。始まった時期や分配の仕方で水準が違うだけで、「安いから割安」という意味はありません。見るべきは、中身と手数料です（第27話）。\u003c/p>\n\u003ch2>Q5. 分配金がたくさん出る投資信託のほうが得？\u003c/h2>\n\u003cp>分配金は、投資信託の資産の中から支払われます。そのため、分配した分だけ基準価額が下がります。利益以上に分配すると、実質的に元本の一部を返しているだけのこともあります。\u003c/p>\n\u003cp>長期の資産形成では、分配金を出さずに中で再投資するほうが、複利の効果を受けやすくなります（第5話）。\u003c/p>\n\u003ch2>Q6. 月1,000円では意味がない？\u003c/h2>\n\u003cp>増える割合は、金額が小さくても同じです。1,000円が5%増えれば50円、100万円なら5万円です。少額のうちに値動きに慣れ、仕組みを体で覚えることにも価値があります。収入が増えたら金額を増やせば十分です。\u003c/p>\n\u003ch2>Q7. 毎日、評価額を確認したほうがいい？\u003c/h2>\n\u003cp>長期投資なら、その必要はありません。むしろ毎日見ると、小さな下落に心が反応しやすくなります（第45話）。積立がきちんと動いているか、月1回確かめる程度で足ります。\u003c/p>\n\u003ch2>Q8. 積立日は何日にするのが得？\u003c/h2>\n\u003cp>長期で見ると、何日を選んでも差はごくわずかです。株価が月のどの日に安くなるかは、予測できないからです。給料日やバイト代の入金日の直後にして、残高不足を防ぐほうが実用的です。\u003c/p>\n\u003ch2>Q9. 売ったら、すぐ現金になる？\u003c/h2>\n\u003cp>投資信託は、売る注文を出した時点では値段が決まりません。注文後に決まる基準価額で売られ、お金が口座に入るのは数営業日後です。海外の資産に投資するものは、さらに日数がかかることがあります。急に必要なお金を投資信託に入れておかない理由の一つです。\u003c/p>\n\u003ch2>Q10. 円で買ったから、為替は関係ない？\u003c/h2>\n\u003cp>円で買っても、中身が外国の株なら為替の影響を受けます。くわしくは第41話を見てください。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち、毎月5,000円をネット証券で積み立てているとします。仮にその証券会社が破綻しても、分別管理と投資者保護基金の仕組みがあります。1,000万円に届かない学生の金額なら、制度の補償の範囲に収まります。\u003c/p>\n\u003cp>「会社が潰れたら」より、「自分が暴落で売ってしまったら」のほうが、ずっと現実的な心配です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>ここで紹介したのは、2026年10月時点の一般的な仕組みです。商品によって細かい条件は違います。投資信託を選ぶときは、交付目論見書（商品の説明書）で確かめてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>証券会社や運用会社が潰れても、資産は分けて管理されている\u003c/li>\u003cli>基準価額の安さや分配金の多さは、お得さを意味しない\u003c/li>\u003cli>少額・月1回の確認・積立日は気にしすぎないで十分\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>投資者保護基金が補償するものはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">株価の値下がりによる損\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">証券会社の破綻で返せなくなった資産（1人1,000万円まで）\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">投資信託の分配金が減った分\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>補償されるのは、分別管理が守られず返還できなくなった資産です。値下がりの損は対象外です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本投資者保護基金 \u003ca href=\"https://www.jipf.or.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jipf.or.jp/\u003c/a>\u003c/li>\u003cli>大和証券「金融・証券用語解説 投資者保護基金」 \u003ca href=\"https://www.daiwa.jp/glossary/YST1341.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.daiwa.jp/glossary/YST1341.html\u003c/a>\u003c/li>\u003cli>大和証券「投資信託の安全性」 \u003ca href=\"https://www.daiwa.jp/products/fund/safety.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.daiwa.jp/products/fund/safety.html\u003c/a>\u003c/li>\u003cli>東海東京証券「投資信託の収益分配金に関するご説明」 \u003ca href=\"https://www.tokaitokyo.co.jp/common_products/fund/structure/shueki.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.tokaitokyo.co.jp/common_products/fund/structure/shueki.html\u003c/a>\u003c/li>\u003cli>2026年10月時点で確認。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"証券会社が潰れたら、お金は消えてしまうのでしょうか。ほかにも、小さな疑問がたくさん残っています。 多くの不安には、制度や仕組みの答えがあります。ここでは、初心者がつまずきやすい10の疑問を、短く一つずつ解消していきます。 Q1. 証券会社が潰れたら、預けたお金は？ 証券会社は、お客さんの資産を自社の財産と分けて管理する分別管理が法律で義務づけられています。そのため、原則として破綻しても返ってきます。 万一それが守られていなかった場合も、投資者保護基金が1人あたり1,000万円まで補償します。ただし、値下がりによる損は補償の対象外です。 Q2. 投資信託の運用会社が潰れたら？ 投資信託のお金は、運用会社ではなく信託銀行が保管しています。信託銀行も、そのお金を自分の財産と分けて管理する義務があります。運用会社が破綻しても、別の会社に運用が引き継がれるか、その時点の価値で精算されます。 なぜ、ここまで何重にも「分けて管理する」仕組みがあるのでしょうか。根っこにあるのは、金融が「信用」で成り立っているからです（第2話）。 預けたお金が会社の倒産で消えるなら、誰も安心して投資できません。お金が集まらなければ、会社は事業を広げられず、経済も育ちません。 つまり、投資家を守る仕組みは、投資家への親切であると同時に、経済全体が回るための土台なのです。 Q3. 全世界株式の投資信託が0円になることはある？ 理屈の上ではゼロではありません。ですが、そのためには世界中の数千社が同時に価値を失う必要があります。そうなれば預金や現金の価値も無事とは考えにくく、現実的に心配すべき場面とは言いにくいでしょう。むしろ心配すべきは、半分程度まで下がる暴落です（第42話）。 Q4. 基準価額が安い投資信託のほうがお得？ いいえ。基準価額は、投資信託の値段を1万口あたりで表した数字です。始まった時期や分配の仕方で水準が違うだけで、「安いから割安」という意味はありません。見るべきは、中身と手数料です（第27話）。 Q5. 分配金がたくさん出る投資信託のほうが得？ 分配金は、投資信託の資産の中から支払われます。そのため、分配した分だけ基準価額が下がります。利益以上に分配すると、実質的に元本の一部を返しているだけのこともあります。 長期の資産形成では、分配金を出さずに中で再投資するほうが、複利の効果を受けやすくなります（第5話）。 Q6. 月1,000円では意味がない？ 増える割合は、金額が小さくても同じです。1,000円が5%増えれば50円、100万円なら5万円です。少額のうちに値動きに慣れ、仕組みを体で覚えることにも価値があります。収入が増えたら金額を増やせば十分です。 Q7. 毎日、評価額を確認したほうがいい？ 長期投資なら、その必要はありません。むしろ毎日見ると、小さな下落に心が反応しやすくなります（第45話）。積立がきちんと動いているか、月1回確かめる程度で足ります。 Q8. 積立日は何日にするのが得？ 長期で見ると、何日を選んでも差はごくわずかです。株価が月のどの日に安くなるかは、予測できないからです。給料日やバイト代の入金日の直後にして、残高不足を防ぐほうが実用的です。 Q9. 売ったら、すぐ現金になる？ 投資信託は、売る注文を出した時点では値段が決まりません。注文後に決まる基準価額で売られ、お金が口座に入るのは数営業日後です。海外の資産に投資するものは、さらに日数がかかることがあります。急に必要なお金を投資信託に入れておかない理由の一つです。 Q10. 円で買ったから、為替は関係ない？ 円で買っても、中身が外国の株なら為替の影響を受けます。くわしくは第41話を見てください。 20万円のうち、毎月5,000円をネット証券で積み立てているとします。仮にその証券会社が破綻しても、分別管理と投資者保護基金の仕組みがあります。1,000万円に届かない学生の金額なら、制度の補償の範囲に収まります。 「会社が潰れたら」より、「自分が暴落で売ってしまったら」のほうが、ずっと現実的な心配です。 ここで紹介したのは、2026年10月時点の一般的な仕組みです。商品によって細かい条件は違います。投資信託を選ぶときは、交付目論見書（商品の説明書）で確かめてください。 証券会社や運用会社が潰れても、資産は分けて管理されている 基準価額の安さや分配金の多さは、お得さを意味しない 少額・月1回の確認・積立日は気にしすぎないで十分 投資者保護基金が補償するものはどれですか。 株価の値下がりによる損 証券会社の破綻で返せなくなった資産（1人1,000万円まで） 投資信託の分配金が減った分 補償されるのは、分別管理が守られず返還できなくなった資産です。値下がりの損は対象外です。"},{"no":49,"part":8,"title":"個別株への一歩","subtitle":"PER・PBR・決算書の入口 — 株価が「高い」とはどういうことか","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株価が5,000円の会社と500円の会社なら、500円のほうが安いのでしょうか。個別の会社の株を「割安」かどうか見分ける方法を知りたいです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株価の数字だけでは、高いか安いかはわかりません。会社の利益や資産と比べてはじめて判断できます。その代表的な物差しがPERとPBRで、元になる数字は決算書に載っています。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>株価の「高い・安い」は比べる相手しだい\u003c/h2>\n\u003cp>株価5,000円の会社でも、1株あたりの利益が1,000円なら、利益の5年分の値段です。株価500円の会社でも、1株あたりの利益が10円なら、利益の50年分です。\u003c/p>\n\u003cp>どちらが「高い」かは、株価そのものではなく、利益との比べ方で変わります。\u003c/p>\n\u003ch2>PER — 利益の何年分の値段か\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"PER\">PER\u003c/span>（株価収益率）は、株価が1株あたり利益の何倍かを表します。株価1,500円、1株あたり利益100円なら、1,500 ÷ 100 = 15倍です。\u003c/p>\n\u003cp>「今の利益が続くとしたら、15年分の利益で株価と同じになる」と読むと、イメージしやすくなります。\u003c/p>\n\u003ch2>PBR — 会社の持ち物と比べてどうか\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"PBR\">PBR\u003c/span>（株価純資産倍率）は、株価が1株あたり純資産の何倍かを表します。純資産とは、会社の資産から借金を引いた、株主の取り分です。\u003c/p>\n\u003cp>PBRが1倍なら、株価と「会社を今たたんだときの取り分」がほぼ同じという目安になります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ、PERが30倍の会社もあれば、8倍の会社もあるのでしょうか。根本には、株価が「今の利益」ではなく「将来の利益への期待」で決まるという点があります（第21話）。\u003c/p>\n\u003cp>これから利益が大きく伸びると多くの人が考える会社は、今の利益に比べて高い株価がつきます。だからPERが高くなります。逆に、利益が減りそうだと思われている会社は、PERが低くなります。\u003c/p>\n\u003cp>つまり、PERが低いことは「お買い得」とは限りません。市場が「この先あまり伸びない」と見ているサインかもしれません。\u003c/p>\n\u003cp>PBRが1倍を下回る会社が多いのも、同じ理由です。市場は「この会社は持っている資産を十分に活かして利益を出せていない」と評価しているのです。東京証券取引所は2023年3月、こうした会社を含む上場企業に、資本コストや株価を意識した経営を求めました。\u003c/p>\n\u003cp>指標は「答え」ではなく、「市場がこの会社をどう見ているか」を読む手がかりです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>決算書の入口\u003c/h2>\n\u003cp>PERやPBRの元の数字は、会社が定期的に公表する決算書にあります。まず見る場所は2つです。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>書類\u003c/th>\u003cth>わかること\u003c/th>\u003cth>例えると\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>損益計算書\u003c/td>\u003ctd>1年間でいくら稼いだか\u003c/td>\u003ctd>家計簿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>貸借対照表\u003c/td>\u003ctd>今いくら持ち、いくら借りているか\u003c/td>\u003ctd>持ち物と借金の一覧\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>決算書は、各社のウェブサイトの「IR（投資家向け情報）」や、金融庁の\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"EDINET\">EDINET\u003c/span>で、誰でも無料で読めます。最初は、売上高と利益が数年でどう変わっているかを眺めるだけで十分です。\u003c/p>\n\u003ch2>個別株の買い方の基本\u003c/h2>\n\u003cp>日本の株は、原則として100株単位で売買します。株価1,500円なら、1単位で15万円です。\u003c/p>\n\u003cp>証券会社によっては、1株から買える「単元未満株」のサービスもあります。少額で個別株の値動きを体験する方法として使えます。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円のうち、個別株に回すのは、あくまで「勉強代」と割り切れる少額にしましょう。たとえば、長期の積立とは別に1万円だけ使う、と決めます。\u003c/p>\n\u003cp>例として、身近な会社を2〜3社選びます。それぞれのPERとPBRを調べ、決算書で売上高と利益の推移を見てみます。そのうち1社を単元未満株で1株だけ買い、1年間、ニュースと株価の関係を観察します。\u003c/p>\n\u003cp>20万円全部を1社に入れると、その会社1社の不調で資産の大半を失うおそれがあります。中心はあくまで、広く分散した投資信託にしておきましょう（第16話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>PERやPBRが低いだけで「割安だから買い」と判断するのは危険です。利益が急に減る予定の会社は、PERが低く見えることがあります。指標は1つではなく、業績の推移と合わせて見てください。\u003c/p>\n\u003cp>また、個別株は1社の倒産で価値がゼロになることもあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>株価の数字だけでは、高いか安いかはわからない\u003c/li>\u003cli>PERは利益と、PBRは純資産と比べた株価の水準を示す\u003c/li>\u003cli>指標は「市場の期待」を読む手がかりで、低い＝お得とは限らない\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>株価2,000円、1株あたり利益100円の会社のPERは何倍ですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">5倍\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">20倍\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">200倍\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>2,000 ÷ 100 = 20倍です。今の利益が続くとすると、20年分の利益で株価と同じになるという目安です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本取引所グループ（東京証券取引所）「資本コストや株価を意識した経営の実現に向けた対応等に関するお願いについて」（2023年3月31日） \u003ca href=\"https://www.jpx.co.jp/news/1020/20230331-01.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jpx.co.jp/news/1020/20230331-01.html\u003c/a>\u003c/li>\u003cli>大和総研「PBRとは」 \u003ca href=\"https://www.dir.co.jp/world/entry/pbr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dir.co.jp/world/entry/pbr\u003c/a>\u003c/li>\u003cli>KPMG「PBR改善に向けた取り組み」 \u003ca href=\"https://kpmg.com/jp/ja/insights/2023/11/pbr202311.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://kpmg.com/jp/ja/insights/2023/11/pbr202311.html\u003c/a>\u003c/li>\u003cli>金融庁「EDINET」 \u003ca href=\"https://disclosure2.edinet-fsa.go.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://disclosure2.edinet-fsa.go.jp/\u003c/a>\u003c/li>\u003cli>2026年10月時点で確認。\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"株価が5,000円の会社と500円の会社なら、500円のほうが安いのでしょうか。個別の会社の株を「割安」かどうか見分ける方法を知りたいです。 株価の数字だけでは、高いか安いかはわかりません。会社の利益や資産と比べてはじめて判断できます。その代表的な物差しがPERとPBRで、元になる数字は決算書に載っています。 株価の「高い・安い」は比べる相手しだい 株価5,000円の会社でも、1株あたりの利益が1,000円なら、利益の5年分の値段です。株価500円の会社でも、1株あたりの利益が10円なら、利益の50年分です。 どちらが「高い」かは、株価そのものではなく、利益との比べ方で変わります。 PER — 利益の何年分の値段か PER（株価収益率）は、株価が1株あたり利益の何倍かを表します。株価1,500円、1株あたり利益100円なら、1,500 ÷ 100 = 15倍です。 「今の利益が続くとしたら、15年分の利益で株価と同じになる」と読むと、イメージしやすくなります。 PBR — 会社の持ち物と比べてどうか PBR（株価純資産倍率）は、株価が1株あたり純資産の何倍かを表します。純資産とは、会社の資産から借金を引いた、株主の取り分です。 PBRが1倍なら、株価と「会社を今たたんだときの取り分」がほぼ同じという目安になります。 なぜ、PERが30倍の会社もあれば、8倍の会社もあるのでしょうか。根本には、株価が「今の利益」ではなく「将来の利益への期待」で決まるという点があります（第21話）。 これから利益が大きく伸びると多くの人が考える会社は、今の利益に比べて高い株価がつきます。だからPERが高くなります。逆に、利益が減りそうだと思われている会社は、PERが低くなります。 つまり、PERが低いことは「お買い得」とは限りません。市場が「この先あまり伸びない」と見ているサインかもしれません。 PBRが1倍を下回る会社が多いのも、同じ理由です。市場は「この会社は持っている資産を十分に活かして利益を出せていない」と評価しているのです。東京証券取引所は2023年3月、こうした会社を含む上場企業に、資本コストや株価を意識した経営を求めました。 指標は「答え」ではなく、「市場がこの会社をどう見ているか」を読む手がかりです。 決算書の入口 PERやPBRの元の数字は、会社が定期的に公表する決算書にあります。まず見る場所は2つです。 書類 わかること 例えると 損益計算書 1年間でいくら稼いだか 家計簿 貸借対照表 今いくら持ち、いくら借りているか 持ち物と借金の一覧 決算書は、各社のウェブサイトの「IR（投資家向け情報）」や、金融庁のEDINETで、誰でも無料で読めます。最初は、売上高と利益が数年でどう変わっているかを眺めるだけで十分です。 個別株の買い方の基本 日本の株は、原則として100株単位で売買します。株価1,500円なら、1単位で15万円です。 証券会社によっては、1株から買える「単元未満株」のサービスもあります。少額で個別株の値動きを体験する方法として使えます。 20万円のうち、個別株に回すのは、あくまで「勉強代」と割り切れる少額にしましょう。たとえば、長期の積立とは別に1万円だけ使う、と決めます。 例として、身近な会社を2〜3社選びます。それぞれのPERとPBRを調べ、決算書で売上高と利益の推移を見てみます。そのうち1社を単元未満株で1株だけ買い、1年間、ニュースと株価の関係を観察します。 20万円全部を1社に入れると、その会社1社の不調で資産の大半を失うおそれがあります。中心はあくまで、広く分散した投資信託にしておきましょう（第16話）。 PERやPBRが低いだけで「割安だから買い」と判断するのは危険です。利益が急に減る予定の会社は、PERが低く見えることがあります。指標は1つではなく、業績の推移と合わせて見てください。 また、個別株は1社の倒産で価値がゼロになることもあります。 株価の数字だけでは、高いか安いかはわからない PERは利益と、PBRは純資産と比べた株価の水準を示す 指標は「市場の期待」を読む手がかりで、低い＝お得とは限らない 株価2,000円、1株あたり利益100円の会社のPERは何倍ですか。 5倍 20倍 200倍 2,000 ÷ 100 = 20倍です。今の利益が続くとすると、20年分の利益で株価と同じになるという目安です。"},{"no":50,"part":8,"title":"人生とお金の計画","subtitle":"これまでの振り返りと、これから学ぶこと","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>50話を読み終えて、全体像は見えてきました。この先、何を大切にして、どこで学び続ければいいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>本書の核は、「なぜそうなるのか」を自分で考える力です。制度や数字は変わりますが、仕組みの理由は変わりにくいものです。これからは、公的な一次情報で最新の事実を確かめながら、人生の計画に合わせて投資を育てていきましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>50話を、5つの「なぜ」で振り返る\u003c/h2>\n\u003cp>本書で扱った内容は、次の5つの問いにまとめられます。\u003c/p>\n\u003col>\u003cli>\u003cstrong>なぜ投資するのか\u003c/strong>: お金の価値はインフレで目減りしうる。一方、経済の成長は会社の利益を通じて株主に返ってきた（第3〜7話）\u003c/li>\u003cli>\u003cstrong>なぜ土台が先か\u003c/strong>: 生活防衛資金がないと、暴落時に売らざるをえなくなる（第8〜12話）\u003c/li>\u003cli>\u003cstrong>なぜ長期・分散・積立か\u003c/strong>: リスクは「ぶれ幅」であり、時間と分散でやわらげられる（第14〜19話）\u003c/li>\u003cli>\u003cstrong>なぜ手数料と税金を気にするのか\u003c/strong>: リターンは不確かだが、コストは確実に差し引かれる（第27〜36話）\u003c/li>\u003cli>\u003cstrong>なぜ人は失敗するのか\u003c/strong>: 脳のくせと、それにつけこむ情報や詐欺があるから（第45〜47話）\u003c/li>\u003c/ol>\n\u003ch2>人生の時期ごとに、お金の役割は変わる\u003c/h2>\n\u003cp>投資は、人生の計画を支える道具の一つです。時期によって、優先することが変わります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>時期\u003c/th>\u003cth>主な課題\u003c/th>\u003cth>お金との向き合い方\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>大学生\u003c/td>\u003ctd>学び・経験\u003c/td>\u003ctd>少額で仕組みに慣れる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>就職後\u003c/td>\u003ctd>収入が増える\u003c/td>\u003ctd>積立額を増やし、iDeCoも検討\u003c/td>\u003c/tr>\u003ctr>\u003ctd>結婚・住宅など\u003c/td>\u003ctd>大きな支出\u003c/td>\u003ctd>使う時期に合わせて準備\u003c/td>\u003c/tr>\u003ctr>\u003ctd>老後\u003c/td>\u003ctd>収入が減る\u003c/td>\u003ctd>少しずつ取り崩す（第43話）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>また、20歳になると国民年金への加入が必要になります。学生で保険料を納めるのが難しい場合は、申請によって納付を猶予してもらえる「\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"学生納付特例\">学生納付特例\u003c/span>」があります。誕生日が近づいたら、日本年金機構のサイトで確認してください。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ最後に「人生の計画」の話をするのでしょうか。根本の理由は、お金そのものには目的がないからです。\u003c/p>\n\u003cp>第2話で見たように、お金は「信用」に支えられた交換の道具です。道具は、何に使うかが決まってはじめて意味を持ちます。\u003c/p>\n\u003cp>「いくら増やすか」から考えると、他人との比較や相場の上下に心を奪われがちです。一方、「何のために、いつ使うか」から考えると、必要な金額、取れるリスク、売る時期が自然に決まります（第43話）。\u003c/p>\n\u003cp>もう一つ、学生のうちにもっとも大きく育つ資産は、お金ではなく自分自身です。20万円を5%で増やしても、1年で1万円です。一方、学びや経験、健康、人とのつながりは、将来の働き方や収入を大きく広げる力になります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>次に読むべき、信頼できる情報源\u003c/h2>\n\u003cp>制度や数字は毎年のように変わります。2026年10月時点でも、18歳未満向けの「こどもNISA」が2027年1月から始まる予定です。最新情報は、次のような公的機関や業界団体のサイトで確かめてください。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>金融庁 NISA特設ウェブサイト\u003c/strong>: NISAの最新の制度と、投資の基本\u003c/li>\u003cli>\u003cstrong>金融経済教育推進機構（J-FLEC）\u003c/strong>: 国が関わる中立的な金融教育の機関。無料相談やセミナーがある\u003c/li>\u003cli>\u003cstrong>iDeCo公式サイト\u003c/strong>（国民年金基金連合会）: iDeCoの制度と手続き\u003c/li>\u003cli>\u003cstrong>国税庁 タックスアンサー\u003c/strong>: 税金のしくみ\u003c/li>\u003cli>\u003cstrong>日本年金機構\u003c/strong>: 国民年金や学生納付特例\u003c/li>\u003cli>\u003cstrong>日本証券業協会・投資信託協会\u003c/strong>: 証券や投資信託の基礎知識\u003c/li>\u003cli>\u003cstrong>国民生活センター・消費者ホットライン188\u003c/strong>: 契約トラブルや詐欺の相談（第46話）\u003c/li>\u003c/ul>\n\u003cp>本を選ぶなら、リスクを正直に書いているものを選びましょう。複数の本に共通する内容が、信頼の目安になります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>今日からできることを、20万円の場合で整理してみます。\u003c/p>\n\u003cul>\u003cli>第8・12話の考え方で、まず生活防衛資金を預金に残す\u003c/li>\u003cli>残りから、毎月数千円の積立を続けられる金額で設定する（第39・40話）\u003c/li>\u003cli>年に1回、誕生日に「比率」と「制度の変更」を確認する（第44話）\u003c/li>\u003c/ul>\n\u003cp>そして、アルバイトや授業で得た経験そのものを、いちばんの投資と考えてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>本書の内容は2026年10月時点の情報に基づいています。NISAや税金、年金の制度は今後も変わる予定や可能性があります。実際に手続きをするときは、必ず公的な一次情報で最新の内容を確認してください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>本書の核は、制度や数字よりも「なぜそうなるのか」を考える力\u003c/li>\u003cli>お金は道具であり、「何のために、いつ使うか」から計画を立てる\u003c/li>\u003cli>最新の情報は、金融庁やJ-FLECなどの公的な情報源で確かめる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>投資の計画を立てるとき、出発点としてもっとも適切な問いはどれですか。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">どの銘柄がいちばん値上がりしそうか\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">そのお金を何のために、いつ使うのか\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">友人はいくら儲けているか\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>使う目的と時期が決まると、必要な金額・取れるリスク・売る時期が自然に決まります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/\u003c/a>\u003c/li>\u003cli>金融経済教育推進機構（J-FLEC） \u003ca href=\"https://www.j-flec.go.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.j-flec.go.jp/\u003c/a>\u003c/li>\u003cli>国民年金基金連合会「iDeCo公式サイト」 \u003ca href=\"https://www.ideco-koushiki.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ideco-koushiki.jp/\u003c/a>\u003c/li>\u003cli>厚生労働省「iDeCoの概要」 \u003ca href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/nenkin/kyoshutsu/ideco.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/nenkin/kyoshutsu/ideco.html\u003c/a>\u003c/li>\u003cli>国税庁「タックスアンサー」 \u003ca href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nta.go.jp/taxes/shiraberu/taxanswer/\u003c/a>\u003c/li>\u003cli>日本年金機構「国民年金保険料の学生納付特例制度」 \u003ca href=\"https://www.nenkin.go.jp/service/kokunen/menjo/20150514.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nenkin.go.jp/service/kokunen/menjo/20150514.html\u003c/a>\u003c/li>\u003cli>厚生労働省 東北厚生局「学生納付特例制度」 \u003ca href=\"https://kouseikyoku.mhlw.go.jp/tohoku/gyomu/bu_ka/nenkin_kanri/gakusei_tokurei/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://kouseikyoku.mhlw.go.jp/tohoku/gyomu/bu_ka/nenkin_kanri/gakusei_tokurei/index.html\u003c/a>\u003c/li>\u003cli>日本証券業協会 \u003ca href=\"https://www.jsda.or.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jsda.or.jp/\u003c/a>\u003c/li>\u003cli>投資信託協会 \u003ca href=\"https://www.toushin.or.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.toushin.or.jp/\u003c/a>\u003c/li>\u003cli>国民生活センター \u003ca href=\"https://www.kokusen.go.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kokusen.go.jp/\u003c/a>\u003c/li>\u003cli>大和総研「令和8年度税制改正法の成立（こどもNISA）」 \u003ca href=\"https://www.dir.co.jp/report/research/law-research/tax/20260526_025774.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dir.co.jp/report/research/law-research/tax/20260526_025774.html\u003c/a>\u003c/li>\u003cli>マネックス証券「こどもNISA（未成年者特定累積投資勘定）に関するお知らせ」 \u003ca href=\"https://info.monex.co.jp/news/2026/20260929_02.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://info.monex.co.jp/news/2026/20260929_02.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"50話を読み終えて、全体像は見えてきました。この先、何を大切にして、どこで学び続ければいいのでしょうか。 本書の核は、「なぜそうなるのか」を自分で考える力です。制度や数字は変わりますが、仕組みの理由は変わりにくいものです。これからは、公的な一次情報で最新の事実を確かめながら、人生の計画に合わせて投資を育てていきましょう。 50話を、5つの「なぜ」で振り返る 本書で扱った内容は、次の5つの問いにまとめられます。 なぜ投資するのか: お金の価値はインフレで目減りしうる。一方、経済の成長は会社の利益を通じて株主に返ってきた（第3〜7話） なぜ土台が先か: 生活防衛資金がないと、暴落時に売らざるをえなくなる（第8〜12話） なぜ長期・分散・積立か: リスクは「ぶれ幅」であり、時間と分散でやわらげられる（第14〜19話） なぜ手数料と税金を気にするのか: リターンは不確かだが、コストは確実に差し引かれる（第27〜36話） なぜ人は失敗するのか: 脳のくせと、それにつけこむ情報や詐欺があるから（第45〜47話） 人生の時期ごとに、お金の役割は変わる 投資は、人生の計画を支える道具の一つです。時期によって、優先することが変わります。 時期 主な課題 お金との向き合い方 大学生 学び・経験 少額で仕組みに慣れる 就職後 収入が増える 積立額を増やし、iDeCoも検討 結婚・住宅など 大きな支出 使う時期に合わせて準備 老後 収入が減る 少しずつ取り崩す（第43話） また、20歳になると国民年金への加入が必要になります。学生で保険料を納めるのが難しい場合は、申請によって納付を猶予してもらえる「学生納付特例」があります。誕生日が近づいたら、日本年金機構のサイトで確認してください。 なぜ最後に「人生の計画」の話をするのでしょうか。根本の理由は、お金そのものには目的がないからです。 第2話で見たように、お金は「信用」に支えられた交換の道具です。道具は、何に使うかが決まってはじめて意味を持ちます。 「いくら増やすか」から考えると、他人との比較や相場の上下に心を奪われがちです。一方、「何のために、いつ使うか」から考えると、必要な金額、取れるリスク、売る時期が自然に決まります（第43話）。 もう一つ、学生のうちにもっとも大きく育つ資産は、お金ではなく自分自身です。20万円を5%で増やしても、1年で1万円です。一方、学びや経験、健康、人とのつながりは、将来の働き方や収入を大きく広げる力になります。 次に読むべき、信頼できる情報源 制度や数字は毎年のように変わります。2026年10月時点でも、18歳未満向けの「こどもNISA」が2027年1月から始まる予定です。最新情報は、次のような公的機関や業界団体のサイトで確かめてください。 金融庁 NISA特設ウェブサイト: NISAの最新の制度と、投資の基本 金融経済教育推進機構（J-FLEC）: 国が関わる中立的な金融教育の機関。無料相談やセミナーがある iDeCo公式サイト（国民年金基金連合会）: iDeCoの制度と手続き 国税庁 タックスアンサー: 税金のしくみ 日本年金機構: 国民年金や学生納付特例 日本証券業協会・投資信託協会: 証券や投資信託の基礎知識 国民生活センター・消費者ホットライン188: 契約トラブルや詐欺の相談（第46話） 本を選ぶなら、リスクを正直に書いているものを選びましょう。複数の本に共通する内容が、信頼の目安になります。 今日からできることを、20万円の場合で整理してみます。 第8・12話の考え方で、まず生活防衛資金を預金に残す 残りから、毎月数千円の積立を続けられる金額で設定する（第39・40話） 年に1回、誕生日に「比率」と「制度の変更」を確認する（第44話） そして、アルバイトや授業で得た経験そのものを、いちばんの投資と考えてください。 本書の内容は2026年10月時点の情報に基づいています。NISAや税金、年金の制度は今後も変わる予定や可能性があります。実際に手続きをするときは、必ず公的な一次情報で最新の内容を確認してください。 本書の核は、制度や数字よりも「なぜそうなるのか」を考える力 お金は道具であり、「何のために、いつ使うか」から計画を立てる 最新の情報は、金融庁やJ-FLECなどの公的な情報源で確かめる 投資の計画を立てるとき、出発点としてもっとも適切な問いはどれですか。 どの銘柄がいちばん値上がりしそうか そのお金を何のために、いつ使うのか 友人はいくら儲けているか 使う目的と時期が決まると、必要な金額・取れるリスク・売る時期が自然に決まります。"}],"glossary":[{"term":"72の法則","reading":"","html":"72を年利（%）で割ると、複利でお金が2倍になるまでのおおよその年数がわかるという目安。","text":"72を年利（%）で割ると、複利でお金が2倍になるまでのおおよその年数がわかるという目安。","group":"英数"},{"term":"EDINET","reading":"","html":"金融庁が運営する電子開示システム。上場企業の有価証券報告書などを、誰でも無料で閲覧できます。","text":"金融庁が運営する電子開示システム。上場企業の有価証券報告書などを、誰でも無料で閲覧できます。","group":"英数"},{"term":"ETF","reading":"","html":"証券取引所に上場し、株と同じように取引時間中に売買できる投資信託。上場投資信託ともいう。","text":"証券取引所に上場し、株と同じように取引時間中に売買できる投資信託。上場投資信託ともいう。","group":"英数"},{"term":"FX","reading":"","html":"外国為替証拠金取引。預けたお金（証拠金）を担保に、その何倍もの金額で通貨を交換する取引。","text":"外国為替証拠金取引。預けたお金（証拠金）を担保に、その何倍もの金額で通貨を交換する取引。","group":"英数"},{"term":"GDP","reading":"","html":"国内総生産。国内で1年間に新しく生み出された物やサービスの価値の合計で、経済の大きさを表します。","text":"国内総生産。国内で1年間に新しく生み出された物やサービスの価値の合計で、経済の大きさを表します。","group":"英数"},{"term":"iDeCo","reading":"","html":"個人型確定拠出年金。自分で掛金を出して運用し、原則60歳以降に受け取る私的な年金で、掛金が所得控除になる。","text":"個人型確定拠出年金。自分で掛金を出して運用し、原則60歳以降に受け取る私的な年金で、掛金が所得控除になる。","group":"英数"},{"term":"NISA","reading":"","html":"少額投資非課税制度。専用の口座で買った株や投資信託の利益に税金がかからない国の制度。","text":"少額投資非課税制度。専用の口座で買った株や投資信託の利益に税金がかからない国の制度。","group":"英数"},{"term":"PBR","reading":"","html":"株価純資産倍率。株価が1株あたり純資産（資産から借金を引いた株主の取り分）の何倍かを示します。","text":"株価純資産倍率。株価が1株あたり純資産（資産から借金を引いた株主の取り分）の何倍かを示します。","group":"英数"},{"term":"PER","reading":"","html":"株価収益率。株価が1株あたり利益の何倍かを示し、「利益の何年分の値段か」の目安になります。","text":"株価収益率。株価が1株あたり利益の何倍かを示し、「利益の何年分の値段か」の目安になります。","group":"英数"},{"term":"REIT","reading":"","html":"集めたお金で不動産を買い、家賃収入などを分配する投資信託。不動産投資信託ともいう。","text":"集めたお金で不動産を買い、家賃収入などを分配する投資信託。不動産投資信託ともいう。","group":"英数"},{"term":"S&P500","reading":"","html":"米国の代表的な大企業約500社の株価をまとめた株価指数。","text":"米国の代表的な大企業約500社の株価をまとめた株価指数。","group":"英数"},{"term":"SNS型投資詐欺","reading":"","html":"SNSの広告やダイレクトメッセージをきっかけに、投資話を持ちかけてお金をだまし取る詐欺。有名人のなりすましや偽の投資アプリが使われます。","text":"SNSの広告やダイレクトメッセージをきっかけに、投資話を持ちかけてお金をだまし取る詐欺。有名人のなりすましや偽の投資アプリが使われます。","group":"英数"},{"term":"アクティブファンド","reading":"","html":"運用担当者が銘柄を選び、指数を上回る成績を目指す投資信託。調査の費用がかかるため手数料が高めのことが多い。","text":"運用担当者が銘柄を選び、指数を上回る成績を目指す投資信託。調査の費用がかかるため手数料が高めのことが多い。","group":"あ"},{"term":"インデックスファンド","reading":"","html":"指数と同じ値動きを目指す投資信託。手数料が低いものが多い。","text":"指数と同じ値動きを目指す投資信託。手数料が低いものが多い。","group":"あ"},{"term":"インフレ","reading":"","html":"物やサービスの値段が全体的に上がり続けること。同じ金額で買える量が減ります。","text":"物やサービスの値段が全体的に上がり続けること。同じ金額で買える量が減ります。","group":"あ"},{"term":"ステルスマーケティング","reading":"","html":"広告であることを隠して行う宣伝。日本では2023年10月から景品表示法で規制されています。","text":"広告であることを隠して行う宣伝。日本では2023年10月から景品表示法で規制されています。","group":"さ"},{"term":"スプレッド","reading":"","html":"買うときの値段と売るときの値段の差。実質的な取引コストになる。","text":"買うときの値段と売るときの値段の差。実質的な取引コストになる。","group":"さ"},{"term":"ゼロサム","reading":"","html":"参加者全員の損益を合計するとゼロになる状態。誰かの得がそのまま誰かの損になる。","text":"参加者全員の損益を合計するとゼロになる状態。誰かの得がそのまま誰かの損になる。","group":"さ"},{"term":"つみたて投資枠","reading":"","html":"NISAの枠の1つ。金融庁の基準を満たす長期・積立向けの投資信託などを、積立で年120万円まで買える。","text":"NISAの枠の1つ。金融庁の基準を満たす長期・積立向けの投資信託などを、積立で年120万円まで買える。","group":"た"},{"term":"デフォルト効果","reading":"","html":"人が最初から決まっている設定（初期設定）をそのまま受け入れやすい傾向。自動積立はこの性質を味方にする方法。","text":"人が最初から決まっている設定（初期設定）をそのまま受け入れやすい傾向。自動積立はこの性質を味方にする方法。","group":"た"},{"term":"デフレ","reading":"","html":"物やサービスの値段が全体的に下がり続けること。給料が上がりにくくなる悪循環を招きやすいとされます。","text":"物やサービスの値段が全体的に下がり続けること。給料が上がりにくくなる悪循環を招きやすいとされます。","group":"た"},{"term":"ドルコスト平均法","reading":"","html":"価格が変動する商品を、毎回同じ金額で買い続ける方法。安いときに多く、高いときに少なく買うことになる。","text":"価格が変動する商品を、毎回同じ金額で買い続ける方法。安いときに多く、高いときに少なく買うことになる。","group":"た"},{"term":"ネット証券","reading":"","html":"店舗を持たず、主にインターネットやアプリで取引を受け付ける証券会社。","text":"店舗を持たず、主にインターネットやアプリで取引を受け付ける証券会社。","group":"な"},{"term":"ファットテール","reading":"","html":"極端な出来事が、正規分布で考えるよりも起きやすい性質。株式市場の暴落はこの例とされる。","text":"極端な出来事が、正規分布で考えるよりも起きやすい性質。株式市場の暴落はこの例とされる。","group":"は"},{"term":"プラスサム","reading":"","html":"参加者全員の損益を合計するとプラスになる状態。新しい価値が生み出される株式への長期投資が代表例。","text":"参加者全員の損益を合計するとプラスになる状態。新しい価値が生み出される株式への長期投資が代表例。","group":"は"},{"term":"マイナンバー","reading":"","html":"日本に住む人に1人1つ割り当てられた12桁の番号。税や社会保障の手続きで本人を確かめるために使われる。","text":"日本に住む人に1人1つ割り当てられた12桁の番号。税や社会保障の手続きで本人を確かめるために使われる。","group":"ま"},{"term":"リスク","reading":"","html":"投資の世界では「危険」ではなく、結果が予想からどれだけぶれるかという不確かさの大きさ。上振れも下振れも含む。","text":"投資の世界では「危険」ではなく、結果が予想からどれだけぶれるかという不確かさの大きさ。上振れも下振れも含む。","group":"ら"},{"term":"リスクプレミアム","reading":"","html":"ぶれの大きい資産を持つ人が、ぶれを引き受ける見返りとして期待できる上乗せのリターン。","text":"ぶれの大きい資産を持つ人が、ぶれを引き受ける見返りとして期待できる上乗せのリターン。","group":"ら"},{"term":"リターン","reading":"","html":"投資によって得られる収益。増えた分だけでなく、減った分（マイナスのリターン）も含む。","text":"投資によって得られる収益。増えた分だけでなく、減った分（マイナスのリターン）も含む。","group":"ら"},{"term":"リバランス","reading":"","html":"値動きでずれた資産の比率を、最初に決めた比率に戻すこと。主な目的は、引き受けるリスクの量を一定に保つことです。","text":"値動きでずれた資産の比率を、最初に決めた比率に戻すこと。主な目的は、引き受けるリスクの量を一定に保つことです。","group":"ら"},{"term":"リボ払い","reading":"","html":"クレジットカードの利用額にかかわらず、毎月ほぼ一定額を支払う方式。残高が減りにくく、手数料が長くかかりやすい点に注意が必要です。","text":"クレジットカードの利用額にかかわらず、毎月ほぼ一定額を支払う方式。残高が減りにくく、手数料が長くかかりやすい点に注意が必要です。","group":"ら"},{"term":"レバレッジ","reading":"","html":"手元のお金より大きな金額を取引すること。利益も損失も何倍にもなる。","text":"手元のお金より大きな金額を取引すること。利益も損失も何倍にもなる。","group":"ら"},{"term":"暗号資産","reading":"","html":"インターネット上でやりとりされる電子的な資産。ビットコインが代表例で、国などの後ろ盾はない。","text":"インターネット上でやりとりされる電子的な資産。ビットコインが代表例で、国などの後ろ盾はない。","group":"その他"},{"term":"為替ヘッジ","reading":"","html":"為替の変動による影響を、取引の工夫で小さくする仕組み。費用がかかり、その大きさはおおむね国どうしの金利差で決まります。","text":"為替の変動による影響を、取引の工夫で小さくする仕組み。費用がかかり、その大きさはおおむね国どうしの金利差で決まります。","group":"その他"},{"term":"為替レート","reading":"","html":"ある通貨を別の通貨と交換するときの比率。「1ドル=150円」なら、1ドルを手に入れるのに150円が必要という意味です。","text":"ある通貨を別の通貨と交換するときの比率。「1ドル=150円」なら、1ドルを手に入れるのに150円が必要という意味です。","group":"その他"},{"term":"一般口座","reading":"","html":"損益の計算から確定申告まで、すべて自分で行う口座。","text":"損益の計算から確定申告まで、すべて自分で行う口座。","group":"その他"},{"term":"確定申告","reading":"","html":"1年分の所得と税金を自分で計算し、翌年に税務署へ届けて納めたり戻してもらったりする手続き。","text":"1年分の所得と税金を自分で計算し、翌年に税務署へ届けて納めたり戻してもらったりする手続き。","group":"その他"},{"term":"学生納付特例","reading":"","html":"所得の少ない学生が申請すると、国民年金保険料の支払いを在学中に待ってもらえる制度。免除ではなく猶予で、後から納める（追納）こともできる。","text":"所得の少ない学生が申請すると、国民年金保険料の支払いを在学中に待ってもらえる制度。免除ではなく猶予で、後から納める（追納）こともできる。","group":"その他"},{"term":"株式","reading":"","html":"会社にお金を出した人が受け取る、会社の持ち分の証明。株主として利益の分配などを受ける権利がある。","text":"会社にお金を出した人が受け取る、会社の持ち分の証明。株主として利益の分配などを受ける権利がある。","group":"その他"},{"term":"株主","reading":"","html":"株式を持っている人。会社の持ち主の一人として、議決権や配当を受け取る権利などを持つ。","text":"株式を持っている人。会社の持ち主の一人として、議決権や配当を受け取る権利などを持つ。","group":"その他"},{"term":"株主優待","reading":"","html":"株主に自社の商品や割引券などを贈る、日本で多く見られるしくみ。内容は会社の判断で変更・廃止されることがある。","text":"株主に自社の商品や割引券などを贈る、日本で多く見られるしくみ。内容は会社の判断で変更・廃止されることがある。","group":"その他"},{"term":"基準価額","reading":"","html":"投資信託の1口あたりの値段。中身の資産の合計を口数で割って、通常1日1回計算される。","text":"投資信託の1口あたりの値段。中身の資産の合計を口数で割って、通常1日1回計算される。","group":"その他"},{"term":"基礎控除","reading":"","html":"すべての人の所得から差し引ける基本の控除。所得税では2026年分は所得に応じて最大104万円（一部は2027年分までの特例）。","text":"すべての人の所得から差し引ける基本の控除。所得税では2026年分は所得に応じて最大104万円（一部は2027年分までの特例）。","group":"その他"},{"term":"議決権","reading":"","html":"株主総会で、役員の選任など会社の重要事項に投票する権利。","text":"株主総会で、役員の選任など会社の重要事項に投票する権利。","group":"その他"},{"term":"給与所得控除","reading":"","html":"給料の収入から差し引ける、会社員などの必要経費にあたる控除。所得税では2026年分の最低額は74万円（一部は特例）。","text":"給料の収入から差し引ける、会社員などの必要経費にあたる控除。所得税では2026年分の最低額は74万円（一部は特例）。","group":"その他"},{"term":"金利","reading":"","html":"お金を借りる人が貸す人に払うレンタル料の割合。ふつうは1年あたりの率（年率）で表します。","text":"お金を借りる人が貸す人に払うレンタル料の割合。ふつうは1年あたりの率（年率）で表します。","group":"その他"},{"term":"金利差","reading":"","html":"国どうしの金利の差。お金は金利の高い通貨に移りやすいため、為替レートを動かす大きな要因の一つとされます。","text":"国どうしの金利の差。お金は金利の高い通貨に移りやすいため、為替レートを動かす大きな要因の一つとされます。","group":"その他"},{"term":"繰越控除","reading":"","html":"その年に差し引ききれなかった損失を翌年以降に持ち越し、将来の利益と差し引くこと。確定申告が必要で、NISAの損は対象外。","text":"その年に差し引ききれなかった損失を翌年以降に持ち越し、将来の利益と差し引くこと。確定申告が必要で、NISAの損は対象外。","group":"その他"},{"term":"経済成長","reading":"","html":"GDPなど経済の規模が大きくなること。働く人・設備・生産性の向上によって起こります。","text":"GDPなど経済の規模が大きくなること。働く人・設備・生産性の向上によって起こります。","group":"その他"},{"term":"権利落ち","reading":"","html":"配当や優待を受け取る権利が確定した後の状態。会社の現金が株主に移る分、株価が下がりやすい。","text":"配当や優待を受け取る権利が確定した後の状態。会社の現金が株主に移る分、株価が下がりやすい。","group":"その他"},{"term":"元本","reading":"","html":"最初に貸し借りしたり、預けたり投資したりしたお金そのもの。利息や利益を含まない元のお金です。","text":"最初に貸し借りしたり、預けたり投資したりしたお金そのもの。利息や利益を含まない元のお金です。","group":"その他"},{"term":"源泉徴収","reading":"","html":"利益や給料が支払われるときに、税金をその場で差し引いて納める方式。","text":"利益や給料が支払われるときに、税金をその場で差し引いて納める方式。","group":"その他"},{"term":"現在バイアス","reading":"","html":"将来の利益よりも、目の前の満足を大きく感じてしまう人間の傾向。後回しや衝動買いの原因になる。","text":"将来の利益よりも、目の前の満足を大きく感じてしまう人間の傾向。後回しや衝動買いの原因になる。","group":"その他"},{"term":"個別リスク","reading":"","html":"不祥事やヒット商品など、個々の会社の事情によるぶれ。多くの会社に分散すると小さくできる。","text":"不祥事やヒット商品など、個々の会社の事情によるぶれ。多くの会社に分散すると小さくできる。","group":"その他"},{"term":"固定費","reading":"","html":"家賃やスマホ代、サブスクなど、毎月ほぼ同じ額が出ていく支出。一度見直すと効果が続きます。","text":"家賃やスマホ代、サブスクなど、毎月ほぼ同じ額が出ていく支出。一度見直すと効果が続きます。","group":"その他"},{"term":"行動経済学","reading":"","html":"人が実際にどう判断し、どう間違えるかを研究する学問。心理学の知見を経済学に取り入れています。","text":"人が実際にどう判断し、どう間違えるかを研究する学問。心理学の知見を経済学に取り入れています。","group":"その他"},{"term":"合計所得金額","reading":"","html":"各種の所得を合計した金額。扶養に入れるかどうかの判定に使われ、NISAの利益や申告しない源泉徴収ありの利益は含まれない。","text":"各種の所得を合計した金額。扶養に入れるかどうかの判定に使われ、NISAの利益や申告しない源泉徴収ありの利益は含まれない。","group":"その他"},{"term":"国債","reading":"","html":"国が発行する債券。日本では個人向け国債が1万円から買える。","text":"国が発行する債券。日本では個人向け国債が1万円から買える。","group":"その他"},{"term":"国民年金第1号被保険者","reading":"","html":"20歳以上60歳未満で、会社員や公務員、その扶養配偶者にあたらない人。学生や自営業者などが含まれる。","text":"20歳以上60歳未満で、会社員や公務員、その扶養配偶者にあたらない人。学生や自営業者などが含まれる。","group":"その他"},{"term":"債券","reading":"","html":"国や会社がお金を借りるときに発行する証書。買った人は利息を受け取り、満期に元本を返してもらう。","text":"国や会社がお金を借りるときに発行する証書。買った人は利息を受け取り、満期に元本を返してもらう。","group":"その他"},{"term":"残余財産","reading":"","html":"会社を解散するとき、借金などをすべて返したあとに残った財産。株主は持ち株に応じて受け取る権利がある。","text":"会社を解散するとき、借金などをすべて返したあとに残った財産。株主は持ち株に応じて受け取る権利がある。","group":"その他"},{"term":"市場リスク","reading":"","html":"世界的な不景気など、市場全体が一緒に動くことによるぶれ。株式どうしを分散しても消せない。","text":"世界的な不景気など、市場全体が一緒に動くことによるぶれ。株式どうしを分散しても消せない。","group":"その他"},{"term":"指数","reading":"","html":"市場全体や特定のグループの株価の動きを、一つの数字で表したもの。日経平均株価やTOPIXなどがある。","text":"市場全体や特定のグループの株価の動きを、一つの数字で表したもの。日経平均株価やTOPIXなどがある。","group":"その他"},{"term":"資産形成","reading":"","html":"時間をかけてお金を少しずつ増やし、将来に備えること。この本では主に長期の投資による資産づくりを指します。","text":"時間をかけてお金を少しずつ増やし、将来に備えること。この本では主に長期の投資による資産づくりを指します。","group":"その他"},{"term":"時価総額加重","reading":"","html":"会社の規模（株価 × 発行株数）が大きいほど多く組み入れる、指数の作り方。","text":"会社の規模（株価 × 発行株数）が大きいほど多く組み入れる、指数の作り方。","group":"その他"},{"term":"実質金利","reading":"","html":"名目金利から物価上昇率を差し引いた金利。お金で買える量がどれだけ増えるかを表します。","text":"名目金利から物価上昇率を差し引いた金利。お金で買える量がどれだけ増えるかを表します。","group":"その他"},{"term":"取り崩し","reading":"","html":"貯めた資産を一度に売らず、必要な分を少しずつ売って使うこと。毎月一定額を売る「定額」と、残高の一定割合を売る「定率」があります。","text":"貯めた資産を一度に売らず、必要な分を少しずつ売って使うこと。毎月一定額を売る「定額」と、残高の一定割合を売る「定率」があります。","group":"その他"},{"term":"需給","reading":"","html":"需要（買いたい量）と供給（売りたい量）の関係。買いたい人が多ければ値段は上がり、売りたい人が多ければ下がる。","text":"需要（買いたい量）と供給（売りたい量）の関係。買いたい人が多ければ値段は上がり、売りたい人が多ければ下がる。","group":"その他"},{"term":"所得控除","reading":"","html":"税金を計算するもとになる所得から、一定の金額を差し引くしくみ。もともと税金がかからない人には効果がない。","text":"税金を計算するもとになる所得から、一定の金額を差し引くしくみ。もともと税金がかからない人には効果がない。","group":"その他"},{"term":"奨学金","reading":"","html":"学業のために給付または貸与されるお金。日本学生支援機構の貸与型には無利子の第一種と、利子のつく第二種があります。","text":"学業のために給付または貸与されるお金。日本学生支援機構の貸与型には無利子の第一種と、利子のつく第二種があります。","group":"その他"},{"term":"消費者物価指数","reading":"","html":"家計が買う品物やサービスの値段の変化を1つの数字にまとめた指標。CPIとも呼ばれ、総務省が毎月発表します。","text":"家計が買う品物やサービスの値段の変化を1つの数字にまとめた指標。CPIとも呼ばれ、総務省が毎月発表します。","group":"その他"},{"term":"証券取引所","reading":"","html":"株やETFなどを売りたい人と買いたい人を引き合わせ、公正に売買させる市場。日本では東京証券取引所などがある。","text":"株やETFなどを売りたい人と買いたい人を引き合わせ、公正に売買させる市場。日本では東京証券取引所などがある。","group":"その他"},{"term":"譲渡益","reading":"","html":"株や投資信託を、買った値段より高く売ったときの差額。値上がり益ともいう。","text":"株や投資信託を、買った値段より高く売ったときの差額。値上がり益ともいう。","group":"その他"},{"term":"信託報酬","reading":"","html":"投資信託を持っている間、資産全体から毎年差し引かれ続ける手数料。運用会社・販売会社・信託銀行への報酬にあたる。","text":"投資信託を持っている間、資産全体から毎年差し引かれ続ける手数料。運用会社・販売会社・信託銀行への報酬にあたる。","group":"その他"},{"term":"信用","reading":"","html":"相手が約束を守るだろうと信じられること。お金や預金、株式、債券の価値は、この信用の上に成り立っています。","text":"相手が約束を守るだろうと信じられること。お金や預金、株式、債券の価値は、この信用の上に成り立っています。","group":"その他"},{"term":"信用リスク","reading":"","html":"お金を借りた国や会社が、利息や元本を約束どおりに返せなくなるリスク。","text":"お金を借りた国や会社が、利息や元本を約束どおりに返せなくなるリスク。","group":"その他"},{"term":"申告分離課税","reading":"","html":"投資の利益などを給料などのほかの所得と切り離し、一律の税率で計算する課税方法。","text":"投資の利益などを給料などのほかの所得と切り離し、一律の税率で計算する課税方法。","group":"その他"},{"term":"人的資本","reading":"","html":"将来働いて得られる収入を、その人の財産としてとらえた考え方。若い人ほど大きい。","text":"将来働いて得られる収入を、その人の財産としてとらえた考え方。若い人ほど大きい。","group":"その他"},{"term":"成長投資枠","reading":"","html":"NISAの枠の1つ。上場株式や投資信託などを年240万円まで買える。生涯で使えるのは1,200万円まで。","text":"NISAの枠の1つ。上場株式や投資信託などを年240万円まで買える。生涯で使えるのは1,200万円まで。","group":"その他"},{"term":"政策金利","reading":"","html":"中央銀行が金融政策で目標にする短期の金利。日本では銀行どうしが翌日まで貸し借りする金利が目標とされます。","text":"中央銀行が金融政策で目標にする短期の金利。日本では銀行どうしが翌日まで貸し借りする金利が目標とされます。","group":"その他"},{"term":"正規分布","reading":"","html":"平均のあたりがいちばん起きやすく、離れるほど起きにくい、左右対称の山の形のばらつき方。","text":"平均のあたりがいちばん起きやすく、離れるほど起きにくい、左右対称の山の形のばらつき方。","group":"その他"},{"term":"生活防衛資金","reading":"","html":"病気や急な出費、収入の減少に備えて、すぐ使える預金などでとっておくお金。投資のお金とは分けて持ちます。","text":"病気や急な出費、収入の減少に備えて、すぐ使える預金などでとっておくお金。投資のお金とは分けて持ちます。","group":"その他"},{"term":"生産性","reading":"","html":"一定の時間や資源で、どれだけの価値を生み出せるかを表す考え方。技術や工夫で高まります。","text":"一定の時間や資源で、どれだけの価値を生み出せるかを表す考え方。技術や工夫で高まります。","group":"その他"},{"term":"積立投資","reading":"","html":"一定の間隔で、少しずつ継続して投資する方法。毎月決まった日に買う設定が一般的。","text":"一定の間隔で、少しずつ継続して投資する方法。毎月決まった日に買う設定が一般的。","group":"その他"},{"term":"先取り貯蓄","reading":"","html":"収入が入ったら、使う前に貯める分を別の口座などへ移す貯め方。残りのお金で暮らすので、意志に頼らず貯まりやすい。","text":"収入が入ったら、使う前に貯める分を別の口座などへ移す貯め方。残りのお金で暮らすので、意志に頼らず貯まりやすい。","group":"その他"},{"term":"全世界株式","reading":"","html":"先進国と新興国を合わせた世界中の株にまとめて投資すること。また、それに連動する投資信託。","text":"先進国と新興国を合わせた世界中の株にまとめて投資すること。また、それに連動する投資信託。","group":"その他"},{"term":"相関","reading":"","html":"2つのものが一緒に動く度合い。同じ方向に動きやすいほど高く、相関が低い資産を混ぜるほど分散の効果は大きい。","text":"2つのものが一緒に動く度合い。同じ方向に動きやすいほど高く、相関が低い資産を混ぜるほど分散の効果は大きい。","group":"その他"},{"term":"損益通算","reading":"","html":"同じ年の利益と損失を差し引きして、税金のかかる利益を減らすこと。","text":"同じ年の利益と損失を差し引きして、税金のかかる利益を減らすこと。","group":"その他"},{"term":"損失回避","reading":"","html":"同じ額でも、得をした喜びより損をした痛みを大きく感じる心のくせ。プロスペクト理論の中心的な考え方です。","text":"同じ額でも、得をした喜びより損をした痛みを大きく感じる心のくせ。プロスペクト理論の中心的な考え方です。","group":"その他"},{"term":"多要素認証","reading":"","html":"パスワードに加えて、スマホに届く確認コードなど別の手段も使って本人を確かめるログイン方式。","text":"パスワードに加えて、スマホに届く確認コードなど別の手段も使って本人を確かめるログイン方式。","group":"その他"},{"term":"単元株","reading":"","html":"株を売買するときの基本の単位となる株数。日本の証券取引所では2018年10月から100株に統一されている。","text":"株を売買するときの基本の単位となる株数。日本の証券取引所では2018年10月から100株に統一されている。","group":"その他"},{"term":"単利","reading":"","html":"最初の元本にだけ利息がつく方式。増える額は毎年同じです。","text":"最初の元本にだけ利息がつく方式。増える額は毎年同じです。","group":"その他"},{"term":"中央銀行","reading":"","html":"国のお金の発行や量、金利の調整を担う特別な銀行。日本では日本銀行です。","text":"国のお金の発行や量、金利の調整を担う特別な銀行。日本では日本銀行です。","group":"その他"},{"term":"投機","reading":"","html":"価格の上がり下がりを予想し、短期間の売買で差額をねらう行為。全体としてはゼロサムに近い。","text":"価格の上がり下がりを予想し、短期間の売買で差額をねらう行為。全体としてはゼロサムに近い。","group":"その他"},{"term":"投資者保護基金","reading":"","html":"証券会社が破綻し、分別管理の不備で資産を返せない場合に、1人あたり1,000万円まで補償する仕組み。値下がりの損は対象外です。","text":"証券会社が破綻し、分別管理の不備で資産を返せない場合に、1人あたり1,000万円まで補償する仕組み。値下がりの損は対象外です。","group":"その他"},{"term":"投資信託","reading":"","html":"大勢から集めたお金をまとめ、専門家が多くの株や債券に分けて投資する商品。投信とも呼ぶ。","text":"大勢から集めたお金をまとめ、専門家が多くの株や債券に分けて投資する商品。投信とも呼ぶ。","group":"その他"},{"term":"特定口座","reading":"","html":"証券会社が1年間の売買の損益を計算してくれる口座。「源泉徴収あり」なら税金の納付まで代わりに行い、原則として確定申告が不要になる。","text":"証券会社が1年間の売買の損益を計算してくれる口座。「源泉徴収あり」なら税金の納付まで代わりに行い、原則として確定申告が不要になる。","group":"その他"},{"term":"特定親族特別控除","reading":"","html":"19〜22歳の子などの所得が扶養控除の基準を超えても、一定額までは親の控除が段階的に残るしくみ。2025年分から導入された。","text":"19〜22歳の子などの所得が扶養控除の基準を超えても、一定額までは親の控除が段階的に残るしくみ。2025年分から導入された。","group":"その他"},{"term":"日本銀行券","reading":"","html":"日本銀行が発行するお札のこと。日本銀行法にもとづき、日本銀行だけが発行できます。","text":"日本銀行が発行するお札のこと。日本銀行法にもとづき、日本銀行だけが発行できます。","group":"その他"},{"term":"配当","reading":"","html":"会社が稼いだ利益の一部を、持っている株数に応じて株主に配るお金。業績しだいで増えたり減ったりする。","text":"会社が稼いだ利益の一部を、持っている株数に応じて株主に配るお金。業績しだいで増えたり減ったりする。","group":"その他"},{"term":"配当利回り","reading":"","html":"株価に対する1年分の配当の割合。株価2,000円で配当50円なら2.5%。","text":"株価に対する1年分の配当の割合。株価2,000円で配当50円なら2.5%。","group":"その他"},{"term":"被扶養者","reading":"","html":"家族の健康保険に、保険料を払わずに入っている人。年間収入などの条件がある。","text":"家族の健康保険に、保険料を払わずに入っている人。年間収入などの条件がある。","group":"その他"},{"term":"非課税保有限度額","reading":"","html":"NISAで一生のうちに非課税で持てる金額の上限。合計1,800万円で、買った値段（簿価）で数える。","text":"NISAで一生のうちに非課税で持てる金額の上限。合計1,800万円で、買った値段（簿価）で数える。","group":"その他"},{"term":"標準偏差","reading":"","html":"結果が平均からどれくらい離れやすいかを表す数字。投資では、年間リターンの標準偏差を「リスク」と呼ぶことが多い。","text":"結果が平均からどれくらい離れやすいかを表す数字。投資では、年間リターンの標準偏差を「リスク」と呼ぶことが多い。","group":"その他"},{"term":"付加価値","reading":"","html":"会社などが事業を通じて新しく生み出した価値。株式のリターンの源になる。","text":"会社などが事業を通じて新しく生み出した価値。株式のリターンの源になる。","group":"その他"},{"term":"扶養控除","reading":"","html":"生活を支えている家族がいる人の所得から差し引ける控除。子の所得が一定以下であることが条件。","text":"生活を支えている家族がいる人の所得から差し引ける控除。子の所得が一定以下であることが条件。","group":"その他"},{"term":"複利","reading":"","html":"ついた利息を元本に加え、その合計に次の利息がつく方式。時間がたつほど増え方が大きくなります。","text":"ついた利息を元本に加え、その合計に次の利息がつく方式。時間がたつほど増え方が大きくなります。","group":"その他"},{"term":"分散投資","reading":"","html":"値動きの異なる複数の資産に分けて投資し、全体のぶれを小さくする方法。","text":"値動きの異なる複数の資産に分けて投資し、全体のぶれを小さくする方法。","group":"その他"},{"term":"分配金","reading":"","html":"投資信託が運用で得た利益などから投資家に払い出すお金。払い出した分だけ投資信託の値段は下がる。","text":"投資信託が運用で得た利益などから投資家に払い出すお金。払い出した分だけ投資信託の値段は下がる。","group":"その他"},{"term":"分別管理","reading":"","html":"投資信託の財産を、信託銀行が自社の財産と分けて保管すること。会社が破綻しても財産が守られやすくなる。","text":"投資信託の財産を、信託銀行が自社の財産と分けて保管すること。会社が破綻しても財産が守られやすくなる。","group":"その他"},{"term":"平均購入単価","reading":"","html":"買った総額を、買った総数（口数や株数）で割った1単位あたりの値段。","text":"買った総額を、買った総数（口数や株数）で割った1単位あたりの値段。","group":"その他"},{"term":"変動費","reading":"","html":"食費や交際費など、月によって金額が変わる支出。","text":"食費や交際費など、月によって金額が変わる支出。","group":"その他"},{"term":"簿価","reading":"","html":"資産を買ったときの値段。NISAの枠の計算や、売ったときの利益の計算のもとになる。","text":"資産を買ったときの値段。NISAの枠の計算や、売ったときの利益の計算のもとになる。","group":"その他"},{"term":"本人確認","reading":"","html":"口座を開く人が本人であることを、書類や顔写真で確かめる手続き。なりすましや犯罪のお金の受け渡しを防ぐ目的がある。","text":"口座を開く人が本人であることを、書類や顔写真で確かめる手続き。なりすましや犯罪のお金の受け渡しを防ぐ目的がある。","group":"その他"},{"term":"名目金利","reading":"","html":"通帳や契約に書かれている、そのままの金利。物価の変化は考えに入れていません。","text":"通帳や契約に書かれている、そのままの金利。物価の変化は考えに入れていません。","group":"その他"},{"term":"有限責任","reading":"","html":"株主の責任が、株式を手に入れるために払った金額までに限られること。会社が倒産しても追加で支払う必要はない。","text":"株主の責任が、株式を手に入れるために払った金額までに限られること。会社が倒産しても追加で支払う必要はない。","group":"その他"},{"term":"預金保険制度","reading":"","html":"金融機関が破綻したときに預金を守る国の制度。1金融機関につき1人あたり元本1,000万円とその利息などが保護されます。","text":"金融機関が破綻したときに預金を守る国の制度。1金融機関につき1人あたり元本1,000万円とその利息などが保護されます。","group":"その他"},{"term":"利率","reading":"","html":"債券の額面に対して、1年にいくらの利息が払われるかを示す割合。","text":"債券の額面に対して、1年にいくらの利息が払われるかを示す割合。","group":"その他"}],"icons":{"question":"\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>","answer":"\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>","why":"\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"
