21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>総務省統計局「消費者物価指数（CPI）全国（最新の月次結果の概要）」 \u003ca href=\"https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html\u003c/a>\u003c/li>\u003cli>預金保険機構「預金保険制度の基礎知識」 \u003ca href=\"https://www.dic.go.jp/yokinsha/kihon.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.dic.go.jp/yokinsha/kihon.html\u003c/a>\u003c/li>\u003cli>日本銀行「金融市場調節方針の変更について（2026年9月18日）」 \u003ca href=\"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260918a.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260918a.pdf\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"預金なら元本が減らず安心です。それでも「預金だけでは損をする」と言われるのはなぜでしょうか。 預金の金額は減りませんが、物価が預金金利より速く上がると、買える量が減ります。金額ではなく「買える力」で見ると、目減りが起きているのです。 「名目」と「実質」 金利には2つの見方があります。名目金利は、通帳に書かれている金利そのものです。実質金利は、名目金利から物価上昇率を差し引いた、買える力で見た金利です。 たとえば預金金利が年0.4%で、物価上昇率が年2.1%だとします。実質金利は、0.4% − 2.1% = 約マイナス1.7%です。通帳の数字は増えても、買える物は1年で約1.7%減る計算です。 2026年10月時点の日本では、大手銀行の普通預金金利は年0.4%程度です。一方、2026年9月の消費者物価は前年より約2.1%上がりました。この状態が続けば、預金の実質金利はマイナスです。 なぜ預金金利は、物価上昇率より低くなりやすいのでしょうか。 1つ目の理由は、預金が「安全で、いつでも引き出せる」からです。銀行は預かったお金を企業や個人に貸し、その金利との差で利益を得ます。安全と便利さを提供する代わりに、預金者に払う金利は低めになります。安全にはコストがかかるのです。 2つ目は、預金金利が物価の動きに遅れて動くことです。物価が上がり始めても、銀行がすぐに預金金利を上げるとは限りません。 つまり預金は「減らない安心」と引き換えに、「物価に負けやすい」という性質を持っています。どちらが正しいではなく、性質の違いです。 それでも預金が大切な理由 預金には、ほかの資産にない強みがあります。元本が変わらず、すぐに引き出せることです。さらに預金保険制度により、銀行が破綻しても1つの金融機関につき1人あたり元本1,000万円と、破綻日までの利息が保護されます。 急な出費に備えるお金は、値動きしない預金で持つのが向いています。この「生活防衛資金」については第8話で扱います。 物価に負けにくい資産とは では、物価に負けにくいのはどんな資産でしょうか。代表例は株式です。物価が上がると、会社が売る商品の値段も上がり、売上や利益も増えやすくなります。会社の持ち分である株式は、その利益の伸びを受け取れます。 ただし、株式は短期間で大きく値下がりすることもあります。物価に負けにくい代わりに、値動きという別のリスクを引き受けるわけです。株が長期で上がってきた根拠は、次の第7話で見ていきます。 20万円を年0.4%の預金に置き、物価が年2.1%上がり続けたとします。実質で年約1.7%ずつ目減りすると、10年後の買える力は「今の約17万円分」です。通帳の数字は約20.8万円に増えていても、買える量は約3万円分減る計算です（税金は考えていません）。 これは「預金は悪い」という意味ではありません。日本では1990年代後半から長い間、物価がほとんど上がらない時期が続き、預金でも買える力はあまり減りませんでした。将来の物価は誰にも正確にはわかりません。だからこそ、預金と投資に役割を分けて持つ考え方が生まれます（第12話）。 実質金利は、名目金利から物価上昇率を引いた「買える力」の金利 物価上昇率が預金金利を上回ると、預金の買える力は目減りする 預金は「すぐ使える・減らない」強みがあり、役割を分けて使う 預金金利が年0.5%、物価上昇率が年2%のとき、実質金利はおよそいくつでしょう。 年プラス2.5% 年プラス0.5% 年マイナス1.5% 実質金利は名目金利から物価上昇率を引いて求めます。0.5% − 2% = マイナス1.5%です。"},{"no":7,"part":1,"title":"経済はなぜ成長するのか","subtitle":"株が長期で上がってきた根拠","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「株は長期で見れば上がってきた」とよく聞きます。それはたまたまなのでしょうか、それとも理由があるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>株価の土台は会社の利益で、利益は経済の成長とともに増えてきました。経済が成長する理由は、人が働き、道具をそろえ、工夫を重ねて、同じ時間でより多くの価値を生み出せるようになるからです。ただし、上がり続ける保証はありません。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>経済成長とは何か\u003c/h2>\n\u003cp>経済の大きさは、\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"GDP\">GDP\u003c/span>（国内総生産）で測ります。GDPとは、国内で1年間に新しく生み出された物やサービスの価値の合計です。これが増えることを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"経済成長\">経済成長\u003c/span>といいます。\u003c/p>\n\u003cp>国際通貨基金（IMF）は2026年10月に世界経済の見通しを発表しました。世界の成長率は2026年に約3.1%、2027年に約3.4%という予測です。予測なので外れることもありますが、世界経済は長い目で見ると拡大を続けてきました。\u003c/p>\n\u003ch2>経済を大きくする3つの力\u003c/h2>\n\u003cp>経済が成長する力は、大きく3つに分けられます。\u003c/p>\n\u003col>\u003cli>\u003cstrong>働く人\u003c/strong>: 働く人が増えれば、生み出せる量も増えます。\u003c/li>\u003cli>\u003cstrong>道具や設備\u003c/strong>: 機械やパソコン、工場があれば、1人で作れる量が増えます。\u003c/li>\u003cli>\u003cstrong>工夫と技術\u003c/strong>: 新しい技術ややり方で、同じ時間でより多くの価値を生めます。\u003c/li>\u003c/ol>\n\u003cp>3つ目は\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"生産性\">生産性\u003c/span>と呼ばれます。生産性とは、一定の時間や資源でどれだけの価値を生み出せるかです。人口が増えにくい国でも、生産性が上がれば経済は成長できます。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ経済の成長が株価につながるのでしょうか。\u003c/p>\n\u003cp>株式は、会社の持ち主の権利を小さく分けたものです（第20話）。会社がもうけた利益は、最終的に持ち主のものです。経済が成長すると、会社の売上と利益が増えやすくなります。物価が上がれば、売上の金額も増えます。持ち主の取り分が大きくなるので、株式の価値も上がりやすくなるのです。\u003c/p>\n\u003cp>もう1つの理由があります。会社に出資する人は、損をするかもしれない危険を引き受けています。危険を引き受ける人がいなければ、新しい事業は生まれません。そのため、株式には平均すると預金より高い見返りが期待されてきました。この「危険を引き受ける見返り」は第15話で詳しく扱います。\u003c/p>\n\u003cp>つまり株が長期で上がってきたのは偶然ではなく、「人々の工夫で増えた利益の分け前」だからです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>理由があっても、保証はない\u003c/h2>\n\u003cp>ただし、この理屈が短期間で必ず現れるわけではありません。日経平均株価は1989年末に約3万8,900円をつけた後、大きく下がりました。その値を終値で上回ったのは2024年2月で、約34年もかかりました。\u003c/p>\n\u003cp>1つの国や時期に集中すると、長く報われないことがあります。だから多くの国や会社に分けて持つ「分散」が大切になります（第16話）。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円で世界の株式に広く投資するとします。これは「世界中の会社が生む利益の、ほんの一部の持ち主になる」ことです。世界経済が年3%前後で成長を続ければ、利益の分け前も増えると期待できます。ただし、1年で20万円が14万円ほどに下がる年もありえます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「経済が成長するから株は必ず上がる」は誤りです。株価には期待や不安も反映され、利益より大きく揺れます。また、過去に成長した事実は、将来も同じように成長する保証にはなりません。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>経済は、働く人・道具・工夫（生産性）によって成長する\u003c/li>\u003cli>株式は会社の利益の分け前なので、経済成長とともに価値が上がりやすい\u003c/li>\u003cli>日本株のように、高値を取り戻すまで約34年かかった例もある\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>株式が長期で上がってきた根本的な理由として、最も近いものはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">株価は毎年決まった率で上がるように決められているから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">経済成長で会社の利益が増え、その分け前を受け取れるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">国が株価の下落を禁止しているから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>株式は会社の利益の持ち分です。経済が成長して利益が増えると、株式の価値も上がりやすくなります。ただし保証はありません。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>IMF「World Economic Outlook, October 2026」 \u003ca href=\"https://www.imf.org/en/publications/weo/issues/2026/10/13/world-economic-outlook-october-2026\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.imf.org/en/publications/weo/issues/2026/10/13/world-economic-outlook-october-2026\u003c/a>\u003c/li>\u003cli>日本経済新聞社 日経平均プロフィル「2024年2月の日経平均」 \u003ca href=\"https://indexes.nikkei.co.jp/atoz/2024/03/202402.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://indexes.nikkei.co.jp/atoz/2024/03/202402.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「株は長期で見れば上がってきた」とよく聞きます。それはたまたまなのでしょうか、それとも理由があるのでしょうか。 株価の土台は会社の利益で、利益は経済の成長とともに増えてきました。経済が成長する理由は、人が働き、道具をそろえ、工夫を重ねて、同じ時間でより多くの価値を生み出せるようになるからです。ただし、上がり続ける保証はありません。 経済成長とは何か 経済の大きさは、GDP（国内総生産）で測ります。GDPとは、国内で1年間に新しく生み出された物やサービスの価値の合計です。これが増えることを経済成長といいます。 国際通貨基金（IMF）は2026年10月に世界経済の見通しを発表しました。世界の成長率は2026年に約3.1%、2027年に約3.4%という予測です。予測なので外れることもありますが、世界経済は長い目で見ると拡大を続けてきました。 経済を大きくする3つの力 経済が成長する力は、大きく3つに分けられます。 働く人: 働く人が増えれば、生み出せる量も増えます。 道具や設備: 機械やパソコン、工場があれば、1人で作れる量が増えます。 工夫と技術: 新しい技術ややり方で、同じ時間でより多くの価値を生めます。 3つ目は生産性と呼ばれます。生産性とは、一定の時間や資源でどれだけの価値を生み出せるかです。人口が増えにくい国でも、生産性が上がれば経済は成長できます。 なぜ経済の成長が株価につながるのでしょうか。 株式は、会社の持ち主の権利を小さく分けたものです（第20話）。会社がもうけた利益は、最終的に持ち主のものです。経済が成長すると、会社の売上と利益が増えやすくなります。物価が上がれば、売上の金額も増えます。持ち主の取り分が大きくなるので、株式の価値も上がりやすくなるのです。 もう1つの理由があります。会社に出資する人は、損をするかもしれない危険を引き受けています。危険を引き受ける人がいなければ、新しい事業は生まれません。そのため、株式には平均すると預金より高い見返りが期待されてきました。この「危険を引き受ける見返り」は第15話で詳しく扱います。 つまり株が長期で上がってきたのは偶然ではなく、「人々の工夫で増えた利益の分け前」だからです。 理由があっても、保証はない ただし、この理屈が短期間で必ず現れるわけではありません。日経平均株価は1989年末に約3万8,900円をつけた後、大きく下がりました。その値を終値で上回ったのは2024年2月で、約34年もかかりました。 1つの国や時期に集中すると、長く報われないことがあります。だから多くの国や会社に分けて持つ「分散」が大切になります（第16話）。 20万円で世界の株式に広く投資するとします。これは「世界中の会社が生む利益の、ほんの一部の持ち主になる」ことです。世界経済が年3%前後で成長を続ければ、利益の分け前も増えると期待できます。ただし、1年で20万円が14万円ほどに下がる年もありえます。 「経済が成長するから株は必ず上がる」は誤りです。株価には期待や不安も反映され、利益より大きく揺れます。また、過去に成長した事実は、将来も同じように成長する保証にはなりません。 経済は、働く人・道具・工夫（生産性）によって成長する 株式は会社の利益の分け前なので、経済成長とともに価値が上がりやすい 日本株のように、高値を取り戻すまで約34年かかった例もある 株式が長期で上がってきた根本的な理由として、最も近いものはどれでしょう。 株価は毎年決まった率で上がるように決められているから 経済成長で会社の利益が増え、その分け前を受け取れるから 国が株価の下落を禁止しているから 株式は会社の利益の持ち分です。経済が成長して利益が増えると、株式の価値も上がりやすくなります。ただし保証はありません。"},{"no":8,"part":2,"title":"投資の前にやること","subtitle":"生活防衛資金","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>早く投資を始めたほうが複利の効果が大きいと知りました。手元の20万円を、全部投資に回してもよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>全部を投資に回すのはおすすめしません。先に、急な出費や収入が減ったときに備える\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"生活防衛資金\">生活防衛資金\u003c/span>を、預金で確保しておくのが基本です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>生活防衛資金とは\u003c/h2>\n\u003cp>生活防衛資金とは、病気やけが、急な出費、収入の減少に備えて、すぐ使える形でとっておくお金です。投資に回すお金とは分けて、普通預金などに置いておきます。\u003c/p>\n\u003cp>目安としてよく言われるのは、働いている人なら「生活費の3か月〜半年分」です。これは公式の基準ではなく、一般的な目安です。\u003c/p>\n\u003cp>金融庁の審議会の報告書（案）にも、同じ順番の考え方が書かれています。いざというときのお金は預貯金などで確保し、そのうえで少額から長期の投資を行う、という順番です。\u003c/p>\n\u003ch2>なぜ投資の「前」なのか\u003c/h2>\n\u003cp>順番が大切なのは、投資の失敗の多くが「売りたくないときに売らされる」ことで起きるからです。\u003c/p>\n\u003cp>株式などは、ときに大きく値下がりします。そのタイミングで急にお金が必要になると、下がった値段で売るしかありません。一時的な値下がりが、取り返せない損に変わってしまいます。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資で利益を得るには「待てること」が条件です。複利も、長期の成長も、時間をかけて初めて効果が出ます。\u003c/p>\n\u003cp>ところが、人は待てるかどうかを自分で選べるとは限りません。スマホが壊れる、実家に帰る交通費が必要になる、バイトのシフトが減る。こうした出来事は、相場の都合を待ってくれません。\u003c/p>\n\u003cp>生活防衛資金は、こうした出来事が起きても投資に手をつけずにすむ「緩衝材」です。つまり、生活防衛資金があるから、投資のお金は安心して「待つ」ことができます。投資を続ける力そのものを守るお金なのです。\u003c/p>\n\u003cp>もう1つ、心の面の効果もあります。生活が守られていると分かっていれば、値下がりの場面でも冷静でいやすくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>学生の場合の考え方\u003c/h2>\n\u003cp>学生は、実家暮らしか一人暮らしかで、必要な額が大きく変わります。全国大学生協連の調査（2025年秋実施）では、1か月の支出合計は自宅生で約7.1万円でした。下宿生は住居費だけで約5.5万円かかっています。\u003c/p>\n\u003cp>ただし、この中には親が払っている費用も含まれます。大事なのは「自分が払う生活費」を基準に考えることです。自分の支出の把握は、次の第9話で扱います。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>実家暮らしで、自分で払う生活費が月4万円の学生を考えます。3か月分なら12万円です。20万円のうち12万円を生活防衛資金として預金に残すと、投資に回せるのは残りの8万円です。少なく感じるかもしれません。しかし、値下がりの場面で20万円を慌てて売るより、8万円を持ち続けられるほうが、長い目で見て有利になりやすいのです。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>生活防衛資金は「何か月分なら正解」という公式な基準はありません。体調やバイトの安定度、仕送りの有無で変わります。不安が大きい人は多めに持ってかまいません。20万円の具体的な分け方は第12話で考えます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>生活防衛資金は、急な出費や収入減に備えて預金で持つお金\u003c/li>\u003cli>投資の失敗の多くは「下がったときに売らされる」ことで起きる\u003c/li>\u003cli>生活防衛資金は、投資を「待てる」状態をつくるための土台\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>生活防衛資金を投資より先に用意する、最も大きな理由はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">預金のほうが投資より必ず増えるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">急な出費のときに、値下がりした投資を売らずにすむから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">投資は生活防衛資金がないと法律で始められないから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>生活防衛資金があれば、相場が悪いときに投資を売らされずにすみます。投資を長く続けるための土台です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁 金融審議会 市場ワーキング・グループ「報告書（案）『高齢社会における資産形成・管理』（2019年6月3日）」 \u003ca href=\"https://www.fsa.go.jp/singi/singi_kinyu/market_wg/siryou/20190603/01.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/singi/singi_kinyu/market_wg/siryou/20190603/01.pdf\u003c/a>\u003c/li>\u003cli>全国大学生活協同組合連合会「第61回学生生活実態調査 概要報告」 \u003ca href=\"https://www.univcoop.or.jp/vision/vision_1896.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.univcoop.or.jp/vision/vision_1896.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"早く投資を始めたほうが複利の効果が大きいと知りました。手元の20万円を、全部投資に回してもよいのでしょうか。 全部を投資に回すのはおすすめしません。先に、急な出費や収入が減ったときに備える生活防衛資金を、預金で確保しておくのが基本です。 生活防衛資金とは 生活防衛資金とは、病気やけが、急な出費、収入の減少に備えて、すぐ使える形でとっておくお金です。投資に回すお金とは分けて、普通預金などに置いておきます。 目安としてよく言われるのは、働いている人なら「生活費の3か月〜半年分」です。これは公式の基準ではなく、一般的な目安です。 金融庁の審議会の報告書（案）にも、同じ順番の考え方が書かれています。いざというときのお金は預貯金などで確保し、そのうえで少額から長期の投資を行う、という順番です。 なぜ投資の「前」なのか 順番が大切なのは、投資の失敗の多くが「売りたくないときに売らされる」ことで起きるからです。 株式などは、ときに大きく値下がりします。そのタイミングで急にお金が必要になると、下がった値段で売るしかありません。一時的な値下がりが、取り返せない損に変わってしまいます。 投資で利益を得るには「待てること」が条件です。複利も、長期の成長も、時間をかけて初めて効果が出ます。 ところが、人は待てるかどうかを自分で選べるとは限りません。スマホが壊れる、実家に帰る交通費が必要になる、バイトのシフトが減る。こうした出来事は、相場の都合を待ってくれません。 生活防衛資金は、こうした出来事が起きても投資に手をつけずにすむ「緩衝材」です。つまり、生活防衛資金があるから、投資のお金は安心して「待つ」ことができます。投資を続ける力そのものを守るお金なのです。 もう1つ、心の面の効果もあります。生活が守られていると分かっていれば、値下がりの場面でも冷静でいやすくなります。 学生の場合の考え方 学生は、実家暮らしか一人暮らしかで、必要な額が大きく変わります。全国大学生協連の調査（2025年秋実施）では、1か月の支出合計は自宅生で約7.1万円でした。下宿生は住居費だけで約5.5万円かかっています。 ただし、この中には親が払っている費用も含まれます。大事なのは「自分が払う生活費」を基準に考えることです。自分の支出の把握は、次の第9話で扱います。 実家暮らしで、自分で払う生活費が月4万円の学生を考えます。3か月分なら12万円です。20万円のうち12万円を生活防衛資金として預金に残すと、投資に回せるのは残りの8万円です。少なく感じるかもしれません。しかし、値下がりの場面で20万円を慌てて売るより、8万円を持ち続けられるほうが、長い目で見て有利になりやすいのです。 生活防衛資金は「何か月分なら正解」という公式な基準はありません。体調やバイトの安定度、仕送りの有無で変わります。不安が大きい人は多めに持ってかまいません。20万円の具体的な分け方は第12話で考えます。 生活防衛資金は、急な出費や収入減に備えて預金で持つお金 投資の失敗の多くは「下がったときに売らされる」ことで起きる 生活防衛資金は、投資を「待てる」状態をつくるための土台 生活防衛資金を投資より先に用意する、最も大きな理由はどれでしょう。 預金のほうが投資より必ず増えるから 急な出費のときに、値下がりした投資を売らずにすむから 投資は生活防衛資金がないと法律で始められないから 生活防衛資金があれば、相場が悪いときに投資を売らされずにすみます。投資を長く続けるための土台です。"},{"no":9,"part":2,"title":"学生のお金の流れを知る","subtitle":"収入と支出の見える化","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>毎月なんとなくお金がなくなります。投資を考える前に、自分のお金の流れをどう把握すればよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>まず1か月、入ってくるお金と出ていくお金を記録し、分類します。流れが見えると、どこを変えればよいか、毎月いくら投資に回せるかが分かります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>ほかの大学生はどうしているか\u003c/h2>\n\u003cp>全国大学生協連の調査（2025年秋実施）で、大学生の1か月のお金の流れを見てみます。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>自宅生\u003c/th>\u003cth>下宿生\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>収入合計\u003c/td>\u003ctd>約7.3万円\u003c/td>\u003ctd>約13.8万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>支出合計\u003c/td>\u003ctd>約7.1万円\u003c/td>\u003ctd>約13.8万円\u003c/td>\u003c/tr>\u003ctr>\u003ctd>目立つ項目\u003c/td>\u003ctd>収入の中心はバイト\u003c/td>\u003ctd>仕送り約7.5万円、住居費約5.5万円\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>自宅生は、収入の多くをアルバイトが占めます。下宿生は仕送りが収入の半分以上で、支出では家賃などの住居費が約4割を占めます。どちらも、物価高で食費が増えたと報告されています。\u003c/p>\n\u003cp>平均はあくまで目安です。大事なのは、他人と比べることより、自分の数字を知ることです。\u003c/p>\n\u003ch2>支出は2種類に分ける\u003c/h2>\n\u003cp>支出は、性質で2つに分けると考えやすくなります。\u003c/p>\n\u003cul>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"固定費\">固定費\u003c/span>: 毎月ほぼ同じ額が出ていくお金。家賃、スマホ代、サブスク、定期券など\u003c/li>\u003cli>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"変動費\">変動費\u003c/span>: 月によって変わるお金。食費、交際費、趣味、服など\u003c/li>\u003c/ul>\n\u003cp>見直すなら、まず固定費からが効果的です。一度変えれば、その後は何もしなくても毎月効果が続くからです。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「見える化」がそれほど大切なのでしょうか。理由は、人は記録しないと、小さく繰り返す支出を実際より少なく見積もるからです。\u003c/p>\n\u003cp>1回300円のコンビニのお菓子は、1回なら小さな額です。しかし週5回なら月6,000円、年7万2,000円になります。1回ごとの判断では「少しだけ」でも、積み重なると大きな額になります。\u003c/p>\n\u003cp>もう1つの理由は、「測れないものは改善できない」ことです。体重を量らずにダイエットが難しいのと同じです。数字が見えると、問題の場所が分かり、意志の強さに頼らずに対策を選べます。この考え方は、第11話の「先取り」の仕組みにもつながります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>見える化の3ステップ\u003c/h2>\n\u003col>\u003cli>\u003cstrong>1か月記録する\u003c/strong>: 家計簿アプリやメモで、レシートの金額だけでも残します。\u003c/li>\u003cli>\u003cstrong>分類する\u003c/strong>: 固定費と変動費に分け、大きい順に並べます。\u003c/li>\u003cli>\u003cstrong>1つだけ変える\u003c/strong>: 使っていないサブスクの解約など、効果の大きいものから1つ選びます。\u003c/li>\u003c/ol>\n\u003cp>最初から完璧を目指す必要はありません。続けられる方法が一番です。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>実家暮らしで、バイト収入が月4万円、支出が月3.5万円の学生を考えます。記録すると、使っていないサブスクが月1,000円見つかりました。解約すれば、毎月の余りは6,000円になります。年間では7万2,000円で、手元の20万円の3分の1以上にあたります。この余りが、将来の積立の原資になります（第39話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>バイト収入が増えると、税金や親の扶養に影響することがあります。いわゆる「年収の壁」です。働き方を決める前に、第36話も読んでおくと安心です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>まず1か月、収入と支出を記録して流れを見える化する\u003c/li>\u003cli>支出は固定費と変動費に分け、固定費から見直すと効果が続く\u003c/li>\u003cli>小さな支出の積み重ねは、記録しないと少なく見積もりやすい\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>支出を見直すとき、固定費から手をつけるとよい理由はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">固定費は変動費より必ず金額が大きいから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">一度見直せば、毎月自動的に効果が続くから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">変動費は見直しても意味がないから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>固定費は毎月同じ額が出ていくので、一度変えれば効果がずっと続きます。意志の力に頼らずにすみます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>全国大学生活協同組合連合会「第61回学生生活実態調査 概要報告」 \u003ca href=\"https://www.univcoop.or.jp/vision/vision_1896.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.univcoop.or.jp/vision/vision_1896.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"毎月なんとなくお金がなくなります。投資を考える前に、自分のお金の流れをどう把握すればよいのでしょうか。 まず1か月、入ってくるお金と出ていくお金を記録し、分類します。流れが見えると、どこを変えればよいか、毎月いくら投資に回せるかが分かります。 ほかの大学生はどうしているか 全国大学生協連の調査（2025年秋実施）で、大学生の1か月のお金の流れを見てみます。 項目 自宅生 下宿生 収入合計 約7.3万円 約13.8万円 支出合計 約7.1万円 約13.8万円 目立つ項目 収入の中心はバイト 仕送り約7.5万円、住居費約5.5万円 自宅生は、収入の多くをアルバイトが占めます。下宿生は仕送りが収入の半分以上で、支出では家賃などの住居費が約4割を占めます。どちらも、物価高で食費が増えたと報告されています。 平均はあくまで目安です。大事なのは、他人と比べることより、自分の数字を知ることです。 支出は2種類に分ける 支出は、性質で2つに分けると考えやすくなります。 固定費: 毎月ほぼ同じ額が出ていくお金。家賃、スマホ代、サブスク、定期券など 変動費: 月によって変わるお金。食費、交際費、趣味、服など 見直すなら、まず固定費からが効果的です。一度変えれば、その後は何もしなくても毎月効果が続くからです。 なぜ「見える化」がそれほど大切なのでしょうか。理由は、人は記録しないと、小さく繰り返す支出を実際より少なく見積もるからです。 1回300円のコンビニのお菓子は、1回なら小さな額です。しかし週5回なら月6,000円、年7万2,000円になります。1回ごとの判断では「少しだけ」でも、積み重なると大きな額になります。 もう1つの理由は、「測れないものは改善できない」ことです。体重を量らずにダイエットが難しいのと同じです。数字が見えると、問題の場所が分かり、意志の強さに頼らずに対策を選べます。この考え方は、第11話の「先取り」の仕組みにもつながります。 見える化の3ステップ 1か月記録する: 家計簿アプリやメモで、レシートの金額だけでも残します。 分類する: 固定費と変動費に分け、大きい順に並べます。 1つだけ変える: 使っていないサブスクの解約など、効果の大きいものから1つ選びます。 最初から完璧を目指す必要はありません。続けられる方法が一番です。 実家暮らしで、バイト収入が月4万円、支出が月3.5万円の学生を考えます。記録すると、使っていないサブスクが月1,000円見つかりました。解約すれば、毎月の余りは6,000円になります。年間では7万2,000円で、手元の20万円の3分の1以上にあたります。この余りが、将来の積立の原資になります（第39話）。 バイト収入が増えると、税金や親の扶養に影響することがあります。いわゆる「年収の壁」です。働き方を決める前に、第36話も読んでおくと安心です。 まず1か月、収入と支出を記録して流れを見える化する 支出は固定費と変動費に分け、固定費から見直すと効果が続く 小さな支出の積み重ねは、記録しないと少なく見積もりやすい 支出を見直すとき、固定費から手をつけるとよい理由はどれでしょう。 固定費は変動費より必ず金額が大きいから 一度見直せば、毎月自動的に効果が続くから 変動費は見直しても意味がないから 固定費は毎月同じ額が出ていくので、一度変えれば効果がずっと続きます。意志の力に頼らずにすみます。"},{"no":10,"part":2,"title":"借金と投資、どちらが先？","subtitle":"金利で考える（リボ・奨学金）","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>借金があるときに投資を始めてもよいのでしょうか。それとも、借金を返すのが先でしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>借金の金利と、投資で期待できる利回りを比べて考えます。リボ払いのような高い金利の借金は、投資より先に返すのが基本です。一方、金利の低い奨学金は、計画どおりに返しながら投資と並行することもできます。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>借金を返すことは「確実なリターン」\u003c/h2>\n\u003cp>年15%の借金を10万円返すと、その分の利息、年1万5,000円を払わずにすみます。これは、10万円を年15%で確実に運用したのと同じ効果です。\u003c/p>\n\u003cp>投資で毎年15%を確実に得る方法はありません。だから高い金利の借金があるなら、返すことが最も有利な「投資」になります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ借金の返済を優先すべきなのでしょうか。根っこにあるのは、「借金の金利は確実、投資の利回りは不確実」という違いです。\u003c/p>\n\u003cp>投資の利回りは、うまくいけば高く、悪ければマイナスにもなります。一方、借金の利息は、相場がどうなっても決まった率でかかり続けます。\u003c/p>\n\u003cp>さらに、第5話の複利は借金にも働きます。返さない利息が元本に加わると、利息が利息を生みます。投資の複利があなたの味方なら、借金の複利は敵です。高い金利の借金を抱えたまま投資をするのは、「不確実な味方」に賭けて「確実な敵」を放っておく状態です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>リボ払いの怖さ\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リボ払い\">リボ払い\u003c/span>とは、クレジットカードの利用額にかかわらず、毎月ほぼ一定の額を払う方式です。毎月の負担が小さく見える一方、残高が減りにくく、手数料が長くかかり続けます。\u003c/p>\n\u003cp>例として、20万円の買い物を年15%のリボ払いにし、毎月1万円ずつ返すとします。完済まで約2年かかり、手数料は約3.2万円です。毎月5,000円にすると、完済まで約4年8か月かかり、手数料は約7.9万円に増えます。\u003c/p>\n\u003cp>いずれも、毎月の返済額に手数料を含む方式で、手数料を月割りにした簡略な計算です。カードによっては、「一括払い」のつもりでも自動でリボ払いになる設定があるので注意が必要です。\u003c/p>\n\u003ch2>奨学金はどう考えるか\u003c/h2>\n\u003cp>日本学生支援機構（JASSO）の貸与型\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"奨学金\">奨学金\u003c/span>には、無利子の第一種と、利子のつく第二種があります。第二種も在学中は利子がかかりません。卒業後の利率は、原則として貸与が終わった月の水準で決まります。上限は年3%です（増額貸与の上乗せ分などを除く）。\u003c/p>\n\u003cp>たとえば2025年12月に貸与を終えた人の場合、利率固定方式で年約2.3%でした。その後の金利上昇で、2026年には3%近い月もあったと報じられています。利率は毎月変わるので、JASSOの公表値で確かめてください。\u003c/p>\n\u003cp>リボ払いと比べると金利はかなり低く、返済期間も長く設定されています。そのため、決められた返済を続けながら、余ったお金で少しずつ投資をする考え方もあります。\u003c/p>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円を持つ学生が、別にリボ払いの残高を5万円抱えているとします。年15%なら、放っておくと年約7,500円の手数料がかかります。まず5万円を返せば、確実に7,500円分得をします。残る15万円で生活防衛資金をつくり、余裕があれば投資へ、という順番が安全です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>奨学金は学業のためのお金です。借りたお金を投資に回すと、値下がりしたときに学費や返済に困るおそれがあります。勧められません。返済に困ったときは、JASSOには返還を待ってもらう制度などもあるので、早めに相談しましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>借金の返済は、その金利で確実に運用するのと同じ効果がある\u003c/li>\u003cli>リボ払いなど高い金利の借金は、投資より先に返すのが基本\u003c/li>\u003cli>低金利の奨学金は、計画どおり返しながら投資と並行する考え方もある\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>年15%のリボ払い残高と、投資の選択肢があるとき、一般に先にすべきことはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">投資で15%以上を狙って増やす\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">リボ払いの残高を返す\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">どちらも何もしない\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>借金の利息は確実にかかりますが、投資の利回りは不確実です。高金利の借金を返すことは確実なリターンになります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>日本学生支援機構「貸与利率の推移」 \u003ca href=\"https://www.jasso.go.jp/shogakukin/about/taiyo/taiyo_2shu/riritsu/2007ikou.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jasso.go.jp/shogakukin/about/taiyo/taiyo_2shu/riritsu/2007ikou.html\u003c/a>\u003c/li>\u003cli>日本学生支援機構「第二種奨学金に係る利率算定方法の選択制の導入について」 \u003ca href=\"https://www.jasso.go.jp/shogakukin/about/henko/1187948_1906.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.jasso.go.jp/shogakukin/about/henko/1187948_1906.html\u003c/a>\u003c/li>\u003cli>国民生活センター「意図せぬリボ払い 利用明細は必ず確認（見守り情報）」 \u003ca href=\"https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen427.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen427.html\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"借金があるときに投資を始めてもよいのでしょうか。それとも、借金を返すのが先でしょうか。 借金の金利と、投資で期待できる利回りを比べて考えます。リボ払いのような高い金利の借金は、投資より先に返すのが基本です。一方、金利の低い奨学金は、計画どおりに返しながら投資と並行することもできます。 借金を返すことは「確実なリターン」 年15%の借金を10万円返すと、その分の利息、年1万5,000円を払わずにすみます。これは、10万円を年15%で確実に運用したのと同じ効果です。 投資で毎年15%を確実に得る方法はありません。だから高い金利の借金があるなら、返すことが最も有利な「投資」になります。 なぜ借金の返済を優先すべきなのでしょうか。根っこにあるのは、「借金の金利は確実、投資の利回りは不確実」という違いです。 投資の利回りは、うまくいけば高く、悪ければマイナスにもなります。一方、借金の利息は、相場がどうなっても決まった率でかかり続けます。 さらに、第5話の複利は借金にも働きます。返さない利息が元本に加わると、利息が利息を生みます。投資の複利があなたの味方なら、借金の複利は敵です。高い金利の借金を抱えたまま投資をするのは、「不確実な味方」に賭けて「確実な敵」を放っておく状態です。 リボ払いの怖さ リボ払いとは、クレジットカードの利用額にかかわらず、毎月ほぼ一定の額を払う方式です。毎月の負担が小さく見える一方、残高が減りにくく、手数料が長くかかり続けます。 例として、20万円の買い物を年15%のリボ払いにし、毎月1万円ずつ返すとします。完済まで約2年かかり、手数料は約3.2万円です。毎月5,000円にすると、完済まで約4年8か月かかり、手数料は約7.9万円に増えます。 いずれも、毎月の返済額に手数料を含む方式で、手数料を月割りにした簡略な計算です。カードによっては、「一括払い」のつもりでも自動でリボ払いになる設定があるので注意が必要です。 奨学金はどう考えるか 日本学生支援機構（JASSO）の貸与型奨学金には、無利子の第一種と、利子のつく第二種があります。第二種も在学中は利子がかかりません。卒業後の利率は、原則として貸与が終わった月の水準で決まります。上限は年3%です（増額貸与の上乗せ分などを除く）。 たとえば2025年12月に貸与を終えた人の場合、利率固定方式で年約2.3%でした。その後の金利上昇で、2026年には3%近い月もあったと報じられています。利率は毎月変わるので、JASSOの公表値で確かめてください。 リボ払いと比べると金利はかなり低く、返済期間も長く設定されています。そのため、決められた返済を続けながら、余ったお金で少しずつ投資をする考え方もあります。 20万円を持つ学生が、別にリボ払いの残高を5万円抱えているとします。年15%なら、放っておくと年約7,500円の手数料がかかります。まず5万円を返せば、確実に7,500円分得をします。残る15万円で生活防衛資金をつくり、余裕があれば投資へ、という順番が安全です。 奨学金は学業のためのお金です。借りたお金を投資に回すと、値下がりしたときに学費や返済に困るおそれがあります。勧められません。返済に困ったときは、JASSOには返還を待ってもらう制度などもあるので、早めに相談しましょう。 借金の返済は、その金利で確実に運用するのと同じ効果がある リボ払いなど高い金利の借金は、投資より先に返すのが基本 低金利の奨学金は、計画どおり返しながら投資と並行する考え方もある 年15%のリボ払い残高と、投資の選択肢があるとき、一般に先にすべきことはどれでしょう。 投資で15%以上を狙って増やす リボ払いの残高を返す どちらも何もしない 借金の利息は確実にかかりますが、投資の利回りは不確実です。高金利の借金を返すことは確実なリターンになります。"},{"no":11,"part":2,"title":"「先取り」の仕組み","subtitle":"意志に頼らない貯め方","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「余ったら貯めよう」と思っているのに、月末になるといつもお金が残りません。自分の意志が弱いせいでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>意志の強さの問題というより、仕組みの問題です。収入が入った瞬間に、貯める分を先に別の場所へ移す「先取り」にすると、意志をほとんど使わずに貯まるようになります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>「残ったら貯める」と「先に貯める」\u003c/h2>\n\u003cp>お金の貯め方には、大きく2つの順番があります。\u003c/p>\n\u003col>\u003cli>収入 − 支出 = 残りを貯める（後取り）\u003c/li>\u003cli>収入 − 貯める分 = 残りで暮らす（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"先取り貯蓄\">先取り貯蓄\u003c/span>）\u003c/li>\u003c/ol>\n\u003cp>式の中身は同じ足し算と引き算です。違うのは順番だけです。しかし、この順番の違いが結果を大きく変えます。\u003c/p>\n\u003cp>後取りでは、貯金は「使い終わったあとのおまけ」です。おまけは、たいてい残りません。先取りでは、貯金が最初に確定します。使えるお金は、はじめから少し小さく見えるだけです。\u003c/p>\n\u003ch2>仕組みの作り方\u003c/h2>\n\u003cp>先取りは、手作業でやると結局続きません。自動化するのがポイントです。\u003c/p>\n\u003cul>\u003cli>銀行の「自動積立定期預金」などで、給料日の翌日に一定額を別口座へ移す\u003c/li>\u003cli>証券会社の積立設定で、毎月決まった日に投資信託を買う（第40話で詳しく扱います）\u003c/li>\u003cli>給料が振り込まれる口座と、ふだん使う口座を分けておく\u003c/li>\u003c/ul>\n\u003cp>一度設定すれば、あとは毎月何も考えなくても動きます。「考えなくていい」ことが、この方法のいちばんの価値です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ後取りは失敗しやすいのでしょうか。根っこには、人間の脳のくせがあります。\u003c/p>\n\u003cp>人は「今もらえるもの」を大きく、「将来もらえるもの」を小さく感じる傾向があります。行動経済学では\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"現在バイアス\">現在バイアス\u003c/span>と呼ばれます。目の前のカフェラテ500円は鮮明ですが、40年後の老後資金はぼんやりとしか想像できません。比べる前から、勝負がついているのです。\u003c/p>\n\u003cp>しかも後取りでは、この比べ合いが「何かを買うたび」に起こります。1か月に何十回も、誘惑と戦う判断を迫られます。毎回勝ち続けるのは、誰にとっても難しいことです。\u003c/p>\n\u003cp>先取りは、この戦いの回数を「最初の1回」に減らします。設定するときだけ、冷静な自分が判断すればよいのです。\u003c/p>\n\u003cp>逆に、人は「最初から決まっている状態」をなかなか変えません。これを\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"デフォルト効果\">デフォルト効果\u003c/span>と呼びます。米国の研究では、企業年金を「自動で加入、嫌なら抜ける」方式に変えた例が調べられました。すると、新入社員の加入率が大きく上がったと報告されています（Madrian and Shea, 2001）。先取りは、この「変えないくせ」を自分の味方にする方法だといえます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>アルバイト収入が月4万円になったとします。給料日の翌日に5,000円を自動で別口座へ移すと、1年で6万円です。手元の20万円と合わせ、1年後には26万円の土台ができます。\u003c/p>\n\u003cp>「5,000円も減らせない」と感じるなら、最初は2,000円でかまいません。金額よりも、仕組みを先に作ることが大切です。慣れたら少しずつ増やしていきます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>先取りする額を大きくしすぎると、月末に生活費が足りなくなります。そこでクレジットカードのリボ払いなどに頼ると、高い金利で逆効果です（第10話）。無理なく続けられる額から始めてください。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>貯まるかどうかは、意志よりも「順番」と「仕組み」で決まる\u003c/li>\u003cli>人は今の満足を大きく感じるため、後取りでは毎回誘惑と戦うことになる\u003c/li>\u003cli>自動化すれば判断は設定時の1回で済み、「変えないくせ」が味方になる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>先取り貯蓄が続きやすい、いちばんの理由はどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">金利が高くなるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">お金を使うたびに貯めるかどうかを判断しなくて済むから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">支出が自動的にゼロになるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>先取りは判断の回数を設定時の1回に減らします。そのため、現在バイアスの影響を受けにくくなります。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>Madrian, B. and Shea, D. &quot;The Power of Suggestion: Inertia in 401(k) Participation and Savings Behavior&quot;（NBER Working Paper 7682、Quarterly Journal of Economics 2001年） \u003ca href=\"https://www.nber.org/papers/w7682\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nber.org/papers/w7682\u003c/a>\u003c/li>\u003cli>金融経済教育推進機構（J-FLEC）公式サイト \u003ca href=\"https://www.j-flec.go.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.j-flec.go.jp/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「余ったら貯めよう」と思っているのに、月末になるといつもお金が残りません。自分の意志が弱いせいでしょうか。 意志の強さの問題というより、仕組みの問題です。収入が入った瞬間に、貯める分を先に別の場所へ移す「先取り」にすると、意志をほとんど使わずに貯まるようになります。 「残ったら貯める」と「先に貯める」 お金の貯め方には、大きく2つの順番があります。 収入 − 支出 = 残りを貯める（後取り） 収入 − 貯める分 = 残りで暮らす（先取り貯蓄） 式の中身は同じ足し算と引き算です。違うのは順番だけです。しかし、この順番の違いが結果を大きく変えます。 後取りでは、貯金は「使い終わったあとのおまけ」です。おまけは、たいてい残りません。先取りでは、貯金が最初に確定します。使えるお金は、はじめから少し小さく見えるだけです。 仕組みの作り方 先取りは、手作業でやると結局続きません。自動化するのがポイントです。 銀行の「自動積立定期預金」などで、給料日の翌日に一定額を別口座へ移す 証券会社の積立設定で、毎月決まった日に投資信託を買う（第40話で詳しく扱います） 給料が振り込まれる口座と、ふだん使う口座を分けておく 一度設定すれば、あとは毎月何も考えなくても動きます。「考えなくていい」ことが、この方法のいちばんの価値です。 なぜ後取りは失敗しやすいのでしょうか。根っこには、人間の脳のくせがあります。 人は「今もらえるもの」を大きく、「将来もらえるもの」を小さく感じる傾向があります。行動経済学では現在バイアスと呼ばれます。目の前のカフェラテ500円は鮮明ですが、40年後の老後資金はぼんやりとしか想像できません。比べる前から、勝負がついているのです。 しかも後取りでは、この比べ合いが「何かを買うたび」に起こります。1か月に何十回も、誘惑と戦う判断を迫られます。毎回勝ち続けるのは、誰にとっても難しいことです。 先取りは、この戦いの回数を「最初の1回」に減らします。設定するときだけ、冷静な自分が判断すればよいのです。 逆に、人は「最初から決まっている状態」をなかなか変えません。これをデフォルト効果と呼びます。米国の研究では、企業年金を「自動で加入、嫌なら抜ける」方式に変えた例が調べられました。すると、新入社員の加入率が大きく上がったと報告されています（Madrian and Shea, 2001）。先取りは、この「変えないくせ」を自分の味方にする方法だといえます。 アルバイト収入が月4万円になったとします。給料日の翌日に5,000円を自動で別口座へ移すと、1年で6万円です。手元の20万円と合わせ、1年後には26万円の土台ができます。 「5,000円も減らせない」と感じるなら、最初は2,000円でかまいません。金額よりも、仕組みを先に作ることが大切です。慣れたら少しずつ増やしていきます。 先取りする額を大きくしすぎると、月末に生活費が足りなくなります。そこでクレジットカードのリボ払いなどに頼ると、高い金利で逆効果です（第10話）。無理なく続けられる額から始めてください。 貯まるかどうかは、意志よりも「順番」と「仕組み」で決まる 人は今の満足を大きく感じるため、後取りでは毎回誘惑と戦うことになる 自動化すれば判断は設定時の1回で済み、「変えないくせ」が味方になる 先取り貯蓄が続きやすい、いちばんの理由はどれでしょう。 金利が高くなるから お金を使うたびに貯めるかどうかを判断しなくて済むから 支出が自動的にゼロになるから 先取りは判断の回数を設定時の1回に減らします。そのため、現在バイアスの影響を受けにくくなります。"},{"no":12,"part":2,"title":"20万円をどう分ける？","subtitle":"使うお金・守るお金・育てるお金","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>手元に20万円あります。全部を投資に回すべきか、全部を貯金しておくべきか、どう決めればよいのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「いつ使うお金か」で3つに分けるのが基本です。近いうちに使うお金と、何かあったときのお金は預金に置き、当分使わないお金だけを投資に回します。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>3つの箱に分ける\u003c/h2>\n\u003cp>お金に「役割」をつけて、箱に分けるイメージを持ってみましょう。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>箱\u003c/th>\u003cth>役割\u003c/th>\u003cth>置き場所の例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>使うお金\u003c/td>\u003ctd>数か月以内の支出\u003c/td>\u003ctd>普通預金\u003c/td>\u003c/tr>\u003ctr>\u003ctd>守るお金\u003c/td>\u003ctd>急な出費への備え\u003c/td>\u003ctd>普通預金・定期預金\u003c/td>\u003c/tr>\u003ctr>\u003ctd>育てるお金\u003c/td>\u003ctd>5年以上使わない\u003c/td>\u003ctd>投資信託など\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>「使うお金」は教科書代や旅行代など、予定が見えている支出です。「守るお金」は、病気やスマホの故障など、予定外の出費に備える\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"生活防衛資金\">生活防衛資金\u003c/span>です（第8話で扱いました）。そして、この2つを除いた残りが「育てるお金」になります。\u003c/p>\n\u003ch2>決める順番が大切\u003c/h2>\n\u003cp>分け方には順番があります。先に「使う」と「守る」を確保し、最後に残った分を「育てる」に回します。\u003c/p>\n\u003cp>投資額から先に決めると、生活に必要なお金まで投資に入ってしまいがちです。投資は「なくなっても当面困らないお金」で行うのが原則です。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「いつ使うか」で置き場所を変える必要があるのでしょうか。\u003c/p>\n\u003cp>株式や投資信託の価格は、毎日上がったり下がったりします。長い目で見れば成長が期待できても、短い期間では大きく下がることがあります。たとえば米国の代表的な株価指数S&amp;P500は、2007年の高値から2009年3月の安値まで、5割以上（約57%）下がりました。\u003c/p>\n\u003cp>ここで問題になるのは、下がったことそのものより「下がったときに売らなければならない」状況です。来月の学費を投資に入れていたら、価格が下がっていても売るしかありません。一時的な値下がりが、取り返せない損として確定してしまいます。\u003c/p>\n\u003cp>逆に、10年使わないお金なら、下がっても売らずに待つという選択ができます。つまり、使う時期が遠いほど、価格のぶれを「待つ」ことで受け流せるのです。\u003c/p>\n\u003cp>置き場所を分けるのは、「待てるお金」と「待てないお金」を混ぜないためです。この「時間がぶれを和らげる」考え方は、第17話でさらに掘り下げます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>20万円の分け方の一例です（あくまで例で、正解は人によって違います）。\u003c/p>\n\u003cul>\u003cli>使うお金: 3万円（前期の教科書代や交際費）\u003c/li>\u003cli>守るお金: 12万円（生活費の数か月分の備え）\u003c/li>\u003cli>育てるお金: 5万円\u003c/li>\u003c/ul>\n\u003cp>育てるお金5万円は、一度に入れずに毎月1万円ずつ5か月かけて投資する方法もあります（第18話）。実家暮らしで生活費が少ない人は、守るお金を少なめにする判断もありえます。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「守るお金」を投資に回しておけば、増えたときに得をすると考える人もいます。しかし、備えのお金が必要になる時期は、景気が悪くなり株価が下がっている時期と重なることがあります。たとえば不景気でアルバイトのシフトが減る、といった場面です。備えは価格が動かない場所に置いておくほうが安心です。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>お金は「使う・守る・育てる」の3つに、使う時期で分ける\u003c/li>\u003cli>先に使うお金と守るお金を確保し、残りを投資に回す\u003c/li>\u003cli>使う時期が遠いお金ほど、値下がりを待って受け流せる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>半年後に支払う予定の学費の置き場所として、もっとも適切なのはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">値上がりが期待できる株式の投資信託\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">価格が変動しない預金\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">値動きの大きい個別株\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>半年後に必ず使うお金は、下がったときに待つことができません。価格が動かない預金に置くのが基本です。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>金融庁「NISA特設ウェブサイト」 \u003ca href=\"https://www.fsa.go.jp/policy/nisa2/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsa.go.jp/policy/nisa2/\u003c/a>\u003c/li>\u003cli>WBUR「2009年3月のS&amp;P500の底値（676.53）」 \u003ca href=\"https://www.wbur.org/hereandnow/2017/03/10/2009-standard-and-poors-index\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.wbur.org/hereandnow/2017/03/10/2009-standard-and-poors-index\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"手元に20万円あります。全部を投資に回すべきか、全部を貯金しておくべきか、どう決めればよいのでしょうか。 「いつ使うお金か」で3つに分けるのが基本です。近いうちに使うお金と、何かあったときのお金は預金に置き、当分使わないお金だけを投資に回します。 3つの箱に分ける お金に「役割」をつけて、箱に分けるイメージを持ってみましょう。 箱 役割 置き場所の例 使うお金 数か月以内の支出 普通預金 守るお金 急な出費への備え 普通預金・定期預金 育てるお金 5年以上使わない 投資信託など 「使うお金」は教科書代や旅行代など、予定が見えている支出です。「守るお金」は、病気やスマホの故障など、予定外の出費に備える生活防衛資金です（第8話で扱いました）。そして、この2つを除いた残りが「育てるお金」になります。 決める順番が大切 分け方には順番があります。先に「使う」と「守る」を確保し、最後に残った分を「育てる」に回します。 投資額から先に決めると、生活に必要なお金まで投資に入ってしまいがちです。投資は「なくなっても当面困らないお金」で行うのが原則です。 なぜ「いつ使うか」で置き場所を変える必要があるのでしょうか。 株式や投資信託の価格は、毎日上がったり下がったりします。長い目で見れば成長が期待できても、短い期間では大きく下がることがあります。たとえば米国の代表的な株価指数S&P500は、2007年の高値から2009年3月の安値まで、5割以上（約57%）下がりました。 ここで問題になるのは、下がったことそのものより「下がったときに売らなければならない」状況です。来月の学費を投資に入れていたら、価格が下がっていても売るしかありません。一時的な値下がりが、取り返せない損として確定してしまいます。 逆に、10年使わないお金なら、下がっても売らずに待つという選択ができます。つまり、使う時期が遠いほど、価格のぶれを「待つ」ことで受け流せるのです。 置き場所を分けるのは、「待てるお金」と「待てないお金」を混ぜないためです。この「時間がぶれを和らげる」考え方は、第17話でさらに掘り下げます。 20万円の分け方の一例です（あくまで例で、正解は人によって違います）。 使うお金: 3万円（前期の教科書代や交際費） 守るお金: 12万円（生活費の数か月分の備え） 育てるお金: 5万円 育てるお金5万円は、一度に入れずに毎月1万円ずつ5か月かけて投資する方法もあります（第18話）。実家暮らしで生活費が少ない人は、守るお金を少なめにする判断もありえます。 「守るお金」を投資に回しておけば、増えたときに得をすると考える人もいます。しかし、備えのお金が必要になる時期は、景気が悪くなり株価が下がっている時期と重なることがあります。たとえば不景気でアルバイトのシフトが減る、といった場面です。備えは価格が動かない場所に置いておくほうが安心です。 お金は「使う・守る・育てる」の3つに、使う時期で分ける 先に使うお金と守るお金を確保し、残りを投資に回す 使う時期が遠いお金ほど、値下がりを待って受け流せる 半年後に支払う予定の学費の置き場所として、もっとも適切なのはどれでしょう。 値上がりが期待できる株式の投資信託 価格が変動しない預金 値動きの大きい個別株 半年後に必ず使うお金は、下がったときに待つことができません。価格が動かない預金に置くのが基本です。"},{"no":13,"part":3,"title":"投資・投機・ギャンブルの違い","subtitle":"プラスサムとゼロサム","minutes":5,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「投資もギャンブルも、お金を賭けて増えたり減ったりするのは同じでは」と言われました。本当に違いはあるのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>違いは「参加者全体のお金の合計が増えるかどうか」にあります。株式への長期投資は全体のパイが増えるプラスサム、宝くじや競馬は胴元の取り分だけ全体が減るマイナスサムです。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>3つを分ける物差し\u003c/h2>\n\u003cp>参加者全員の損益を足し合わせたとき、合計がどうなるかで分類してみます。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>種類\u003c/th>\u003cth>全員の損益の合計\u003c/th>\u003cth>例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"プラスサム\">プラスサム\u003c/span>\u003c/td>\u003ctd>プラス\u003c/td>\u003ctd>株式への長期投資\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"ゼロサム\">ゼロサム\u003c/span>\u003c/td>\u003ctd>ゼロ（手数料分マイナス）\u003c/td>\u003ctd>FX・先物の短期売買\u003c/td>\u003c/tr>\u003ctr>\u003ctd>マイナスサム\u003c/td>\u003ctd>マイナス\u003c/td>\u003ctd>宝くじ・競馬\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>ゼロサムとは、誰かの得がそのまま誰かの損になる状態です。手数料がかかる分、現実には少しマイナスになります。\u003c/p>\n\u003ch2>ギャンブルはなぜ損をする仕組みなのか\u003c/h2>\n\u003cp>宝くじは、法律で当せん金の合計が発売総額の5割を超えないよう決められています。実際の割合は種類によって違い、ジャンボ宝くじでは約47〜50%とされています。中央競馬（JRA）の払戻率は、2014年に設定された値で、馬券の種類によって約70〜80%です。\u003c/p>\n\u003cp>つまり、買った人全体で見ると、1万円を賭けるごとに平均で消えていく額は、競馬で約2,000〜3,000円、宝くじで約5,000円です。当たる人がいる一方で、全員分を合計すると必ず減ります。\u003c/p>\n\u003ch2>投機とは何か\u003c/h2>\n\u003cp>\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"投機\">投機\u003c/span>は、価格の上がり下がりを予想して短期間で売買し、差額をねらう行為です。株でも、数日で売り買いを繰り返すなら投機に近くなります。\u003c/p>\n\u003cp>投機が悪いわけではありません。ただ、短期の値動きは会社の成長とあまり関係がありません。誰かが安く買えた分、別の誰かが高く買っているので、全体としてはゼロサムに近くなります。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>では、なぜ株式への長期投資だけがプラスサムになりうるのでしょうか。\u003c/p>\n\u003cp>ポイントは「お金の出どころ」です。ギャンブルの当せん金は、参加者が出したお金の一部にすぎません。外から新しいお金は入ってきません。\u003c/p>\n\u003cp>一方、会社は集めたお金で工場を建て、人を雇い、商品やサービスを生み出します。お客さんがそれにお金を払うのは、払った額以上の価値を感じるからです。こうして生まれた\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"付加価値\">付加価値\u003c/span>が会社の利益となり、配当や株価の上昇という形で株主に届きます。\u003c/p>\n\u003cp>つまり株式のリターンは、参加者同士の取り合いではありません。「社会で新しく生み出された価値」の分け前です。だからこそ、全員がプラスになる可能性があるのです。経済が成長する理由そのものは、第7話で扱っています。\u003c/p>\n\u003cp>ただし、プラスサムは「全体の平均」の話です。個々の会社は倒産もしますし、高すぎる値段で買えば損をします。だからこそ、多くの会社に分けて投資する考え方（第16話）が大切になります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>宝くじを1万円分買うと、当たり方は人それぞれでも、平均すると戻ってくるのは5,000円弱です。\u003c/p>\n\u003cp>一方、同じ1万円で世界中の株式に広く投資する投資信託を買い、長く持つとします。会社が生み出す利益の分け前を受け取る形になるので、平均的には増えることが期待できます。ただし保証はなく、数年単位では元本を割り込むこともあります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>違いは「参加者全体の合計」が増えるか、変わらないか、減るか\u003c/li>\u003cli>宝くじや競馬は胴元の取り分があるため、全体では必ず減る\u003c/li>\u003cli>株式への長期投資は、会社が生む新しい価値の分け前を受け取るのでプラスサムになりうる\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>株式への長期投資がプラスサムになりうる理由として、正しいのはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">株価は毎日必ず上がるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">会社が新しい価値を生み出し、その利益が株主に分配されるから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">損をした人のお金が勝った人に移るから\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>株式のリターンの源は、会社が生み出す付加価値です。参加者同士の取り合いではない点が、ギャンブルとの違いです。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>e-Gov法令検索「当せん金付証票法」（第5条 当せん金品の金額の限度）\u003c/li>\u003cli>総務省「宝くじの発売許可に関する資料」（ジャンボ宝くじの当せん金・収益金・経費の内訳）\u003c/li>\u003cli>楽天カード みんなのマネ活「宝くじの還元率」 \u003ca href=\"https://www.rakuten-card.co.jp/minna-money/bank/raffle/article_2109_00001/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.rakuten-card.co.jp/minna-money/bank/raffle/article_2109_00001/\u003c/a>\u003c/li>\u003cli>日本中央競馬会（JRA）「払戻率の変更について」（2014年）\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「投資もギャンブルも、お金を賭けて増えたり減ったりするのは同じでは」と言われました。本当に違いはあるのでしょうか。 違いは「参加者全体のお金の合計が増えるかどうか」にあります。株式への長期投資は全体のパイが増えるプラスサム、宝くじや競馬は胴元の取り分だけ全体が減るマイナスサムです。 3つを分ける物差し 参加者全員の損益を足し合わせたとき、合計がどうなるかで分類してみます。 種類 全員の損益の合計 例 プラスサム プラス 株式への長期投資 ゼロサム ゼロ（手数料分マイナス） FX・先物の短期売買 マイナスサム マイナス 宝くじ・競馬 ゼロサムとは、誰かの得がそのまま誰かの損になる状態です。手数料がかかる分、現実には少しマイナスになります。 ギャンブルはなぜ損をする仕組みなのか 宝くじは、法律で当せん金の合計が発売総額の5割を超えないよう決められています。実際の割合は種類によって違い、ジャンボ宝くじでは約47〜50%とされています。中央競馬（JRA）の払戻率は、2014年に設定された値で、馬券の種類によって約70〜80%です。 つまり、買った人全体で見ると、1万円を賭けるごとに平均で消えていく額は、競馬で約2,000〜3,000円、宝くじで約5,000円です。当たる人がいる一方で、全員分を合計すると必ず減ります。 投機とは何か 投機は、価格の上がり下がりを予想して短期間で売買し、差額をねらう行為です。株でも、数日で売り買いを繰り返すなら投機に近くなります。 投機が悪いわけではありません。ただ、短期の値動きは会社の成長とあまり関係がありません。誰かが安く買えた分、別の誰かが高く買っているので、全体としてはゼロサムに近くなります。 では、なぜ株式への長期投資だけがプラスサムになりうるのでしょうか。 ポイントは「お金の出どころ」です。ギャンブルの当せん金は、参加者が出したお金の一部にすぎません。外から新しいお金は入ってきません。 一方、会社は集めたお金で工場を建て、人を雇い、商品やサービスを生み出します。お客さんがそれにお金を払うのは、払った額以上の価値を感じるからです。こうして生まれた付加価値が会社の利益となり、配当や株価の上昇という形で株主に届きます。 つまり株式のリターンは、参加者同士の取り合いではありません。「社会で新しく生み出された価値」の分け前です。だからこそ、全員がプラスになる可能性があるのです。経済が成長する理由そのものは、第7話で扱っています。 ただし、プラスサムは「全体の平均」の話です。個々の会社は倒産もしますし、高すぎる値段で買えば損をします。だからこそ、多くの会社に分けて投資する考え方（第16話）が大切になります。 宝くじを1万円分買うと、当たり方は人それぞれでも、平均すると戻ってくるのは5,000円弱です。 一方、同じ1万円で世界中の株式に広く投資する投資信託を買い、長く持つとします。会社が生み出す利益の分け前を受け取る形になるので、平均的には増えることが期待できます。ただし保証はなく、数年単位では元本を割り込むこともあります。 違いは「参加者全体の合計」が増えるか、変わらないか、減るか 宝くじや競馬は胴元の取り分があるため、全体では必ず減る 株式への長期投資は、会社が生む新しい価値の分け前を受け取るのでプラスサムになりうる 株式への長期投資がプラスサムになりうる理由として、正しいのはどれでしょう。 株価は毎日必ず上がるから 会社が新しい価値を生み出し、その利益が株主に分配されるから 損をした人のお金が勝った人に移るから 株式のリターンの源は、会社が生み出す付加価値です。参加者同士の取り合いではない点が、ギャンブルとの違いです。"},{"no":14,"part":3,"title":"リスクの本当の意味","subtitle":"「危険」ではなく「ぶれ幅」","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「この商品はリスクが高い」と聞くと、損をしやすい危ないもの、という印象を持ちます。投資の世界でいうリスクも、同じ意味なのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>投資の世界での\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リスク\">リスク\u003c/span>は、「結果がどれくらいぶれるか」という不確かさの大きさを指します。損をする可能性だけでなく、予想より大きく増える可能性も含んだ言葉です。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>日常の「リスク」との違い\u003c/h2>\n\u003cp>日常会話のリスクは「危険」や「損をする可能性」です。一方、投資でいうリスクは、将来の結果が予想からどれだけ外れうるかという「ぶれ幅」を指します。\u003c/p>\n\u003cp>具体例で比べてみましょう。どちらも1年後の「平均的な結果」は同じ10万5,000円だとします。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>商品\u003c/th>\u003cth>1年後の結果の幅\u003c/th>\u003cth>リスク\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>10万4,000円〜10万6,000円\u003c/td>\u003ctd>小さい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>8万円〜13万円\u003c/td>\u003ctd>大きい\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Bは大きく増えることもあれば、大きく減ることもあります。この「振れ幅の広さ」こそがリスクの大きさです。\u003c/p>\n\u003ch2>リターンとの関係\u003c/h2>\n\u003cp>リスクと並んでよく出てくるのが\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リターン\">リターン\u003c/span>です。リターンは、投資で得られる収益（増えた分、または減った分）を指します。\u003c/p>\n\u003cp>投資の判断では「平均してどれくらい増えそうか（リターン）」と「どれくらいぶれそうか（リスク）」の2つをセットで考えます。ぶれ幅を数字で表す方法は、第19話で見ていきます。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ「上振れ」まで含めて、ぶれ全体をリスクと呼ぶのでしょうか。損をする可能性だけをリスクと呼べばよさそうに思えます。\u003c/p>\n\u003cp>理由は、お金には「使う予定」があるからです。たとえば4年後の留学資金に100万円が必要だとします。そのとき手元に80万円しかなければ困りますし、130万円あるかもしれないと思って計画を立てるのも危ういことです。困るのは「いくらになるか事前にわからない」ことそのものなのです。\u003c/p>\n\u003cp>もう一つの理由は、上振れと下振れが同じ根っこから生まれる点です。大きく上がる可能性がある資産は、同じ仕組みで大きく下がる可能性も持っています。景気がよいと急成長する会社は、景気が悪いと急に落ち込みやすいものです。上振れだけを取り出すことはできません。\u003c/p>\n\u003cp>だから投資では、上にも下にもどれだけ広がるかをまとめて「リスク」として測ります。リスクを「危ないかどうか」ではなく「予想がどれだけ当てにならないか」と言い換えると、理解しやすくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-student\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 9.5L12 5l9.5 4.5L12 14z\"/>\u003cpath d=\"M6.5 11.6v3.9c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1v-3.9\"/>\u003cpath d=\"M21.5 9.5v5\"/>\u003c/svg>\u003cspan>大学1年生・20万円の場合\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>手元の20万円を、値動きの大きい株式の投資信託に入れたとします。1年後は、たとえば16万円〜26万円くらいの幅のどこかに着地する可能性があります（数字は説明のための例です）。\u003c/p>\n\u003cp>一方、普通預金なら1年後もほぼ20万円です。預金はリスクがとても小さく、そのかわり増え方もわずかです。どちらを選ぶかは「いつ、いくら必要か」で決まります（第12話）。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-caution\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 3.8L2.9 19.5h18.2z\"/>\u003cpath d=\"M12 10v4.4\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>注意・よくある誤解\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>「リスクが小さい＝損をしない」ではありません。預金はぶれがほとんどありませんが、物価が上がるとお金の実質的な価値が目減りすることがあります（第6話）。ぶれ以外の弱点もある、と覚えておきましょう。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-summary\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 7h11M9 12h11M9 17h11\"/>\u003cpath d=\"M4 7l1 1 1.7-2M4 12l1 1 1.7-2M4 17l1 1 1.7-2\"/>\u003c/svg>\u003cspan>まとめ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>投資でいうリスクは「危険」ではなく「結果のぶれ幅」\u003c/li>\u003cli>上振れと下振れは同じ根っこから生まれるので、まとめてリスクと呼ぶ\u003c/li>\u003cli>判断はリターン（平均的な増え方）とリスク（ぶれ）の2つで考える\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-quiz\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z\"/>\u003cpath d=\"M10.2 8.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3\"/>\u003ccircle cx=\"12\" cy=\"13.4\" r=\".45\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>確認クイズ\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cdiv class=\"quiz-item\">\u003cp class=\"quiz-q\">\u003cspan class=\"qno\">Q\u003c/span>投資の世界でいう「リスクが大きい」の意味として、もっとも近いのはどれでしょう。\u003c/p>\u003cdiv class=\"choices\">\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">A\u003c/span>\u003cspan class=\"tx\">必ず損をする\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\" data-c=\"1\">\u003cspan class=\"mk\">B\u003c/span>\u003cspan class=\"tx\">結果が大きく上にも下にもぶれる可能性がある\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"choice\">\u003cspan class=\"mk\">C\u003c/span>\u003cspan class=\"tx\">平均的な利益がマイナスである\u003c/span>\u003cspan class=\"badge\">正解\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"quiz-ex\" aria-live=\"polite\">\u003cp class=\"verdict\">\u003c/p>\u003cp class=\"ex\">\u003cspan class=\"exl\">解説\u003c/span>リスクは結果のぶれ幅を指します。大きく増える可能性と、大きく減る可能性の両方を含みます。\u003c/p>\u003cbutton type=\"button\" class=\"quiz-retry\">もう一度解く\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003caside class=\"blk blk-source\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/>\u003cpath d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/>\u003c/svg>\u003cspan>出典\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cul>\u003cli>財務省 中国財務局「リスクとリターンの関係」 \u003ca href=\"https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/risukutoritan.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://lfb.mof.go.jp/chugoku/kinyusyouken/kin3/risukutoritan.html\u003c/a>\u003c/li>\u003cli>金融経済教育推進機構（J-FLEC）公式サイト \u003ca href=\"https://www.j-flec.go.jp/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.j-flec.go.jp/\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003c/aside>","text":"「この商品はリスクが高い」と聞くと、損をしやすい危ないもの、という印象を持ちます。投資の世界でいうリスクも、同じ意味なのでしょうか。 投資の世界でのリスクは、「結果がどれくらいぶれるか」という不確かさの大きさを指します。損をする可能性だけでなく、予想より大きく増える可能性も含んだ言葉です。 日常の「リスク」との違い 日常会話のリスクは「危険」や「損をする可能性」です。一方、投資でいうリスクは、将来の結果が予想からどれだけ外れうるかという「ぶれ幅」を指します。 具体例で比べてみましょう。どちらも1年後の「平均的な結果」は同じ10万5,000円だとします。 商品 1年後の結果の幅 リスク A 10万4,000円〜10万6,000円 小さい B 8万円〜13万円 大きい Bは大きく増えることもあれば、大きく減ることもあります。この「振れ幅の広さ」こそがリスクの大きさです。 リターンとの関係 リスクと並んでよく出てくるのがリターンです。リターンは、投資で得られる収益（増えた分、または減った分）を指します。 投資の判断では「平均してどれくらい増えそうか（リターン）」と「どれくらいぶれそうか（リスク）」の2つをセットで考えます。ぶれ幅を数字で表す方法は、第19話で見ていきます。 なぜ「上振れ」まで含めて、ぶれ全体をリスクと呼ぶのでしょうか。損をする可能性だけをリスクと呼べばよさそうに思えます。 理由は、お金には「使う予定」があるからです。たとえば4年後の留学資金に100万円が必要だとします。そのとき手元に80万円しかなければ困りますし、130万円あるかもしれないと思って計画を立てるのも危ういことです。困るのは「いくらになるか事前にわからない」ことそのものなのです。 もう一つの理由は、上振れと下振れが同じ根っこから生まれる点です。大きく上がる可能性がある資産は、同じ仕組みで大きく下がる可能性も持っています。景気がよいと急成長する会社は、景気が悪いと急に落ち込みやすいものです。上振れだけを取り出すことはできません。 だから投資では、上にも下にもどれだけ広がるかをまとめて「リスク」として測ります。リスクを「危ないかどうか」ではなく「予想がどれだけ当てにならないか」と言い換えると、理解しやすくなります。 手元の20万円を、値動きの大きい株式の投資信託に入れたとします。1年後は、たとえば16万円〜26万円くらいの幅のどこかに着地する可能性があります（数字は説明のための例です）。 一方、普通預金なら1年後もほぼ20万円です。預金はリスクがとても小さく、そのかわり増え方もわずかです。どちらを選ぶかは「いつ、いくら必要か」で決まります（第12話）。 「リスクが小さい＝損をしない」ではありません。預金はぶれがほとんどありませんが、物価が上がるとお金の実質的な価値が目減りすることがあります（第6話）。ぶれ以外の弱点もある、と覚えておきましょう。 投資でいうリスクは「危険」ではなく「結果のぶれ幅」 上振れと下振れは同じ根っこから生まれるので、まとめてリスクと呼ぶ 判断はリターン（平均的な増え方）とリスク（ぶれ）の2つで考える 投資の世界でいう「リスクが大きい」の意味として、もっとも近いのはどれでしょう。 必ず損をする 結果が大きく上にも下にもぶれる可能性がある 平均的な利益がマイナスである リスクは結果のぶれ幅を指します。大きく増える可能性と、大きく減る可能性の両方を含みます。"},{"no":15,"part":3,"title":"リスクとリターンはなぜセットなのか","subtitle":"「安全で高利回り」が見つからない理由","minutes":4,"html":"\u003csection class=\"blk blk-question\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6\"/>\u003ccircle cx=\"12\" cy=\"16.9\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>\u003cspan>今日の疑問\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>どうせなら、ぶれが小さくて、しかもよく増える商品を選びたいです。なぜそういう商品は見つからないのでしょうか。\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"blk blk-answer\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M8 12.4l2.7 2.7L16.2 9.6\"/>\u003c/svg>\u003cspan>先に結論\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>多くの人がぶれを嫌うため、ぶれの大きい資産は「おまけ」をつけないと買ってもらえないからです。逆に、安全でよく増える資産があれば、みんなが買って値段が上がり、すぐに「よく増える」ではなくなります。\u003c/p>\u003c/div>\u003c/section>\n\u003ch2>リスクとリターンの関係\u003c/h2>\n\u003cp>一般に、ぶれ（\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リスク\">リスク\u003c/span>）が小さい資産は、期待できる\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リターン\">リターン\u003c/span>も小さくなります。ぶれが大きい資産は、期待できるリターンも大きい傾向があります。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>資産の例\u003c/th>\u003cth>ぶれ\u003c/th>\u003cth>期待できるリターン\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>預金\u003c/td>\u003ctd>ほぼない\u003c/td>\u003ctd>とても小さい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>債券\u003c/td>\u003ctd>小さめ\u003c/td>\u003ctd>小さめ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>株式\u003c/td>\u003ctd>大きい\u003c/td>\u003ctd>大きめ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>これは自然の法則ではありません。市場で多くの人が売り買いした結果として、こうした関係ができあがっています。\u003c/p>\n\u003csection class=\"blk blk-why\">\u003cdiv class=\"blk-h\">\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9.2 18h5.6M10.2 21h3.6\"/>\u003cpath d=\"M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.4-1.5 1.1-2A6 6 0 0 0 12 3z\"/>\u003c/svg>\u003cspan>なぜそうなるのか\u003c/span>\u003c/div>\u003cdiv class=\"blk-b\">\u003cp>なぜ市場でこの関係が生まれるのか、2つの方向から考えてみます。\u003c/p>\n\u003cp>一つ目は「人はぶれを嫌う」ことです。確実に1万円もらえる話と、半々の確率で0円か2万円になる話があったとします。平均はどちらも1万円です。それでも多くの人は確実な1万円を選びます。\u003c/p>\n\u003cp>すると、ぶれの大きい資産は、同じ値段では買い手がつきません。買ってもらうには、値段を下げるしかありません。安く買えれば、将来同じ利益を受け取ったときの増え方は大きくなります。この「ぶれを引き受けるごほうび」を\u003cspan class=\"term\" role=\"button\" tabindex=\"0\" data-term=\"リスクプレミアム\">リスクプレミアム\u003c/span>と呼びます。\u003c/p>\n\u003cp>二つ目は「おいしい話は競争で消える」ことです。仮に、ぶれが小さいのに年10%増える資産があったとします。気づいた人は次々と買うでしょう。買う人が増えれば値段が上がります。高い値段で買えば、その後の増え方は小さくなります。値段が上がりきったところで、普通の資産と同じ程度のリターンに落ち着きます。\u003c/p>\n\u003cp>このように、ぶれの大きい資産には上乗せがつき、ぶれが小さくて高リターンの資産は競争で消えていきます。結果として、リスクとリターンはセットで動くのです。\u003c/p>\
