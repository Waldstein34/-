<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ピコファイターズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 横画面いっぱいに 16:9 のキャンバス。設定ボタンだけ右下に浮かせる */
:root{
  --bg:#120a24; --ink:#f4f1ff; --accent:#5ee0ff; --warn:#ffd23f; --panel:#1b1530;
  --font:"DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;outline:none;max-width:100%}
.btns{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:2px solid var(--accent);padding:6px 12px;border-radius:0;cursor:pointer}
button.sub{border-color:var(--warn)}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
</style>

</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="ゲーム画面"></canvas></div>
<div class="btns">
  <button id="cfgBtn" type="button">ボタン設定</button>
  <button id="defBtn" type="button" class="sub" hidden>初期設定に戻す</button>
  <button id="cancelBtn" type="button" class="sub" hidden>やめる</button>
</div>

<script>
(() => {
'use strict';
const W = 320, H = 180, S = 3, GROUND = 160, GRAV = 0.25;
const C = document.getElementById('c');
const X = C.getContext('2d');
C.width = W * S; C.height = H * S;
const FONT = '"DotGothic16", "Noto Sans JP", sans-serif';

function fit() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H);
  C.style.width = Math.floor(W * s) + 'px';
  C.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 音 ---------- */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d, type = 'square', vol = 0.05, f2) {
  const a = AC; if (!a || a.state !== 'running') return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(g); g.connect(a.destination); o.start(n); o.stop(n + d);
}
function noise(d, vol = 0.12) {
  const a = AC; if (!a || a.state !== 'running') return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start();
}

/* ---------- キャラクター ---------- */
const CHARS = [
  { name: 'ソラ', desc: 'すばやい風の拳士', speed: 3, power: 2, hp: 100, scale: 1, walkF: 1.5, walkB: 1.2, jumpVx: 1.7, dmg: 1, hair: 'pony',
    col: { skin: '#f2c49b', top: '#2ec4b6', topD: '#1a8a80', pants: '#34365a', pantsD: '#22233d', hair: '#1b1530', belt: '#ffd23f', glove: '#ff4d6d', gloveD: '#b8324b' },
    proj: { name: 'かぜ玉', speed: 3.2, r: 5, c1: '#e6fdff', c2: '#5ee0ff', dmg: 10 }, riseName: 'つむじ蹴り' },
  { name: 'ガルド', desc: '重くて強い岩の闘士', speed: 1, power: 3, hp: 115, scale: 1.15, walkF: 1.1, walkB: 0.9, jumpVx: 1.3, dmg: 1.25, hair: 'beard',
    col: { skin: '#c98b5e', top: '#7b4ce0', topD: '#53309e', pants: '#4a3a26', pantsD: '#30261a', hair: '#e8e1d4', belt: '#ff9a3c', glove: '#6dff8b', gloveD: '#3fa457' },
    proj: { name: 'いわ玉', speed: 2.2, r: 7, c1: '#ffe2b3', c2: '#ff9a3c', dmg: 13 }, riseName: 'ずつき昇り' }
];

/* 技のデータ：st=出始め, act=当たる時間, rec=戻り（いずれもフレーム数）, box=[前方向, 高さ, 幅, 高さ] */
const MOVES = {
  sP:   { pose: 'sP', st: 4, act: 3, rec: 8, dmg: 6, box: [8, 28, 22, 10], hs: 14, bs: 10, push: 2.2 },
  sK:   { pose: 'sK', st: 7, act: 4, rec: 14, dmg: 10, box: [8, 20, 28, 12], hs: 18, bs: 12, push: 3 },
  cP:   { pose: 'cP', st: 4, act: 3, rec: 8, dmg: 5, box: [8, 16, 22, 8], hs: 13, bs: 9, push: 2, crouch: true },
  cK:   { pose: 'cK', st: 6, act: 4, rec: 16, dmg: 8, box: [6, 0, 32, 8], hs: 0, bs: 12, push: 2.5, crouch: true, low: true, kd: true },
  jP:   { pose: 'jP', st: 3, act: 8, rec: 0, dmg: 8, box: [6, 6, 22, 16], hs: 16, bs: 10, push: 2, air: true, high: true },
  jK:   { pose: 'jK', st: 4, act: 10, rec: 0, dmg: 10, box: [6, 8, 24, 12], hs: 18, bs: 12, push: 2.5, air: true, high: true },
  fb:   { pose: 'fb', st: 12, act: 1, rec: 26, proj: true },
  rise: { pose: 'rise', st: 3, act: 12, rec: 0, dmg: 14, box: [0, 26, 22, 26], hs: 0, bs: 14, push: 3, kd: true, inv: 9, rise: true }
};

/* ---------- ポーズ（足元が0、上が+、前が+） ---------- */
const mod = (b, o) => Object.assign({}, b, o);
const BASE = { hip: [0, 24], neck: [1, 40], head: [2, 46], eB: [-3, 31], hB: [5, 35], eF: [9, 32], hF: [13, 38], kB: [-5, 12], fB: [-8, 0], kF: [6, 12], fF: [8, 0] };
const CROUCH = { hip: [0, 13], neck: [4, 27], head: [6, 33], eB: [0, 20], hB: [8, 23], eF: [11, 19], hF: [15, 25], kB: [-6, 10], fB: [-10, 0], kF: [10, 12], fF: [10, 0] };
const JUMP = { hip: [0, 24], neck: [1, 40], head: [2, 46], eB: [-4, 34], hB: [0, 42], eF: [8, 36], hF: [12, 44], kB: [-6, 16], fB: [-4, 8], kF: [8, 18], fF: [4, 10] };
const POSES = {
  idle: BASE,
  idle2: mod(BASE, { hip: [0, 23], neck: [1, 39], head: [2, 45], hB: [5, 34], hF: [13, 37], eB: [-3, 30], eF: [9, 31] }),
  walk1: mod(BASE, { kF: [8, 12], fF: [11, 0], kB: [-3, 12], fB: [-4, 0] }),
  walk2: mod(BASE, { kF: [3, 13], fF: [1, 0], kB: [-7, 11], fB: [-12, 0] }),
  crouch: CROUCH,
  cblock: mod(CROUCH, { eB: [8, 18], hB: [9, 28], eF: [11, 20], hF: [10, 30] }),
  block: mod(BASE, { neck: [-1, 40], head: [0, 46], eB: [6, 30], hB: [8, 42], eF: [10, 32], hF: [9, 44] }),
  jump: JUMP,
  sP: mod(BASE, { neck: [4, 40], head: [5, 46], hip: [1, 24], eF: [16, 37], hF: [26, 37], eB: [-2, 32], hB: [4, 36], kF: [8, 12], fF: [12, 0] }),
  sK: { hip: [-1, 24], neck: [-5, 39], head: [-7, 45], eB: [-8, 32], hB: [-4, 38], eF: [2, 34], hF: [6, 40], kB: [-3, 12], fB: [-4, 0], kF: [12, 26], fF: [30, 28] },
  cP: mod(CROUCH, { neck: [6, 27], head: [8, 33], eF: [16, 22], hF: [25, 22] }),
  cK: { hip: [-2, 11], neck: [-4, 25], head: [-5, 31], eB: [-8, 16], hB: [-12, 6], eF: [2, 18], hF: [6, 22], kB: [-8, 8], fB: [-12, 0], kF: [14, 5], fF: [32, 2] },
  jP: mod(JUMP, { neck: [3, 40], head: [4, 46], eF: [14, 34], hF: [22, 28] }),
  jK: { hip: [0, 24], neck: [-3, 39], head: [-4, 45], eB: [-7, 34], hB: [-3, 40], eF: [4, 36], hF: [8, 42], kB: [-4, 18], fB: [-2, 10], kF: [12, 20], fF: [24, 14] },
  fb0: mod(BASE, { neck: [-2, 39], head: [-3, 45], eB: [-8, 30], hB: [-6, 28], eF: [-4, 30], hF: [-4, 27], kF: [10, 12], fF: [14, 0], kB: [-6, 12], fB: [-12, 0] }),
  fb: mod(BASE, { neck: [4, 39], head: [5, 45], eB: [12, 32], hB: [22, 31], eF: [14, 34], hF: [24, 34], kF: [10, 12], fF: [16, 0], kB: [-6, 12], fB: [-12, 0] }),
  rise: { hip: [0, 24], neck: [0, 40], head: [1, 46], eB: [-6, 34], hB: [-8, 42], eF: [6, 46], hF: [8, 58], kB: [-4, 14], fB: [-6, 4], kF: [10, 34], fF: [16, 48] },
  hit: mod(BASE, { hip: [-2, 24], neck: [-8, 38], head: [-11, 43], eB: [-14, 34], hB: [-18, 38], eF: [-4, 34], hF: [-8, 40], kF: [4, 12], fF: [6, 0] }),
  down: { hip: [-12, 4], neck: [-28, 6], head: [-34, 6], eB: [-24, 10], hB: [-20, 14], eF: [-30, 2], hF: [-38, 2], kB: [-4, 8], fB: [6, 2], kF: [-2, 6], fF: [10, 4] },
  win: mod(BASE, { eF: [6, 48], hF: [8, 58], eB: [-4, 32], hB: [2, 30] })
};

/* ---------- 入力 ---------- */
const ACTIONS = ['up', 'down', 'left', 'right', 'p', 'k', 'g', 'start'];
const LABEL = { up: '上', down: '下', left: '左', right: '右', p: 'パンチ', k: 'キック', g: 'ガード', start: 'ポーズ（START）' };
const DEFAULT = {
  up:    ['k:ArrowUp', 'k:KeyW', 'p:12', 'a:1-'],
  down:  ['k:ArrowDown', 'k:KeyS', 'p:13', 'a:1+'],
  left:  ['k:ArrowLeft', 'k:KeyA', 'p:14', 'a:0-'],
  right: ['k:ArrowRight', 'k:KeyD', 'p:15', 'a:0+'],
  p:     ['k:KeyZ', 'k:KeyJ', 'k:Space', 'p:2', 'p:3'],
  k:     ['k:KeyX', 'k:KeyK', 'p:0', 'p:1'],
  g:     ['k:KeyC', 'k:KeyL', 'p:4', 'p:5', 'p:6', 'p:7'],
  start: ['k:Enter', 'k:KeyP', 'k:Escape', 'p:9', 'p:8']
};
let binds = store.get('pf.binds', null) || JSON.parse(JSON.stringify(DEFAULT));
const keys = new Set(), tapped = new Set();
const cur = {}, prev = {};
ACTIONS.forEach(a => { cur[a] = false; prev[a] = false; });
let padName = '', lastUnknown = null, unknownT = 0, anyInput = false, cfgQueue = [];
const keyId = e => e.code || e.key;
const isBound = id => ACTIONS.some(a => binds[a].includes('k:' + id));

addEventListener('keydown', e => {
  ac(); anyInput = true;
  const id = keyId(e);
  if (mode === 'config') { if (!e.repeat) cfgQueue.push('k:' + id); e.preventDefault(); return; }
  keys.add(id); tapped.add(id);
  if (isBound(id)) e.preventDefault();
  else if (!e.repeat) { lastUnknown = id; unknownT = 240; }
});
addEventListener('keyup', e => keys.delete(keyId(e)));
addEventListener('blur', () => keys.clear());
addEventListener('pointerdown', () => { ac(); C.focus(); });

function getPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) if (p && p.connected) return p;
  return null;
}
function test(b, gp) {
  const t = b[0], v = b.slice(2);
  if (t === 'k') return keys.has(v) || tapped.has(v);
  if (!gp) return false;
  if (t === 'p') { const btn = gp.buttons[+v]; return !!btn && (btn.pressed || btn.value > 0.5); }
  if (t === 'a') {
    const val = gp.axes[parseInt(v, 10)], sgn = v.endsWith('-') ? -1 : 1;
    return val !== undefined && Math.abs(val) <= 1.05 && val * sgn > 0.5;
  }
  return false;
}
const padPrevBtn = [], padPrevAxis = [];
function poll() {
  const gp = getPad();
  padName = gp ? gp.id : '';
  for (const a of ACTIONS) cur[a] = binds[a].some(b => test(b, gp));
  tapped.clear();
  if (gp) {
    gp.buttons.forEach((btn, i) => {
      const on = btn.pressed || btn.value > 0.5;
      if (on) anyInput = true;
      if (mode === 'config' && on && !padPrevBtn[i]) cfgQueue.push('p:' + i);
      padPrevBtn[i] = on;
    });
    gp.axes.forEach((v, i) => {
      const dir = Math.abs(v) <= 1.05 && Math.abs(v) > 0.6 ? (v < 0 ? '-' : '+') : '';
      if (mode === 'config' && dir && padPrevAxis[i] !== dir) cfgQueue.push('a:' + i + dir);
      padPrevAxis[i] = dir;
    });
  }
}
const pr = a => cur[a] && !prev[a];

/* ---------- ボタン設定 ---------- */
const cfgBtn = document.getElementById('cfgBtn');
const defBtn = document.getElementById('defBtn');
const cancelBtn = document.getElementById('cancelBtn');
let cfgIndex = 0, cfgNew = {}, cfgReturn = 'title', cfgMsgT = 0;
function startConfig() {
  cfgReturn = mode === 'config' ? 'title' : mode;
  mode = 'config'; cfgIndex = 0; cfgNew = {}; cfgQueue = []; keys.clear();
  syncButtons();
}
function endConfig(save) {
  if (save) { binds = cfgNew; store.set('pf.binds', binds); }
  mode = cfgReturn; cooldown = 30; keys.clear(); syncButtons();
}
function updateConfig() {
  while (cfgQueue.length) {
    const b = cfgQueue.shift();
    if (Object.values(cfgNew).some(list => list.includes(b))) { cfgMsgT = 90; continue; }
    cfgNew[ACTIONS[cfgIndex]] = [b];
    beep(660, 0.08, 'square', 0.05);
    if (++cfgIndex >= ACTIONS.length) { endConfig(true); beep(990, 0.15, 'square', 0.05); return; }
  }
}
cfgBtn.addEventListener('click', () => { cfgBtn.blur(); ac(); startConfig(); });
cancelBtn.addEventListener('click', () => { cancelBtn.blur(); endConfig(false); });
defBtn.addEventListener('click', () => {
  defBtn.blur();
  binds = JSON.parse(JSON.stringify(DEFAULT)); store.set('pf.binds', binds);
  mode = cfgReturn; cooldown = 30; syncButtons();
});
let shownFor = '';
function syncButtons() {
  if (shownFor === mode) return;
  shownFor = mode;
  const inCfg = mode === 'config';
  cfgBtn.hidden = !(mode === 'title' || mode === 'pause' || mode === 'matchEnd' || mode === 'select');
  defBtn.hidden = !inCfg; cancelBtn.hidden = !inCfg;
}

/* ---------- 試合の状態 ---------- */
let mode = 'title', mt = 0, cooldown = 0, tick = 0, pausedFrom = 'fight';
let sel = 0, stage = 1, round = 1, wins = [0, 0], timer = 99, timerF = 0, hitstop = 0, shake = 0, endReason = '', roundWinner = -1, matchResult = '';
let best = store.get('pf.best', 0);
let F = [], projs = [], parts = [], projId = 0;
const hist = [];
const ai = { t: 0, intent: 'wait', seenAtk: -1, block: false, seenJump: -1, antiAir: false, seenProj: -1, projReact: 'none', atkCd: 0, low: false, jk: false };

function newFighter(ch, x, facing) {
  return { char: ch, x, y: 0, vx: 0, vy: 0, facing, hp: ch.hp, dispHp: ch.hp, state: 'idle', t: 0, move: null, mt: 0, hitDone: false,
    stun: 0, blocking: false, crouching: false, airAtk: false, flash: 0, atkId: 0, jumpId: 0, walkV: 0 };
}
function startMatch() { wins = [0, 0]; round = 1; startRound(); }
function startRound() {
  const pc = CHARS[sel], cc = CHARS[1 - sel];
  F = [newFighter(pc, 110, 1), newFighter(cc, 210, -1)];
  projs = []; parts = []; hist.length = 0;
  timer = 99; timerF = 0; hitstop = 0; mode = 'intro'; mt = 0;
  ai.t = 30; ai.intent = 'wait';
  beep(392, 0.15, 'square', 0.05);
}
const blank = () => ({ f: false, b: false, u: false, d: false, g: false, p: false, k: false, special: null });
const setState = (f, s) => { f.state = s; f.t = 0; };
const free = f => f.state === 'idle' || f.state === 'walk' || f.state === 'crouch';

function startMove(f, name) {
  const m = MOVES[name];
  if (m.proj && projs.some(p => p.owner === f)) return false;
  f.move = m; f.mt = 0; f.hitDone = false; f.atkId++;
  if (!m.air) { setState(f, 'attack'); f.vx = 0; }
  if (m.proj) beep(300, 0.25, 'sawtooth', 0.03, 600);
  else if (m.rise) beep(500, 0.2, 'square', 0.04, 1200);
  else beep(m.dmg > 8 ? 180 : 240, 0.05, 'triangle', 0.05, 120);
  return true;
}
function spawnProj(f) {
  const sc = f.char.scale, p = f.char.proj;
  projs.push({ id: ++projId, owner: f, x: f.x + f.facing * 26 * sc, y: 32 * sc, vx: p.speed * f.facing, r: p.r, c1: p.c1, c2: p.c2, dmg: p.dmg, t: 0 });
}

function fighterStep(f, inp, o) {
  f.t++;
  if (f.flash > 0) f.flash--;
  f.crouching = (free(f) || f.state === 'block') ? inp.d : (f.state === 'attack' && !!f.move.crouch);
  f.blocking = (free(f) || f.state === 'block') && (inp.b || inp.g);

  if (free(f)) {
    f.facing = o.x >= f.x ? 1 : -1;
    if (inp.special && startMove(f, inp.special)) { /* 必殺技 */ }
    else if (inp.u && !inp.g) {
      setState(f, 'jump'); f.vy = 4.3; f.y = 0.01; f.move = null; f.airAtk = false; f.jumpId++;
      f.vx = inp.f ? f.char.jumpVx * f.facing : inp.b ? -f.char.jumpVx * f.facing : 0;
    }
    else if (inp.d) { if (inp.p) startMove(f, 'cP'); else if (inp.k) startMove(f, 'cK'); else if (f.state !== 'crouch') setState(f, 'crouch'); }
    else if (inp.p) startMove(f, 'sP');
    else if (inp.k) startMove(f, 'sK');
    else if (!inp.g && (inp.f || inp.b)) { if (f.state !== 'walk') setState(f, 'walk'); f.walkV = inp.f ? f.char.walkF * f.facing : -f.char.walkB * f.facing; }
    else if (f.state !== 'idle') setState(f, 'idle');
  } else if (f.state === 'attack') {
    const m = f.move; f.mt++;
    if (m.proj && f.mt === m.st) spawnProj(f);
    if (m.rise && f.mt === m.st) { f.vy = 4.8; f.vx = f.facing * 0.9; f.y = 0.01; }
    if (!m.rise && f.mt >= m.st + m.act + m.rec) { f.move = null; setState(f, m.crouch && inp.d ? 'crouch' : 'idle'); }
  } else if (f.state === 'jump') {
    if (f.move) f.mt++;
    else if ((inp.p || inp.k) && !f.airAtk) { f.airAtk = true; startMove(f, inp.k ? 'jK' : 'jP'); }
  } else if (f.state === 'land' || f.state === 'hit' || f.state === 'block') {
    if (f.t >= f.stun) setState(f, inp.d ? 'crouch' : 'idle');
  } else if (f.state === 'down') {
    if (f.t >= 40) setState(f, 'getup');
  } else if (f.state === 'getup') {
    if (f.t >= 14) setState(f, 'idle');
  }

  // 動き
  if (f.state === 'walk') f.x += f.walkV;
  f.x += f.vx;
  let landed = false;
  if (f.y > 0 || f.vy > 0) {
    f.y += f.vy; f.vy -= GRAV;
    if (f.y <= 0) { f.y = 0; f.vy = 0; landed = true; }
  } else f.vx *= 0.8;
  if (landed) {
    if (f.state === 'jump') { f.move = null; setState(f, 'land'); f.stun = 4; f.vx = 0; }
    else if (f.state === 'attack' && f.move && f.move.rise) { f.move = null; setState(f, 'land'); f.stun = 18; f.vx = 0; }
    else if (f.state === 'fall') { setState(f, 'down'); f.vx = 0; shake = Math.max(shake, 4); noise(0.12, 0.08); }
    else if (f.state === 'ko') { f.vx = 0; noise(0.2, 0.1); }
  }
  f.x = Math.max(14, Math.min(W - 14, f.x));
  f.dispHp += (f.hp - f.dispHp) * (f.dispHp > f.hp ? 0.05 : 1);
}

function hurtbox(f) {
  if (f.state === 'down' || f.state === 'getup' || f.state === 'ko') return null;
  if (f.move && f.move.inv && f.state === 'attack' && f.mt < f.move.inv) return null;
  const sc = f.char.scale;
  const low = f.state === 'crouch' || (f.state === 'block' && f.crouching) || (f.state === 'attack' && f.move && f.move.crouch);

  txt('CPUと1対1で戦うドット格闘ゲーム', W / 2, 52, 9, '#f4f1ff', 'center');
  if (Math.floor(tick / 30) % 2) txt('パンチ か START でスタート', W / 2, 72, 11, '#5ee0ff', 'center');
  const help = ['十字キー：移動・ジャンプ・しゃがみ', 'Y／X：パンチ　B／A：キック　L／R：ガード', '後ろに入れてもガード', '↓↘→＋パンチ：飛び道具', '→↓↘＋キック：昇り蹴り'];
  help.forEach((h, i) => txt(h, W / 2, 92 + i * 10, 7, '#e6e1ff', 'center'));
  if (best > 0) txt('最高到達：ステージ ' + best, W / 2, 144, 7, '#ffd23f', 'center');
  let status;
  if (padName) status = 'コントローラー接続中：' + padName.slice(0, 30);
  else if (anyInput) status = 'キーボード入力を受信中';
  else status = 'コントローラーを接続するか、画面を一度タップしてからボタンを押してください';
  txt(status, 6, H - 20, 7, padName || anyInput ? '#6dff8b' : '#e6e1ff');
  if (unknownT > 0 && lastUnknown) txt('未登録のキー「' + lastUnknown + '」→ 右下の［ボタン設定］で登録できます', 6, H - 10, 7, '#ff9a3c');
}
function drawSelect() {
  X.fillStyle = 'rgba(18,10,36,0.6)'; X.fillRect(0, 0, W, H);
  txt('キャラクターを選んでください', W / 2, 8, 12, '#f4f1ff', 'center');
  CHARS.forEach((ch, i) => {
    const x = i === 0 ? 20 : 170, on = i === sel;
    X.fillStyle = on ? 'rgba(94,224,255,0.18)' : 'rgba(27,21,48,0.7)'; X.fillRect(x, 28, 130, 120);
    X.strokeStyle = on ? '#5ee0ff' : '#433d6e'; X.lineWidth = on ? 1.5 : 1; X.strokeRect(x + 0.5, 28.5, 129, 119);
    demo[i].facing = 1; demo[i].state = on ? 'idle' : 'idle';
    drawFighter(demo[i], 1.2, x + 34, 136);
    txt(ch.name, x + 70, 36, 14, on ? '#ffd23f' : '#f4f1ff');
    txt(ch.desc, x + 70, 56, 7, '#e6e1ff');
    txt('スピード ' + '★'.repeat(ch.speed) + '☆'.repeat(3 - ch.speed), x + 70, 72, 7, '#6dff8b');
    txt('パワー　 ' + '★'.repeat(ch.power) + '☆'.repeat(3 - ch.power), x + 70, 84, 7, '#ff9a3c');
    txt('飛び道具：' + ch.proj.name, x + 70, 100, 7, '#e6e1ff');
    txt('昇り技：' + ch.riseName, x + 70, 112, 7, '#e6e1ff');
  });
  demo.forEach(d => d.t++);
  if (Math.floor(tick / 30) % 2) txt('←→で選ぶ　パンチで決定　キックで戻る', W / 2, 156, 9, '#5ee0ff', 'center');
}
function drawConfig() {
  X.fillStyle = 'rgba(18,10,36,0.92)'; X.fillRect(0, 0, W, H);
  txt('ボタン設定　' + Math.min(cfgIndex + 1, ACTIONS.length) + '／' + ACTIONS.length, W / 2, 12, 12, '#5ee0ff', 'center');
  const a = ACTIONS[cfgIndex];
  if (a) txt('「' + LABEL[a] + '」にしたいボタンを押してください', W / 2, 34, 11, '#ffd23f', 'center');
  ACTIONS.forEach((k, i) => {
    const y = 56 + i * 12, done = cfgNew[k];
    txt(LABEL[k], 90, y, 8, i === cfgIndex ? '#ffd23f' : '#f4f1ff');
    txt(done ? showBind(done[0]) : i === cfgIndex ? '…待機中' : '―', 190, y, 8, done ? '#6dff8b' : '#8a86b8');
  });
  if (cfgMsgT > 0) txt('そのボタンはもう使っています。別のボタンを押してください', W / 2, H - 20, 8, '#ff9a3c', 'center');
}
function showBind(b) {
  const v = b.slice(2);
  return b[0] === 'k' ? 'キー ' + v : b[0] === 'p' ? 'パッド ボタン' + v : 'パッド 軸' + v;
}
function draw() {
  X.setTransform(1, 0, 0, 1, 0, 0);
  X.drawImage(BG, 0, 0);
  X.setTransform(S, 0, 0, S, 0, 0);
  const inFight = ['intro', 'fight', 'roundEnd', 'matchEnd'].includes(mode) || (mode === 'pause') || (mode === 'config' && cfgReturn === 'pause');
  if (inFight && F.length) {
    if (shake > 0) X.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const order = F[0].move ? [F[1], F[0]] : [F[0], F[1]];
    order.forEach(f => drawFighter(f));
    projs.forEach(drawProj);
    for (const p of parts) { X.fillStyle = p.c; const s = p.life > 12 ? 2 : 1; X.fillRect(p.x, p.y, s, s); }
    X.setTransform(S, 0, 0, S, 0, 0);
    drawHud();
    if (mode === 'intro') bigText(mt < 60 ? 'ラウンド ' + round : 'ファイト', mt < 60 ? '#f4f1ff' : '#ffd23f');
    if (mode === 'roundEnd') {
      if (mt < 110) bigText(endReason, endReason === 'KO' ? '#ff4d6d' : '#f4f1ff', endReason === 'KO' ? 36 : 24);
      else bigText(roundWinner < 0 ? '引き分け' : F[roundWinner].char.name + 'の勝ち', '#ffd23f', 20);
    }
    if (mode === 'pause') drawPanel('ポーズ中', ['キック：タイトルへ戻る', 'STARTで再開']);
    if (mode === 'matchEnd') {
      if (matchResult === 'win') drawPanel('あなたの勝ち', ['ステージ ' + stage + ' クリア', 'キック：タイトルへ', mt > 50 ? 'パンチ：次の相手へ（少し強くなります）' : ''], '#ffd23f');
      else drawPanel('あなたの負け', ['ステージ ' + stage, 'キック：タイトルへ', mt > 50 ? 'パンチ：もう一度挑戦' : ''], '#ff4d6d');
    }
  } else if (mode === 'title' || (mode === 'config' && cfgReturn === 'title')) drawTitle();
  else if (mode === 'select' || (mode === 'config' && cfgReturn === 'select')) drawSelect();
  if (mode === 'config') drawConfig();
}

/* ---------- ループ（1秒60回で固定） ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (mode === 'fight' || mode === 'intro' || mode === 'roundEnd')) { pausedFrom = mode; mode = 'pause'; }
});
C.addEventListener('pointerdown', e => {
  if (mode === 'title') { mode = 'select'; cooldown = 10; }
  else if (mode === 'select') {
    const r = C.getBoundingClientRect(), side = (e.clientX - r.left) / r.width < 0.5 ? 0 : 1;
    if (side === sel) { stage = 1; startMatch(); } else sel = side;
  } else if (mode === 'matchEnd' && mt > 50) { if (matchResult === 'win') stage++; startMatch(); }
});
syncButtons();
if (document.fonts && document.fonts.load) document.fonts.load('10px "DotGothic16"').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
</body>
